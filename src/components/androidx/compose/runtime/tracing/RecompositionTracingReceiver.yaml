recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: A development tool can send a start or stop broadcast to the AndroidX Compose tracing
      Receiver to record how Compose screens are recomputed during a diagnostic session.
    disableEffect: Compose recomposition tracing cannot be started or stopped through this Receiver, while
      normal app screens remain unaffected.
  zh-CN:
    description: 开发诊断工具可以向 AndroidX Compose 追踪 Receiver 发送开始或停止广播，以记录诊断期间 Compose 界面的重新计算情况。
    disableEffect: 禁用后无法通过这个 Receiver 开始或停止 Compose 重新计算追踪，但应用界面不受影响。
