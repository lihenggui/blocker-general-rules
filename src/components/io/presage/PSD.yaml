i18n:
  en:
    description: Ogury (ExploreStack)’s background service handles scheduled profile and settings work.
      When enabled by its configuration, it observes app installations, network or screen changes, and
      syncs selected installed-app, app-use, IP, or account data.
    disableEffect: Ogury’s background profile and settings updates will stop, while the host app’s own
      features remain available.
  zh-CN:
    description: Ogury（ExploreStack）的后台服务负责定时处理用户画像和设置任务。配置启用相关功能时，它会关注应用安装、网络或屏幕状态变化，并同步选定的已安装应用、应用使用情况、IP
      或账户数据。
    disableEffect: Ogury 的后台用户画像和设置更新将停止，但应用自身的功能仍可使用。
