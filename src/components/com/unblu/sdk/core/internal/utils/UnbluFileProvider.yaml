i18n:
  en:
    description: Unblu uses Android’s file-sharing provider to create shareable links for captured photos
      and videos and grant the receiving app permission to read them.
    disableEffect: Captured photos and videos cannot be passed through Unblu’s shared-file link.
  zh-CN:
    description: Unblu 使用 Android 文件共享提供程序为拍摄的照片和视频创建可共享链接，并授权接收应用读取文件。
    disableEffect: 停用后，拍摄的照片和视频无法通过 Unblu 的共享文件链接传递。
