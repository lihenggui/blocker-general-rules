  en:
    description: After OkayCam takes regular document or selfie photos, this screen displays them and
      lets the user confirm or retake them before returning the accepted images to the app.
    disableEffect: The OkayCam flows that use this screen cannot finish photo review or return accepted
      images if it is disabled.
  zh-CN:
    description: OkayCam 拍摄普通证件照或自拍照后会显示在此界面，用户可确认或重拍，确认的照片随后交回应用。
    disableEffect: 停用后，使用此界面的 OkayCam 流程无法完成照片确认或返回已确认的照片。
