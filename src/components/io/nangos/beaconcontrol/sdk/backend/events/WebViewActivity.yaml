  en:
    description: Nangos BeaconControl SDK opens the web page assigned to a beacon action, such as a URL
      or coupon, when that action is triggered.
    disableEffect: Beacon-triggered URL and coupon pages will not open, and the associated action can
      fail.
  zh-CN:
    description: Nangos BeaconControl SDK 会在信标触发已配置的操作（例如网址或优惠券）时打开相应网页。
    disableEffect: 停用后，由信标触发的网址或优惠券页面将无法打开，相关操作也可能无法完成。
