i18n:
  en:
    description: Tencent Cloud IM (TIM)'s push SDK opens this screen when the app requests a runtime permission
      or notification-listener access; it explains the request, opens Android's permission or settings
      screen, and returns the result.
    disableEffect: If the app starts this permission flow while the screen is disabled, the screen cannot
      open and notification access or the requested permission setup fails.
  zh-CN:
    description: 腾讯云 IM（TIM）的推送 SDK 在应用申请运行时权限或通知监听权限时启动此界面；界面会说明请求、打开 Android 权限或设置页面并返回结果。
    disableEffect: 如果应用在此界面被关闭时发起权限流程，界面无法打开，通知访问或相应权限设置会失败。
