i18n:
  en:
    description: After Android finishes starting, SmartMe Monitor (SmartMe) checks saved settings and
      restarts the enabled app-use, audio, or location collection services.
    disableEffect: If disabled, SmartMe's background monitoring will not restart after a reboot; the host
      app's other functions remain available.
  zh-CN:
    description: Android 启动完成后，SmartMe Monitor（SmartMe）会读取已保存的设置，并重新启动已启用的应用使用、音频或位置采集服务。
    disableEffect: 禁用后，SmartMe 的后台监测不会在设备重启后自动恢复；宿主应用的其他功能仍可使用。
