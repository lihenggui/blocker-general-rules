    description: Clistery WebBasic prepares Tencent X5 for embedded pages at app startup when X5 is enabled.
      It also receives the browser engine's download and installation status.
    disableEffect: Pages that rely on WebBasic's X5 setup may fail to load without this startup initialization.
  zh-CN:
