i18n:
  en:
    description: The NetEase Yunxin SMS Login SDK opens this screen from the login page's password-recovery
      option. It requests and verifies an SMS code, collects a replacement password, and submits the recovery
      details through the configured callback.
    disableEffect: Users cannot reset a forgotten password through the built-in SMS login flow.
  zh-CN:
    description: 网易云信短信登录库会在用户从登录页选择找回密码时打开此页。页面请求并验证短信验证码、收集新密码，并通过配置的回调提交找回信息。
    disableEffect: 用户无法通过内置短信登录流程重设忘记的密码。
