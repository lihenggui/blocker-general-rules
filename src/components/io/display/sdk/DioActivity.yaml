recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:03:34Z'
i18n:
  en:
    description: Display.io Android ad SDK opens this full-screen Activity when it renders an interstitial
      ad or handles an ad click. It shows the ad and can send the user to the advertiser's page or app
      store.
    disableEffect: Interstitial ads and ad click-throughs handled by Display.io will stop working.
  zh-CN:
    description: Display.io Android 广告 SDK 在展示插屏广告或处理广告点击时会打开此全屏 Activity。它显示广告，并可将用户带到广告主页面或应用商店。
    disableEffect: Display.io 通过此界面展示的插屏广告和广告跳转将无法使用。
