i18n:
  en:
    description: AndroidX AppFunctions starts this service when the system requests a function published
      by the app; it runs the requested function and returns its result or an error.
    disableEffect: The system and other authorized callers will no longer be able to run functions the
      app exposes through Android AppFunctions.
  zh-CN:
    description: 系统请求运行应用发布的功能时，AndroidX AppFunctions 会启动此 Service，执行请求并返回结果或错误。
    disableEffect: 系统和其他获授权的调用方将无法再运行应用通过 AndroidX AppFunctions 提供的功能。
