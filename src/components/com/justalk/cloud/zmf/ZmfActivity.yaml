i18n:
  en:
    description: Juphoon RTC, integrated by Rokid, opens Android's screen-capture permission prompt when
      screen sharing starts. After approval, the call can send the device screen to other participants.
    disableEffect: Screen sharing cannot request capture permission, so participants cannot view the device
      screen in a call.
  zh-CN:
    description: Rokid 集成的 Juphoon RTC 会在开始屏幕共享时打开 Android 的屏幕录制授权页。授权后，通话中的其他参与者才能看到设备屏幕。
    disableEffect: 禁用后无法请求屏幕录制授权，因此通话中的其他参与者无法看到设备屏幕。
