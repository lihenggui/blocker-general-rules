    description: Google Cast TV lets the system MediaShell app bind to this service to launch the app's
      Cast receiver, send messages, and report connected senders.
    disableEffect: The app's Cast TV receiver will no longer be available to the system Cast host.
  zh-CN:
    description: Google Cast TV 允许系统 MediaShell 应用绑定此服务，以启动应用的 Cast 接收端、发送消息并报告已连接的发送端。
    disableEffect: 系统 Cast 主机将无法再使用应用的 Cast TV 接收端。
