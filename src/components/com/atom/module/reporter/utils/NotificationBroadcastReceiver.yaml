i18n:
  en:
    description: When a user taps the crash reporter's share-link notification, this Receiver sends the
      saved report through the configured reporting service and opens the resulting link for sharing.
      Disabling it only affects diagnostics.
    disableEffect: Users may be unable to upload and share a report from that notification.
  zh-CN:
    description: 用户点击崩溃报告的分享链接通知时，此 Receiver 会通过已配置的报告服务上传日志，并打开生成的链接供分享。停用后只会影响诊断功能。
    disableEffect: 用户可能无法通过该通知上传并分享报告。
