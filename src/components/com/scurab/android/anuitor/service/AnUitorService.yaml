i18n:
  en:
    description: AnUitor starts this local inspection service when a developer requests a view of the
      app's screen hierarchy and UI details. It exposes diagnostic information through a local server.
    disableEffect: Disabling it prevents AnUitor's local screen-inspection service from starting; normal
      app features continue.
  zh-CN:
    description: 开发者请求查看应用屏幕结构和界面详情时，AnUitor 会启动此本地检查服务。它通过本地服务器提供诊断信息。
    disableEffect: 禁用后，AnUitor 的本地屏幕检查服务无法启动；应用的常规功能仍可使用。
