i18n:
  en:
    description: When a form image question requests a drawing, ODK Collect opens a canvas where the user
      can draw or annotate an image and save it back to the form. It is part of the Samagra ODK Collect
      client.
    disableEffect: Users will lose the drawing and image-annotation answer option in forms.
  zh-CN:
    description: 表单中的图像问题要求绘图时，ODK Collect 会打开画布，供用户绘制或标注图像并保存回表单。 它是 Samagra 构建的 ODK Collect 客户端的一部分。
    disableEffect: 停用后，用户将无法在表单中使用绘图或图像标注作为答案。
