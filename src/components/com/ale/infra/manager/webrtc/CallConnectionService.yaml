i18n:
  en:
    description: The ALE Rainbow SDK registers with Android Telecom for its VoIP calls. When Android asks
      about an incoming or outgoing Rainbow call, this service creates a system call connection and links
      it with the SDK's call state.
    disableEffect: Rainbow calls lose Android Telecom integration, so native call presentation and controls
      may fail.
  zh-CN:
    description: ALE Rainbow SDK 会为其网络电话向 Android Telecom 注册。Android 收到或拨出 Rainbow 通话时，此服务会创建系统通话连接，并与
      SDK 的通话状态关联。
    disableEffect: Rainbow 通话将失去 Android Telecom 集成，系统通话界面和控制功能可能无法正常工作。
