i18n:
  en:
    description: AdColony opens this Activity to host an AdColony display ad inside the app. It attaches
      the ad view while the ad is active and closes it when the viewer backs out.
    disableEffect: AdColony display ads hosted by this Activity will no longer appear.
  zh-CN:
    description: AdColony 展示应用内广告时会打开此界面。广告显示期间它承载广告视图，用户返回时会将其关闭。
    disableEffect: 屏蔽后，由此界面承载的 AdColony 展示广告将不会出现。
