i18n:
  en:
    description: When a BNC GIMAC call moves out of its main screen, this Activity keeps the call view
      connected to the floating meeting window. It lets the user return to the video call after switching
      to another app.
    disableEffect: Disabling it can prevent the call from switching cleanly to or back from the floating
      view.
  zh-CN:
    description: 当 BNC GIMAC 通话切换到浮动会议窗口时，此 Activity 会维持通话画面的连接，方便用户切换应用后回到视频通话。
    disableEffect: 停用后，通话可能无法正常切换到浮动窗口，或无法从浮窗返回通话界面。
