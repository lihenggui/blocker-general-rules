recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T20:40:46Z'
i18n:
  en:
    description: The Nabin Bhandari Permissions library opens this Activity when an app requests Android
      runtime permissions. It can explain why a permission is needed, ask Android for it, or direct the
      user to app settings after a denial.
    disableEffect: Permission requests through this library will stop working, which can leave app features
      without permissions they need.
  zh-CN:
    description: Nabin Bhandari 权限库会在应用请求 Android 运行时权限时打开此 Activity。它可以说明权限用途、向 Android 发起请求，或在权限被拒后引导用户前往应用设置。
    disableEffect: 停用后，该库的权限请求流程将无法使用，依赖相应权限的应用功能可能受影响。
