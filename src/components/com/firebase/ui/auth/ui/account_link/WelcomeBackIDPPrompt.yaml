i18n:
  en:
    description: When FirebaseUI Auth finds that an email address belongs to a different sign-in provider,
      this screen asks the user to sign in with the existing provider so the accounts can be linked.
    disableEffect: Users cannot confirm the existing provider account, so this account-linking sign-in
      flow cannot finish.
  zh-CN:
    description: FirebaseUI Auth 发现邮箱已关联其他登录方式时，此界面会要求用户使用原有方式登录，以便关联账号。
    disableEffect: 用户无法确认原有身份提供方账号，因此此账号关联登录流程无法完成。
