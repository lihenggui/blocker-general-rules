recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:04:01Z'
i18n:
  en:
    description: When a user dismisses a Gamedock push notification, this Receiver reports a dismissal
      event and updates the saved notification record.
    disableEffect: Blocking it stops Gamedock from recording notification dismissals; gameplay and other
      app features remain available.
  zh-CN:
    description: 用户关闭 Gamedock 推送通知时，此 Receiver 会报告关闭事件并更新已保存的通知记录。
    disableEffect: 停用后，Gamedock 将无法记录通知关闭事件；游戏和应用的其他功能仍可使用。
