  en:
    description: When Android reports that an app was uninstalled, this InAd Receiver removes the matching
      app from the offer wall’s saved install records.
    disableEffect: The offer wall may retain stale records for apps that have been removed, making offer
      status inaccurate.
  zh-CN:
