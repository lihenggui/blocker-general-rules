i18n:
  en:
    description: Facebook Core uses this receiver when the current sign-in token changes and passes the
      update to Facebook's token manager.
    disableEffect: Apps that use Facebook sign-in may not process access-token changes correctly if this
      receiver is disabled.
  zh-CN:
    description: 当前登录令牌变化时，Facebook Core 会通过此接收器把更新交给 Facebook 令牌管理器处理。
    disableEffect: 停用此接收器后，使用 Facebook 登录的应用可能无法正确处理访问令牌变化。
