  en:
    description: Yandex MapKit receives boot and version-election broadcasts here to compare MapKit copies
      and choose which one remains active.
    disableEffect: MapKit may not be able to maintain its active SDK instance, disrupting services that
      depend on that coordination.
  zh-CN:
    description: 设备启动或收到版本选举广播时，Yandex MapKit 会通过此 Receiver 比较不同 MapKit 实例，并选择保持活动状态的实例。
    disableEffect: MapKit 可能无法维持活动实例，依赖该协调机制的服务会受到影响。
