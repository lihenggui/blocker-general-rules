i18n:
  en:
    description: The legacy Google AdMob SDK opens this full-screen activity when an app needs to show
      an ad page. It displays web or video ads and handles ad closing or opening its destination.
    disableEffect: Full-screen ads and ad destination pages provided through this SDK will no longer open.
  zh-CN:
    description: 旧版 Google AdMob 广告 SDK 会打开此全屏页面来展示网页或视频广告，并处理关闭广告或打开广告目标页面的操作。
    disableEffect: 禁用后，该 SDK 提供的全屏广告和广告目标页面将无法打开。
