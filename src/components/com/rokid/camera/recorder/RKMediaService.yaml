    description: Rokid Camera Recorder starts this service when the app requests audio recording, video
      recording, or photo capture. It performs the requested capture and returns status or results to
      the app.
    disableEffect: The app will not be able to use this SDK’s audio recording, video recording, or photo
      capture features.
  zh-CN:
