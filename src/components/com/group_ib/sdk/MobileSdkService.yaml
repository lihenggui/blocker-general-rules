i18n:
  en:
    description: YooMoney's YooKassa payments SDK includes Group-IB's mobile security service. It runs
      during payment checks to gather device and browser signals for transaction risk assessment.
    disableEffect: YooKassa loses these device signals for its payment security checks, so a payment that
      depends on them may not complete.
  zh-CN:
    description: YooMoney 的 YooKassa 支付 SDK 集成了 Group-IB 移动安全服务。该服务会在付款校验时收集设备和浏览器信息，用于评估交易风险。
    disableEffect: 关闭后，YooKassa 的支付安全检查将缺少这些设备信息，依赖这些信息的付款可能无法完成。
