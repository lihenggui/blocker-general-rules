  en:
    description: EdCast MyGuide starts this service after the user grants screen-capture permission and
      chooses an inline guide; it captures the screen and places highlights and prompts over matching
      guide steps.
    disableEffect: MyGuide’s on-screen inline walkthroughs cannot run.
  zh-CN:
    description: 用户授予屏幕捕获权限并选择内嵌指南后，EdCast MyGuide 会启动此 Service；它捕获屏幕，并在匹配的指南步骤上显示高亮和提示。
    disableEffect: MyGuide 的屏幕内嵌式操作指南将无法运行。
