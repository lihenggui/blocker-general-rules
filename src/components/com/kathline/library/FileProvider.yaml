recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:51:19Z'
i18n:
  en:
    description: Dynckathline FilePicker uses this provider to create a shareable file link when its browser
      opens a document in another app, especially on Android 7 and later.
    disableEffect: Disabling it prevents the file picker from opening selected documents in other apps
      on Android 7 and later.
  zh-CN:
    description: Dynckathline FilePicker 会在文件浏览器将文档交给其他应用打开时，通过此 Provider 创建可共享的文件链接，尤其用于 Android 7 及更高版本。
    disableEffect: 在 Android 7 及更高版本中，禁用后文件选择器将无法把选中的文档交给其他应用打开。
