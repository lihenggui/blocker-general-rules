i18n:
  en:
    description: Rokid Remote Cooperation opens this screen after a user joins a meeting. It shows the
      participants and meeting status, provides call controls, and opens screen sharing, whiteboard, or
      camera views.
    disableEffect: Users cannot enter or stay in the meeting screen, so Rokid Remote Cooperation calls
      and meetings are unusable.
  zh-CN:
    description: 用户加入会议后，Rokid Remote Cooperation 会打开此页面。页面显示参与者和会议状态，提供通话控制，并可进入屏幕共享、白板或摄像头页面。
    disableEffect: 用户无法进入或留在会议页面，因此无法使用 Rokid Remote Cooperation 的通话和会议功能。
