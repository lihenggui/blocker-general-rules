i18n:
  en:
    description: When a Trusted Web Activity requests location access, Meta Android Browser Helper opens
      this Activity to request fine or coarse Android location permission and return the result to the
      web page.
    disableEffect: Web pages in the app will not receive the Android location-permission result through
      Trusted Web Activity integration.
  zh-CN:
    description: Trusted Web Activity 请求位置权限时，Meta Android Browser Helper 会打开此 Activity 请求 Android 精确或大致位置权限，并把结果返回网页。
    disableEffect: 应用中的网页将无法通过 Trusted Web Activity 集成取得 Android 位置权限结果。
