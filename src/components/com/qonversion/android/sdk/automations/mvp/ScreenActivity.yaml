recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:22:44Z'
i18n:
  en:
    description: Qonversion opens this Activity to show an in-app automation screen supplied as HTML or
      a screen ID; the screen can include links and purchase or restore actions.
    disableEffect: Disabling it prevents Qonversion automation screens from opening, so offers and purchase
      actions shown there will not work.
  zh-CN:
    description: Qonversion 会用此 Activity 显示自动化流程中的应用内页面，页面内容由 HTML 或页面编号指定，也可包含链接、购买或恢复操作。
    disableEffect: 停用后，Qonversion 自动化页面无法打开，其中的优惠和购买操作也无法使用。
