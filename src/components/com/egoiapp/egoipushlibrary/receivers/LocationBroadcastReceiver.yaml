  en:
    description: E-goi uses this receiver for background location updates and stop requests. A stop request
      removes the active location updates.
    disableEffect: E-goi can no longer handle these location events, so location-based messaging may behave
      incorrectly.
  zh-CN:
    description: E-goi 使用此接收器处理后台位置更新和停止请求；收到停止请求时会移除正在进行的位置更新。
    disableEffect: E-goi 无法再处理这些位置事件，基于位置的消息可能无法正常工作。
