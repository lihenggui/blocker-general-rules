    description: The NextBillion Navigation SDK starts this foreground service when guided navigation
      begins. It continues receiving location updates and maintains navigation status and notifications
      while the route is active.
    disableEffect: The app may not keep guided navigation active or show its navigation notification in
      the background.
  zh-CN:
