  en:
    name: MoPub Ads
    description: "## Primary location\nUnited States\n## Website\n[https://www.mopub.com](https://www.mopub.com)\n\
      ## About\nMoPub offers services aimed th help publishers acquire and serve advertisements and advertisers\
      \ to reach audiences that may be interested in their products and services [MoPub, 03](https://www.mopub.com/legal/privacy).\n\
      ## Ownership\nTwitter\n## Documentation\n[https://www.mopub.com/resources/docs/android-sdk-integration](https://www.mopub.com/resources/docs/android-sdk-integration)\n\
      ## Products and Services\nMopub describes itself as \"The leading monetization platform for mobile\
      \ app publishers and developers\"  [MoPub, 01](https://www.mopub.com).  \n* They connect publishers\
      \ with advertisers in a way aimed to \"drive the highest price for every ad impression\" [MoPub,\
      \ 01](https://www.mopub.com).\n* They \"flexible mediation system allows publishers to target the\
      \ right inventory with the right network partner, based on each publisher’s unique business goals\"\
      \ [MoPub, 01](https://www.mopub.com).\n* They offer \"ad serving tools, interface, and analytics.\"\
      \nFor publishers:  [Mopub, 02](https://www.mopub.com/publishers/overview)\n* Offer a \"dependable\
      \ back-end systems powered by Twitter’s world-class data center strength.\"\n* Offer consultative\
      \ services.\n* Offer a creative dashboard for ad serving tools, interface, and ad formats.\n* Offer\
      \ publishers access to over 180 demand-side platforms.\n* Help publishers reach an audience across\
      \ 49,000 apps and 1.5 billion devices [MoPub, 03](https://www.mopub.com/dsp/overview).\n## Privacy\
      \ Policy\n### Section 1: End User Policies\n_Information Collection on End Users:_ MoPub states,\
      \ \"we may collect information about your device and the ads you view or click. The MoPub Services\
      \ are designed to avoid collecting information that identifies you personally, such as your name,\
      \ address, or email address, but the information we collect does enable us to recognize your device\
      \ over time\". Data collected includes, but is not limited to:\n* \"Information about your device,\
      \ such as the type and model, manufacturer, operating system (e.g. iOS or Android), carrier name,\
      \ IP address, mobile browser (e.g. Chrome, Safari), applications using the MoPub Services and the\
      \ version of such applications, and identifiers assigned to your device, such as its iOS Identifier\
      \ for Advertising (IDFA), Android Advertising ID, or unique device identifier (a number uniquely\
      \ allocated to your device by your device manufacturer).\n* Log information, including the app or\
      \ website visited, session start/stop time, time zone, and network connection type (e.g., WiFi,\
      \ cellular), and cookie information.\n* The geo-location of your device (using GPS or other geo-location\
      \ data), when location services have been enabled for the mobile app or website that uses the MoPub\
      \ Services.\n* Information about ads served, viewed, or clicked on, such as the type of ad, where\
      \ the ad was served, whether you clicked on it, and whether you visited the advertiser’s website\
      \ or purchased the product or service advertised.\n* Information that MoPub Customers and other\
      \ third parties have collected and share with MoPub, such as information about activity in their\
      \ services. This may include the content you view or searches you made, the language you prefer,\
      \ or other non-personally identifying demographic or interest information, to help make the ads\
      \ served to you more relevant.\"  \n_Information Use on End Users:_ This includes for the following\
      \ purposes:\n* Serving Ads\n* Ad Reporting and Conversations\n* Frequency Capping\n* Fraud Detection\
      \ and Prevention\n* Interest-Based Advertising\n* Geo-Targeting\n* Providing and Improving MoPub\
      \ Services\n_PII:_ \"MoPub will not combine the non-personally identifiable information collected\
      \ to provide the MoPub Services with your personally-identifying information without your express\
      \ consent.\" \n_Information sharing:_ \n* With advertiser customers: for the purposes of the ad\
      \ bidding process.\n* Aggregated and non-PII data: \"We share aggregate or non-personally identifiable\
      \ information about the use of our Services with MoPub Customers. For example, we provide advertisers\
      \ reports showing how many users viewed or clicked on their ads. We also provide publishers reports\
      \ about the types of ads served to their apps.\"\n* With partners: who help with anti-fraud, quality,\
      \ and security efforts.\n* With partners: who help MoPub improve mobile advertising exchange services.\n\
      * Within \"our corporate family to provide, understand, or improve their or our services.\"\nMoPub\
      \ also shares data as described in Section 3 of the Privacy Policy (see below).  \n_Opt-Out:_ \"\
      Your iOS mobile device may provide a 'Limit Ad Tracking' setting. On Android devices, your settings\
      \ may allow you to 'Opt out of Interest-Based Ads.' When you have opted out using this setting on\
      \ a device, MoPub will not use in-app information collected from that device to infer your interests\
      \ or serve ads to that device that are targeted based on your inferred interests.\" MoPub also observes\
      \ \"Do Not Track\" requests in web browsers. MoPub \"requires its advertising customers to honor\
      \ opt-out preferences expressed using these controls.\"  \n_Requirements of MoPub Customers:_ \"\
      MoPub requires MoPub Customers to comply with all applicable laws and regulations and to provide\
      \ end users with notice of the collection of data for advertising purposes as outlined in this Privacy\
      \ Policy. We encourage all users to review the privacy policies of sites and apps they visit for\
      \ information about those sites’ and apps’ data collection and use practices.\"  \n### Section 3:\
      \ General Information\n_Other sharing policies:_ MoPub \"may preserve or disclose information if\
      \ we believe that it is reasonably necessary to comply with a law, regulation, legal process, or\
      \ governmental request; to protect the safety of any person; to address fraud, security or technical\
      \ issues; or to protect the rights or property of MoPub, MoPub Customers, users of our website,\
      \ or end users.\"\n_Information from Third Parties:_ MoPub \"may receive information about you from\
      \ third parties, including MoPub Customers, data partners, and our corporate family. This information\
      \ may include, for example, browser cookie IDs, mobile device IDs, demographic or interest data,\
      \ and content viewed or actions taken on a website or app.\"  \n_Other sites:_ MoPub \"is not responsible\
      \ for the privacy practices or content of these other sites.\"  \n_Confidentiality and Security:_\
      \ MoPub \"has implemented reasonable security measures in order to protect both personal and non-personal\
      \ information from loss, misuse and unauthorized access, disclosure, alteration or destruction.\"\
      \n## Relationships\n_Clients:_ Apalon / ASKfm / FEO Media / First Touch Games / glu / Gram Games\
      \ / Jorudan / LA Place Media / Lotum / Lovoo / MeetMe / Miniclip / MobilityWare / Outfit7 / theScore\
      \ / Simeji / Spinrilla / timehop / truecaller / tunein / Ubisoft / Paper.io / The Weather Channel\
      \ / Zynga [MoPub, 04](https://www.mopub.com/publishers/clients)\n## Details\n_Financial history:_\
      \ MoPub was founded in 2010 [CrunchBase, 01](https://www.crunchbase.com/organization/mopub). It\
      \ was acquired by Twitter in 2013; the details of the deal were not disclosed. Media outlets estimated\
      \ the deal at around $300 million [CCN Tech, 01](http://money.cnn.com/2013/09/10/technology/social/twitter-acquisition/index.html)\n\
      ## References\n* _CNN Tech, 01_. [http://money.cnn.com/2013/09/10/technology/social/twitter-acquisition/index.html](http://money.cnn.com/2013/09/10/technology/social/twitter-acquisition/index.html)\
      \  \n* _CrunchBase, 01_. [https://www.crunchbase.com/organization/mopub](https://www.crunchbase.com/organization/mopub)\n\
      * _MoPub, 01_. [https://www.mopub.com](https://www.mopub.com)  \n* _MoPub, 02_. [https://www.mopub.com/publishers/overview](https://www.mopub.com/publishers/overview)\
      \  \n* _MoPub, 03_. [https://www.mopub.com/legal/privacy](https://www.mopub.com/legal/privacy) \
      \ \n* _MoPub, 04_. [https://www.mopub.com/publishers/clients](https://www.mopub.com/publishers/clients)\n\
      ## External Links\n* _Ghostery (MoPub)_: [https://apps.ghostery.com/ko/apps/mopub](https://apps.ghostery.com/ko/apps/mopub)\n\
      * _GitHub_: https://github.com/mopub"
