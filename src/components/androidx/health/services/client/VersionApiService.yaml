  en:
    description: AndroidX Health Services Client exposes this version service when the Wear OS Health
      Services app sends its protected binding request. It returns the Health Services API and client
      SDK version numbers for compatibility checks.
    disableEffect: Wear OS Health Services may be unable to verify compatibility and provide health features
      through the app.
  zh-CN:
    description: Wear OS Health Services 应用发送受权限保护的绑定请求时，AndroidX Health Services Client 会提供此版本服务。它会返回
      Health Services API 和客户端 SDK 的版本号，以供兼容性检查。
    disableEffect: Wear OS Health Services 可能无法验证兼容性，也可能无法通过此应用提供健康功能。
