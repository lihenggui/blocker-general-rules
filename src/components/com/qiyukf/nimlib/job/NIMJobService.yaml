i18n:
  en:
    description: When Android runs one of Qiyu’s scheduled message-delivery jobs, this Service starts
      the background messaging connection and handles the job’s start or stop callback.
    disableEffect: Disabling it prevents the SDK’s scheduled background work, which can delay message
      delivery and reconnection while the app is closed.
  zh-CN:
    description: Android 执行七鱼安排的消息后台任务时，此服务会启动后台消息连接，并处理任务的开始或停止回调。
    disableEffect: 禁用后，SDK 安排的后台任务无法运行，应用关闭时的消息接收和重连可能延迟。
