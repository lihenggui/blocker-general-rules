  en:
    description: When enabled and granted notification access, TENQUBE Visual Base receives posted notifications
      and sends supported message content to its parser. This artifact declares the listener disabled
      by default.
    disableEffect: If enabled, notification-based transaction messages will no longer reach the Visual
      Base parser.
  zh-CN:
    description: 启用并获得通知访问权限后，TENQUBE Visual Base 会接收新通知，并将可识别的内容交给解析功能；此版本默认将该监听服务设为禁用。
    disableEffect: 如果启用了此服务，通知中的交易消息将无法再传给 Visual Base 解析。
