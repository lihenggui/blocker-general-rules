i18n:
  en:
    description: The Androscope developer tool starts this Service when its inspection screen or automatic-start
      option needs the local inspection server. The server provides the app inspection page and reports
      its status to the screen.
    disableEffect: Disabling it stops the Androscope inspection page and its status controls from working.
  zh-CN:
    description: Androscope 开发工具需要本地检查服务时，会启动此 Service。该服务提供应用检查页面，并向界面报告运行状态。
    disableEffect: 停用后，Androscope 检查页面及其状态控制将无法使用。
