  en:
    description: The DP3T Android exposure-tracing SDK listens for Google Play services exposure results.
      When an exposure-state update arrives, it starts background work to match the reported exposures.
    disableEffect: DP3T would no longer process these exposure updates, so exposure results could be missed
      or stop refreshing.
  zh-CN:
    description: DP3T Android 暴露追踪 SDK 会监听 Google Play 服务发来的暴露结果。收到暴露状态更新时，它会启动后台任务来匹配报告的暴露记录。
    disableEffect: DP3T 将无法继续处理这些暴露状态更新，暴露结果可能遗漏或无法刷新。
