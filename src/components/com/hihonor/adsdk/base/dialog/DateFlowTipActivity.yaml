recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:21:23Z'
i18n:
  en:
    description: Honor Ads SDK shows this prompt when a user follows an ad link to download an advertised
      app; it displays the file size and lets the user continue or stop.
    disableEffect: Users will not see the download-size confirmation, so this ad-download flow cannot
      continue through the prompt.
  zh-CN:
    description: Honor 广告 SDK 在用户通过广告链接下载推广应用时显示此提示，告知文件大小，并让用户选择继续或停止。
    disableEffect: 屏蔽后，用户无法查看下载文件大小或通过此提示继续广告下载流程。
