    description: The earlier Leap Creator Android SDK preview flow explicitly opens this camera activity
      to scan a project or sample-app QR code, fetch its preview setup, and begin on-device preview.
    disableEffect: Leap Creator's QR-based developer preview sessions will no longer start through this
      scanner.
  zh-CN:
    description: 较早版本的 Leap Creator Android SDK 会显式打开此相机界面，扫描项目或示例应用二维码、获取预览配置并启动设备端预览。
    disableEffect: Leap Creator 将无法通过此扫描器启动二维码开发者预览会话。
