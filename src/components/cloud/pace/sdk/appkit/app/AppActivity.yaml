i18n:
  en:
    description: When the host app opens a PACE connected-fueling page, the PACE Cloud SDK displays it
      in the app and handles page actions such as Google Pay requests.
    disableEffect: PACE in-app pages and their payment actions will not open, so connected-fueling tasks
      that use them can fail.
  zh-CN:
    description: 宿主应用打开 PACE 互联加油服务页面时，PACE Cloud SDK 会在应用内显示该页面，并处理包括 Google Pay 在内的支付操作。
    disableEffect: 禁用后，PACE 应用内页面及其支付操作将无法打开，依赖这些页面的互联加油服务可能无法使用。
