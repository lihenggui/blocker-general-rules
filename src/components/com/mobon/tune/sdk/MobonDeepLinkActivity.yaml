recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:09:07Z'
i18n:
  en:
    description: Mobon Tune opens this activity when one of its deep links is tapped. It launches the
      app and passes along the link so the app can open the requested content.
    disableEffect: Mobon links will no longer launch the app with their link details, so content reached
      through those links may not open.
  zh-CN:
    description: 用户点开 Mobon Tune 的深层链接时，此 Activity 会启动应用并传入链接，让应用打开相应内容。
    disableEffect: 停用后，Mobon 深层链接将无法携带链接信息启动应用，通过这些链接访问的内容可能无法打开。
