i18n:
  en:
    description: Qiyu starts this Service in its messaging process to load the saved login settings and
      run the background connection that receives and sends customer-service messages.
    disableEffect: Disabling it stops the SDK’s messaging connection, so support conversations and background
      messages do not work.
  zh-CN:
    description: 七鱼客服 SDK 会在消息进程中启动此服务，读取已保存的登录设置，并运行用于收发客服消息的后台连接。
    disableEffect: 禁用后，SDK 的消息连接会停止，客服会话和后台消息收发将无法工作。
