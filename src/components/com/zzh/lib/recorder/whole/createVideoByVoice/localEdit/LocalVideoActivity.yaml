  zh-CN:
    description: 应用交来本地视频进行剪辑时，ZHRecorder 会打开此界面。用户可以选取较短片段、旋转画面，并将导出的视频交给预览界面。
    disableEffect: 应用将无法通过 ZHRecorder 剪辑或旋转本地视频片段。
