recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: When a user taps an Antsomi push notification, this short-lived Activity routes the tap
      to the app's configured destination or a web link and records the click. Disabling it stops that
      notification navigation.
    disableEffect: Tapping Antsomi notifications will no longer open their configured destination or web
      link.
  zh-CN:
    description: 用户点击 Antsomi 推送通知时，此短暂显示的 Activity 会把点击转到应用配置的页面或网页链接，并记录点击。禁用后，通知导航将停止。
    disableEffect: 点击 Antsomi 通知将无法打开配置的页面或网页链接。
