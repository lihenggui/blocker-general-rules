i18n:
  en:
    description: After ODK Collect detects a crash from an earlier run during startup, this screen shows
      the crash recovery view and can return the user to the main menu. It is part of the Samagra ODK
      Collect client.
    disableEffect: The crash recovery screen and its route back to the main menu will be unavailable after
      a detected crash.
  zh-CN:
    description: ODK Collect 启动时发现上次运行发生崩溃后，会显示此恢复页面，并可从这里返回主菜单。 它是 Samagra 构建的 ODK Collect 客户端的一部分。
    disableEffect: 停用后，检测到崩溃时将无法显示恢复页面或从这里返回主菜单。
