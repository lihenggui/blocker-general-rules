recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:27:27Z'
i18n:
  en:
    description: The Yodo1 Game SDK uses this receiver for scheduled local messages; when the game is
      in the background, it posts a notification that can reopen the game.
    disableEffect: Yodo1's scheduled wake-up or in-game notifications will not be delivered, while the
      game itself continues to work.
  zh-CN:
    description: Yodo1 游戏 SDK 用此 Receiver 处理定时本地消息；游戏在后台时，它会发布可重新打开游戏的通知。
    disableEffect: Yodo1 的定时唤醒或游戏内通知将无法送达，但游戏本身仍可运行。
