recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: The ech0s7r androidlog library binds this service when file logging receives messages;
      it queues them and appends them to the current daily log file.
    disableEffect: Blocking it stops androidlog from writing file logs, while the host app's features
      continue to work.
  zh-CN:
    description: ech0s7r androidlog 日志库收到需要写入文件的日志时会绑定此 Service，将日志排队并追加到当天的日志文件中。
    disableEffect: 禁用后，androidlog 不会写入文件日志，但宿主应用的功能仍可使用。
