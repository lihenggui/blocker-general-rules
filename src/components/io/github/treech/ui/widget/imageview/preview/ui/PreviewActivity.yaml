  en:
    description: When the app opens Treech UI's image viewer, this screen displays selected pictures in
      a swipeable gallery with an image count or page dots.
    disableEffect: Image previews provided by Treech UI will not open, so app screens that rely on this
      viewer lose that feature.
  zh-CN:
    description: 应用打开 Treech UI 图片查看器时，此页面会以可滑动的画廊显示所选图片，并显示图片数量或分页圆点。
    disableEffect: 停用后，Treech UI 提供的图片预览将无法打开，依赖此查看器的应用页面会失去该功能。
