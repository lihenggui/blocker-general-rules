  en:
    name: Xiaomi Mobile Ads Alliance (Mimo Ad SDK)
    description: Mimo Ad SDK (Android) is an official toolkit launched by Xiaomi Alliance to help developers
      easily monetize ads on the Android platform. Supported ad formats include banner ads, interstitial
      ads, rewarded video ads, splash ads, native template ads, native self-rendered ads, and native video
      ads.
    company: Xiaomi Inc.
  zh-CN:
    name: 小米移动广告联盟
    description: 米盟广告SDK (Android) 是由小米联盟官方推出，帮助开发者在安卓平台上轻松实现广告变现。支持的广告形式包括Banner广告、插屏广告、激励视频广告、开屏广告、原生模板广告、原生自渲染广告和原生视频广告。
    company: 小米科技有限责任公司
