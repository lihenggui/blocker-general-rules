recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:15:16Z'
i18n:
  en:
    description: The KARTE notifications SDK uses this receiver when a message action is delivered. It
      records clicks or dismissals and opens the message's target screen for a tap.
    disableEffect: KARTE notification actions may stop opening their intended screen, and click or dismissal
      tracking will be lost.
  zh-CN:
    description: KARTE 通知 SDK 收到消息操作时会使用此接收器记录点击或关闭事件；收到点击操作时，它会打开消息指定的页面。
    disableEffect: KARTE 通知可能无法打开指定页面，点击和关闭记录也会停止。
