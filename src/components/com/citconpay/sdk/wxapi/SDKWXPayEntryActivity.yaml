  en:
    description: CITCON's payment SDK uses this screen to receive the result after the user switches to
      WeChat Pay. It reports success or failure to the active CITCON or UPI payment.
    disableEffect: WeChat Pay results will not return to the app, so those payments may remain unfinished.
  zh-CN:
    description: 用户跳转到微信支付后，CITCON 支付 SDK 会通过此页面接收结果，并把成功或失败状态交给当前的 CITCON 或 UPI 支付流程。
    disableEffect: 微信支付结果将无法返回应用，因此这类支付可能无法完成。
