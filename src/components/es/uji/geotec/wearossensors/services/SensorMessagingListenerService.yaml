i18n:
  en:
    description: When a Wear OS watch sends a message through Google Play services, GeoTecINIT WearOS
      Sensors receives capability requests and forwards accelerometer, gyroscope, magnetometer, heart-rate,
      location, and plain messages to the app.
    disableEffect: The app will no longer receive sensor readings or messages sent from the watch.
  zh-CN:
    description: Wear OS 手表通过 Google Play 服务发送消息时，GeoTecINIT WearOS Sensors 会接收能力查询，并把加速度、陀螺仪、磁力计、心率、位置和普通消息转交给应用。
    disableEffect: 停用后，应用将无法收到手表发送的传感器读数和消息。
