recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T20:40:46Z'
i18n:
  en:
    description: Najva's push SDK opens this Activity after a user taps a push notification. It records
      the tap and opens the destination provided with the notification, such as an app screen, web link,
      phone dialer, SMS app, or Telegram.
    disableEffect: Tapping Najva notifications will no longer report the click or open their configured
      destination.
  zh-CN:
    description: 用户点击推送通知后，Najva 推送 SDK 会打开此 Activity。它会记录点击，并打开通知指定的目标，例如应用页面、网页链接、拨号器、短信应用或 Telegram。
    disableEffect: 停用后，点击 Najva 通知将不再记录点击，也无法打开通知指定的目标。
