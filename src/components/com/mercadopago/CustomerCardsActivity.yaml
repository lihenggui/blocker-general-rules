recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T20:15:07Z'
i18n:
  en:
    description: Mercado Pago Android SDK opens this Activity when checkout needs the buyer to choose
      one of their saved cards. It loads the customer’s cards and returns the selected card to the payment
      flow.
    disableEffect: The buyer cannot choose a saved card in this flow, which can prevent checkout from
      continuing with that card.
  zh-CN:
    description: 结账需要用户选择已保存的银行卡时，Mercado Pago Android SDK 会打开此 Activity。它会加载用户的银行卡，并将所选卡片返回给付款流程。
    disableEffect: 用户无法在此流程中选择已保存的银行卡，结账可能因此无法使用该卡继续。
