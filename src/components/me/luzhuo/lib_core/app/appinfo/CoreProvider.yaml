i18n:
  en:
    description: When Android initializes Luzhuo Core's file-sharing provider at app startup, it saves
      the app context and exposes the library's approved files for sharing with other apps.
    disableEffect: Features that rely on the library's startup context or shared files may fail to initialize
      or share files.
  zh-CN:
    description: 应用启动时，Luzhuo Core 的文件共享提供程序会保存应用上下文，并允许其他应用读取 SDK 配置的共享文件。
    disableEffect: 依赖该库启动上下文或文件共享功能的部分功能可能无法初始化或分享文件。
