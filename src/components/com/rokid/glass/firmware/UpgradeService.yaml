i18n:
  en:
    description: The Rokid Glass firmware SDK uses this service while the app updates supported glasses
      over USB. It requests USB access, connects to the device, and sends update progress, completion,
      or errors back to the app.
    disableEffect: The app cannot connect to the glasses through this SDK to install or monitor a firmware
      update.
  zh-CN:
    description: 应用通过 USB 为受支持的 Rokid 眼镜更新固件时，Rokid Glass 固件 SDK 会使用此服务。它会申请 USB 访问权限、连接设备，并向应用报告更新进度、完成状态或错误。
    disableEffect: 停用后，应用无法通过此 SDK 连接眼镜或安装、监控固件更新。
