i18n:
  en:
    description: PayU's card scanner opens when a user chooses camera-based card entry during checkout.
      It uses the camera to read card text and returns the card details or a scan error to PayU.
    disableEffect: Camera-based card entry will not work, so users cannot scan a card during checkout.
  zh-CN:
    description: 用户在结账时选择用相机录入银行卡后，PayU 卡片扫描器会打开。它使用相机读取卡片文字，并把卡片信息或扫描错误返回 PayU。
    disableEffect: 停用后，相机录入银行卡的功能将无法使用，用户不能在结账时扫描卡片。
