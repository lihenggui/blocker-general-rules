i18n:
  en:
    description: Android invokes Fillr's native autofill service when a user focuses a supported form
      field or saves a form. Fillr matches form fields to its saved profile and offers suggestions, then
      handles details the user chooses to save.
    disableEffect: Disabling it prevents Android from offering Fillr profile data or saving new details
      through the system autofill feature.
  zh-CN:
    description: 用户在其他应用中聚焦受支持的表单字段或保存表单时，Android 会调用 Fillr 的系统自动填充服务。Fillr 会将表单字段与已保存的资料匹配并提供建议，也会处理用户选择保存的信息。
    disableEffect: 停用后，Android 无法通过系统自动填充功能提供 Fillr 资料或保存新信息。
