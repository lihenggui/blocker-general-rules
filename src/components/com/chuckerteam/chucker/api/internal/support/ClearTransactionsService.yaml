recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:48:24Z'
i18n:
  en:
    description: The Chucker HTTP inspector runs this service when a user clears captured request history.
      It removes saved requests or errors and dismisses their notifications.
    disableEffect: Users will not be able to clear Chucker's saved request or error history from its controls;
      normal app networking still works.
  zh-CN:
    description: 用户清除已记录的请求历史时，Chucker 网络检查工具会运行此服务。它会删除保存的请求或错误记录，并关闭相应通知。
    disableEffect: 用户将无法通过 Chucker 控件清除已保存的请求或错误记录；应用的正常网络功能仍可使用。
