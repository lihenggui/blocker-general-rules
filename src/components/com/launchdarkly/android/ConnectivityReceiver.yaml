i18n:
  en:
    description: LaunchDarkly’s Android feature-flag SDK checks for internet changes and informs its clients
      when connectivity returns or is lost. This helps the app refresh feature settings after a network
      change.
    disableEffect: Feature flags may remain out of date after the network changes, which can affect app
      features controlled by LaunchDarkly.
  zh-CN:
    description: LaunchDarkly Android 功能开关 SDK 会检测网络连接变化，并通知客户端网络恢复或断开，以便应用在网络变化后更新功能设置。
    disableEffect: 网络变化后功能开关可能无法及时更新，受 LaunchDarkly 控制的应用功能可能因此受到影响。
