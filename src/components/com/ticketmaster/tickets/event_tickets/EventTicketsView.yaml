i18n:
  en:
    description: The Ticketmaster Tickets SDK opens the selected event's ticket screen when an event link
      or ticket-list request is handled. If the event enables extras, the screen also shows an add-ons
      tab.
    disableEffect: Users cannot open that event's ticket list or its add-ons through the SDK.
  zh-CN:
    description: 处理活动链接或门票列表请求时，Ticketmaster Tickets SDK 会打开所选活动的门票页面。活动启用了附加项目时，页面还会显示附加项目标签。
    disableEffect: 用户将无法通过该 SDK 打开该活动的门票列表或附加项目。
