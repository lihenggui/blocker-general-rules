lastUpdateTime: '2026-10-29T02:32:52Z'
i18n:
  en:
    description: Unity Ads uses this transparent full-screen Activity for ad content that needs a clear
      background over the app. It passes screen events to Unity’s ad player.
    disableEffect: Unity Ads will not display; users will not receive rewards for watching Unity rewarded
      ads.
  zh-CN:
    description: Unity Ads 的广告需要透明背景覆盖在应用上方时会使用此全屏界面。它会把界面状态交给 Unity 广告播放器处理。
    disableEffect: 屏蔽后，Unity Ads 将无法显示；观看 Unity 奖励广告也不会获得奖励。
