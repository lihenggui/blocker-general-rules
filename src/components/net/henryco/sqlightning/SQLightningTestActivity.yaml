i18n:
  en:
    description: SQLightning (HenryCo SQLite helper library) includes this empty test screen, which appears
      only when an app explicitly opens the library's test page. It does not create or manage the app's
      normal database screens.
    disableEffect: The blank test page will be unavailable; normal app screens and database use remain
      available.
  zh-CN:
    description: SQLightning（HenryCo SQLite 辅助库）包含一个空白测试页面，只有应用主动打开该库的测试页时才会显示。它不负责应用日常数据库界面的创建或管理。
    disableEffect: 该空白测试页将无法打开，应用的正常界面和数据库使用仍可继续。
