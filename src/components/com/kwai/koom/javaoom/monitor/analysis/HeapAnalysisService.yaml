i18n:
  en:
    description: When KOOM's Java leak monitor has a saved heap snapshot to inspect, this service runs
      in the separate `:heap_analysis` process, analyzes the snapshot, and builds a leak report.
    disableEffect: KOOM will no longer turn captured heap snapshots into leak reports through this service.
  zh-CN:
    description: KOOM Java 泄漏监控保存待检查的堆快照时，此 Service 会在独立的 `:heap_analysis` 进程中分析快照并生成泄漏报告。
    disableEffect: KOOM 将无法通过此 Service 将捕获的堆快照转换为泄漏报告。
