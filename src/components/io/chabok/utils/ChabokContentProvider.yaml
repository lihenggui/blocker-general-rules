i18n:
  en:
    description: Chabok Push & Realtime Messaging uses this Provider at app startup to store the application
      context and register app lifecycle callbacks for its SDK.
    disableEffect: Without another Chabok context setup, push handling and notification actions can fail
      when the SDK requests the application context.
  zh-CN:
    description: Chabok Push 与实时消息 SDK 会在应用启动时使用此 Provider 保存应用上下文并注册应用生命周期回调。
    disableEffect: 如果应用未通过其他方式设置 Chabok 上下文，SDK 读取应用上下文时推送处理和通知操作可能失败。
