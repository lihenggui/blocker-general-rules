recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:38:47Z'
i18n:
  en:
    description: Weex delivers global events to active Weex pages through a listener registered while
      each page runs; the declared manifest receiver has no broadcast action of its own.
    disableEffect: Disabling the manifest entry does not stop the separately registered listeners, so
      active Weex pages continue to receive their global events.
  zh-CN:
    description: Weex 页面运行期间会注册事件监听器，将全局事件交给当前页面；清单中声明的接收器本身没有广播动作过滤器。
    disableEffect: 停用清单中的声明不会影响另外注册的监听器，因此运行中的 Weex 页面仍可收到全局事件。
