i18n:
  en:
    description: The Ingenico PCL terminal service used by Cashlez and Finix connects a POS app to a payment
      terminal over Bluetooth, USB, or a supported network link. Disabling it can stop the terminal from
      communicating with the app.
    disableEffect: Card-terminal connection and in-person payments may fail.
  zh-CN:
    description: Cashlez 和 Finix 使用的 Ingenico PCL 终端服务可通过蓝牙、USB 或支持的网络连接 POS 应用与支付终端。禁用后，终端可能无法与应用通信。
    disableEffect: 刷卡终端连接和线下支付可能失败。
