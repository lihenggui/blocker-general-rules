recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:53:28Z'
i18n:
  en:
    description: Before Android 8, JetBeep starts this service to scan for nearby Bluetooth beacons in
      the background and report detections to the app. It pauses or resumes scanning when Bluetooth is
      turned off or on.
    disableEffect: Background beacon detection will stop on these Android versions, so app features that
      depend on nearby devices will not update.
  zh-CN:
    description: 在 Android 8 之前，JetBeep 会启动此服务，在后台扫描附近的蓝牙信标并把发现结果交给应用；蓝牙关闭或重新打开时，它会暂停或恢复扫描。
    disableEffect: 这些 Android 版本上的后台信标检测将停止，依赖附近设备的功能也无法更新。
