i18n:
  en:
    description: When an app requests location, the Baidu Location SDK runs its location service in a
      separate process and can display an ongoing notification when running in the foreground.
    disableEffect: Apps using Baidu Location will not receive location fixes.
  zh-CN:
    description: 应用请求位置信息时，Baidu Location SDK 会在独立进程中运行位置服务；以前台方式运行时也可显示持续通知。
    disableEffect: 依赖 Baidu Location 的应用将无法获取位置。
