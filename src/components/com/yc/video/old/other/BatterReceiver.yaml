recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:53:46Z'
i18n:
  en:
    description: While YC VideoPlayer is active, this Receiver listens for battery changes and updates
      the player's battery status, including charging and low-battery states. Video playback itself does
      not depend on this display update.
    disableEffect: The player may stop showing the current battery or charging state; video playback remains
      available.
  zh-CN:
    description: YC VideoPlayer 运行时，此 Receiver 会监听电池变化并更新播放器中的电量、充电和低电量状态显示。视频播放本身不依赖此显示更新。
    disableEffect: 播放器可能不再显示最新电量或充电状态，但视频仍可播放。
