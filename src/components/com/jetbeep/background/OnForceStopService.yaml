i18n:
  en:
    description: JetBeep starts this service with its background manager. When the user removes the app
      from the recent-apps screen, JetBeep uses it to stop foreground beacon scanning.
    disableEffect: JetBeep's foreground beacon scan may continue after the user swipes the app away.
  zh-CN:
    description: JetBeep 会随后台管理器启动此服务；用户从最近任务中划掉应用时，SDK 会通过它停止前台信标扫描。
    disableEffect: 用户划掉应用后，JetBeep 的前台信标扫描可能仍会继续。
