  en:
    description: Extole's Android SDK opens a full-screen web page for an Extole zone selected by the
      app and passes along the page data. The page can navigate backward before it closes.
    disableEffect: Any app experience routed through an Extole zone will have no page to display.
  zh-CN:
    description: Extole Android SDK 会为应用选择的 Extole 区域打开全屏网页，并传入页面所需的数据。用户可以在关闭前返回上一页。
    disableEffect: 通过 Extole 区域展示的应用界面将无法打开。
