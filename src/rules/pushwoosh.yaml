    description: "## Primary Location\nUnited States (Washington, DC) [CrunchBase, 01](https://www.crunchbase.com/organization/pushwoosh)\n\
      ## Website\n[https://www.pushwoosh.com](https://www.pushwoosh.com)\n## About\nPushwoosh pushes in-app\
      \ messaging across platforms [Pushwoosh, 01](https://www.pushwoosh.com)\n## Ownership\nPushwoosh\n\
      ## Documentation\n[http://docs.pushwoosh.com/docs/fcm-integration](http://docs.pushwoosh.com/docs/fcm-integration)\n\
      ## Products and services\nFeatures include:\n* _Data collection (via tags):_ \"Collect additional\
      \ data from your users as Tags - gender, city and DOB, or the amount of money spent on in-app purchases.\
      \ Then use this data for precise segmentation, personal communication, push automation and analytics.\"\
      \n* _Real world location targeting:_ \"Try real-time location-based feature to send automated push\
      \ notifications to users entering a specific area. Send your sale offers, discount alerts and welcoming\
      \ messages automatically\" [Pushwoosh, 02](https://www.pushwoosh.com/features). \n   * _Targeting\
      \ in geozones:_ \"pins on the map that allow sending automatically triggered push notifications\
      \ right at the moment a user enters the specified area on the map. Its range can be set from 50\
      \ to 1000 meters, and it has an adjustable cooldown period\" [Pushwoosh, 03](http://docs.pushwoosh.com/docs/geozones).\n\
      \   * _iBeacon micro-targeting_ [Pushwoosh, 10](https://www.pushwoosh.com/blog/features-guides/ibeacons)\n\
      * _Segmentation of audiences for marketing campaigns_ [Pushwoosh, 02](https://www.pushwoosh.com/features).\
      \ Segments could include \"username, ID, city, favorite football team, preferred news categories,\
      \ or any other piece of information about your users\" [Pushwoosh, 04](http://docs.pushwoosh.com/docs/segmentation-tags-and-filters).\n\
      * _In-apps tracking:_ In-app purchases (\"The total amount of money spent on in-app purchases for\
      \ the device\"); Last In-App Purchase Date (\"The date of the last in-app purchase made on the device\"\
      ); and In-App Product (\"Names of in-app products that were purchased on the device\") [Pushwoosh,\
      \ 05](https://docs.pushwoosh.com/v1.0/docs/in-apps-tracking).\n* 250+ million pushes per day.\n\
      * _Personalized messages:_ \"Address your users by name, and use any of their preferences in the\
      \ message to make it relevant for every single user\"\n* _Statistics:_ \"Measure app installs and\
      \ opens, push subscription, sent & open rates, all tag data statistics, and much more.\"\n* _In-app\
      \ messaging:_ \"deeply customizable rich content in-app banners and full-screen interstitials.\"\
      \n* _A/B Tests:_ \"Perform A/B tests on your audience to figure out which push configuration works\
      \ better for you.\"\n* _Multiple languages_ [Pushwoosh, 02](https://www.pushwoosh.com/features)\n\
      * _Conversion Tracking:_ Track \"the number of users who perform specific actions in your application\
      \ or on your website after opening the push\" [Pushwoosh, 06](https://www.pushwoosh.com/conversion-tracking)\n\
      * _Push Recovery Campaigns:_ Target abandon carts by returning customers to finish the transaction\
      \ [Pushwoosh, 07](https://www.pushwoosh.com/abandoned-cart).\n* _Loyalty:_ Boost audience loyalty\
      \ with personalized messages.\n* _Targeted messaging:_ Send targeted messages to segments [Pushwoosh,\
      \ 09](https://www.pushwoosh.com/business-cases).\n## Privacy  Policy\nPrivacy policy is listed at\
      \ [Pushwoosh, 08](https://www.pushwoosh.com/privacy-policy). The Privacy Policy web page does not\
      \ address opt-out; it appears to be directed at prospective business clients.\n## Relationships\n\
      Nissan / Mercedes / Leica / Bosch / Sabre / runtastic / Abbyy / Silicon Beach Media / Reaktor /\
      \ redBit games / Saatchi & Saatchi / RTL Group / Skyjey / STC / SurfStitch / rtve / Ubisoft / Unaversidad\
      \ APEC / Tripcase / Suzuki / VANSO / Veikkaus / Urban Rivals / XiMad / Sony Entertainment Television\
      \ / MSC Cruises / Rayman Jungle Run / World Wide Fund for Nature (WWF) / Red Cross / Diner Dash\
      \ / Plymouth University / Playscape / MLB.com / Marmalade / Mastercard / Hewlett-Packard / MTN /\
      \ 3rd Sense / ixigo.com / JDG / Elektromarked / LOT Polish Airlines / FX Guru / G5 Games / Haaretz\
      \ / Frima Studio / FunPlus / Concentra / Fanfair / Deloitte Digital / Exhibit Force / Firezoo /\
      \ AppPresser / Autoliv / Bag It! / Carrefour / Chicago Tribune Trivia [Pushwoosh, 01](https://www.pushwoosh.com)\n\
      ## Details\n_Financial details:_ Pushwoosh was founded in 2011 [Crunchbase, 01](https://www.crunchbase.com/organization/pushwoosh).\n\
