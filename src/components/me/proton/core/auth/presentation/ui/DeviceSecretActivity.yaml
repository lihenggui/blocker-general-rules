i18n:
  en:
    description: Proton AG's Proton Core Android SDK opens this Activity when sign-in needs a backup password
      or organization-admin help. It guides the user through those account-security steps and returns
      the outcome.
    disableEffect: If disabled, users who need a backup password or administrator assistance may be unable
      to finish signing in.
  zh-CN:
    description: Proton AG 的 Proton Core Android SDK 会在登录需要备用密码或组织管理员协助时打开此 Activity，引导用户完成账户安全步骤并返回结果。
    disableEffect: 停用后，需要备用密码或管理员协助的用户可能无法完成登录。
