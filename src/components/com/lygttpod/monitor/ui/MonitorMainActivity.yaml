i18n:
  en:
    description: AndroidMonitor's launcher screen lists captured network requests and saved preference
      files, and shows a local browser address when the viewer service is available.
    disableEffect: AndroidMonitor's request and preference diagnostics will not open, but the host app's
      normal screens remain available.
  zh-CN:
    description: AndroidMonitor 的启动页会列出已记录的网络请求和保存的偏好设置文件；查看服务可用时，还会显示本地浏览器访问地址。
    disableEffect: AndroidMonitor 的请求和偏好设置诊断页面将无法打开，但宿主应用的常规页面仍可使用。
