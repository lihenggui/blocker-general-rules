i18n:
  en:
    description: When MultiPicker captures a photo or video, this provider exposes the temporary file
      through a content link so the camera can write it and the app can read it.
    disableEffect: The camera may not be able to access the output file, so photo or video capture from
      MultiPicker can fail.
  zh-CN:
    description: MultiPicker 拍摄照片或视频时，此 Provider 会通过内容链接开放临时文件，让相机写入、应用读取。
    disableEffect: 相机可能无法访问输出文件，导致 MultiPicker 中的拍照或录像失败。
