  en:
    description: Zabaan Publisher SDK shows its publisher bubble after receiving an internal request to
      enable it. Users can move or dismiss the on-screen bubble, which exposes the publisher's configured
      action.
    disableEffect: The publisher bubble and its configured action will not be available.
  zh-CN:
    description: Zabaan Publisher SDK 会在收到内部启用请求后显示发布者气泡。用户可以移动或关闭屏幕上的气泡，气泡会打开发布者配置的操作。
    disableEffect: 停用后，发布者气泡及其配置的操作将无法使用。
