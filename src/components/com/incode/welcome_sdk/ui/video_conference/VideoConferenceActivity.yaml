      video review.
  zh-CN:
    description: 核验流程要求实时审核时，此页面会将用户接入与审核人员的视频通话。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法完成要求实时视频审核的核验流程。
