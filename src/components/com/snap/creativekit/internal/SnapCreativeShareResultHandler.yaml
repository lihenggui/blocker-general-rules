recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:51:42Z'
i18n:
  en:
    description: When an app sends content to Snapchat through Snap CreativeKit (Snap Inc.), the SDK includes
      this receiver as the target for a follow-up broadcast. In this version, the receiver does not process
      the result.
    disableEffect: If disabled, the app will not receive that follow-up share-result broadcast; the share
      screen itself is started through a separate Snapchat handoff.
  zh-CN:
    description: 应用通过 Snap CreativeKit（Snap Inc.）向 Snapchat 发送内容时，SDK 会将此 Receiver 设为后续广播的接收目标。此版本中，该
      Receiver 不会处理结果。
    disableEffect: 禁用后，应用将收不到后续的分享结果广播；分享界面本身由单独的 Snapchat 跳转流程启动。
