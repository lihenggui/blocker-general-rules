i18n:
  en:
    description: The Androscope developer tool runs this Provider during app startup. When automatic inspection
      is enabled, it watches for the first app screen to open and starts the inspection server.
    disableEffect: Disabling it turns off automatic server startup for Androscope; normal app startup
      and screens continue to work.
  zh-CN:
    description: Androscope 开发工具会在应用启动时运行此 Provider。启用自动检查后，它会等待应用首个界面打开，再启动检查服务。
    disableEffect: 停用后，Androscope 将不再自动启动检查服务；应用正常启动和使用不受影响。
