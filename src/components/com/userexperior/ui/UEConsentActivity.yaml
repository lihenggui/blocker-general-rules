recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Before recording, UserExperior opens this screen to ask whether the user allows in-app
      activity, screen, and gestures to be sent to a third-party analytics service.
    disableEffect: The UserExperior recording consent prompt will not open, so users cannot grant recording
      permission through it.
  zh-CN:
    description: 开始记录前，UserExperior 会打开此页面，询问用户是否允许将应用操作、屏幕和手势发送给第三方分析服务。
    disableEffect: 禁用后，UserExperior 的记录授权提示将无法打开，用户也无法通过此页面授予记录权限。
