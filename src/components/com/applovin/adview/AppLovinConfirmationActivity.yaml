i18n:
  en:
    description: After an AppLovin incentivized ad reports an accepted, rejected, or over-limit reward
      outcome, this Activity shows the matching confirmation dialog. If the Activity is unavailable, AppLovin
      falls back to a brief message.
    disableEffect: The full reward confirmation dialog will not appear; AppLovin will show a brief message
      instead.
  zh-CN:
    description: AppLovin 激励广告返回奖励已接受、被拒绝或超出限额等结果后，此 Activity 会显示相应的确认对话框。若此 Activity 不可用，AppLovin 会改为显示简短提示。
    disableEffect: 完整的奖励确认对话框不会显示，AppLovin 会改为显示简短提示。
