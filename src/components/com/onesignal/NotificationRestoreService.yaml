recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:08:14Z'
i18n:
  en:
    description: After an app update on Android versions below 8.0, OneSignal starts this background Service
      to restore notifications that were still active. It reloads saved notifications and posts the ones
      that remain valid.
    disableEffect: OneSignal may not bring back active notifications after an app update on older Android
      versions.
  zh-CN:
    description: Android 8.0 以下的设备在应用更新后，OneSignal 会启动此后台 Service 来恢复仍有效的通知。它会载入已保存的通知，并重新显示仍可恢复的项目。
    disableEffect: 在较旧的 Android 版本上，应用更新后 OneSignal 可能无法重新显示仍有效的通知。
