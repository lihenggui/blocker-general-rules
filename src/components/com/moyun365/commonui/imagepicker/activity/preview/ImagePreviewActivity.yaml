  en:
    description: CommonUI (Moyun365) lets users review photos in a multi-image selection, change which
      photos are selected and optionally keep original quality. It returns the updated selection when
      the user confirms or goes back.
    disableEffect: Users will lose the photo review and selection screen in the multi-image picker.
  zh-CN:
    description: CommonUI（Moyun365）允许用户在多图选择中预览照片、调整所选图片，并可选择保留原图画质。确认或返回时，它会交回更新后的选择结果。
    disableEffect: 多图选择流程中的照片预览和调整界面将无法使用。
