  en:
    description: When an Ogury (ExploreStack) timer sends a task, this receiver forwards it to Ogury (ExploreStack)’s
      background service for processing.
    disableEffect: Ogury’s timer-triggered background tasks will stop; the host app’s other features remain
      available.
  zh-CN:
    description: Ogury（ExploreStack）定时器发送任务时，此接收器会将任务转交给 Ogury（ExploreStack）后台服务处理。
    disableEffect: Ogury 由定时器触发的后台任务将停止，但应用的其他功能仍可使用。
