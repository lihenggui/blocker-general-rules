  en:
    description: When an app or library using Stanfy’s Enroscar submits background work, this service
      runs the queued tasks in separate work queues.
    disableEffect: Background tasks that rely on Enroscar may not finish, which can disrupt app features
      that depend on them.
  zh-CN:
    description: 使用 Stanfy Enroscar 的应用或库提交后台任务时，此服务会在不同队列中执行这些任务。
