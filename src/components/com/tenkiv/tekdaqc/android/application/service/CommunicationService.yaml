i18n:
  en:
    description: When the app binds to this TenKiv TekDAQC service, it accepts board connection, command,
      and task requests and relays board responses to the app.
    disableEffect: Disabling it prevents the app from communicating with TekDAQC boards or running commands
      and tasks on them.
  zh-CN:
    description: 应用连接这个 TenKiv TekDAQC 服务时，服务会接收与采集板连接、发送命令和执行任务的请求，并把设备响应传回应用。
    disableEffect: 停用后，应用将无法与 TekDAQC 采集板通信，也无法在设备上执行命令和任务。
