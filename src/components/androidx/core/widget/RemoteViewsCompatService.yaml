i18n:
  en:
    description: AndroidX RemoteViews binds this Service when a home-screen widget needs a collection
      such as a list or grid; it supplies the saved rows for the requested widget.
    disableEffect: Widgets that use these collection views lose their list or grid content and may appear
      empty.
  zh-CN:
    description: 主屏幕小组件需要列表或网格等集合内容时，AndroidX RemoteViews 会绑定这个 Service；它为相应小组件提供已保存的条目。
    disableEffect: 使用此集合视图的小组件将失去列表或网格内容，显示可能变为空白。
