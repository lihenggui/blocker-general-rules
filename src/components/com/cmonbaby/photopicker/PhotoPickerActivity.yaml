i18n:
  en:
    description: The Cnmen Photo Selector library opens this Activity when an app requests image selection.
      It shows a photo grid, enforces the requested selection limit, supports optional cropping, and returns
      the chosen images.
    disableEffect: App flows that rely on this picker to choose or crop photos may fail to accept those
      images.
  zh-CN:
    description: 应用请求选图时，Cnmen Photo Selector 会打开此界面。它显示照片网格，按应用要求限制选择数量，支持可选裁剪，并把选中的照片交回应用。
    disableEffect: 依赖此选择器来选择或裁剪照片的应用流程可能无法接收这些图片。
