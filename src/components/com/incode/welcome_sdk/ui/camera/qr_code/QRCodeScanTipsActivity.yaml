      interrupt that path.
  zh-CN:
    description: 二维码相机打开前，此页面会说明如何摆放并扫描二维码。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，二维码扫描流程无法显示所需说明，并可能中断该流程。
