i18n:
  en:
    description: When Google Activity Recognition reports a recent vehicle transition, this Receiver forwards
      it to DriveBuddy's trip tracker so it can start or stop a drive.
    disableEffect: DriveBuddy can miss vehicle transitions and record trip boundaries incorrectly.
  zh-CN:
    description: Google 活动识别报告近期车辆活动转换时，此 Receiver 会将其转交 DriveBuddy 行程追踪流程，用于开始或结束驾驶记录。
    disableEffect: 停用后，DriveBuddy 可能漏掉车辆活动转换，导致行程边界记录不准确。
