    description: When another Mindcafe feature opens a web page, this screen displays the configured page
      inside the app. The SDK uses it for counselor pages, legal documents, and other counseling service
      pages.
    disableEffect: Users cannot open the counselor, legal, or other service pages that the Mindcafe SDK
      displays inside the app.
  zh-CN:
