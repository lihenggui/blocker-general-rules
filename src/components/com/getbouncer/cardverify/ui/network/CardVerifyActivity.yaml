i18n:
  en:
    description: When an app requests Bouncer CardVerify's network card check, this Activity guides the
      user through scanning a payment card and returns the verification result to the app.
    disableEffect: The app cannot open this card-verification step, so checkout or another flow that relies
      on it may fail.
  zh-CN:
    description: 应用请求 Bouncer CardVerify 网络验卡时，此 Activity 会引导用户扫描银行卡，并将验证结果返回应用。
    disableEffect: 应用无法打开这一步验卡流程，依赖它的结账或其他功能可能无法完成。
