i18n:
  en:
    description: The Facebook Android SDK opens this screen during Facebook account sign-in for Adobe
      Creative SDK Behance, ASNE, OneAll, or Wings integrations. It completes authorization and returns
      the result to the requesting app.
    disableEffect: Facebook sign-in and authorization flows that use this screen will fail.
  zh-CN:
    description: Adobe Creative SDK Behance、ASNE、OneAll 或 Wings 集成进行 Facebook 账户登录时，Facebook Android SDK
      会打开此界面。它完成授权并将结果返回给发起请求的应用。
    disableEffect: 停用后，使用此界面的 Facebook 登录和授权流程将会失败。
