i18n:
  en:
    description: HIGH MOBILITY HMKit opens this screen when an app needs the user to authorize access
      to a vehicle service. It displays the authorization page and any status or error before returning
      to the app.
    disableEffect: Disabling it can prevent users from authorizing or connecting an account to a vehicle
      service.
  zh-CN:
    description: 应用需要用户授权访问车辆服务时，HIGH MOBILITY HMKit 会打开此页面。页面显示授权内容及状态或错误信息，之后返回应用。
    disableEffect: 停用后，用户可能无法授权账户或连接车辆服务。
