  en:
    description: Chalk Digital's CD Ads SDK opens a full-screen player for video ads. It can also show
      interactive rich-media video ads.
    disableEffect: These ad videos will not play; if the app uses a rewarded video placement, the user
      will not receive its reward.
  zh-CN:
    description: Chalk Digital 的 CD Ads 广告 SDK 会打开这个全屏页面播放视频广告，也可播放带互动内容的视频广告。
    disableEffect: 停用后，这些视频广告将无法播放；如果应用使用激励视频广告，用户将无法获得观看奖励。
