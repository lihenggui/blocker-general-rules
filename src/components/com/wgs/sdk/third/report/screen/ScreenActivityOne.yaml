i18n:
  en:
    description: When BXM SDK's lock-screen information feature is enabled, this first layout opens after
      the device screen turns off and its configured delay passes. It shows a clock and date with configured
      web content and floating ad links.
    disableEffect: This first lock-screen page and its ad links no longer appear, while the rest of the
      app remains available.
  zh-CN:
    description: 启用 BXM SDK 的锁屏资讯功能后，设备屏幕关闭并经过设定的延迟时间，此第一种页面布局会打开。它显示时钟、日期、配置的网页内容和悬浮广告入口。
    disableEffect: 此锁屏页面及其广告入口将不再显示，应用的其他功能仍可使用。
