recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:23:19Z'
i18n:
  en:
    description: When Huawei Push Kit refreshes a token or delivers a message, this Tencent TPNS service
      passes the token or message into the app's TPNS push handling.
    disableEffect: Disabling it stops TPNS from registering or receiving messages through Huawei Push
      Kit.
  zh-CN:
    description: 华为推送令牌更新或消息到达时，这个腾讯 TPNS 服务会把令牌或消息交给应用中的 TPNS 推送处理。
    disableEffect: 停用后，TPNS 将无法通过华为推送渠道登记令牌或接收消息。
