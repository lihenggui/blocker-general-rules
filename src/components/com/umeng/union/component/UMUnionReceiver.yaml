i18n:
  en:
    description: When Umeng Union sends an internal ad-notification or download-status broadcast, this
      Receiver updates the related ad event or download record.
    disableEffect: Umeng Union will stop processing these ad-notification and download-status events;
      the app's other features continue to work.
  zh-CN:
    description: 友盟 Union 发送内部广告通知或下载状态广播时，此 Receiver 会更新对应的广告事件或下载记录。
    disableEffect: 停用后，友盟 Union 将无法处理这些广告通知和下载状态事件；应用的其他功能仍可使用。
