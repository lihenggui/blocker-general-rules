i18n:
  en:
    description: When opened, the Sobot CRM SDK clears the saved agent login and shows a prompt to sign
      in again with the supplied credentials or close the CRM session.
    disableEffect: If Sobot CRM opens this screen after an agent session ends, the agent cannot use it
      to sign in again or leave the CRM session cleanly.
  zh-CN:
    description: 此界面打开时，Sobot CRM SDK 会清除已保存的客服登录信息，并提示客服人员用提供的凭据重新登录或退出 CRM 会话。
    disableEffect: 如果客服会话结束后 Sobot CRM 打开此界面，停用它会使客服人员无法在此重新登录或正常退出 CRM 会话。
