i18n:
  en:
    description: The Aniways Android SDK starts this Service for scheduled or requested server syncs;
      it downloads updated configuration and keyword data used by its conversation suggestions. Disabling
      it prevents those updates from being fetched.
    disableEffect: Aniways will stop downloading refreshed configuration and suggestion data.
  zh-CN:
    description: Aniways Android SDK 会在定时任务或应用请求同步时启动此 Service，从服务器下载更新后的配置和关键词数据，供对话建议功能使用。禁用后，SDK 无法获取这些更新。
    disableEffect: Aniways 将停止下载更新后的配置和建议数据。
