recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:48:16Z'
i18n:
  en:
    description: When Android reports an app install or removal, the Youmi Overseas Offers Wall SDK updates
      its installed-app tracking and checks whether a pending task should open that app. The receiver
      is also registered for boot, package-replacement, and keyboard-change notices.
    disableEffect: App-install offers will no longer update their tracking or resume a waiting task app,
      while the host app’s other features remain available.
  zh-CN:
    description: Android 通知有应用安装或卸载时，Youmi 海外积分墙 SDK 会更新已安装应用记录，并检查是否有等待启动该应用的任务。此接收器还注册接收开机、应用替换和输入法切换通知。
    disableEffect: 安装类任务将无法更新跟踪信息或继续启动等待中的应用，但宿主应用的其他功能仍可使用。
