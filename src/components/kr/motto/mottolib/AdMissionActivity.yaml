i18n:
  en:
    description: Motto (MobileCodit) opens this screen for a selected reward campaign. It routes ad, search,
      social, or website tasks to their campaign screen and returns the completion reward to the calling
      screen.
    disableEffect: Motto campaign tasks opened here will not run, and their rewards will not be reported
      to the app.
  zh-CN:
    description: Motto（MobileCodit）会在用户选择奖励活动后打开此界面。它会把广告、搜索、社交或网站任务转到相应页面，并将完成结果和奖励返回给调用方。
    disableEffect: 停用后，通过此界面打开的 Motto 活动将无法进行，奖励也不会回传应用。
