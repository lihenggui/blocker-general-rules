i18n:
  en:
    description: When a flow requires a qualified electronic signature, this screen lets the user review
      documents, provide the signature consent, and see the signing result. The MetaMap identity verification
      SDK opens this screen when the configured flow reaches this step.
    disableEffect: Disabling it prevents users from completing the qualified-signature step in flows that
      require it.
  zh-CN:
    description: 核验流程要求合格电子签名时，此页面让用户查看文件、提供签名同意并查看签署结果。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法完成要求合格电子签名的核验步骤。
