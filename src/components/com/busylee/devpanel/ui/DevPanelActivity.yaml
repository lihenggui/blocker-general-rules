  en:
    description: Android Tools DevPanel opens this developer panel after a shake gesture or when requested
      by the app; it shows registered app information and controls for changing registered settings.
    disableEffect: The developer information and tuning panel becomes unavailable; ordinary app screens
      remain usable.
  zh-CN:
    description: Android Tools 的 DevPanel 会在用户摇动设备或应用请求时打开开发者面板，其中列出已登记的应用信息和可调整的设置。
    disableEffect: 停用后，开发者信息和调试设置面板将无法使用，但应用的日常页面仍可使用。
