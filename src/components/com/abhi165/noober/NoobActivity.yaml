i18n:
  en:
    description: When Noober 2.0's debugging dashboard is opened, this Activity displays captured API
      calls, logs, shared preferences, and app properties. Noober can also open it from its browsable
      link.
    disableEffect: Users lose the Noober debugging dashboard and its link-based debugging account switch.
  zh-CN:
    description: 打开 Noober 2.0 的调试面板时，这个 Activity 会显示记录的 API 请求、日志、共享偏好设置和应用属性。用户也可以通过 Noober 的可浏览链接打开它。
    disableEffect: 用户将无法打开 Noober 调试面板，也无法通过其链接切换调试账号。
