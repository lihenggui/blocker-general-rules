i18n:
  en:
    description: When Google Play services reports a detected activity transition, this receiver records
      it and may trigger Neura Android SDK location, Bluetooth, and Wi-Fi scans.
    disableEffect: Neura movement context and related scans will stop updating.
  zh-CN:
    description: Google Play 服务报告检测到的活动转换时，此接收器会记录该事件，并可触发 Neura Android SDK 的位置、蓝牙和 Wi-Fi 扫描。
    disableEffect: Neura 的移动情境数据及相关扫描将停止更新。
