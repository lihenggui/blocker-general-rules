i18n:
  en:
    description: When an app requests a Bluetooth printer connection or sends print data, the EasyPrinter
      Service connects to the selected printer and sends the print bytes.
    disableEffect: Bluetooth printing through this library stops, so app flows that depend on it cannot
      print.
  zh-CN:
    description: 应用请求连接蓝牙打印机或发送打印数据时，EasyPrinter Service 会连接所选打印机并发送打印内容。
    disableEffect: 此库提供的蓝牙打印将停止，依赖它的应用流程将无法打印。
