recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: When a Fillr embedded browser sends form data for capture, this service maps the submitted
      fields and stores approved values in the user's profile for later autofill. It can ask before saving
      sensitive values.
    disableEffect: Disabling it prevents Fillr from capturing new form details for reuse in the user's
      profile.
  zh-CN:
    description: Fillr 嵌入式浏览器提交表单数据以供保存时，此服务会映射表单字段，并将获准保存的信息写入用户资料，供之后自动填充；保存敏感信息前也可能征求用户同意。
    disableEffect: 停用后，Fillr 无法采集并保存新的表单信息以供用户资料复用。
