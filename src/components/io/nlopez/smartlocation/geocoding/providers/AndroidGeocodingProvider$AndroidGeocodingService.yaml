recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:19:59Z'
i18n:
  en:
    description: When an app requests a place-name or address lookup through Smart Location Library, this
      service uses Android’s built-in address lookup feature and sends matching addresses back to the
      app.
    disableEffect: Address searches based on place names or coordinates will no longer return results
      to the app.
  zh-CN:
    description: 应用通过 Smart Location Library 查询地点或地址时，此服务会使用 Android 内置的地址查询功能，并将匹配的地址返回给应用。
    disableEffect: 停用后，应用将无法取得按地点名称或坐标查询的地址结果。
