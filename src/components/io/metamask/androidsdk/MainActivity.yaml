recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:18:55Z'
i18n:
  en:
    description: The MetaMask Android SDK includes this standalone main screen. In release 0.1.2 the app
      icon opens it, but it displays an empty screen and contains no wallet connection flow; release 0.6.6
      keeps it available for direct opening without the app-icon link.
    disableEffect: Blocking it hides the empty screen and may remove the app-icon entry point in versions
      that use it as the launcher.
  zh-CN:
    description: MetaMask Android SDK 包含此独立主页面。0.1.2 版会通过应用图标打开它，但页面为空且没有钱包连接流程；0.6.6 版仍可直接打开此页面，但应用图标不再指向它。
    disableEffect: 停用后此空白页面将无法打开；在将它用作启动入口的版本中，应用图标入口也可能消失。
