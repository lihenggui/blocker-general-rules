i18n:
  en:
    description: The Spotii app Netcore Smartech push integration runs when Firebase supplies a device
      push token or message. It forwards token updates and message data to Smartech for notification handling.
    disableEffect: Spotii push notifications and device token updates handled by Smartech will stop being
      processed, while the app screens remain available.
  zh-CN:
    description: Spotii 应用中的 Netcore Smartech 推送集成会在 Firebase 提供设备推送令牌或消息时运行，并把令牌更新和消息数据交给 Smartech 处理通知。
    disableEffect: 停用后，Smartech 处理的 Spotii 推送通知和设备令牌更新都会停止，应用界面仍可使用。
