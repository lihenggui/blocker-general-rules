i18n:
  en:
    description: After device boot or an unlock event, Advanced Biometric Prompt Compat checks whether
      biometric sensor lockout state needs to be reset.
    disableEffect: Biometric lockout recovery after a restart or unlock will not run, so biometric sign-in
      may remain unavailable after a lockout.
  zh-CN:
    description: 设备启动或解锁后，Advanced Biometric Prompt Compat 会检查是否需要重置生物识别传感器的锁定状态。
    disableEffect: 重启或解锁后的生物识别锁定恢复将无法运行，发生锁定后生物识别登录可能仍不可用。
