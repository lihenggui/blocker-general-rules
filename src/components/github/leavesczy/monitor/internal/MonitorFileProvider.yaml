i18n:
  en:
    description: LeavesCZY Monitor starts this file provider with the app to initialize its HTTP inspector
      and share files created by its request-inspection screens. It runs before the user opens those screens.
    disableEffect: The inspector may not initialize, and exporting or sharing its saved request details
      may fail.
  zh-CN:
    description: 应用启动时，LeavesCZY Monitor 会通过此文件提供器初始化 HTTP 检查工具，并分享请求检查界面生成的文件。它会在用户打开相关界面前运行。
    disableEffect: 检查工具可能无法初始化，导出或分享已保存的请求详情也可能失败。
