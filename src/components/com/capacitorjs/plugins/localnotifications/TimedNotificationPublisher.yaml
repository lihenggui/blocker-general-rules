i18n:
  en:
    description: When a scheduled Capacitor local notification alarm fires, this receiver displays the
      notification and schedules the next occurrence for repeating reminders. It also forwards the received
      reminder to the plugin.
    disableEffect: Scheduled local notifications will not appear at their set times.
  zh-CN:
    description: Capacitor 本地通知的定时提醒到期时，此接收器会显示通知；对于重复提醒，还会安排下一次触发，并把提醒转交给插件。
    disableEffect: 已安排的本地通知将无法在设定时间显示。
