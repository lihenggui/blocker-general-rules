i18n:
  en:
    description: Swrve opens this Activity to explain and request foreground or background location access,
      and it can direct the user to app settings after a denial.
    disableEffect: Swrve may be unable to request location access, so geofences and location-based campaigns
      may not start.
  zh-CN:
    description: Swrve 会打开此活动页面说明并申请前台或后台位置权限；用户拒绝后，页面还可引导其进入应用设置。
    disableEffect: Swrve 可能无法申请位置权限，因此地理围栏和基于位置的活动可能无法启动。
