i18n:
  en:
    description: FlatOCRExtractor's lib-ocr library opens this Activity when an app starts a scan. It
      shows scan instructions, then hosts the camera capture and text-recognition flow and returns the
      scan result to the app.
    disableEffect: The app's camera-based text scanning and OCR results will no longer be available.
  zh-CN:
    description: 应用开始扫描时，FlatOCRExtractor 的 lib-ocr 文字识别库会打开此 Activity。它先显示扫描说明，再承载相机拍摄和文字识别流程，并将扫描结果返回给应用。
    disableEffect: 应用将无法再使用相机扫描文字或获取 OCR 识别结果。
