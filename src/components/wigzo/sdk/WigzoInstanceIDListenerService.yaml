i18n:
  en:
    description: Google Play services starts this Wigzo Service when the push registration token changes;
      it clears the old registration state and starts registration again.
    disableEffect: Wigzo push delivery may stop after a token change, while the app’s other features remain
      available.
  zh-CN:
    description: 推送注册令牌发生变化时，Google Play 服务会启动 Wigzo 的此 Service；它清除旧注册状态并重新注册。
    disableEffect: 令牌变化后，Wigzo 推送可能无法继续送达，但应用的其他功能仍可使用。
