i18n:
  en:
    description: The Agora AVC conference app starts this Service after Xiaomi reports a registration
      result or supplies incoming meeting data. It updates the push token or passes the invitation data
      to the app.
    disableEffect: Xiaomi push registration and incoming meeting data handled by this Service will stop
      reaching the app.
  zh-CN:
    description: 小米返回推送注册结果或提供会议数据后，Agora AVC 会议应用会启动此 Service。它会更新推送令牌，或将邀请数据交给应用处理。
    disableEffect: 此 Service 处理的小米推送注册结果和会议数据将无法送达应用。
