  en:
    description: Tapsell opens this Activity to show video or banner ads and lets viewers follow an ad’s
      web page or app action. It reports whether rewarded video was completed or closed.
    disableEffect: Tapsell ads will not display; rewards for watching Tapsell rewarded ads will no longer
      be granted.
  zh-CN:
    description: Tapsell 展示视频或横幅广告时会打开此界面，也可让用户前往广告网页或应用操作。它会记录奖励视频是否看完或关闭。
    disableEffect: 屏蔽后，Tapsell 广告将无法显示；观看 Tapsell 奖励广告也不会获得奖励。
