recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: AndroidX Core PiP starts this hidden Activity when an app requests its content picture-in-picture
      fallback; it attaches the supplied content, enters picture-in-picture, and reports when that view
      closes.
    disableEffect: Apps using this fallback can no longer show or close their content in picture-in-picture.
  zh-CN:
    description: 应用请求 AndroidX Core PiP 的内容画中画备用流程时会启动这个隐藏 Activity；它接入指定内容、进入画中画，并在该内容关闭时返回结果。
    disableEffect: 使用此备用流程的应用将无法再以画中画方式显示或关闭该内容。
