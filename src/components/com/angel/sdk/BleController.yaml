i18n:
  en:
    description: The Angel Sensor Bluetooth connector bundled with SSJ (HCM Lab) runs when an app connects
      to an Angel sensor, initializes Bluetooth, and provides the connection needed to receive sensor
      readings. It works in the background when the app requests that connection.
    disableEffect: Angel Sensor pairing and sensor readings will stop.
  zh-CN:
    description: 随 SSJ（HCM Lab）打包的 Angel Sensor 蓝牙连接组件会在应用连接 Angel 传感器时初始化蓝牙，并提供读取传感器数据所需的连接。应用请求连接时，它会在后台运行。
    disableEffect: Angel Sensor 设备将无法配对，应用也无法读取其传感器数据。
