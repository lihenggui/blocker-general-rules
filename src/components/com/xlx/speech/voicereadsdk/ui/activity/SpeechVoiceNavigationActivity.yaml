    description: The Xinliangxiang voice-read SDK opens this screen when Android opens its route for an
      external link. It brings an already-running app task to the foreground and then closes.
    disableEffect: External links that use this navigation route may no longer bring the running app to
      the foreground.
  zh-CN:
    description: Xinliangxiang 的 voice-read SDK 会在 Android 打开外部链接导航入口时显示此页面。它会把已运行的应用任务切到前台，然后关闭。
    disableEffect: 使用此导航入口的外部链接可能无法再将正在运行的应用切到前台。
