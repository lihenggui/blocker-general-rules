i18n:
  en:
    description: When a project submits data to Google Sheets, ODK Collect uses this screen to authorize
      the account and upload the selected form responses. It is part of the Samagra ODK Collect client.
    disableEffect: Selected form responses will no longer be submitted to Google Sheets through ODK Collect.
  zh-CN:
    description: 项目使用 Google 表格提交数据时，ODK Collect 会通过此页面授权账户并上传所选表单答卷。 它是 Samagra 构建的 ODK Collect 客户端的一部分。
    disableEffect: 停用后，所选表单答卷将无法通过 ODK Collect 提交到 Google 表格。
