i18n:
  en:
    description: Primer's Stripe integration opens this Activity when a payment needs bank-account details;
      it presents Stripe's bank-account collection flow and returns the result.
    disableEffect: Disabling it prevents users from entering bank-account details for Stripe payments
      through Primer.
  zh-CN:
    description: Primer 的 Stripe 集成会在支付需要银行账户信息时打开此 Activity；它显示 Stripe 的账户信息收集流程并返回结果。
    disableEffect: 停用后，用户无法通过 Primer 为 Stripe 支付填写银行账户信息。
