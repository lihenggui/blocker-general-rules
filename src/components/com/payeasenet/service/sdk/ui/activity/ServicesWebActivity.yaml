i18n:
  en:
    description: When an app opens a PayEase add-on service, this Activity checks the service request,
      loads the service page in an in-app browser, and returns whether the user completed or cancelled
      it.
    disableEffect: Disabling it makes PayEase add-on service flows unavailable and prevents their result
      from returning to the app.
  zh-CN:
    description: 应用打开 PayEase 增值服务时，此 Activity 会校验服务请求，在应用内浏览器中加载服务页面，并返回用户已完成或取消的状态。
    disableEffect: 停用后，PayEase 增值服务流程无法使用，处理结果也无法返回应用。
