    description: The Castled Notifications SDK opens this Activity when a user taps one of its notifications.
      It follows the configured link or screen, or returns to the app's launch screen, and reports the
      click.
    disableEffect: Tapping a Castled notification will no longer open its configured destination.
  zh-CN:
