i18n:
  en:
    description: While Pangle downloads an advertised app, this Service shows or cancels progress notifications
      and reacts to network or storage changes by retrying or pausing downloads.
    disableEffect: Pangle download progress notifications and automatic retry or pause handling will stop;
      the host app remains usable.
  zh-CN:
    description: Pangle 下载广告应用期间，此 Service 会显示或取消进度通知，并根据网络或存储变化重试或暂停下载。
    disableEffect: Pangle 下载进度通知以及自动重试或暂停处理会停止，但宿主应用仍可使用。
