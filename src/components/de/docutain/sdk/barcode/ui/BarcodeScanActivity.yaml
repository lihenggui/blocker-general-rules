i18n:
  en:
    description: Docutain SDK Barcode opens this Activity when the app starts a barcode scan. It uses
      the camera to detect barcode values and returns the scan results to the app.
    disableEffect: The Docutain barcode-scan screen will not open, so users cannot scan barcodes through
      that flow.
  zh-CN:
    description: 应用启动条码扫描时，Docutain SDK Barcode 会打开此 Activity。它使用相机识别条码内容并将扫描结果返回应用。
    disableEffect: 停用后，应用将无法使用 Docutain 单次扫描界面识别条码。
