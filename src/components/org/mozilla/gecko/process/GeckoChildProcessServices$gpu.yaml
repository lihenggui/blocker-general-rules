recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:44:57Z'
i18n:
  en:
    description: The Mozilla GeckoView engine (also forked by Equalitie for CENO) starts this separate
      worker when a page needs graphics work handled by the device’s GPU.
    disableEffect: Some page graphics may not display correctly, and pages may fail if GeckoView cannot
      start this worker.
  zh-CN:
    description: Mozilla GeckoView 浏览器引擎（包括 Equalitie 为 CENO 制作的分支）在网页需要设备 GPU 处理图形时启动此独立进程。
    disableEffect: 部分网页图形可能显示异常；如果 GeckoView 无法启动此进程，网页也可能无法正常运行。
