i18n:
  en:
    description: When Ant Digital face verification enters its fallback authorization route, this browsable
      screen lets the user exit or continue with Alipay-based verification and returns the outcome. Disabling
      it removes that authentication path.
    disableEffect: Users may be unable to complete the Alipay fallback verification route.
  zh-CN:
    description: Ant Digital 人脸核验进入备用授权流程时，此可浏览界面允许用户退出或继续使用支付宝核验，并返回处理结果。禁用后，这条身份验证路径会失效。
    disableEffect: 用户可能无法完成支付宝备用核验流程。
