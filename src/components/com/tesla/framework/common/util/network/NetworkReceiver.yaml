i18n:
  en:
    description: FastFramework (Jerry Liu's FastAndroid library) listens for Android connectivity changes
      and checks whether a network is available. It tells the app's network listener when connectivity
      appears or disappears.
    disableEffect: Features that respond to connection changes may stop updating their online or offline
      state.
  zh-CN:
    description: FastFramework（Jerry Liu 的 FastAndroid 库）监听 Android 网络连接变化，并检查网络是否可用。连接出现或中断时，它会通知应用的网络监听器。
    disableEffect: 依赖网络变化通知的功能可能无法及时更新在线或离线状态。
