i18n:
  en:
    description: When Pangle prepares a downloaded app or plug-in for installation, this Provider creates
      a secure link to its file and lets Android read the file.
    disableEffect: Android may not be able to access the downloaded file, so installing an app from a
      Pangle ad can fail.
  zh-CN:
    description: Pangle 准备安装广告中下载的应用或插件时，此 Provider 会生成安全链接，让 Android 读取相应文件。
    disableEffect: Android 可能无法访问下载文件，因此通过 Pangle 广告安装应用可能失败。
