  en:
    description: The PayPal Here Retail SDK opens this Activity during card-reader setup or checkout.
      It shows reader scanning and connection screens, including Bluetooth and connection-error steps.
    disableEffect: Card-reader scanning and connection through PayPal Here will not work, so in-person
      checkout with that reader can fail.
  zh-CN:
    description: PayPal Here Retail SDK 会在设置读卡器或结账时打开此 Activity，显示读卡器扫描和连接页面，包括蓝牙及连接错误处理步骤。
    disableEffect: PayPal Here 的读卡器扫描和连接将无法使用，依赖该读卡器的现场结账可能失败。
