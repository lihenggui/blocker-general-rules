i18n:
  en:
    description: Rokid Air screen casting starts this foreground service after Android grants screen-capture
      permission. It captures the phone display for the cast preview and provides floating controls to
      return or lock the screen.
    disableEffect: Rokid Air screen mirroring cannot keep capturing or send the phone display to the cast
      preview.
  zh-CN:
    description: Android 授予屏幕捕获权限后，Rokid Air 投屏会启动此前台服务，捕获手机画面供投屏预览，并提供返回和锁屏浮动控制。
    disableEffect: Rokid Air 投屏将无法持续捕获手机画面或将画面发送到投屏预览。
