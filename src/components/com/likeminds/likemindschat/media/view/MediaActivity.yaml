i18n:
  en:
    description: LikeMinds Chat-v1 opens this Activity when a user views media shared in a conversation
      or chatroom. It provides photo and video browsing, along with related media-send and editing screens.
    disableEffect: Users cannot browse shared media or use the chat SDK's media-editing screens.
  zh-CN:
    description: 用户查看会话或聊天室中分享的媒体时，LikeMinds Chat-v1 会打开此 Activity。页面支持浏览照片和视频，也承载相关的媒体发送和编辑页面。
    disableEffect: 停用后，用户无法浏览已分享的媒体或使用聊天 SDK 的媒体编辑页面。
