recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:12:24Z'
i18n:
  en:
    description: Tencent Klevin runs this receiver when Android reports that an ad-app download has finished.
      It checks the downloaded file, records completion, and continues the ad's install handoff.
    disableEffect: Klevin ad downloads will not be handed off after completion, so their app-install prompt
      may not appear.
  zh-CN:
    description: Android 报告广告应用下载完成时，Tencent Klevin 会运行此接收器。它检查下载文件、记录完成事件，并继续广告应用的安装交接。
    disableEffect: Klevin 广告下载完成后将无法继续交接，因此可能不会显示相应的应用安装提示。
