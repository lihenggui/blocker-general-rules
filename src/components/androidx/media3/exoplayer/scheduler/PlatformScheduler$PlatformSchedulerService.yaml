i18n:
  en:
    description: The AndroidX Media3 playback library uses this service for scheduled media work, including
      downloads. Android runs it when requirements such as network access, charging, idle state, or available
      storage are met, and it starts the requested media service.
    disableEffect: Scheduled Media3 downloads will not restart through this job when their requirements
      are met.
  zh-CN:
    description: AndroidX Media3 播放库会用此服务调度媒体任务，包括下载。网络、充电、设备空闲或存储空间等条件满足时，Android 会运行它并启动相应的媒体服务。
    disableEffect: Media3 下载将无法通过此任务在条件满足时自动重新启动。
