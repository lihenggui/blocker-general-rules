i18n:
  en:
    description: The Leap Logging Android SDK provider opens a local database for SDK log entries and
      log-session records when Android starts the app. Leap Creator's diagnostic screens use it to read
      and share saved logs.
    disableEffect: Leap's saved diagnostic logs and log-viewing or export tools become unavailable.
  zh-CN:
    description: Leap Logging Android SDK 的内容提供器会在 Android 启动应用时打开本地数据库，保存 SDK 日志和日志会话记录。Leap Creator
      的诊断界面会从中读取并分享已保存的日志。
    disableEffect: Leap 的已保存诊断日志以及日志查看和导出工具将无法使用。
