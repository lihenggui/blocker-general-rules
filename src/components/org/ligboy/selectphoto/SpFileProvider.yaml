i18n:
  en:
    description: When Ligboy's SelectPhoto captures a new photo, this Provider gives the camera app temporary
      access to write the image into the host app's cache.
    disableEffect: Camera capture through SelectPhoto fails because the camera cannot write the photo
      to the app's cache.
  zh-CN:
    description: Ligboy 的 SelectPhoto 拍摄照片时，此 Provider 会临时允许相机应用将图片写入宿主应用的缓存。
    disableEffect: 停用后，相机应用无法将照片写入应用缓存，SelectPhoto 的拍摄功能会失败。
