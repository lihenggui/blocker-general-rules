i18n:
  en:
    description: When a user dismisses a Capacitor local notification, this receiver removes its saved
      record when the reminder can safely be forgotten. This keeps dismissed one-time reminders from being
      restored later.
    disableEffect: Dismissed reminders may remain saved and can reappear after the app restores its notifications.
  zh-CN:
    description: 用户清除 Capacitor 本地通知后，此接收器会在可以安全删除时移除已保存的提醒记录，避免一次性提醒之后再次恢复。
    disableEffect: 已清除的提醒可能仍保存在记录中，并在应用恢复通知时再次出现。
