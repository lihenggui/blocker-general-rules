i18n:
  en:
    description: Tencent Tinker and Tencent Cloud Micro Tinker start this service in the patch process
      when the app receives a hot-fix package. It applies the patch and sends the result to the configured
      result handler.
    disableEffect: Hot-fix packages will not be applied, so fixes or changes delivered through the app’s
      patch system will not take effect.
  zh-CN:
    description: 腾讯 Tinker 和腾讯云 Micro Tinker 会在应用收到热修复包时，在补丁进程中启动此服务。它负责应用补丁，并把结果交给配置的结果处理服务。
    disableEffect: 热修复包将无法应用，通过补丁提供的修复或改动也不会生效。
