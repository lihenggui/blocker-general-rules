    description: Before account removal, the CIBMall Huawei Branch SDK shows a confirmation page that
      keeps Delete disabled for 15 seconds. Confirming then sends the account-removal request.
    disableEffect: Disabling it prevents users from confirming deletion of a Huawei Branch account.
  zh-CN:
    description: 申请注销账号前，CIBMall Huawei Branch SDK 会显示确认页面，并在 15 秒内禁用删除按钮。等待结束后确认，页面才会提交注销请求。
    disableEffect: 停用后，用户无法确认注销 Huawei Branch 账号。
