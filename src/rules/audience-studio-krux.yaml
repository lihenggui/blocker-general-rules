    description: "## Primary Location\nUnited States (San Francisco) [Crunchbase, 01](https://www.crunchbase.com/organization/krux-digital)\n\
      ## Website\n[https://www.salesforce.com/products/marketing-cloud/data-management](https://www.salesforce.com/products/marketing-cloud/data-management)\n\
      ## About\nSalesforce DMP is a data management platform that manages data, identifies end users,\
      \ and cetnralizes user-level data for advertising and content personalization [Salesforce, 24](https://konsole.zendesk.com/hc/en-us/articles/115012398067-What-if-I-just-want-to-import-data-instead-of-using-the-Control-Tag-SDK-or-other-DMP-tracking-)\n\
      ## Ownership\nSalesforce\n## Products and Services\nSalesforce DMP offers a vast array of technologies\
      \ in its data management platform. These are detailed in the Techology section under Details, below.\n\
      Services provided by Salesforce DMP include:  \n* Accerlated Mobile Pages (facilitate mobile-optimized\
      \ content)\n* Cross Device Identity Mangement (identify individuals across devices)\n* Salesforce\
      \ DMP Einstein Segmentation (segment multiple personas in an audience)\n* Tracking (re-identify\
      \ and track users using various methods)\n* Hashed device management (tracking used in reaction\
      \ to Safari 3rd party blocking)\n* User matching (match users with various techniques to identify\
      \ individuals)\n* Ad Server analytics (understand and analyze audience segment delivery and yield\
      \ across all ad impressions)\n* Content engagement reports (loyalty report cards, site visits, and\
      \ more)\n* Frequency engagement reports (how many times a user has seen an ad)\n* Funnels report\
      \ (track customer behaviors across their customer journey)\n* Look-alike modeling (\n* Audience\
      \ Profile Report (such as age, gender, and household income)\n## Privacy Policy\n**Opting out**\
      \   \n_DMP Opt-Out_ \"DMP Opt-Out\nhttps://apiservices.krxd.net/consumer/optout is the standard\
      \ DMP opt-out URL. When called directly, this URL will execute the Opt-out action for a user and\
      \ it will return the following JSON response:\n{\"code\":\"success\"}\nA user must allow cookies\
      \ from Salesforce DMP in order to opt-out. Calling the DMP opt-out code (by clicking on an opt-out\
      \ button placed on the client's page) will result in a persistent 'cookie' placed in the user’s\
      \ web browser by Salesforce, identifying that user as being on the Salesforce DMP 'do not target'\
      \ list. Taking this opt-out step won't prevent all tracking and targeting online, but it will ensure\
      \ the user’s wishes are honored by all Salesforce DMP clients.\nNote: If the user uses more than\
      \ one computer, the process must be repeated for each one as this information is associated with\
      \ a cookie unique to each machine.\" [Salesforce, 7](https://konsole.zendesk.com/hc/en-us/articles/217039187-Privacy-Policy-and-Opt-Out-Guide)\n\
      _On Mobile:_ \"Users can reset their IDFA or AdID to receive a new one. This is comparable to deleting\
      \ cookies.\nThey can also block these completely by opting-out of Ad Track or Ads Personalization.\
      \ In that case, Salesforce DMP cannot track or target these users.\" [Salesforce, 3](https://konsole.zendesk.com/hc/en-us/articles/115000428127-Mobile-IDs-FAQ)\n\
      _In Safari FAQ:_ \"Is there any difference in the how 1st-party cookies and Hashed Device IDs treat\
      \ opt-outs?\nYes, if the client is utilizing a first-party cookie and has multiple domains, a dedicated\
      \ opt-out will need to be configured and maintained for each site. Alternatively, if hashed device\
      \ management is employed a single opt-out link will be applicable for a given client.\nCan users\
      \ opt-out of Hashed ID tracking?\nAbsolutely – unlike other providers of so-called Fingerprinting\
      \ techniques, the Salesforce DMP actually can manage fingerprinting users through an opt-out. \n\
      Does Fingerprinting adhere to PII rules?\nYes, our hashed device management solution is fully compliant\
      \ with PII protocols.\nDo both approaches lose uses when they clear their cookies?\nNo, first-party\
      \ cookies can be cleared, while the hashed ID will persist even if cookies are emptied. [Salesforce,\
      \ 4](https://konsole.zendesk.com/hc/en-us/articles/115000428307-Safari-FAQ)\n\"Can users opt-out\
      \ of tracking in Mobile Apps?\nUsers can reset their IDFA or AdID to receive a new one. This is\
      \ comparable to deleting cookies.\nThey can also block these completely by opting-out of Ad Track\
      \ or Ads Personalization. In that case, Salesforce DMP cannot track or target these users.\" [Salesforce,\
      \ 58](https://konsole.zendesk.com/hc/en-us/articles/115000428127-Mobile-IDs-FAQ)\n**Personally Identifiable\
      \ Information**  \n\"Personally Identifiable Information (PII) includes any data that could potentially\
      \ identify a specific individual and can be used for de-anonymizing data. Salesforce does not collect\
      \ or store PII.\"\nSome examples of PII include: Full name; Email address; Phone numbers; Credit\
      \ card numbers; Date of birth; Login/screen name; IP address is considered PII in some countries\
      \ outside of the US; Home address; etc\" [Salesforce, 8](https://konsole.zendesk.com/hc/en-us/articles/115007222048-PII)\n\
      **Data Privacy and Security Considerations**\nSalesforce DMP does not accept PII data and it is\
      \ a breach of the MSA to send to us. Onboarding might be a better option if you have data connected\
      \ to email addresses and are concerned with offline data import user matching. Usage and set up\
      \ fees apply.\" [Salesforce, 32](https://konsole.zendesk.com/hc/en-us/articles/214918988-First-Party-Data-Import)\
      \  \n**Data Retention**  \n\"Data Expiry\nSalesforce DMP stores any data collected through online\
      \ mechanisms (including user matching data) for a variable period as defined in the contractual\
      \ agreement between Salesforce and the client. First-party imports remove any data not included\
      \ in subsequent imports (full refresh). For best user match results, files should be uploaded frequently,\
      \ or daily, even if the data output has no change.\" [Salesforce, 32](https://konsole.zendesk.com/hc/en-us/articles/214918988-First-Party-Data-Import)\
      \  \n## Relationships\n_Data Onboarding:_\ncomScore / LiveRamp / Neustar [Salesforce, 9](https://konsole.zendesk.com/hc/en-us/articles/115010458727-Data-Onboarding-Partners)\n\
