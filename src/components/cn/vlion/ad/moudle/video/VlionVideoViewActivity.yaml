i18n:
  en:
    description: VLion uses this alternate video screen to play an ad, with close and mute controls. When
      the viewer clicks the ad or playback ends, it can open the ad's landing page or end card.
    disableEffect: VLion video ads and their landing pages will not display; the host app's ordinary features
      remain available.
  zh-CN:
    description: VLion 使用此备用视频界面播放广告，并提供关闭和静音控制。用户点击广告或视频播放结束时，界面可以打开广告落地页或结束页。
    disableEffect: VLion 视频广告及其落地页将不再显示，但宿主应用的日常功能仍可使用。
