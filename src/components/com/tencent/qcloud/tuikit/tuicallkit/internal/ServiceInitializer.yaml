i18n:
  en:
    description: Android runs this Tencent Cloud TRTC TUICallKit Provider when the app starts. It registers
      the call and voice-message recording services and watches screen changes so an active call window
      can be restored.
    disableEffect: The call services will not be registered here, and an active call window cannot be
      restored through this initializer.
  zh-CN:
    description: Android 会在应用启动时运行腾讯云 TRTC TUICallKit 的此 Provider，用来注册通话和语音消息录制服务，并监听界面切换以便恢复正在进行的通话窗口。
    disableEffect: 停用后，通话服务无法通过此处注册，正在进行的通话界面也无法由此恢复。
