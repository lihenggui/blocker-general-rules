i18n:
  en:
    description: Scandit (formerly Microblink) Text Capture opens this screen after a payment-card scan
      when the app requests card editing. The user can review and correct card fields before the app receives
      them.
    disableEffect: Disabling it removes the card review and correction step; flows that require that step
      cannot finish as intended.
  zh-CN:
    description: Scandit（原 Microblink）文字采集 SDK 会在应用要求编辑支付卡信息时，于扫描后打开此页面。用户可以核对并修改卡片字段，然后将结果交给应用。
    disableEffect: 禁用后，卡片核对和修改步骤将不可用；依赖该步骤的流程无法按预期完成。
