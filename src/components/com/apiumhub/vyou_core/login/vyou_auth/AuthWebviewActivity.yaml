i18n:
  en:
    description: VYou (Apiumhub) opens this screen when the app starts a VYou sign-in flow. It displays
      VYou's authorization page and returns the sign-in result to the app.
    disableEffect: VYou sign-in cannot finish, so features that require a VYou account may not work.
  zh-CN:
    description: 应用启动 VYou 登录流程时，Apiumhub 的 VYou SDK 会打开此页面，显示 VYou 授权页面并将登录结果返回应用。
    disableEffect: 停用后，VYou 登录无法完成，依赖 VYou 账户的功能可能无法使用。
