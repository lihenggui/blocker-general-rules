i18n:
  en:
    description: The Mindcafe Android SDK from Atommerce uses this as its main screen for the home page,
      counselor search, counseling, and My Space. It also opens counseling sessions and related pages
      when the SDK routes the user there.
    disableEffect: Without it, users cannot enter these main Mindcafe areas or follow the SDK counseling
      routes.
  zh-CN:
    description: Atommerce 的 Mindcafe Android SDK 以此作为主界面，提供首页、咨询师搜索、咨询服务和「我的空间」入口。SDK 也会通过此界面打开咨询会话及相关页面。
    disableEffect: 停用后，用户将无法进入这些 Mindcafe 主页面，也无法沿 SDK 的咨询服务入口继续操作。
