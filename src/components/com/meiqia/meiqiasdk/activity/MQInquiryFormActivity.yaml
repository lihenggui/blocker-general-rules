i18n:
  en:
    description: When Meiqia has a pre-chat inquiry menu, this Activity shows the configured choices for
      routing a visitor to a support team or agent. A choice can lead to a contact form or directly into
      the conversation.
    disableEffect: The Meiqia routing menu cannot open, so users may not reach the support team selected
      by the app.
  zh-CN:
    description: Meiqia 配置了聊天前咨询菜单时，此 Activity 会显示将访客转接到客服团队或客服人员的选项；用户选择后可能进入联系表单或直接开始会话。
    disableEffect: Meiqia 分流菜单无法打开，用户可能无法联系应用所选的客服团队。
