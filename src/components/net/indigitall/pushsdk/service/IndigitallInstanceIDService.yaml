  en:
    description: When Google refreshes the app's Firebase push token, this Service retrieves the new token
      and saves it for indigitall.
    disableEffect: A refreshed Firebase token is not saved for indigitall, which can prevent later push
      messages from reaching the app.
  zh-CN:
    description: Google 刷新应用的 Firebase 推送令牌时，这个服务会获取新令牌并保存给 indigitall 使用。
    disableEffect: 刷新后的 Firebase 令牌不会保存给 indigitall，后续推送可能无法到达应用。
