i18n:
  en:
    description: When the host app uses Chat SDK's tab-based layout, this activity provides the main chat
      screen. It displays the configured tabs, supports search in the current tab, and opens the current
      user's profile from the toolbar.
    disableEffect: The tab-based Chat SDK home screen and its navigation and search cannot open.
  zh-CN:
    description: 宿主应用使用 Chat SDK 的标签页布局时，此界面会提供聊天主屏幕。它显示已配置的标签页、支持搜索当前标签内容，并可从工具栏打开当前用户的资料。
    disableEffect: Chat SDK 的标签页主屏幕及其导航和搜索将无法打开。
