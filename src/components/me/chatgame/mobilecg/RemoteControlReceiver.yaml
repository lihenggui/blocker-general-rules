i18n:
  en:
    description: Android sends this VCloud Receiver Bluetooth-headset connection and media-button broadcasts;
      it updates call audio routing and forwards headset button presses to the active call interface.
    disableEffect: Bluetooth call routing and headset-button controls will stop being handled, so users
      may need to use calls without those headset controls.
  zh-CN:
    description: Android 在蓝牙耳机连接状态或媒体按键变化时通知 VCloud 接收器；它会更新通话音频路由，并将耳机按键操作转发给当前通话界面。
    disableEffect: 蓝牙通话路由和耳机按键控制将停止工作，用户可能需要不使用这些耳机控制来通话。
