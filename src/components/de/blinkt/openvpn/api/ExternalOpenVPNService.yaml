i18n:
  en:
    description: When an external app binds to NetEase iTVPN's published OpenVPN interface, it can list
      profiles and request VPN start, stop, pause, resume, and status updates.
    disableEffect: Other apps lose this control and status interface; the host app's own VPN screens remain
      available.
  zh-CN:
    description: 外部应用绑定网易 iTVPN 发布的 OpenVPN 接口后，可列出配置并请求启动、停止、暂停或恢复 VPN，还可接收状态更新。
    disableEffect: 其他应用将失去此控制和状态接口，但宿主应用自身的 VPN 界面仍可使用。
