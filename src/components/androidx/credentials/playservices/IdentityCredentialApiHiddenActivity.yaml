i18n:
  en:
    description: The older AndroidX Credentials Play Services Auth adapter opens this hidden Activity
      for digital-credential requests; it presents Google's pending identity screen and returns the user's
      result to Credential Manager.
    disableEffect: Digital-credential retrieval through this older Play services adapter may fail.
  zh-CN:
    description: 较旧的 AndroidX Credentials Play Services Auth 实现会在处理数字凭据请求时打开这个隐藏 Activity；它显示 Google 的待处理身份验证界面，并将用户结果返回给
      Credential Manager。
    disableEffect: 通过较旧 Play 服务实现获取数字凭据的流程可能失败。
