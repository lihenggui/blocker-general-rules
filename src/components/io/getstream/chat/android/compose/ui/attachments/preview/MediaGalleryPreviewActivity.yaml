i18n:
  en:
    description: Stream Chat Compose's gallery for media attached to a message. It opens the message's
      images and videos in a gallery and provides the SDK's attachment actions.
    disableEffect: Disabling it prevents users from opening a message's media gallery and using its attachment
      controls.
  zh-CN:
    description: 这是 Stream Chat Compose 中用于查看消息附件的媒体图库。它会以图库形式打开消息中的图片和视频，并提供附件操作。
    disableEffect: 停用后，用户将无法打开消息媒体图库或使用其中的附件操作。
