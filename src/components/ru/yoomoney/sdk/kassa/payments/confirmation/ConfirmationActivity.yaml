i18n:
  en:
    description: YooMoney's YooKassa payments SDK opens this Activity when a bank or payment page returns
      a confirmation link. It completes the confirmation step and sends the payment result back to the
      app.
    disableEffect: The app cannot finish payment confirmations returned from a bank or payment page, so
      affected payments will not complete.
  zh-CN:
    description: 银行或支付页面返回确认链接时，YooMoney 的 YooKassa 支付 SDK 会打开此 Activity。它完成确认步骤，并将付款结果返回给应用。
    disableEffect: 应用无法处理银行或支付页面返回的确认信息，因此相关付款无法完成。
