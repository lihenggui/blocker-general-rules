i18n:
  en:
    description: When the app starts, Skelter Labs AIQ.Aware uses this ContentProvider to save the app
      context required by its SDK. It does not provide content to users or other apps.
    disableEffect: Without it, AIQ.Aware does not receive its startup context, so features that use this
      SDK cannot initialize through this path.
  zh-CN:
    description: 应用启动时，Skelter Labs AIQ.Aware 会通过此 ContentProvider 保存 SDK 所需的应用上下文；它不向用户或其他应用提供内容。
    disableEffect: 停用后，AIQ.Aware 无法通过此启动入口取得应用上下文，依赖该 SDK 的功能将无法初始化。
