i18n:
  en:
    description: When a user chooses the video attachment option in Hippo (Jungle Works) support chat,
      this Activity lists videos saved on the device and returns the selected clip to the conversation.
    disableEffect: Users can no longer attach saved videos to Hippo chats; opening the video option may
      fail.
  zh-CN:
    description: 在 Hippo（Jungle Works）客服聊天中选择视频附件时，此 Activity 会列出设备上保存的视频，并将所选视频返回给对话以供发送。
    disableEffect: 停用后，用户无法在 Hippo 聊天中添加设备上保存的视频，打开视频附件选项也可能失败。
