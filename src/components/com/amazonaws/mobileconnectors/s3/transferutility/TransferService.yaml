i18n:
  en:
    description: The AWS SDK for Android's Amazon S3 service starts when an app launches it for S3 work.
      It watches for network changes and can keep a supplied progress notification in the foreground during
      a transfer.
    disableEffect: S3 operations that rely on this service may lose network-change handling or background-transfer
      support.
  zh-CN:
    description: AWS Android SDK 的 Amazon S3 服务会在应用为 S3 任务启动它时运行，监听网络连接变化，并可在传输期间通过通知保持前台运行。
    disableEffect: 依赖此服务的 S3 操作可能无法处理网络变化，也可能无法在应用后台继续传输。
