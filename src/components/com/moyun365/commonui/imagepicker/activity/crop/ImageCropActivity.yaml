  en:
    description: When the photo picker requests cropping, CommonUI (Moyun365) displays the selected photo
      and saves a cropped copy using the app's configured size and shape. It returns the cropped image
      as the selection.
    disableEffect: Photo selections that require cropping will no longer complete through this screen.
  zh-CN:
    description: 图片选择流程需要裁剪时，CommonUI（Moyun365）会显示所选照片，并按应用设置的尺寸和形状保存裁剪副本。裁剪后的图片会作为选图结果返回。
    disableEffect: 需要裁剪的图片将无法通过此界面完成选择。
