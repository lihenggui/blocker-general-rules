i18n:
  en:
    description: Android runs this Tencent Cloud TRTC TUICallKit Provider when the app starts. It registers
      the call and voice-message recording services and signals the kit to restore a floating call view
      when a call is already active.
    disableEffect: The call services will not be registered here, and an active call cannot return to
      its floating view through this initializer.
  zh-CN:
    description: Android 会在应用启动时运行腾讯云 TRTC TUICallKit 的此 Provider，注册通话和语音消息录制服务；检测到已有通话时，它会通知组件恢复悬浮通话界面。
    disableEffect: 停用后，通话服务无法通过此处注册，已有通话也无法由此恢复为悬浮界面。
