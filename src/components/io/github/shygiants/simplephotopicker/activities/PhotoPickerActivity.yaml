i18n:
  en:
    description: Shygiants' Simple Photo Picker opens this Activity when the host app asks the user to
      choose photos. It displays device images in a grid and returns the selection in single- or multi-select
      mode.
    disableEffect: Photo-selection flows that use this picker can no longer return the chosen photos to
      the app.
  zh-CN:
    description: 宿主应用要求用户选择照片时，Shygiants 的 Simple Photo Picker 会打开此界面。它以网格显示设备中的图片，并按单选或多选模式将所选照片返回给应用。
    disableEffect: 依赖此选择器的照片选择流程将无法把所选照片返回给应用。
