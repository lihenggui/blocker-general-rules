recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:50:27Z'
i18n:
  en:
    description: When Blaze Share receives a remote-file download request, this Service saves the supplied
      file in the requested location or the app cache and reports download progress and completion to
      the app.
    disableEffect: Remote files requested through Blaze Share will not download, so a share operation
      that needs them cannot complete.
  zh-CN:
    description: Blaze Share 收到远程文件下载请求时，此 Service 会将文件保存到指定位置或应用缓存，并向应用报告下载进度和完成状态。
    disableEffect: 通过 Blaze Share 请求的远程文件将无法下载，因此依赖这些文件的分享操作无法完成。
