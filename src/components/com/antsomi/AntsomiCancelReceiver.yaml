recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: The Antsomi Android SDK targets this Receiver when one of its push notifications is dismissed;
      it reads the notification's push ID. Disabling it stops this dismissal hook while leaving notification
      clearing available.
    disableEffect: Antsomi's notification-dismissal hook will not run when a user clears one of its messages.
  zh-CN:
    description: 用户清除 Antsomi Android SDK 的推送通知时，通知会触发此 Receiver；它会读取通知的推送 ID。禁用后，清除通知仍可进行，但此清除回调不会运行。
    disableEffect: 用户清除 Antsomi 通知时，对应的清除回调将不会运行。
