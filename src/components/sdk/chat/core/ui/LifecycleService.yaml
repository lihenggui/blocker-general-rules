recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T15:41:30Z'
i18n:
  en:
    description: Chat SDK starts this service while opening the app and uses it to detect when the user
      swipes the app away from Recents. That event lets connected chat modules perform their app-dismissal
      cleanup.
    disableEffect: Chat modules will not receive the app-dismissal cleanup event when the user swipes
      the app away.
  zh-CN:
    description: 打开应用时，Chat SDK 会启动此服务，并用它检测用户是否从最近任务中划掉应用。检测到后，已连接的聊天模块可执行应用退出清理。
    disableEffect: 用户划掉应用时，聊天模块将收不到应用退出清理事件。
