i18n:
  en:
    description: When the Estimote SDK finds Bluetooth or location requirements missing, this Activity
      asks the user to enable Bluetooth, grant location permission, or open location settings.
    disableEffect: Users cannot be guided to meet missing Bluetooth or location requirements, which can
      prevent beacon features from working.
  zh-CN:
    description: Estimote SDK 发现蓝牙或定位条件未满足时，会打开此 Activity，引导用户开启蓝牙、授予定位权限或进入定位设置。
    disableEffect: 屏蔽后，用户无法通过 SDK 的提示补齐蓝牙或定位条件，信标功能可能无法运行。
