i18n:
  en:
    description: Diagnal Engage receives the Play Store install-referrer broadcast through this Receiver.
      It decodes the referral information so Engage can attribute the app install.
    disableEffect: Diagnal Engage will not receive Play Store install-referrer information for install
      attribution.
  zh-CN:
    description: Google Play 商店发送安装来源信息时，Diagnal Engage 会通过此 Receiver 接收并解码该信息，以归因应用安装来源。
    disableEffect: 停用后，Diagnal Engage 将无法接收 Google Play 商店的安装来源信息来进行安装归因。
