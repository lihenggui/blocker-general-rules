i18n:
  en:
    description: WonderAndroid’s Google mediation integration uses this Firebase service when mediation
      push messages or a device-token update arrives. It handles the message, can show its notification,
      and forwards the token to the SDK.
    disableEffect: The mediation integration will stop receiving its Firebase messages and showing related
      notifications.
  zh-CN:
    description: WonderAndroid 的 Google 广告中介适配会在收到中介推送消息或设备令牌更新时使用此 Firebase 服务。它处理消息、显示相关通知，并把令牌传给 SDK。
    disableEffect: 此广告中介适配将无法接收 Firebase 消息或显示相关通知。
