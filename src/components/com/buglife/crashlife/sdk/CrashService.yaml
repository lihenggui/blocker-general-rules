      details.
  zh-CN:
    description: Crashlife（Buglife 的原生崩溃报告扩展）会在收到原生崩溃记录后，把设备和运行环境信息保存到崩溃报告旁边。
    disableEffect: 停用后，Crashlife 的原生崩溃报告将不再包含这些设备和运行环境信息。
