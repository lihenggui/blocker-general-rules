i18n:
  en:
    description: AirbaPay opens this screen after a successful payment when the merchant has not supplied
      a custom success page. It displays the payment-complete result and closes the checkout flow.
    disableEffect: A successful payment may not show its completion page or return to the merchant app
      correctly.
  zh-CN:
    description: 商家未提供自定义成功页面时，AirbaPay 会在付款成功后打开此界面，显示完成结果并结束结账流程。
    disableEffect: 停用后，付款成功时可能无法显示完成页面或正确返回商家应用。
