    name: Google DoubleClick
    description: "** Deprecated and replaced by Google AdMob**\n## Primary Location\nUnited States (New\
      \ York City) [Crunchbase, 01](https://www.crunchbase.com/organization/doubleclick)\n## Website\n\
      [https://www.doubleclickbygoogle.com](https://www.doubleclickbygoogle.com)\n## About\nDoubleClick\
      \ offers products and services to publishers and advertisers. Publishers use DoubleClick to display\
      \ advertisements, and advertisers use DoubleClick to control the displaying of their ads by publishers.\n\
      ## Ownership\nGoogle\n## Documentation\n[https://developers.google.com/doubleclick-publishers/docs/start](https://developers.google.com/doubleclick-publishers/docs/start)\n\
      ## Products and Services\n### Identification and Analytics\n* Through DoubleClick Campaign Manager\
      \ (DCM), Google uses mobile device IDs to attribute conversions to mobile devices [DoubleClick,\
      \ 07](https://developers.google.com/doubleclick-advertisers/guides/conversions_overview#using_mobile_device_id).\n\
      * DoubleClick segments audiences for targeted advertising [The Guardian, 01](https://www.theguardian.com/technology/2012/apr/23/doubleclick-tracking-trackers-cookies-web-monitoring).\n\
      * Google performs cross-device identification (via Google Attribution) [Search Engine Land, 01](https://searchengineland.com/google-attribution-search-marketers-need-know-275751);\
      \ [DoubleClick, 01](https://www.doubleclickbygoogle.com/articles/google-debuts-new-ad-attribution-service);\
      \ [Forbes, 01](https://www.forbes.com/sites/roberthof/2017/05/23/did-that-ad-work-google-debuts-new-ai-driven-ad-attribution-service).\n\
      * Google connects data to personally identifiable information [ProPublica, 01](https://www.propublica.org/article/google-has-quietly-dropped-ban-on-personally-identifiable-web-tracking).\n\
      * DoubleClick offers analytics services for revenue management [DoubleClick, 05](https://www.doubleclickbygoogle.com/solutions/revenue-management/ad-exchange);\
      \ [DoubleClick, 06](https://support.google.com/dcm/partner/answer/4568975?hl=en); [Online-behavior.com,\
      \ 01](http://online-behavior.com/analytics/dfp-audience)\n### Store visit tracking\nThrough AdWords,\
      \ Google offers insights on store-visit conversions: \"In DoubleClick Search, you can report on\
      \ store visit conversions by adding a custom AdWords store visit conversions column to a report\"\
      \ [Google, 01](https://support.google.com/ds/answer/6348835?hl=en).\n### Advertising Methods\n*\
      \ DoubleClick loads targeted advertisements [Google, 03](https://support.google.com/dfp_premium/answer/2884033?hl=en);\
      \ [Google, 05, PDF](http://services.google.com/fh/files/misc/case-study-accuweather-delivers-enhanced-value-to-advertisers-with-doubleclick-for-publishers-and-google-analytics-360.pdf);\
      \ [The Guardian, 01](https://www.theguardian.com/technology/2012/apr/23/doubleclick-tracking-trackers-cookies-web-monitoring).\n\
      * Google Attribution integrates information from several Google ad services, including DoubleClick,\
      \ to evaluate the effectiveness of ads, from search to store visits [Forbes, 01](https://www.forbes.com/sites/roberthof/2017/05/23/did-that-ad-work-google-debuts-new-ai-driven-ad-attribution-service);\
      \ [Google, 04](https://support.google.com/richmedia/answer/3399874?hl=en)\n* Google is using offline\
      \ and online data sources to conduct real-world location targeting [Google, 01](https://support.google.com/ds/answer/6348835?hl=en);\
      \ [Google, 02](https://support.google.com/adwords/answer/6100636?co=ADWORDS.IsAWNCustomer%3Dfalse&hl=en-GB);\
      \ [TechCrunch, 02](https://techcrunch.com/2017/05/23/google-is-now-using-deep-learning-to-measure-store-visits);\
      \ [DoubleClick, 02](https://support.google.com/adxseller/answer/6016023?hl=en)\n* Google conducts\
      \ real-time targeting [DoubleClick, 04](https://www.doubleclickbygoogle.com/articles/bt-sport-dynamic-ad-insertion-google)\n\
      * Google uses artificial intelligence (via Google Attribution) [Forbes, 01](https://www.forbes.com/sites/roberthof/2017/05/23/did-that-ad-work-google-debuts-new-ai-driven-ad-attribution-service);\
      \ [TechCrunch, 01](https://techcrunch.com/2017/05/23/google-attribution-is-a-free-and-easy-way-to-evaluate-marketing-efforts);\
      \ [TechCrunch, 02](https://techcrunch.com/2017/05/23/google-is-now-using-deep-learning-to-measure-store-visits)\n\
      * Google targets across devices and channels [Forbes, 01](https://www.forbes.com/sites/roberthof/2017/05/23/did-that-ad-work-google-debuts-new-ai-driven-ad-attribution-service)\n\
      * DoubleClick provids bidding services [DoubleClick, 05](https://www.doubleclickbygoogle.com/solutions/revenue-management/ad-exchange)\n\
      ### Advertising Networks\n* Google conducts data sharing and integration [DoubleClick, 05](https://www.doubleclickbygoogle.com/solutions/revenue-management/ad-exchange);\
      \ [The Guardian, 01](https://www.theguardian.com/technology/2012/apr/23/doubleclick-tracking-trackers-cookies-web-monitoring);\
      \ [DoubleClick, 03](https://support.google.com/dfp_premium/answer/6281539?hl=en); [AppsFlyer, 01](https://support.appsflyer.com/hc/en-us/articles/115003213726-DoubleClick-Integration-Guide)\n\
      ## Privacy Policy\nA Google search for \"DoubleClick Privacy Policy\" brings the user to the general\
      \ Google privacy policy web page.\n_Cookies:_ Google's privacy policy states that Google uses cookies\
      \ in web broswers for targeted advertising. They also store a record of the ads they serve in their\
      \ logs. Log data includes \"your web request, IP address, browser type, browser language, the date\
      \ and time of your request, and one or more cookies that may uniquely identify your browser.\" They\
      \ anonymize the log data by \"removing part of the IP address (after 9 months) and cookie information\
      \ (after 18 months)\". Google services, such as AdWords, AdSense, and a range of DoubleClick-branded\
      \ services, may send cookies to your bro]]wser when you visit a page or see an ad that uses one\
      \ of these services.  \n_Other technologies:_ Google may \"select advertising based on information\
      \ about your computer or device, such as your device model, browser type, or sensors in your device\
      \ like the accelerometer.\"  \n_Location:_ Google may infer your location \"from a variety of sources\"\
      , including your IP address, search queries, as well as you \"precise location from your mobile\
      \ device\" and \"websites or apps that you use may send information about your location\" to Google.\
      \  Google \"uses location information in our ads products to infer demographic information, to improve\
      \ the relevance of the ads you see, to measure ad performance and to report aggregate statistics\
      \ to advertiser.\"  \n_Mobile tracking:_ When cookies are not available (eg, in mobile devices),\
      \ Google \"may use technologies that perform similar functions to cookies. Sometimes Google links\
      \ the identifier used for advertising on mobile applications to an advertising cookie on the same\
      \ device in order to coordinate ads across your mobile apps and mobile browser. This can happen,\
      \ for example, when you see an ad within an app that launches a web page in your mobile browser.\
      \ This also helps us improve the reports we give to our advertisers on the effectiveness of their\
      \ campaigns.\"\n_Opt-out and user control:_ Users can control cookie tracking through Google Ad\
      \ Settings, consumer choice tools created under self-regulation programs in many countries, and\
      \ through the management of cookies in web browser settings. Users can opt out of personalized ads\
      \ in apps through Android and iOS device settings [Google, 06](https://www.google.com/policies/technologies/ads).\n\
      ## Details\nDoubleClick was founded in 1995 [Crunchbase, 01](https://www.crunchbase.com/organization/doubleclick).\n\
