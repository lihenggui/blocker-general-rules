i18n:
  en:
    description: AndroidX Startup reads the library initializers registered in the app manifest and runs
      them automatically when the app process starts.
    disableEffect: Libraries that rely on automatic startup can remain uninitialized, so their dependent
      features may not work.
  zh-CN:
    description: AndroidX Startup 会读取应用清单中注册的库初始化任务，并在应用进程启动时自动运行。
    disableEffect: 依赖自动启动的库可能无法完成初始化，其相关功能也可能无法使用。
