  en:
    description: When a custom support field asks the user for a date or time, Sobot's customer-service
      chat SDK shows this dialog. It shows the date-and-time picker and returns the selected value.
    disableEffect: The user will not be able to fill the date-and-time field in the support form.
  zh-CN:
    description: 当自定义客服字段要求用户填写日期或时间时，Sobot 客服聊天 SDK 会显示此对话框。它显示日期和时间选择器并返回所选值。
    disableEffect: 用户将无法填写客服表单中的日期和时间字段。
