i18n:
  en:
    description: Pichs FilePicker opens this Activity when the user crops an image selected in the picker.
      It lets the user adjust the crop, rotate or mirror the image, and save the edited result.
    disableEffect: Users cannot open this crop screen or receive a cropped image through the editing flow.
  zh-CN:
    description: 用户裁剪通过 Pichs FilePicker 选中的图片时会打开此 Activity。用户可以调整裁剪范围、旋转或镜像图片，并保存编辑后的结果。
    disableEffect: 用户将无法打开裁剪界面，也无法通过此编辑流程取得裁剪后的图片。
