  en:
    description: This is part of Nangongkuo's YF CommonLibrary UI toolkit. When a user selects Privacy
      in the YF settings page, this screen opens the supplied privacy-policy URL in an in-app web view.
    disableEffect: The privacy page will not open; selecting the privacy link from YF settings can fail.
  zh-CN:
    description: 这是 Nangongkuo 的 YF CommonLibrary 界面工具库的一部分。用户在 YF 设置页面选择隐私政策时，此页面会在应用内打开指定网址。
    disableEffect: 停用后，隐私政策页面无法打开；从 YF 设置中点击隐私入口时可能失败。
