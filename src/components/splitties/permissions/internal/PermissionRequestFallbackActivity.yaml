i18n:
  en:
    description: When a permission request produces no result through Splitties' usual screen, the Splitties
      permissions library opens a brief system permission screen and returns Android's answer to the app.
    disableEffect: Permission requests that need this fallback may fail, leaving features that require
      the permission unavailable.
  zh-CN:
    description: 通过 Splitties 的常规权限申请页面没有收到结果时，Splitties 权限库会打开简短的系统权限页面，并把 Android 的结果返回给应用。
    disableEffect: 需要此备用流程的权限申请可能失败，依赖该权限的功能会无法使用。
