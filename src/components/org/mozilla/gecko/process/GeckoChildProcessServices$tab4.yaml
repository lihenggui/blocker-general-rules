recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:46:27Z'
i18n:
  en:
    description: Mozilla GeckoView, in the CENO Developers fork for CENO Browser, starts this Service
      when it needs another process for web page content. GeckoView assigns these numbered Services from
      a pool so page work runs separately from the main app process.
    disableEffect: If disabled, GeckoView may fail to start a page process when this service is selected,
      so the affected tab may not load or run correctly.
  zh-CN:
    description: Mozilla GeckoView（CENO Developers 为 CENO Browser 提供的分支）需要为网页内容启动额外进程时，会启动此服务。引擎会从这组编号服务中分配一个，在应用主进程之外处理网页内容。
    disableEffect: 如果停用此服务，GeckoView 在分配到它来启动页面进程时可能失败，相关标签页可能无法加载或正常运行。
