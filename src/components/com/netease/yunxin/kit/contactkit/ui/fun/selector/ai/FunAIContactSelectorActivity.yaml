i18n:
  en:
    description: When an app feature asks the user to choose people or AI accounts, the NetEase Yunxin
      ContactKit UI SDK shows friend and AI-account tabs and returns the selection.
    disableEffect: Features that rely on this picker can no longer receive the selected people or AI accounts.
  zh-CN:
    description: 应用功能需要用户选择联系人或 AI 账号时，网易云信 ContactKit UI SDK 会显示好友和 AI 账号两个列表，并返回所选对象。
    disableEffect: 依赖此选择器的功能将无法获取用户选中的联系人或 AI 账号。
