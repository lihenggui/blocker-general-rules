recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:32:20Z'
i18n:
  en:
    description: Android Support Library creates a shareable link to an app file when another app or SDK
      needs to open or share it. It runs when the host app requests that file link.
    disableEffect: File sharing, opening, or installation flows that use this provider can fail; an SDK
      that requests a file link from it can also fail.
  zh-CN:
    description: Android Support Library 会在其他应用或 SDK 需要打开、分享应用文件时，为文件生成可分享的链接。应用请求此链接时它会运行。
    disableEffect: 依赖此 Provider 的文件分享、打开或安装流程可能失败；请求文件链接的 SDK 也可能无法继续。
