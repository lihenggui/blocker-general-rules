    description: The HeyTap User Center account SDK runs this Provider when the app starts to initialize
      account services and register for login, logout, and profile-change notices.
    disableEffect: Disabling it can leave HeyTap sign-in and account-state updates unavailable in the
      app.
  zh-CN:
    description: HeyTap（OPPO）用户中心账号 SDK 会在应用启动时运行此 Provider，以初始化账号服务并注册接收登录、退出和资料变更通知。
    disableEffect: 停用后，应用内的 HeyTap 登录和账号状态同步可能无法使用。
