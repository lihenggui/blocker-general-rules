  en:
    description: When the flow includes a global-watchlist check, this screen collects identifying details
      such as name, birth date, and country, then shows the screening result. The MetaMap identity verification
      SDK opens this screen when the configured flow reaches this step.
    disableEffect: Disabling it prevents users from completing verification flows that require global-watchlist
      screening.
  zh-CN:
    description: 核验流程包含全球名单检查时，此页面会收集姓名、出生日期和国家等身份信息，并展示筛查结果。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法完成要求全球名单筛查的核验流程。
