i18n:
  en:
    description: OkayID Mobile (Innov8tif identity-document SDK) opens this screen with an identity-document
      image for card segmentation, feature checks and text recognition. It can also let the user choose
      or take an image and returns recognized details to the app.
    disableEffect: The app cannot extract or receive identity-document details through OkayID Mobile if
      this screen is disabled.
  zh-CN:
    description: OkayID Mobile（Innov8tif 身份证件 SDK）会在此处理证件图像，定位证件、检查图像并识别文字；用户也可在界面中选择或拍摄图像，识别结果会交回应用。
    disableEffect: 停用后，应用无法通过 OkayID Mobile 提取或接收证件信息。
