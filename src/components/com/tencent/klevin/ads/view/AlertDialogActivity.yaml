    description: Tencent Klevin shows this confirmation dialog when the user chooses whether to continue
      or cancel an ad-app download. It carries out the selected download action.
    disableEffect: Users will not be able to continue or cancel Klevin ad-app downloads through this confirmation
      screen.
  zh-CN:
    description: 用户选择继续或取消广告应用下载时，Tencent Klevin 会显示此确认对话框，并执行所选的下载操作。
    disableEffect: 用户将无法通过此确认页面继续或取消 Klevin 广告应用下载。
