i18n:
  en:
    description: When a user starts Fillr autofill from an embedded browser, this screen handles the form
      review and PIN steps before Fillr fills saved details. It also lets users create or change their
      Fillr PIN.
    disableEffect: Without it, users cannot complete the embedded Fillr autofill or PIN flow.
  zh-CN:
    description: 用户在嵌入式浏览器中启动 Fillr 自动填充时，此页面会先处理表单确认和 PIN 步骤，再填入已保存的信息；用户也可在此创建或更改 Fillr PIN。
    disableEffect: 停用后，用户无法完成嵌入式 Fillr 自动填充或 PIN 流程。
