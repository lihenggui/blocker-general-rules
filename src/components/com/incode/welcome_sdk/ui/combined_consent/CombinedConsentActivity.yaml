i18n:
  en:
    description: When a flow requests combined consent, this screen displays the supplied consent text
      and records the user's choice. The MetaMap identity verification SDK opens this screen when the
      configured flow reaches this step.
    disableEffect: Disabling it prevents the user from giving or declining the consent required by that
      verification flow.
  zh-CN:
    description: 核验流程要求合并同意时，此页面会显示流程提供的同意内容并记录用户选择。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法对该核验流程要求的事项表示同意或拒绝。
