i18n:
  en:
    description: Lexar CloudLibrary starts this Service when upload or download tasks are queued. It checks
      unfinished transfers and refreshes the task list as they progress and finish.
    disableEffect: Queued file uploads and downloads will no longer run through the transfer service,
      and their progress will stop updating.
  zh-CN:
    description: Lexar CloudLibrary 在加入上传或下载任务时启动此服务。它会检查未完成的传输，并在任务进行或完成时更新任务列表。
    disableEffect: 排队的文件上传和下载将无法通过此服务继续执行，进度也会停止更新。
