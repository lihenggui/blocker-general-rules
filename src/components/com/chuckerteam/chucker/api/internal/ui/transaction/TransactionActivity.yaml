i18n:
  en:
    description: The Chucker HTTP inspector opens this screen when a user selects a captured network request.
      It displays that request's details.
    disableEffect: Users will not be able to inspect individual captured requests in Chucker; normal app
      networking continues.
  zh-CN:
    description: 用户选择一条已记录的网络请求时，Chucker 网络检查工具会打开此页面，显示该请求的详细信息。
    disableEffect: 用户将无法在 Chucker 中查看单条请求详情；应用的正常网络功能仍可使用。
