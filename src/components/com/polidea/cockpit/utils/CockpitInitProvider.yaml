i18n:
  en:
    description: Polidea Cockpit runs this provider at app startup to load its parameter files from app
      storage and bundled assets.
    disableEffect: Cockpit parameters may not load, so app features that read them may keep using default
      values.
  zh-CN:
    description: 应用启动时，Polidea Cockpit 会通过此内容提供程序从应用存储和内置资源中加载参数文件。
    disableEffect: 停用后，Cockpit 参数可能无法加载，读取这些参数的应用功能可能会继续使用默认值。
