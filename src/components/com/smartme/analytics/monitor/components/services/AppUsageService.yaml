recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:51:42Z'
i18n:
  en:
    description: When SmartMe Monitor's app-use collection is enabled, this foreground service tracks
      which apps are open on the device and records their names, use duration, connection type, and last
      saved location.
    disableEffect: If disabled, SmartMe stops collecting app-use history, while the host app's own screens
      continue to work.
  zh-CN:
    description: 启用 SmartMe Monitor 的应用使用采集后，此前台服务会跟踪设备上打开过的应用，并记录应用名称、使用时长、网络类型和最近保存的位置。
    disableEffect: 禁用后，SmartMe 将停止采集应用使用记录；宿主应用自身的界面仍可正常使用。
