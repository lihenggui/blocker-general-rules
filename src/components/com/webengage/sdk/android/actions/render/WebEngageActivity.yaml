i18n:
  en:
    description: When this WebEngage Activity starts and stops, it reports that screen's lifecycle to
      WebEngage analytics. The component itself does not create screen content.
    disableEffect: WebEngage can miss analytics and session updates for this screen, while the app's other
      screens continue to work.
  zh-CN:
    description: 此 WebEngage Activity 启动或关闭时，会向 WebEngage 分析功能报告该页面的生命周期。此组件本身不创建页面内容。
    disableEffect: WebEngage 可能无法记录此页面的分析和会话信息，但应用的其他页面仍可使用。
