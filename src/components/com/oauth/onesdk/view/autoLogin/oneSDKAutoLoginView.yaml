i18n:
  en:
    description: When saved sign-in details are available and automatic sign-in is requested, the CIBMall
      or PlayID OneSDK account SDK opens this page. It checks the saved account with the service and returns
      the sign-in result.
    disableEffect: Disabling it prevents saved-account sign-in from completing, so the user may remain
      signed out.
  zh-CN:
    description: 存在已保存的登录信息且应用请求自动登录时，CIBMall 或 PlayID OneSDK 账号 SDK 会打开此页面。页面向账号服务验证已保存的账号，并返回登录结果。
    disableEffect: 停用后，已保存账号的自动登录无法完成，用户可能仍处于未登录状态。
