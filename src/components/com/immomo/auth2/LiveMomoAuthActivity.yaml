  en:
    description: During a Momo account sign-in or authorization request, this screen opens the authorization
      page and returns its result to the requesting flow. It may ask for phone permission used by the
      authentication check.
    disableEffect: Momo account sign-in or authorization flows that use this screen will fail.
  zh-CN:
    description: 陌陌账号登录或授权时，此界面会打开授权页面，并将结果返回发起流程。身份验证过程中可能会请求电话状态权限。
    disableEffect: 使用此界面的陌陌账号登录或授权流程将无法完成。
