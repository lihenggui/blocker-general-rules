  en:
    description: Hassan Mirza's Intergrate_arr Flutter integration sample registers this Activity as the
      app's launcher and starts the main Flutter screen. It passes API-key and email-selection results
      between the Flutter page and the app.
    disableEffect: The sample app will lose its launcher screen, so its main Flutter experience cannot
      start.
  zh-CN:
    description: Hassan Mirza 的 Intergrate_arr Flutter 集成示例将此 Activity 注册为应用入口，并启动 Flutter 主页面。它会在 Flutter
      页面与应用之间传递 API 密钥和邮箱选择结果。
    disableEffect: 示例应用将失去启动入口，因此无法启动其 Flutter 主界面。
