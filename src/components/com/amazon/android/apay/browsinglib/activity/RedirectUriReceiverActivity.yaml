i18n:
  en:
    description: When Android opens an Amazon Pay return link for the app, this Activity forwards the
      link to the Amazon Pay browsing Activity for payment or sign-in completion.
    disableEffect: The app will not receive the browser's Amazon Pay authorization or payment result,
      so that flow will fail.
  zh-CN:
    description: Android 打开返回应用的 Amazon Pay 链接时，此界面会把链接转交给 Amazon Pay 浏览界面，以完成付款或登录流程。
    disableEffect: 应用将收不到浏览器返回的 Amazon Pay 授权或付款结果，因此该流程会失败。
