  en:
    description: During a Swirepay checkout, this Activity displays the extra web payment step required
      by the selected payment method. It detects the return from that page and opens the payment status
      screen.
    disableEffect: The external payment step may not finish or return its result to the app.
  zh-CN:
    description: Swirepay 结账需要所选支付方式进行网页验证或跳转时，此 Activity 会显示相应页面。用户返回后，它会打开支付状态页面。
    disableEffect: 停用后，外部支付步骤可能无法完成，或无法将结果返回应用。
