recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:04:01Z'
i18n:
  en:
    description: When Gamedock Ads is asked to show a full-screen ad, this Activity displays image, web,
      or video interstitials and video or VAST rewarded ads. It tells the app when a rewarded video has
      been completed and its reward earned.
    disableEffect: Blocking it stops these Gamedock Ads from opening; users will not receive rewards for
      watching rewarded ads.
  zh-CN:
    description: Gamedock Ads 被要求显示全屏广告时，此 Activity 会展示图片、网页或视频插屏广告，以及视频或 VAST 激励广告。激励视频完成并可获得奖励时，它会通知应用。
    disableEffect: 停用后，这些 Gamedock Ads 将无法打开；用户观看激励广告后不会获得奖励。
