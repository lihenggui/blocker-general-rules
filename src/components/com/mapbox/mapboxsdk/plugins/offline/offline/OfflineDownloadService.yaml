i18n:
  en:
    description: The Mapbox Android Offline Plugin starts this service when the app starts or cancels
      an offline map download. It creates saved map regions and reports download progress and completion.
    disableEffect: The app cannot start, cancel, or track offline map downloads through this plugin.
  zh-CN:
    description: 应用开始或取消离线地图下载时，Mapbox Android Offline Plugin 会启动此服务。它会创建离线地图区域，并报告下载进度和完成状态。
    disableEffect: 禁用后，应用无法通过此插件开始、取消或跟踪离线地图下载。
