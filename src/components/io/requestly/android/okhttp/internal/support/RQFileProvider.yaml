i18n:
  en:
    description: When the Requestly HTTP inspector exports a captured request or response as a file, this
      Provider makes the file available to Android's share sheet.
    disableEffect: Requestly's file-based request exports cannot be shared and may fail when the inspector
      tries to create a share link.
  zh-CN:
    description: Requestly HTTP 检查工具将已记录的请求或响应导出为文件时，此 Provider 会将文件提供给 Android 分享面板。
    disableEffect: Requestly 将无法分享文件形式的请求导出内容，检查工具生成分享链接时也可能失败。
