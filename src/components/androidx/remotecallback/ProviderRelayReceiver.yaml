i18n:
  en:
    description: When another part of the app sends a remote callback through a content provider, this
      AndroidX Remote Callback receiver forwards the request to that provider.
    disableEffect: Any app feature that depends on this callback path will no longer receive its callback.
  zh-CN:
    description: 当应用的其他部分通过内容提供程序发送远程回调时，这个 AndroidX Remote Callback 接收器会将请求转发给相应的内容提供程序。
    disableEffect: 依赖此回调路径的应用功能将无法再收到回调。
