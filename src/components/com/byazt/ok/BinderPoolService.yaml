i18n:
  en:
    description: When a Pangle background process connects to this service, it provides the shared connection
      that lets the ad SDK’s background tasks communicate.
    disableEffect: Pangle processes that depend on the binder pool may stop communicating; app features
      outside the ad SDK are unaffected.
  zh-CN:
    description: 穿山甲后台进程连接此 Service 时，它会提供共享连接，让广告 SDK 的后台任务彼此通信。
    disableEffect: 依赖 Binder 池的穿山甲进程可能无法通信；广告 SDK 以外的应用功能不受影响。
