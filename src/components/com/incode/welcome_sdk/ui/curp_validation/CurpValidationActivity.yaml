i18n:
  en:
    description: This screen collects or generates the user's CURP identifier and submits it for validation
      during identity verification. The MetaMap identity verification SDK opens this screen when the configured
      flow reaches this step.
    disableEffect: Disabling it prevents users from completing a verification flow that requires CURP
      validation.
  zh-CN:
    description: 此页面会收集或生成用户的 CURP 身份识别码，并在身份核验中提交验证。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法完成要求验证 CURP 的核验流程。
