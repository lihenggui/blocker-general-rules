recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: MobFox's ad SDK opens this screen when an ad's landing page should stay inside the app.
      It shows the advertiser's page with back, refresh, close, and external-open controls.
    disableEffect: MobFox ad landing pages will not open in the app; the app's other screens continue
      to work.
  zh-CN:
    description: MobFox 广告 SDK 会在广告落地页需要留在应用内打开时显示此页面，并提供返回、刷新、关闭和在外部打开等控件。
    disableEffect: MobFox 广告落地页将无法在应用内打开，应用的其他页面仍可使用。
