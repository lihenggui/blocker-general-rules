i18n:
  en:
    description: Freshservice Support displays support pages such as tickets, incidents, service requests,
      and approvals, and handles their attachment uploads and downloads. It opens after support sign-in
      or when the app selects a support page.
    disableEffect: Disabling it prevents the app from displaying Freshservice support pages and handling
      their attachments.
  zh-CN:
    description: Freshservice Support 会显示工单、事件、服务请求和审批等支持页面，并处理附件上传和下载。用户登录支持服务或应用选择支持页面时会打开此页面。
    disableEffect: 禁用后，应用中的 Freshservice 支持页面及其附件功能将无法使用。
