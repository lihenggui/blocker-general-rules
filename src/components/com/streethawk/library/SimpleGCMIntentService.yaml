  en:
    description: This component is part of the StreetHawk mobile engagement SDK. Google Cloud Messaging
      starts this legacy StreetHawk service for delivered messages. The service passes them through StreetHawk's
      GCM handler, which checks and routes push content.
    disableEffect: StreetHawk push messages delivered through this legacy integration will stop.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。Google Cloud Messaging 会在收到消息时启动此旧版 StreetHawk 服务。服务会把消息交给
      StreetHawk 的 GCM 处理流程，由其检查并转送推送内容。
    disableEffect: 通过此旧版集成送达的 StreetHawk 推送消息将停止。
