i18n:
  en:
    description: When Airnow Media Network starts a full-screen interstitial or rewarded ad, this Activity
      displays the ad and passes user actions back to the ad flow.
    disableEffect: Airnow full-screen ads will not appear; rewarded ads cannot be completed, so rewards
      for watching ads will not be granted.
  zh-CN:
    description: Airnow Media Network 启动全屏插屏或激励广告时，此 Activity 会显示广告并将用户操作交回广告流程。
    disableEffect: Airnow 全屏广告将不会显示；激励广告无法完成，观看广告的奖励也不会发放。
