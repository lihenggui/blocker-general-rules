  en:
    description: Stingray Mobile Palette opens this launcher Activity as an image color-picking screen.
      Dragging across its sample image selects a region and displays colors extracted from it.
    disableEffect: The Palette screen will no longer launch, so users cannot select an image region or
      view its extracted colors.
  zh-CN:
    description: Stingray Mobile Palette 会通过此启动 Activity 打开图片取色界面；在示例图片上拖动可选取区域并显示提取出的颜色。
    disableEffect: Palette 界面将无法启动，用户不能选取图片区域或查看提取出的颜色。
