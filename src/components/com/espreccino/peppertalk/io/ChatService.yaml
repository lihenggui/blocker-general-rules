i18n:
  en:
    description: Espreccino’s PepperTalk chat library starts this Service when the app connects its chat
      client; it maintains the chat connection and sends or retries messages as connection state changes.
    disableEffect: PepperTalk cannot connect or deliver messages, so the app’s chat feature will stop
      working.
  zh-CN:
    description: 应用连接聊天客户端时，Espreccino 的 PepperTalk 聊天库会启动此 Service；它维持聊天连接，并在连接状态变化时发送或重试消息。
    disableEffect: 屏蔽后，PepperTalk 无法建立连接或传递消息，应用的聊天功能会停止工作。
