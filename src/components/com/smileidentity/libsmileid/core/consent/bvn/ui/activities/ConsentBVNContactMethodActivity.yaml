i18n:
  en:
    description: During Smile Identity's Nigerian BVN consent flow, this screen shows the contact methods
      offered for the entered number and sends the selected method to the verification service before
      OTP confirmation.
    disableEffect: If disabled, users cannot choose where to receive a code, so BVN consent cannot continue.
  zh-CN:
    description: 在 Smile Identity 的尼日利亚 BVN 授权流程中，此界面会显示该号码可用的联系方式，并在短信验证码确认前将用户选择提交给验证服务。
    disableEffect: 禁用后，用户无法选择接收验证码的方式，BVN 授权流程无法继续。
