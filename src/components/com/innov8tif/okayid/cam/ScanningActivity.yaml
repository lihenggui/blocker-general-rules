i18n:
  en:
    description: OkayID Mobile (Innov8tif identity-document SDK) checks camera frames for a steady, clear
      document image. When it finds one, it passes the photo to its text-recognition screen; the user
      can also skip directly to that screen.
    disableEffect: The app loses OkayID Mobile assisted scanning and cannot use this automatic image check
      if this screen is disabled.
  zh-CN:
    description: OkayID Mobile（Innov8tif 身份证件 SDK）会检查相机画面，寻找稳定清晰的证件图像；找到后将照片交给文字识别界面，用户也可直接跳过扫描进入识别。
    disableEffect: 停用后，应用无法使用 OkayID Mobile 的辅助扫描和自动图像检查。
