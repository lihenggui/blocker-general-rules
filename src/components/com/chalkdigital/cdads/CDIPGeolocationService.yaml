recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: When CD Ads requests a location update, this background service asks Chalk Digital for
      an estimate based on the device's public IP address. It saves the result and requests a more detailed
      location lookup when needed.
    disableEffect: CD Ads will lose this IP-based location lookup for its ad features.
  zh-CN:
    description: CD Ads 请求更新位置时，此后台服务会根据设备的公网 IP 地址向 Chalk Digital 查询大致位置，并在需要时继续获取更详细的位置信息。
    disableEffect: 停用后，CD Ads 的广告功能将无法通过此服务获取基于 IP 的位置估算。
