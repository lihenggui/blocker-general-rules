i18n:
  en:
    description: The iQNECT iQKIT and AIQ Image Match UI camera flow opens this screen when a user-started
      scan has no matching result. It shows the submitted image with failure feedback and lets the user
      close the screen.
    disableEffect: If disabled, the app cannot show feedback for a scan that finds no match.
  zh-CN:
    description: 用户主动扫描但没有找到匹配项时，iQNECT iQKIT 和 AIQ Image Match UI 的相机流程会打开此界面。它展示提交的图像和未匹配提示，并允许用户关闭页面。
    disableEffect: 停用后，应用无法显示扫描无匹配结果时的反馈界面。
