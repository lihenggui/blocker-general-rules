i18n:
  en:
    description: The Safer (ISEE-U) safety SDK opens this screen while a user creates an alert. It lets
      them choose whether they feel uncomfortable, are being harassed, or are in danger, then continues
      with that alert level.
    disableEffect: Users cannot choose an alert severity, blocking the app's request-for-help flow.
  zh-CN:
    description: 用户创建求助警报时，Safer（ISEE-U）安全 SDK 会打开此界面。用户可以选择感到不适、正在遭受骚扰或身处危险，应用随后按所选级别继续处理。
    disableEffect: 用户将无法选择警报级别，应用的求助流程会因此受阻。
