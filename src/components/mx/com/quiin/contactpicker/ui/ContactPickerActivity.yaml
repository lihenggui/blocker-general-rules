i18n:
  en:
    description: Quiin’s Unified Contact Picker opens this screen when the host app requests contact selection;
      it lists saved phone numbers and email addresses, lets the user choose entries, and returns the
      selection to the app.
    disableEffect: The app cannot open this contact picker or return selected contacts to a feature that
      uses it.
  zh-CN:
    description: 应用请求选择联系人时，Quiin 的 Unified Contact Picker 会打开此界面；它列出保存的电话号码和邮箱，供用户选择并将结果返回应用。
    disableEffect: 应用无法打开此联系人选择器，也无法把所选联系人交给依赖它的功能。
