  en:
    name: Honor Ad Alliance
    description: The Honor Ad Network leverages the advantages of Honor's terminal to provide developers
      with high-quality traffic monetization services, helping them achieve commercial growth. Its service
      advantages include a vast array of advertising resources, diverse ad formats (such as splash ads,
      native ads, interstitial ads, rewarded videos, and banner ads), and efficient monetization. The
      monetization process includes registration and certification, media and ad slot creation, SDK integration
      development, and official monetization.
    company: Honor
  zh-CN:
    name: 荣耀广告联盟
    description: 荣耀广告联盟是依托荣耀终端优势，为开发者提供优质的流量变现服务，帮助开发者实现商业增长的平台。其服务优势包括海量的广告资源、丰富的广告样式（如开屏广告、信息流广告、插屏广告、激励视频和Banner广告）以及高效的变现效率。变现流程包括注册及认证、创建媒体及广告位、SDK集成开发和正式变现。
    company: 荣耀
