i18n:
  en:
    description: When the patched Evernote Android Job library bundled with Yandex MapKit repairs its
      schedule, this Service checks saved jobs and restores those missing from the system; MapKit uses
      the jobs for offline-map downloads.
    disableEffect: Offline-map download jobs with a lost schedule may remain stopped instead of being
      restored.
  zh-CN:
    description: Yandex MapKit 附带的 Evernote Android Job 库修复任务计划时，会通过此 Service 检查已保存的任务并恢复系统中缺失的任务；MapKit
      使用这些任务进行离线地图下载。
    disableEffect: 离线地图下载任务的计划丢失后，可能会一直停止，无法自动恢复。
