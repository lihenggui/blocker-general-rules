recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:07:28Z'
i18n:
  en:
    description: When a browser returns through the app's sign-in link, this Strivacity Activity passes
      the returned address to the SDK to finish authentication.
    disableEffect: If disabled, browser sign-in redirects cannot be delivered back to the app, so login
      can fail.
  zh-CN:
    description: 浏览器通过应用的登录链接返回时，Strivacity 身份认证 SDK 会运行此 Activity，把返回信息交给登录流程继续处理。
    disableEffect: 停用后，浏览器返回的登录链接无法交给应用处理，Strivacity 登录可能无法完成。
