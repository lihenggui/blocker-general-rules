i18n:
  en:
    description: Docutain SDK UI opens this Activity when the user edits a scanned page. It displays the
      page and lets the user rotate it, delete pages, or open the filter screen.
    disableEffect: Users cannot rotate, remove or adjust scanned pages through the Docutain editing flow.
  zh-CN:
    description: 用户编辑扫描页面时，Docutain SDK UI 会打开此 Activity。它显示页面，并允许用户旋转页面、删除页面或打开滤镜界面。
    disableEffect: 停用后，用户无法通过 Docutain 编辑流程旋转、删除或调整扫描页面。
