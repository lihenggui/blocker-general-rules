i18n:
  en:
    description: The Livery Android library’s download Service runs after the host app submits a URL;
      it downloads and saves the file, reports progress, and can open the file or start APK installation
      when requested.
    disableEffect: Downloads, automatic file opening and APK installation handled by Livery will stop
      working.
  zh-CN:
    description: 应用提交下载地址后，Livery 安卓库的下载 Service 会下载并保存文件、报告进度，并可按请求打开文件或启动 APK 安装。
    disableEffect: Livery 提供的下载、自动打开文件和 APK 安装功能将无法使用。
