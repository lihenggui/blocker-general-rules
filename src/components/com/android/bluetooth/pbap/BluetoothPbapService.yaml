  en:
    description: 'To enable PBAP DEBUG/VERBOSE logging - run below cmd in adb shell, and restart com.android.bluetooth
      process. only enable DEBUG log: "setprop log.tag.BluetoothPbapService DEBUG"; enable both VERBOSE
      and DEBUG log: "setprop log.tag.BluetoothPbapService VERBOSE"'
