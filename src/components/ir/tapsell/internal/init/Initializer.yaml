i18n:
  en:
    description: This older Tapsell provider initializes the SDK’s ad components when the app starts,
      before the app requests ads.
    disableEffect: Tapsell ads will not initialize; rewarded ads will not play, so rewards for watching
      them will no longer be granted.
  zh-CN:
    description: 这个旧版 Tapsell 提供程序会在应用启动时初始化广告组件，以便应用之后请求广告。
    disableEffect: 屏蔽后，Tapsell 广告将无法初始化；奖励广告无法播放，观看广告也不会获得奖励。
