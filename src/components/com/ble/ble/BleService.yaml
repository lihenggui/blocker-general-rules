    description: When the TTC Android BLE SDK connects to a nearby supported device, this background Service
      manages the Bluetooth LE connection, exchanges device data, and reports connection changes to the
      app.
    disableEffect: The app cannot connect to or exchange data with supported Bluetooth devices through
      this SDK.
  zh-CN:
