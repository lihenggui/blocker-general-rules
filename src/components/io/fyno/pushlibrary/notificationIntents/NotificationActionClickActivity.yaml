recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:04:01Z'
i18n:
  en:
    description: When a user taps an action button on a Fyno push notification, this Activity reports
      the click, opens the configured web link or app screen, and closes the notification.
    disableEffect: Blocking it stops Fyno notification action buttons from opening their configured links
      or app screens.
  zh-CN:
    description: 用户点击 Fyno 推送通知中的操作按钮时，此 Activity 会记录点击、打开配置的网页链接或应用页面，并关闭该通知。
    disableEffect: 停用后，Fyno 通知中的操作按钮将无法打开配置的链接或应用页面。
