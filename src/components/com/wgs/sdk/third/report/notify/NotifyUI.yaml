i18n:
  en:
    description: BXM SDK's push-ad flow opens this translucent Activity when ad content is ready. It displays
      the push ad and handles its interaction or landing action.
    disableEffect: BXM push ads and their destinations will no longer appear, while the host app's regular
      features remain available.
  zh-CN:
    description: BXM SDK 的推送广告内容就绪时会打开此半透明活动。它显示推送广告，并处理广告互动或落地页面。
    disableEffect: BXM 推送广告及其目标页面将不再显示，宿主应用的常规功能仍可使用。
