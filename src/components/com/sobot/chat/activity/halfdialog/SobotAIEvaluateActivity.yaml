  en:
    description: When a user is asked to rate an automated support answer or session, Sobot's customer-service
      chat SDK shows this dialog. It collects the rating and optional feedback and submits it to Sobot.
    disableEffect: The user will not be able to send feedback for this automated support session.
  zh-CN:
    description: 当用户需要评价自动客服的答复或会话时，Sobot 客服聊天 SDK 会显示此对话框。它收集评分和可选意见并提交给 Sobot。
    disableEffect: 用户将无法为这次自动客服会话提交评价。
