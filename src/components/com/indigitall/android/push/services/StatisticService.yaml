  en:
    description: When a user taps or responds to an indigitall push notification, this service reports
      the action and any topic choice, then clears the opened notification.
    disableEffect: Push actions and topic choices will no longer be reported to indigitall, and opened
      notifications may remain in the notification shade.
  zh-CN:
    description: 用户点击或回复 indigitall 推送通知时，此 Service 会上报操作和主题选择，并清除已打开的通知。
    disableEffect: 推送操作和主题选择将无法上报给 indigitall，已打开的通知也可能留在通知栏中。
