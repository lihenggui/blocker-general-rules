i18n:
  en:
    description: When the user completes Fillr's sign-up flow, this service reads the saved email and
      name and prepares registration details with browser information. It clears the saved sign-up data
      when it receives a response.
    disableEffect: Disabling it can leave the saved Fillr sign-up details unprocessed and prevent the
      profile registration flow from completing.
  zh-CN:
    description: 用户完成 Fillr 注册流程时，此服务会读取已保存的邮箱和姓名，并准备包含浏览器信息的注册资料；收到响应后会清除已保存的注册信息。
    disableEffect: 停用后，已保存的 Fillr 注册资料可能无法处理，资料注册流程也可能无法完成。
