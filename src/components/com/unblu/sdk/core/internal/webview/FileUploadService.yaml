i18n:
  en:
    description: Unblu starts this short service when a file is selected in a web-based support form.
      It keeps the selected file link available to the upload flow.
    disableEffect: Files selected from Unblu web forms will not remain available to their upload flow.
  zh-CN:
    description: 用户在 Unblu 网页客服表单中选择文件时，Unblu 会启动此短时服务。它会在上传流程中保留所选文件的链接。
    disableEffect: 停用后，Unblu 网页表单中选择的文件无法继续用于上传。
