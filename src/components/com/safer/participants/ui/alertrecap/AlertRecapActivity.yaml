  en:
    description: After a user requests help, the Safer SDK sends the selected alert level with their location
      or chosen safe zone and shows the response status. The screen also offers follow-up chat and a way
      to cancel the request.
    disableEffect: The app cannot submit or track help requests from this screen, breaking its safety-alert
      flow.
  zh-CN:
    description: 用户请求帮助后，Safer SDK 会发送所选警报级别以及用户位置或指定的安全区域，并显示处理状态。此界面还提供后续聊天和取消请求的入口。
    disableEffect: 应用将无法通过此界面提交或跟踪求助请求，安全警报流程会中断。
