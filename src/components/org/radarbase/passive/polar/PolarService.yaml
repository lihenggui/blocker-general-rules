    description: When RADAR-base collection is configured for a Polar wearable, this service connects
      over Bluetooth and collects heart rate, ECG, movement, pulse-wave, heartbeat-interval, and battery
      readings.
    disableEffect: RADAR-base will stop connecting to Polar wearables and collecting their sensor readings.
  zh-CN:
    description: 当 RADAR-base 配置为采集 Polar 穿戴设备数据时，此服务会通过蓝牙连接设备，并采集心率、心电、运动、脉搏波、心搏间隔和电量信息。
    disableEffect: RADAR-base 将无法连接 Polar 穿戴设备或继续采集其传感器数据。
