i18n:
  en:
    description: When an authorized external app uses NetEase iTVPN's connect or disconnect shortcut,
      this Activity checks the request and starts or stops the selected VPN profile.
    disableEffect: External apps lose these quick VPN controls; the host app's own controls remain available.
  zh-CN:
    description: 获准的外部应用使用网易 iTVPN 的连接或断开快捷入口时，此 Activity 会检查请求并启动或停止所选 VPN 配置。
    disableEffect: 外部应用将无法使用这些 VPN 快捷控制，但宿主应用自身的控制仍可使用。
