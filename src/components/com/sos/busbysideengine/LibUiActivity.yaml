i18n:
  en:
    description: Flare Side Engine (SAMDev313) opens this screen after detecting a possible incident.
      It shows a countdown and incident location so the user can cancel or continue the alert.
    disableEffect: The incident-confirmation screen will not open, preventing the user from reviewing
      or canceling the alert there.
  zh-CN:
    description: Flare Side Engine（SAMDev313）检测到可能的事故后会打开此页面，显示倒计时和事故位置，供用户取消或继续发送警报。
    disableEffect: 停用后，事故确认页面将无法打开，用户也无法在此查看或取消警报。
