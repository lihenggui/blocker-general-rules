i18n:
  en:
    description: AnyLife DownloadInstaller uses this provider when passing a downloaded app file to Android's
      installer. It lets the installer read the APK from the app's private storage.
    disableEffect: Downloaded apps can no longer be passed to Android for installation through this flow.
  zh-CN:
    description: AnyLife DownloadInstaller 将下载的应用安装包交给 Android 安装程序时会使用此提供程序，使安装程序能够读取应用私有存储中的 APK 文件。
    disableEffect: 停用后，此流程将无法把下载的应用安装包交给 Android 安装。
