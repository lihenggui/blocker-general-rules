i18n:
  en:
    description: DirectOne Smarkio ALTU opens this Activity when the app starts a configured customer
      chat. It shows the conversation and message-entry screen for chatting with the service team.
    disableEffect: Users cannot open the ALTU customer chat from the app, so its support conversation
      is unavailable.
  zh-CN:
    description: 应用启动已配置的客服对话时，DirectOne Smarkio ALTU 会打开此 Activity。它显示与客服团队沟通的消息列表和输入界面。
    disableEffect: 停用后，用户无法从应用打开 ALTU 客服对话，相关支持沟通将不可用。
