  en:
    description: AirbaPay opens this in-app browser during the standard payment flow to load a payment
      provider's redirect page. The user completes the provider's web checkout there.
    disableEffect: Provider redirect and authorization pages may not load, interrupting the payment flow.
  zh-CN:
    description: AirbaPay 会在标准付款流程中打开此应用内浏览器，加载支付提供方的跳转页面，供用户完成网页授权或付款。
    disableEffect: 停用后，支付提供方的跳转和授权页面可能无法加载，付款流程会中断。
