i18n:
  en:
    description: When Firebase refreshes the push token, the Restcomm WebRTC SDK sends the updated token
      to the Restcomm service so push notifications can reach the app.
    disableEffect: Restcomm will no longer receive refreshed push tokens, preventing incoming call or
      message notifications from reaching the app after token rotation.
  zh-CN:
    description: Firebase 刷新推送令牌时，Restcomm WebRTC SDK 会将新令牌发送给 Restcomm 服务，以便推送通知能够到达应用。
    disableEffect: Restcomm 将无法收到更新后的推送令牌，令牌轮换后应用可能收不到来电或消息通知。
