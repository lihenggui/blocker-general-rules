recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:16:17Z'
i18n:
  en:
    description: TouchAd (RUNCOMM) opens this page from an offer when a user chooses card registration.
      It lets them select a transit-card issuer, enter a card number, and submit it to TouchAd.
    disableEffect: Users will not be able to register a transit card for TouchAd offers that require it.
  zh-CN:
    description: 用户在 TouchAd（RUNCOMM）优惠页面选择登记交通卡时，此页面会打开，让用户选择发卡机构、输入卡号并提交给 TouchAd。
    disableEffect: 停用后，用户将无法为需要交通卡的 TouchAd 优惠登记交通卡。
