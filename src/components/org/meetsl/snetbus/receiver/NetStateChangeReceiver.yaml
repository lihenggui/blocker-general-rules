i18n:
  en:
    description: On Android versions before 5.0, SNetBus updates the shared network status when Android
      reports a connectivity change.
    disableEffect: Apps that rely on SNetBus for network status will stop receiving these connectivity
      updates.
  zh-CN:
    description: 在 Android 5.0 之前，MeetSL 的 SNetBus 网络状态库会在系统报告连接变化时更新应用可读取的网络状态。
    disableEffect: 停用后，依赖 SNetBus 网络状态的功能将无法及时获知网络连接变化。
