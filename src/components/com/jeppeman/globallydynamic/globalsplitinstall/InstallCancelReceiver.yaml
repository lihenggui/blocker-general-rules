  en:
    description: GloballyDynamic (Jeppeman) uses this component when a user cancels a module installation
      from its download notification. It sends the cancellation back to the installation flow.
    disableEffect: The cancel action on a module download notification may no longer stop that installation.
  zh-CN:
    description: GloballyDynamic（Jeppeman）的自托管模块交付 SDK 会在用户从下载通知中取消模块安装时处理取消请求，并将取消结果交回安装流程。
    disableEffect: 下载通知中的取消操作可能无法停止模块安装。
