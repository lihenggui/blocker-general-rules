  en:
    description: The RevOS Vehicle Controller SDK starts this background service to scan for and reconnect
      to the remembered vehicle over Bluetooth. It carries device status and control data while the connection
      is active.
    disableEffect: The app may lose its background Bluetooth connection, vehicle status updates, and device-control
      functions.
  zh-CN:
    description: RevOS Vehicle Controller SDK 会启动此后台服务，通过蓝牙搜索并重新连接已记住的车辆；连接期间由它传递设备状态和控制数据。
    disableEffect: 应用可能失去后台蓝牙连接、车辆状态更新和设备控制功能。
