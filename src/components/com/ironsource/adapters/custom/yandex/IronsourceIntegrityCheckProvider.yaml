i18n:
  en:
    description: The Yandex Mobile Ads IronSource mediation adapter starts this provider with the app.
      In debuggable builds it logs that this adapter version is unsupported and reports its integration
      status.
    disableEffect: Only the adapter warning and startup messages in debuggable builds are lost; this provider
      does not change normal app features.
  zh-CN:
    description: Yandex Mobile Ads 的 IronSource 中介适配器会在应用启动时运行此提供器。可调试版本中，它会记录该适配器版本已不受支持的警告和集成状态。
    disableEffect: 只会失去可调试版本中的适配器警告和启动日志；此提供器不会改变应用的正常功能。
