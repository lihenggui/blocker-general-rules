  en:
    description: During older DriveBuddy setup, this foreground service registers vehicle activity transitions.
      When the phone detects entering or leaving a vehicle, it starts or stops drive tracking.
    disableEffect: DriveBuddy's automatic trip start and stop detection may not work.
  zh-CN:
    description: 旧版 DriveBuddy 设置期间，此前台 Service 会注册车辆活动转换；手机检测到进入或离开车辆时，它会启动或停止驾驶追踪。
    disableEffect: 停用后，DriveBuddy 的自动行程开始和结束检测可能无法工作。
