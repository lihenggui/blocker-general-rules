i18n:
  en:
    description: When OPay Offline Acquirer receives a Mini POS payment request, this Activity displays
      the payment screen and initializes the connected payment-terminal provider. It accepts an order
      from the app or an OPay payment link.
    disableEffect: Users cannot pay through the OPay Mini POS flow, including payments that require the
      connected payment terminal.
  zh-CN:
    description: OPay Offline Acquirer 收到 Mini POS 支付请求时，此 Activity 会显示支付界面并初始化连接的支付终端服务。它可以接收应用传入的订单，也可以处理
      OPay 支付链接。
    disableEffect: 用户将无法通过 OPay Mini POS 流程付款，包括需要连接支付终端的付款。
