i18n:
  en:
    description: The ZXing barcode-scanning library, as packaged by ZHScanQRCode, opens this Activity
      when an app asks to scan a QR code or barcode. It uses the camera to read the code and returns its
      contents to the app.
    disableEffect: Apps that use this screen will lose their QR-code and barcode-scanning flow.
  zh-CN:
    description: ZHScanQRCode 集成的 ZXing 条码扫描库会在应用发起扫码时打开此 Activity，使用相机读取二维码或条形码，并把识别结果交还给应用。
    disableEffect: 使用此界面的应用将无法继续通过它扫描二维码或条形码。
