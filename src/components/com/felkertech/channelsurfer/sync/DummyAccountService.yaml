i18n:
  en:
    description: Android binds to this ChannelSurfer account authenticator when managing the library's
      sync account. It blocks creating a duplicate account and prevents the existing account from being
      removed.
    disableEffect: Android's sync account may no longer be available to ChannelSurfer, interrupting background
      channel updates.
  zh-CN:
    description: Android 管理 ChannelSurfer 的同步账户时，会连接到此账户验证 Service。它会阻止重复创建账户，并禁止移除现有账户。
    disableEffect: ChannelSurfer 可能无法再使用 Android 同步账户，后台频道更新会受到影响。
