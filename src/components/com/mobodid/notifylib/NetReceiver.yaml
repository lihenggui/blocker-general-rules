i18n:
  en:
    description: When Wi-Fi or mobile connectivity changes, this receiver restarts NotifyLib’s server
      check if a connection is available and its interval has elapsed.
    disableEffect: NotifyLib will not restart its notification check when connectivity returns.
  zh-CN:
    description: Wi-Fi 或移动网络状态变化时，如果网络已连接且间隔时间已到，此接收器会重新启动 NotifyLib 的服务器检查。
    disableEffect: 网络恢复后，NotifyLib 将不会重新启动通知检查。
