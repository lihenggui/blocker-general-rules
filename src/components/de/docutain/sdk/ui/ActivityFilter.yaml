    description: Docutain SDK UI opens this Activity while the user edits a scanned document to choose
      an image filter. The selected filter can be applied to one page or all pages.
    disableEffect: Users cannot choose or apply image filters to scanned pages through Docutain.
  zh-CN:
    description: 用户编辑扫描文档并选择图像滤镜时，Docutain SDK UI 会打开此 Activity。所选滤镜可应用于单页或全部页面。
    disableEffect: 停用后，用户无法通过 Docutain 为扫描页面选择或应用图像滤镜。
