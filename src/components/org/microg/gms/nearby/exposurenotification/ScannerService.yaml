i18n:
  en:
    description: While exposure monitoring is enabled, this microG GmsCore service scans for participating
      devices' Bluetooth broadcasts and records rotating identifiers used to detect encounters.
    disableEffect: The device will stop detecting nearby encounter broadcasts, so exposure matching may
      miss contacts.
  zh-CN:
    description: 启用接触监测期间，microG GmsCore 的此服务会扫描参与设备的蓝牙广播，并记录用于检测接触的轮换标识。
    disableEffect: 设备将停止检测附近的接触广播，可能会漏掉接触匹配。
