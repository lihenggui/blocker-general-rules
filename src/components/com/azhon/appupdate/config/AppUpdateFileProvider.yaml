i18n:
  en:
    description: On Android 7 and newer, the AppUpdate (Azhon) SDK uses this Provider to give Android’s
      installer access to a downloaded APK when an update is ready to install.
    disableEffect: On Android 7 and newer, if disabled, users cannot install an update downloaded through
      this library.
  zh-CN:
    description: 在 Android 7 及更高版本上，AppUpdate（Azhon）更新库会在准备安装更新时，通过此 Provider 让 Android 安装程序读取已下载的 APK。
    disableEffect: 在 Android 7 及更高版本上，停用后，用户无法通过此库安装已下载的应用更新。
