i18n:
  en:
    description: AndroidUtilCode’s Messenger helper binds this Service when the app sends messages across
      its processes, and forwards those messages to registered listeners in connected processes.
    disableEffect: Cross-process messages that rely on this helper will no longer be delivered.
  zh-CN:
    description: 应用需要在多个进程间传递消息时，会绑定 AndroidUtilCode 的 Messenger 辅助 Service；它会将消息转发给已连接进程中的监听器。
    disableEffect: 依赖此辅助功能的跨进程消息将无法送达。
