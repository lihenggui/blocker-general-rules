i18n:
  en:
    description: When started by the Helpshift Android customer-support SDK, this Service checks for conversation
      notification updates while the app is in the foreground and refreshes the SDK’s in-app notification
      state.
    disableEffect: New Helpshift message notifications and unread counts stop refreshing while the app
      is open; the app’s other screens remain available.
  zh-CN:
    description: Helpshift Android 客户支持 SDK 启动此 Service 后，它会在应用处于前台时检查对话通知更新，并刷新 SDK 的应用内通知状态。
    disableEffect: 停用后，应用打开时新的 Helpshift 消息通知和未读数将不再刷新；应用的其他页面仍可使用。
