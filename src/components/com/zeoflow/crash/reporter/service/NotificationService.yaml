i18n:
  en:
    description: ZeoFlow Flow Kit starts this Service when the user chooses a crash-report notification
      action; it can remove the saved report or open a share sheet with the log and device details.
    disableEffect: Users will not be able to remove or share a crash report from its notification; normal
      app features are unaffected.
  zh-CN:
    description: 用户点击崩溃报告通知操作时，ZeoFlow Flow Kit 会启动此 Service；它可删除已保存的报告，或打开分享菜单并附上日志和设备信息。
    disableEffect: 用户将无法通过通知删除或分享崩溃报告；应用的常规功能不受影响。
