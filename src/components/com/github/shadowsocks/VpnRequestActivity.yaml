  en:
    description: When Shadowsocks starts in VPN mode, this screen asks Android to approve the VPN connection;
      if the phone is locked, it waits until the user unlocks it.
    disableEffect: Without the approval screen, Android may not grant the access needed to connect in
      VPN mode.
  zh-CN:
    description: Shadowsocks 以 VPN 模式启动时，此页面会向 Android 请求 VPN 连接授权；如果手机处于锁定状态，它会等到用户解锁后再请求。
    disableEffect: 缺少授权页面时，Android 可能不会授予 VPN 模式所需的连接权限。
