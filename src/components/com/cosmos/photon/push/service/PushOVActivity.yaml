i18n:
  en:
    description: When MoPush cannot pass an incoming notification to the app through its Provider, it
      starts this Activity to offer the notification to the app or display it itself.
    disableEffect: Notifications that need this handoff may no longer reach the app or appear on the device.
  zh-CN:
    description: MoPush 无法通过 Provider 将收到的通知交给应用时，会启动此 Activity，让应用处理通知，或由 SDK 直接显示。
    disableEffect: 需要此处理流程的通知可能无法交给应用，也可能不会显示在设备上。
