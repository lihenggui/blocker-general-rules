i18n:
  en:
    description: When an app requests motion updates from SYRF's location and sensor SDK, this service
      reads three-axis gyroscope data and sends the readings to the app.
    disableEffect: App features that rely on SYRF gyroscope readings will no longer receive rotation updates.
  zh-CN:
    description: 应用向 SYRF 位置与传感器 SDK 请求运动数据时，此服务会读取陀螺仪的三轴数据并发送给应用。
    disableEffect: 停用后，依赖 SYRF 陀螺仪数据的功能将无法收到旋转更新。
