i18n:
  en:
    description: MFMS Push Lite starts this background Service after a push arrives or is marked read.
      It syncs message content and read status with MFMS and saves new messages for the app.
    disableEffect: The app's MFMS push inbox may not sync new messages or read status.
  zh-CN:
    description: 收到推送或消息被标记为已读后，MFMS Push Lite 会在后台启动此 Service。它会与 MFMS 同步消息内容和已读状态，并将新消息保存给应用。
    disableEffect: 应用中的 MFMS 推送收件箱可能无法同步新消息或已读状态。
