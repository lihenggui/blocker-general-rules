i18n:
  en:
    description: The SimpleInstaller library by solrudev starts this Activity during APK installation.
      It opens Android's install or confirmation screen and returns the user's choice to the install flow.
    disableEffect: SimpleInstaller may be unable to open or complete the system installation screen, so
      APK installation can fail.
  zh-CN:
    description: solrudev 的 SimpleInstaller 库在安装 APK 时启动此 Activity。它会打开 Android 安装或确认界面，并将用户的选择返回安装流程。
    disableEffect: 停用后，SimpleInstaller 可能无法打开或完成系统安装界面，导致 APK 安装失败。
