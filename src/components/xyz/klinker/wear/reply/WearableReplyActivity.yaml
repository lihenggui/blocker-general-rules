i18n:
  en:
    description: When the app asks Klinker Wear Reply to compose a wearable notification reply, this Activity
      offers preset responses, voice recognition, or typed text and returns the selected response to the
      app.
    disableEffect: Preset, voice, and typed replies from that wearable reply screen will no longer be
      available.
  zh-CN:
    description: 应用使用 Klinker Wear Reply 编写可穿戴设备通知回复时，此 Activity 会提供预设回复、语音识别或文字输入，并将选中的回复返回给应用。
    disableEffect: 该可穿戴设备回复页面中的预设、语音和文字回复功能都将无法使用。
