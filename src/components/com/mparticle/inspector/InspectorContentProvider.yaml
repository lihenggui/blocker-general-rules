  en:
    description: In a debug version of the app, this mParticle Inspector provider sets up the developer
      inspection panel at startup. Shaking the device can open a panel for viewing mParticle SDK activity.
    disableEffect: The mParticle debugging panel will not appear, while the app's normal features continue
      to work.
  zh-CN:
    description: 在应用的调试版本启动时，此 mParticle Inspector Provider 会设置开发者检查面板。摇晃设备可以打开面板查看 mParticle SDK 的活动。
    disableEffect: 禁用后，mParticle 调试面板不会显示，应用的常规功能仍可使用。
