  en:
    description: Attestr FlowX, Attestr’s identity-check SDK, opens this screen when an identity verification
      session begins. It presents the requested checks, such as identity details and one-time codes, and
      sends the answers to Attestr.
    disableEffect: If disabled, the app cannot complete this Attestr identity-check session.
  zh-CN:
    description: Attestr FlowX（Attestr 的身份核验 SDK）会在身份核验开始时打开此页面，展示所需的身份信息和验证码步骤，并将结果提交给 Attestr。
    disableEffect: 停用后，应用将无法完成这次 Attestr 身份核验。
