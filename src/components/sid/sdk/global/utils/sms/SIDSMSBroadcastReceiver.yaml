recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:27:26Z'
i18n:
  en:
    description: During Sber ID sign-in, SIDSDK listens for Google's SMS Retriever result and asks the
      user to approve using a received verification message. The sign-in screen sets up this listener
      only while authentication is active.
    disableEffect: Turning off this declared entry alone does not stop the SMS consent step, because the
      active sign-in screen registers its listener directly.
  zh-CN:
    description: Sber ID 登录期间，SIDSDK 会监听 Google 短信检索结果，并请求用户同意使用收到的验证短信。只有认证界面处于活动状态时，登录流程才会设置此监听。
    disableEffect: 仅关闭此处声明的接收器不会停止短信授权步骤，因为活动中的登录界面会直接注册监听器。
