i18n:
  en:
    description: Tasomaniac EmailAutoCompleteTextView opens this translucent screen when its email suggestions
      need permission to read device accounts. It shows Android's permission prompt and returns the user's
      choice to the email field.
    disableEffect: The widget cannot request account access, so email suggestions that rely on device
      accounts may stop working.
  zh-CN:
    description: Tasomaniac 的 EmailAutoCompleteTextView 在邮箱建议需要读取设备账户权限时打开此透明页面。它会显示 Android 权限提示，并把用户的选择返回给邮箱输入框。
    disableEffect: 该输入框无法请求读取账户的权限，因此依赖设备账户的邮箱建议可能无法使用。
