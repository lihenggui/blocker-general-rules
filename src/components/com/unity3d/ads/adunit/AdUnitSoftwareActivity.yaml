  en:
    description: Unity Ads uses this software-rendered version of its ad screen for video and web ads,
      including rewarded placements.
    disableEffect: Unity ads using this screen will not open, and rewards for watching rewarded ads will
      no longer be granted; other app features continue to work.
  zh-CN:
    description: Unity Ads 使用此软件渲染版本的广告页面播放视频或网页广告，包括奖励型广告。
    disableEffect: 此页面承载的 Unity 广告将无法打开，观看奖励型广告也不再获得奖励；应用的其他功能仍可使用。
