i18n:
  en:
    description: When the 233 MPG SDK detects a newer game package, this Activity shows the version and
      update details, downloads it, and opens the installer. Required updates must finish before entering
      the game, while optional updates can be skipped.
    disableEffect: The SDK's game-update prompt and install path will fail, and a game that requires the
      update may not open.
  zh-CN:
    description: 233 MPG SDK 检测到游戏有新版本时，此 Activity 会显示版本和更新说明、下载更新并打开安装程序；强制更新必须完成后才能进入游戏，可选更新则可以跳过。
    disableEffect: 停用后，SDK 的游戏更新提示和安装流程将无法使用，需要更新的游戏可能无法正常打开。
