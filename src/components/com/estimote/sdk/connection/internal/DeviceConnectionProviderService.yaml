i18n:
  en:
    description: When an app requests a connection to a configurable Estimote device, this legacy Estimote
      SDK Service provides the connection used to read or change device settings.
    disableEffect: The app will not be able to connect to configurable Estimote devices to read or change
      their settings.
  zh-CN:
    description: 应用请求连接可配置的 Estimote 设备时，旧版 Estimote SDK 会绑定此 Service，提供读取或修改设备设置所需的连接。
    disableEffect: 屏蔽后，应用无法连接可配置的 Estimote 设备，也无法读取或修改其设置。
