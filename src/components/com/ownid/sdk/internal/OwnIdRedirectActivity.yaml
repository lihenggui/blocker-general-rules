recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:12:20Z'
i18n:
  en:
    description: When a user follows an OwnID sign-in return link, this Activity opens briefly and closes
      so control returns to the host app. It is the handoff point for OwnID's redirect-based authentication
      flow.
    disableEffect: OwnID sign-in flows that depend on this return link cannot complete.
  zh-CN:
    description: 用户打开 OwnID 登录返回链接时，此 Activity 会短暂启动后立即关闭，让操作返回应用。它负责 OwnID 重定向登录流程的返回交接。
    disableEffect: 依赖此返回链接的 OwnID 登录流程将无法完成。
