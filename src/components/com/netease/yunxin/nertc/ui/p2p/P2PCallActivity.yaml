  en:
    description: When a user starts or answers a NetEase Yunxin CallKit one-to-one voice or video call,
      this Activity shows the call screen and its answer, reject, mute, camera, speaker, and hang-up controls.
    disableEffect: One-to-one calls routed to this screen may not open, preventing users from placing
      or answering them.
  zh-CN:
    description: 用户发起或接听 NetEase 云信 CallKit 一对一语音或视频通话时，此 Activity 会显示通话界面，并提供接听、拒接、静音、摄像头、扬声器和挂断操作。
    disableEffect: 分配到此界面的一对一通话可能无法打开，用户将无法发起或接听这些通话。
