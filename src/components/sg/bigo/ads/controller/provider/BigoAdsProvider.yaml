i18n:
  en:
    description: The Bigo Ads SDK provider runs automatically as Android creates the app process and initializes
      the SDK using the app's Application object.
    disableEffect: Automatic Bigo Ads initialization will not run, so Bigo ad placements that depend on
      it will not load.
  zh-CN:
    description: Bigo Ads SDK 的 Provider 会在 Android 创建应用进程时自动运行，并使用应用的 Application 对象初始化 SDK。
    disableEffect: 自动初始化 Bigo Ads 的流程将停止，依赖该流程的 Bigo 广告也将无法加载。
