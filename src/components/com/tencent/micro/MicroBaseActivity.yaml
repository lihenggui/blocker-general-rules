i18n:
  en:
    description: This is Tencent TCR's shared screen foundation for cloud-hosted games, not a screen the
      app can open by itself. A concrete game screen supplied by the host app can use it to show the live
      game video, send player controls, reconnect, and manage updates.
    disableEffect: Disabling this base declaration does not disable a separate game screen supplied by
      the app; this base component cannot be opened on its own.
  zh-CN:
    description: 这是腾讯 TCR 云游戏 SDK 为云端游戏提供的基础页面，应用不能单独打开它。应用提供的具体游戏页面可借助它播放实时游戏画面，并处理操作、重连和更新。
    disableEffect: 停用此基础声明不会停用应用另行提供的具体游戏页面；这个组件本身无法单独启动。
