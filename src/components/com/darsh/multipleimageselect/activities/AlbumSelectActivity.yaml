i18n:
  en:
    description: CrazyCodeBoy MultipleImageSelect is a photo-picker SDK, also published as a WDEO3601-maintained
      fork. This screen opens when an app asks the user to choose photos, lists albums from the device
      photo library, and opens the selected album.
    disableEffect: Apps that use this picker can no longer browse photo albums or continue to selecting
      photos through this screen.
  zh-CN:
    description: CrazyCodeBoy 的 MultipleImageSelect 图片选择 SDK（也有 WDEO3601 维护的分支）会在应用打开图片选择器时显示此页面。它读取设备照片库并列出相册，用户选择相册后即可继续选图。
    disableEffect: 使用此选择器的应用将无法通过此页面浏览相册或继续选择照片。
