i18n:
  en:
    description: The OwnID authentication SDK uses this hidden Activity as a temporary host during account
      sign-in or verification steps that need Android's interface. It closes when the requested step ends.
    disableEffect: OwnID sign-in or verification steps that need this host can fail, preventing users
      from completing the related account action.
  zh-CN:
    description: OwnID 身份验证 SDK 会在需要调用 Android 界面的登录或验证步骤中使用此隐藏 Activity，并在步骤结束后关闭。
    disableEffect: 需要此 Activity 的 OwnID 登录或验证步骤可能失败，用户将无法完成相关账户操作。
