i18n:
  en:
    description: Mercury uses this provider to give Android access to an APK downloaded through an ad
      when the user chooses to install it.
    disableEffect: Android’s installer cannot access APKs downloaded by Mercury, so those app installations
      may fail.
  zh-CN:
    description: 用户选择安装广告应用时，Mercury 会通过此 Provider 让 Android 访问已下载的 APK。
    disableEffect: Android 安装器将无法访问 Mercury 下载的应用安装包，相关安装可能失败。
