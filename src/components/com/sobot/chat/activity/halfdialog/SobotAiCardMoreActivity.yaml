  en:
    description: When a user opens the additional choices in an automated support card, Sobot's customer-service
      chat SDK shows this dialog. It lists the card’s extra options and sends a selected option back into
      the conversation.
    disableEffect: The user will not be able to browse or send additional options from the support card.
  zh-CN:
    description: 当用户打开自动客服卡片中的更多选项时，Sobot 客服聊天 SDK 会显示此对话框。它列出卡片的其他选项，并将用户选择的选项发送回会话。
    disableEffect: 用户将无法浏览或发送客服卡片中的其他选项。
