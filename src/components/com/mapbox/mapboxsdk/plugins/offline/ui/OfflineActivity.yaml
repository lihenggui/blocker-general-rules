i18n:
  en:
    description: The Mapbox Android Offline Plugin opens this screen when the app asks the user to choose
      a map area for offline use. The selected area and name are returned to the app for saving.
    disableEffect: Users cannot choose a map area to save for offline use through this plugin.
  zh-CN:
    description: 应用要求用户选择离线使用的地图区域时，Mapbox Android Offline Plugin 会打开此页面。用户选定的区域和名称会返回给应用以便保存。
    disableEffect: 禁用后，用户无法通过此插件选择要保存供离线使用的地图区域。
