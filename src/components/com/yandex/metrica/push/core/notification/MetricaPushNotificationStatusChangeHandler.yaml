recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:21:08Z'
i18n:
  en:
    description: When Android reports that app notifications or a notification channel changed blocked
      state, this receiver asks AppMetrica Push to refresh delivery registration.
    disableEffect: AppMetrica Push may not learn when notifications are blocked or restored, so its delivery
      registration can become stale.
  zh-CN:
    description: Android 报告应用通知或通知渠道的屏蔽状态发生变化时，此 Receiver 会让 AppMetrica Push 更新推送登记信息。
    disableEffect: 通知被屏蔽或恢复时，AppMetrica Push 可能无法获知变化，推送登记信息可能过期。
