i18n:
  en:
    description: When the Estimote SDK binds for scanning, this Service manages Bluetooth beacon ranging
      and monitoring and reports detected beacons and locations to SDK clients.
    disableEffect: Estimote and Rover beacon detection and region notifications will stop; unrelated app
      screens remain available.
  zh-CN:
    description: Estimote SDK 绑定以进行扫描时，此 Service 会管理蓝牙信标测距和监测，并向 SDK 使用方报告检测到的信标及位置。
    disableEffect: Estimote 和 Rover 的信标检测及区域通知将停止；应用的其他界面仍可使用。
