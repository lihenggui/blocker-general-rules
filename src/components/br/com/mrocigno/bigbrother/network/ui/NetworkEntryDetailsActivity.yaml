i18n:
  en:
    description: This is part of Mrocigno's BigBrother diagnostic toolkit. When a user selects a captured
      request in BigBrother's network history, this screen shows its URL, request data, and response.
    disableEffect: You will not be able to open individual request details in BigBrother; the app's network
      connections continue to work.
  zh-CN:
    description: 这是 Mrocigno 的 BigBrother 诊断工具的一部分。在 BigBrother 网络记录中选择一条请求后，此页面会显示网址、请求内容和响应。
    disableEffect: 停用后，用户无法在 BigBrother 中打开单条请求详情；应用的网络连接仍可正常工作。
