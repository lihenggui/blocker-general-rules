i18n:
  en:
    description: When a learner opens a course item, the Testpress Course SDK displays its lesson. Depending
      on the item, the screen shows formatted text, video, a downloadable attachment, or an exam with
      start and resume options.
    disableEffect: Learners lose access to these course lessons and any exam or attachment provided through
      them.
  zh-CN:
    description: 用户打开课程内容时，Testpress Course SDK 会显示相应课程页面。根据内容类型，页面可显示排版文本、视频、可下载的附件，或带有开始和继续选项的考试。
    disableEffect: 用户将无法查看这些课程内容，也无法使用其中的考试或附件。
