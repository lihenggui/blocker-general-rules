    description: When a user taps a Strict Canary notification about an Android policy violation, Alex
      Dadukin's Strict Canary opens this screen to show the violation list or selected details.
    disableEffect: Strict Canary notifications can no longer open the violation list or details; the app's
      regular screens remain available.
  zh-CN:
    description: 用户点击有关 Android 策略违规的 Strict Canary 通知时，Alex Dadukin 的 Strict Canary 会打开此界面，显示违规列表或所选违规的详情。
    disableEffect: Strict Canary 通知将无法打开违规列表或详情；应用的常规界面仍可使用。
