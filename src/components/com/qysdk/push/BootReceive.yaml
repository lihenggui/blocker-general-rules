i18n:
  en:
    description: The QySDK receiver starts its background service after the device finishes booting or
      the user unlocks the screen. The analyzed service has no separate user-facing action.
    disableEffect: The service will no longer start from those boot or unlock events; no other app-facing
      effect is shown in the analyzed code.
  zh-CN:
    description: 设备启动完成或用户解锁屏幕后，QySDK 接收器会启动其后台服务；所分析的服务没有其他面向用户的操作。
    disableEffect: 停用后，设备启动或解锁时将不再启动该服务；所分析代码未显示其他应用层面的影响。
