i18n:
  en:
    description: The LiveShopper mobile insights SDK receives background location and geofence events
      and schedules them for processing; it also handles device startup notifications. Disabling it stops
      those background location and place-boundary updates from reaching the SDK.
    disableEffect: LiveShopper will no longer receive background location or geofence updates through
      this component.
  zh-CN:
    description: LiveShopper 移动应用洞察 SDK 会接收后台位置和地点区域事件并安排处理，也会处理设备启动通知。禁用后，这些后台位置和地点区域更新将无法送达 SDK。
    disableEffect: LiveShopper 将无法通过此组件接收后台位置或地点区域更新。
