i18n:
  en:
    description: This is part of Mrocigno's BigBrother diagnostic toolkit. After a user selects a saved
      session in BigBrother, this screen shows its recorded activity and links to the session's network
      and log details.
    disableEffect: Saved session details and their diagnostic links will not be viewable in BigBrother;
      the app's normal screens are unaffected.
  zh-CN:
    description: 这是 Mrocigno 的 BigBrother 诊断工具的一部分。用户在 BigBrother 中选择已保存的会话后，此页面会显示记录的活动，并提供该会话的网络和日志详情入口。
    disableEffect: 停用后，BigBrother 中无法查看已保存的会话详情及诊断链接；应用的普通页面不受影响。
