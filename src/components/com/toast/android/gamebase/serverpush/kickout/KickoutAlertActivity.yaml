recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:38:17Z'
i18n:
  en:
    description: Gamebase opens this blocking alert when a server kickout event occurs; it shows the server
      message and waits for acknowledgement.
    disableEffect: The kickout notice and its session-cleanup callback may not run, leaving the Gamebase
      session in an inconsistent state.
  zh-CN:
    description: 服务器发出踢出事件时，Gamebase 会打开此阻断式提示，显示服务器消息并等待用户确认。
    disableEffect: 停用后踢出提示及其会话清理回调可能不会执行，Gamebase 会话状态可能不一致。
