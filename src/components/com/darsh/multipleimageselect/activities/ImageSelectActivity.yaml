i18n:
  en:
    description: CrazyCodeBoy MultipleImageSelect is a photo-picker SDK, also published as a WDEO3601-maintained
      fork. This screen shows photos from the album selected in the picker, lets the user select several
      images, and returns the selection to the app.
    disableEffect: Apps that use this picker can no longer select photos and return them through this
      screen.
  zh-CN:
    description: CrazyCodeBoy 的 MultipleImageSelect 图片选择 SDK（也有 WDEO3601 维护的分支）会在用户选定相册后显示其中的照片。用户可以选择多张图片并将结果返回应用。
    disableEffect: 使用此选择器的应用将无法通过此页面选取照片并返回结果。
