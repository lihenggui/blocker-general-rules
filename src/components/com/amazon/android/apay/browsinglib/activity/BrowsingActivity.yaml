recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: The Amazon Pay Android browsing library opens this Activity when a payment or sign-in
      flow needs a browser; it uses Chrome Custom Tabs when available, otherwise an external browser,
      and returns the redirect result to the calling flow.
    disableEffect: Amazon Pay sign-in or payment flows that require browser authorization will not complete.
  zh-CN:
    description: Amazon Pay Android 浏览库在付款或登录流程需要打开网页时启动此界面；有 Chrome 自定义标签页时会优先使用，否则打开外部浏览器，并将返回结果交还给发起流程。
    disableEffect: 需要浏览器授权的 Amazon Pay 登录或付款流程将无法完成。
