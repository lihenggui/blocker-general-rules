  en:
    description: MixPush’s Meizu push adapter receives Meizu message, registration, and notification callbacks.
      It forwards message taps and data messages to the app and supplies the icons used by Meizu notifications.
    disableEffect: Meizu push messages, notification taps, and registration updates will no longer reach
      the app.
  zh-CN:
    description: MixPush 的魅族推送适配器会接收魅族消息、注册和通知回调。它把通知点击和透传消息交给应用，并为魅族通知提供图标。
    disableEffect: 停用后，魅族推送消息、通知点击和注册状态更新将无法到达应用。
