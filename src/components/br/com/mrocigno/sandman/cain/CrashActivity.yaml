i18n:
  en:
    description: This is part of Mrocigno's Sandman diagnostic toolkit. When Sandman's crash handler catches
      an uncaught app error, it opens this screen with the page name and exception details.
    disableEffect: Sandman's crash report screen will not open; the app's normal features are unaffected.
  zh-CN:
    description: 这是 Mrocigno 的 Sandman 诊断工具的一部分。Sandman 的崩溃处理程序捕获应用未处理的错误后会打开此页面，显示页面名称和异常详情。
    disableEffect: 停用后，Sandman 崩溃报告页面不会打开；应用的普通功能不受影响。
