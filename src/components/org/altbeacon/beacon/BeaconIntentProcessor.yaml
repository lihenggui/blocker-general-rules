i18n:
  en:
    description: When the AltBeacon Android Beacon Library receives a scan result, this background service
      turns it into nearby-beacon and region entry or exit updates for the app.
    disableEffect: Apps using AltBeacon stop receiving beacon and monitored-region updates.
  zh-CN:
    description: AltBeacon Android Beacon Library 收到扫描结果后，这个后台服务会将其转换为附近信标以及进入或离开监测区域的更新，并通知应用。
    disableEffect: 使用 AltBeacon 的应用将无法再收到信标和监测区域变化。
