  en:
    description: On Android versions where it is registered, this Blueshift Receiver runs after a connectivity-change
      broadcast and retries queued network requests.
    disableEffect: Blueshift queued requests will not be retried when network connectivity changes.
  zh-CN:
    description: 在注册此接收器的 Android 版本上，Blueshift 会在收到网络变化广播后运行它，并重试队列中的网络请求。
    disableEffect: 网络连接变化时，Blueshift 队列中的请求将不会被重试。
