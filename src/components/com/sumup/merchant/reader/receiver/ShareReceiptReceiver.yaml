recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:07:28Z'
i18n:
  en:
    description: When Android reports which app was selected for a receipt share, SumUp Reader uses this
      receiver to record the destination for analytics. It does not send the receipt itself.
    disableEffect: If disabled, receipt sharing still works, but SumUp Reader stops recording which destination
      app was chosen.
  zh-CN:
    description: Android 返回用户在回执分享菜单中选择的应用时，SumUp Reader 会用此接收器记录分享目标的统计信息。它本身不负责发送回执。
    disableEffect: 停用后，回执仍可分享，但 SumUp Reader 不会再记录用户选择的目标应用。
