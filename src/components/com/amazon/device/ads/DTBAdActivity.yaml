recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Amazon Publisher Services (APS) opens this Activity when an expandable ad grows into
      a full-screen view. It loads the expanded creative and handles closing it.
    disableEffect: Expanded APS ads will not open; the app's other features remain available.
  zh-CN:
    description: Amazon Publisher Services（APS）在可展开广告扩展为全屏内容时会打开此 Activity。它加载扩展后的广告并处理关闭操作。
    disableEffect: APS 展开式广告将无法打开，应用的其他功能仍可使用。
