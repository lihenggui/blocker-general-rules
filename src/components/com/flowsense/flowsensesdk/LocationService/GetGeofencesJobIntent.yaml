lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: When the FlowSense location job requests a region refresh, this background service updates
      or removes the SDK geofences on Wi-Fi according to its daily refresh schedule.
    disableEffect: FlowSense region data may become stale, affecting its location-based messages and tracking;
      unrelated app features remain available.
  zh-CN:
    description: FlowSense 位置任务请求刷新区域时，此后台服务会按每日计划在 Wi-Fi 下更新或移除 SDK 地理围栏。
    disableEffect: 停用后，FlowSense 的区域数据可能过期，影响其基于位置的消息和跟踪；应用的其他功能仍可使用。
