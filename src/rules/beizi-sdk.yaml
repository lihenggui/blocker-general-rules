i18n:
  en:
    name: BeiZi SDK
    description: '### Description

      **Purpose of use:**

      Used for application download advertising delivery and advertising material storage, advertising
      delivery and monitoring attribution, anti-cheating. Adjust advertising delivery strategy based on
      user device information, provide statistical analysis services, achieve normal display and interaction
      of advertisements. Optimize code defects to minimize app crashes through crash information. Optimize
      the performance of the SDK by collecting performance data during SDK operation. Collect advertising
      data for advertising analysis, including but not limited to: requests, impressions, clicks, conversions,
      etc., for advertising process analysis.

      **Types of collected personal information:**

      Device brand, device model, device time zone, device language, system version, developer application
      name, application version number, application package name, network type, UserAgent information,
      network status, crash information, performance data, screen height and width, screen orientation,
      screen DPI information, system update time, boot time, USB debugging mode, carrier, CPU, application
      process name, application process information, running status, disk space, physical memory. Device
      ID (OAID, GAID) (IMEI is collected only with user authorization), internet access, network status,
      phone WiFi status, installed applications'
    company: Shanghai BeiZi Network Technology Co., Ltd.
  zh-CN:
    description: '### 使用目的

      用于应用下载广告投放及广告素材存储，广告投放及广告监测归因、反作弊。基于用户设备信息调整广告投放策略、统计分析服务、实现广告正常显示与交互。通过崩溃信息，以此来优化代码缺陷，最大程度减少App崩溃。通过收集SDK运行过程中性能数据，以优化SDK的性能。统计广告数据，以用于广告主统计投放结果。包括不限于：请求、展示、点击、转化等，用于广告流程分析。

      ### 收集个人信息类型

      设备品牌、设备型号、设备时区、设备语言、系统版本、开发者应用名、应用版本号、应用包名、网络类型、UserAgent信息、网络状态、崩溃信息、性能数据、屏幕高宽、屏幕方向、屏幕DPI信息、系统更新时间、开机时间、USB调试模式、运营商、cpu、应用的进程名称、应用的进程信息、运行状态、磁盘空间、物理内存。设备ID（OAID、GAID）（IMEI
      用户授权才收集）、访问互联网、网络状态、手机WiFi状态、安装应用

      '
    company: 上海倍孜网络技术有限公司
