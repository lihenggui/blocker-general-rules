i18n:
  en:
    description: Abbreviated Dial Numbers (ADN) list activity for the Phone app. By default, this class
      will show you all Service Dialing Numbers (SDN) that are supported by a service provider. SDNs are
      a form of speed dial for accessing service provider contacts like "#MIN" for getting user minutes.
      To see this class in use, trigger the radio info screen by dialing *#*#INFO#*#and open the menu.
      This class can also be used as a base class for simple contact lists that can be represented with
      only labels and numbers.
