recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T20:04:30Z'
i18n:
  en:
    description: The Klinker Android SMS/MMS library uses this Provider to open cached files when building
      MMS messages or handling downloaded MMS media. It reads or writes the requested file in the app
      cache.
    disableEffect: Disabling it prevents MMS media files from being read or written through the provider,
      so sending or opening MMS attachments can fail.
  zh-CN:
    description: Klinker Android SMS/MMS 库会通过此 Provider 打开缓存文件，用于创建彩信或处理下载的彩信媒体。它会读取或写入应用缓存中的指定文件。
    disableEffect: 停用后，应用无法通过此 Provider 读写彩信媒体文件，发送或打开彩信附件可能会失败。
