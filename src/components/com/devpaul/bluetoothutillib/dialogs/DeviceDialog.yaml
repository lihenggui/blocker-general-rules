i18n:
  en:
    description: When an app opens the DeveloperPaul123 Simple Bluetooth Library chooser, this Activity
      lists paired devices and discovers nearby devices, then returns the selected Bluetooth device to
      the app.
    disableEffect: The app cannot use this library screen to pick a Bluetooth device, so any pairing or
      connection flow that depends on it will fail.
  zh-CN:
    description: 应用打开 DeveloperPaul123 Simple Bluetooth Library 的设备选择界面时，此 Activity 会列出已配对设备并搜索附近设备，然后将用户选中的蓝牙设备返回给应用。
    disableEffect: 应用无法通过此库的界面选择蓝牙设备，因此依赖它进行配对或连接的流程会失败。
