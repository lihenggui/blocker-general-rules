  en:
    description: In the earlier Firebase App Distribution integration, this screen checks the unknown-app
      install setting and launches Android's package installer for a downloaded APK.
    disableEffect: Disabling it stops the test-build install flow, and the SDK direct launch of this screen
      may fail.
  zh-CN:
    description: 在较早版本的 Firebase App Distribution 集成中，此页面会检查是否允许安装未知来源应用，并为已下载的 APK 启动 Android 安装程序。
    disableEffect: 停用后，测试版本安装流程会中断，SDK 直接启动此页面也可能失败。
