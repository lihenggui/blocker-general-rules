i18n:
  en:
    description: When Yandex returns a browser sign-in link to an app using the legacy Yandex Login SDK,
      this Activity passes it to the login flow.
    disableEffect: The older Yandex login flow may not return the browser sign-in result, preventing login.
  zh-CN:
    description: 使用旧版 Yandex Login SDK 的应用收到浏览器登录返回链接时，此 Activity 会将链接交给登录流程。
    disableEffect: 旧版 Yandex 登录流程可能无法收到浏览器登录结果，导致登录失败。
