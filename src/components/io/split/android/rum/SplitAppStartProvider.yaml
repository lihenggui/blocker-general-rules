recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:21:32Z'
i18n:
  en:
    description: Split's Android RUM Agent starts observing app screens during startup and records when
      the first screen opens. It uses that timing for app performance monitoring.
    disableEffect: Split will miss app-start timing and related performance data, while the app's screens
      and controls continue to work.
  zh-CN:
    description: Split Android RUM Agent 会在应用启动时开始监听页面，并记录首个页面打开的时间，用于监测应用性能。
    disableEffect: 停用后，Split 将无法收集应用启动耗时等性能数据，但应用页面和控件仍可正常使用。
