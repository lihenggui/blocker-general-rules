i18n:
  en:
    description: AndroidX Test Core starts this blank Activity during instrumentation tests to move the
      app into a stopped screen state while testing another Activity.
    disableEffect: Tests that rely on these screen lifecycle transitions may fail or time out; normal
      app navigation is unaffected.
  zh-CN:
    description: AndroidX Test Core 会在测试期间启动这个空白 Activity，使正在测试的另一个界面进入停止状态。
    disableEffect: 依赖这些界面生命周期变化的测试可能失败或超时；应用的正常导航不受影响。
