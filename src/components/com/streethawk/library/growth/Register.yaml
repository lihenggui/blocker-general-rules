i18n:
  en:
    description: This component is part of the StreetHawk mobile engagement SDK. When Google Play reports
      an install referral, this StreetHawk receiver saves matching referral data for growth attribution.
      StreetHawk also uses this module to register installs and return referral-link results.
    disableEffect: StreetHawk install attribution and referral registration will stop.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。Google Play 报告安装来源时，此 StreetHawk 接收器会保存匹配的来源信息以进行增长归因。StreetHawk
      也通过此模块登记安装并返回推荐链接结果。
    disableEffect: StreetHawk 的安装归因和推荐登记将停止。
