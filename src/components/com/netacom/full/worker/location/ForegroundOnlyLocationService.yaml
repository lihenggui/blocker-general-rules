i18n:
  en:
    description: When a user shares live location through NetAlo Chat, this foreground service requests
      location updates and sends them to the shared conversation. It also shows a persistent live-location
      notification.
    disableEffect: Recipients will no longer receive the sender’s changing location during a live-location
      share.
  zh-CN:
    description: 用户通过 NetAlo 聊天分享实时位置时，此前台服务会持续获取位置更新并发送到共享会话，同时显示持续通知。
    disableEffect: 实时位置分享期间，接收者将无法继续收到发送者更新后的位置。
