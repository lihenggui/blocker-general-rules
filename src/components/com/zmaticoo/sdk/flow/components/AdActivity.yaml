i18n:
  en:
    description: Maticoo Ads opens this full-screen page when an ad placement needs a separate viewing
      screen. It displays the ad content until the ad closes.
    disableEffect: Ad placements that use this Maticoo screen will not display; the host app's own non-ad
      features remain available.
  zh-CN:
    description: Maticoo 广告 SDK 在广告位需要单独的全屏页面时会打开此页面，并在其中展示广告内容，直到广告关闭。
    disableEffect: 依赖此页面的 Maticoo 广告位将无法显示；宿主应用自身的非广告功能仍可使用。
