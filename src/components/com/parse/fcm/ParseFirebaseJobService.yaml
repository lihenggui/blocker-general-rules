i18n:
  en:
    description: Firebase Job Dispatcher runs this service to save the app's Firebase Cloud Messaging
      token and push type to its Parse installation. It runs when Parse schedules a push-token registration
      or update.
    disableEffect: Parse will not receive updated FCM registration details, so Parse push delivery to
      this app will stop working reliably.
  zh-CN:
    description: Firebase Job Dispatcher 会启动此 Service，将应用的 Firebase Cloud Messaging 令牌和推送类型保存到 Parse 安装记录中。Parse
      安排推送令牌注册或更新时会运行它。
    disableEffect: Parse 无法收到更新后的 FCM 注册信息，向此应用投递 Parse 推送将无法正常工作。
