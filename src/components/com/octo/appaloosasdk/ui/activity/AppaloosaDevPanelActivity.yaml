i18n:
  en:
    description: The Appaloosa Android SDK opens this developer panel on request to show app metadata
      and requested or granted permissions for inspection. Disabling it removes the diagnostic panel.
    disableEffect: Appaloosa's app-configuration and permission diagnostic screen will no longer open.
  zh-CN:
    description: Appaloosa Android SDK 按需打开此开发者面板，供人查看应用元数据以及请求过或已授予的权限。禁用后，诊断面板将无法打开。
    disableEffect: Appaloosa 的应用配置和权限诊断界面将无法打开。
