i18n:
  en:
    description: When Huawei Push Kit refreshes the device token or delivers a Sendbird chat message,
      this Sendbird Chat SDK Service passes it to the SDK's chat push handling.
    disableEffect: Huawei-delivered Sendbird chat push notifications and token updates will stop; users
      can still read messages in the app.
  zh-CN:
    description: Huawei Push Kit 刷新设备令牌或投递 Sendbird 聊天消息时，Sendbird Chat SDK 的此 Service 会将其交给 SDK 处理聊天推送。
    disableEffect: 通过 Huawei 投递的 Sendbird 聊天推送和令牌更新会停止，但用户仍可在应用中查看消息。
