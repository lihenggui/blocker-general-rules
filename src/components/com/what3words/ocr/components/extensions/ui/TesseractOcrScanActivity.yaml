i18n:
  en:
    description: The what3words OCR Components extension opens this camera scanner when an app uses Tesseract
      recognition. It reads a three-word address and displays validated what3words matches.
    disableEffect: Users will no longer be able to scan what3words addresses with Tesseract recognition.
  zh-CN:
    description: 应用使用 Tesseract 识别时，what3words OCR Components 扩展会打开此相机扫描界面，读取三词地址并显示验证后的 what3words 匹配结果。
    disableEffect: 用户将无法再通过 Tesseract 识别扫描 what3words 地址。
