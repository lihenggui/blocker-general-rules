    description: The CashCat SDK from CashCat22 and BXM SDK from Sinnerlwu both include this WGS advertising
      page. It opens an ad or rewarded offer's web page, and its timed viewing flow can confirm when the
      required viewing period is complete.
    disableEffect: These ad pages will not open, and rewards for watching ads in this flow will no longer
      be granted.
