i18n:
  en:
    description: Android DbInspector uses this private provider when its database screen shares a selected
      database; it reports the file name and size and labels the URI as a binary file.
    disableEffect: The inspector's database-sharing action may fail or lose file details if this provider
      is blocked.
  zh-CN:
    description: 用户在 Android DbInspector 中分享数据库时，此私有 Provider 会提供文件名和大小，并将链接标记为二进制文件。
    disableEffect: 停用后，检查器的数据库分享操作可能失败或无法取得文件信息。
