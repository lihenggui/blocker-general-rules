i18n:
  en:
    description: The Xinliangxiang Voice Read SDK opens this screen for a spoken ad-reward task, showing
      the advertiser’s message and guiding the user through a read-aloud flow. Its close control can show
      instructions for leaving the task.
    disableEffect: Blocking it stops this voice ad task from opening or completing, so rewards for the
      associated ad will no longer be granted.
  zh-CN:
    description: Xinliangxiang Voice Read SDK 会在本页展示语音广告任务和广告主内容，并引导用户朗读内容以完成任务；退出时可能显示退出提示。
    disableEffect: 停用后，此语音广告任务无法打开或完成，通过该 SDK 获得的广告奖励将不再发放。
