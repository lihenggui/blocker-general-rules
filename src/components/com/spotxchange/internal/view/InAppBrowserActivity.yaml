  en:
    description: When a SpotX ad opens a web destination, the SpotX advertising SDK displays its URL in
      an in-app browser.
    disableEffect: SpotX ad destinations will not open in the app; the app's non-ad features remain available.
  zh-CN:
    description: SpotX 广告打开网页目标时，SpotX 广告 SDK 会在应用内浏览器中显示该网页。
    disableEffect: 停用后，SpotX 广告网页将无法在应用内打开，但应用的非广告功能仍可使用。
