  en:
    description: Samsung IAP, included in NHN Cloud and GamePub's Android SDKs, shows a message if Galaxy
      Store is missing, disabled, or out of date when the app tries to use Samsung in-app purchases.
    disableEffect: Users may be unable to fix a missing or outdated Galaxy Store before buying through
      Samsung IAP.
  zh-CN:
    description: NHN Cloud 和 GamePub 的 Android SDK 中包含 Samsung IAP；应用尝试使用 Samsung 内购时，如果 Galaxy Store
      未安装、已停用或版本过旧，它会显示提示。
    disableEffect: 禁用后，用户可能无法根据提示修复缺失或过期的 Galaxy Store，也就无法通过 Samsung IAP 购买。
