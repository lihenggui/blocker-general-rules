i18n:
  en:
    description: The Drifter Unity integration by Teogor opens this Activity when the app opens its Unity-based
      live wallpaper. It displays the Unity scene and passes screen and input changes through so the scene
      can keep running.
    disableEffect: Disabling it prevents the app live wallpaper from opening or responding to input.
  zh-CN:
    description: Teogor 的 Drifter Unity 集成会在应用打开基于 Unity 的动态壁纸时启动此 Activity。它会显示 Unity 场景并传递屏幕和输入变化，让场景继续运行。
    disableEffect: 停用后，应用的动态壁纸将无法打开或响应输入。
