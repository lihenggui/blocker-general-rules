    description: When an authorized external app requests a VPN connection through NetEase iTVPN, this
      entry starts the saved profile named in that request.
    disableEffect: External apps can no longer start a saved VPN profile through this shortcut; the host
      app can still start it directly.
  zh-CN:
    description: 获准的外部应用通过网易 iTVPN 请求连接 VPN 时，此入口会启动请求中指定的已保存配置。
    disableEffect: 外部应用将无法通过此快捷入口启动 VPN 配置，但宿主应用仍可直接启动连接。
