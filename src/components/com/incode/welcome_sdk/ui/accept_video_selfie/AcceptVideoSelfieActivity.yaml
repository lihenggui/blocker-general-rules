i18n:
  en:
    description: When a configured verification flow requires a video selfie, this screen explains the
      recording step and asks the user to accept it before recording begins. The MetaMap identity verification
      SDK opens this screen when the configured flow reaches this step.
    disableEffect: Disabling it prevents users from accepting the video-selfie step when the flow requires
      one.
  zh-CN:
    description: 核验流程要求录制视频自拍时，此页面会说明录制步骤，并在开始前征求用户同意。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法在流程要求时同意视频自拍步骤。
