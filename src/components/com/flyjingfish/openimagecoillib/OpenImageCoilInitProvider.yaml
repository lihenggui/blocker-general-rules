i18n:
  en:
    description: FlyJingFish OpenImage runs this provider at app startup to configure image loading and
      media saving for its image viewer. It selects the viewer's large-image and download support based
      on the image library available in the app.
    disableEffect: Large images or media downloads in the OpenImage viewer may fail.
  zh-CN:
    description: FlyJingFish OpenImage 会在应用启动时通过此 Provider 配置图片查看器的加载和媒体保存功能，并根据应用中可用的图片库选择相应支持。
    disableEffect: 禁用后，OpenImage 查看器中的大图加载或媒体下载可能无法使用。
