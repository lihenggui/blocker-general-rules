    description: When PhotoPicker+ starts a media selection, this Activity offers sources such as the
      camera roll, connected photo services, and camera capture. It opens the chosen source and returns
      the selected media.
    disableEffect: Users cannot choose a media source or return photos and videos through PhotoPicker+.
  zh-CN:
    description: PhotoPicker+ 开始选择媒体时，此 Activity 会提供相机胶卷、已连接的照片服务和拍摄照片等来源，并将选中的媒体返回应用。
    disableEffect: 用户无法通过 PhotoPicker+ 选择媒体来源，也无法将照片或视频返回应用。
