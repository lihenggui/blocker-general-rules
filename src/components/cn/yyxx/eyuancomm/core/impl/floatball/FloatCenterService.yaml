i18n:
  en:
    description: The Eyuan (YYXXGame) game communication SDK binds this Service to display a floating
      menu on the game screen; its configured entries open the member center, game-service links, recharge
      and invitation pages, or account switching.
    disableEffect: Disabling it removes those floating entries, including the member and recharge links,
      from the game screen.
  zh-CN:
    description: 易元（YYXXGame）游戏通信 SDK 绑定此 Service，在游戏画面上显示悬浮菜单；菜单中的配置入口可打开会员中心、游戏服务链接、充值和邀请页面，或切换账号。
    disableEffect: 停用后，游戏画面上的悬浮菜单及其会员、充值等入口会消失。
