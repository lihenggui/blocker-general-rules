i18n:
  en:
    description: When an app asks Radius Networks’ iBeacon library to watch for or range nearby iBeacons,
      this service runs Bluetooth scans and tracks matching regions.
    disableEffect: The app loses the iBeacon detection and region updates provided by this library.
  zh-CN:
    description: 应用请求 Radius Networks 的 iBeacon 库监测附近信标或测距时，此服务会执行蓝牙扫描并跟踪匹配区域。
    disableEffect: 应用将无法使用此库检测 iBeacon 或接收区域更新。
