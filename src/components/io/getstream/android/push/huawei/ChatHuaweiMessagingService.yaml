i18n:
  en:
    description: Stream's Huawei push service for its Chat and Video push integrations. It receives Huawei
      push messages and refreshed registration tokens and forwards them to Stream.
    disableEffect: Disabling it stops Stream notifications and token updates delivered through Huawei
      Push Kit.
  zh-CN:
    description: 这是 Stream Chat 和 Stream Video 推送集成使用的华为推送服务。它接收华为推送消息和更新后的注册令牌，并将它们交给 Stream 处理。
    disableEffect: 停用后，通过华为推送服务发送的 Stream 通知和令牌更新将停止。
