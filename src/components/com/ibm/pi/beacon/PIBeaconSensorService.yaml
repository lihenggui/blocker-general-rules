i18n:
  en:
    description: The IBM Presence Insights beacon service starts when the app enables beacon sensing,
      scans for nearby Bluetooth beacons, and reports sightings to the configured Presence Insights service.
      It also sends region-entry and region-exit updates to the app.
    disableEffect: Nearby-beacon reporting and any app behavior tied to beacon regions will stop.
  zh-CN:
    description: 应用启用信标感知时，IBM Presence Insights 后台服务会扫描附近的蓝牙信标，并将发现结果发送到已配置的 Presence Insights 服务；它也会把进入或离开信标区域的事件通知应用。
    disableEffect: 附近信标的采集与上报会停止，依赖信标区域变化的应用功能也会失效。
