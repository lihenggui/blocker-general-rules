  en:
    description: When 233 MPG installs a downloaded game update on Android 7 or newer, this Provider creates
      an app-scoped file link so Android's package installer can read the APK.
    disableEffect: The installer cannot access the downloaded APK through this SDK, so game updates cannot
      be installed through this path.
  zh-CN:
    description: 在 Android 7 及更高版本上安装 233 MPG 下载的游戏更新时，此 Provider 会创建应用专属的文件链接，让 Android 安装程序读取 APK。
    disableEffect: 安装程序将无法通过此 SDK 读取下载的 APK，因此无法使用这条路径安装游戏更新。
