i18n:
  en:
    description: AWS Authentication UI opens this Activity when the app requests sign-in; it displays
      the configured identity-provider choices and returns the provider's success, cancellation, or error
      result.
    disableEffect: Apps using AWS Authentication UI will not be able to sign in through its screen.
  zh-CN:
    description: 应用请求登录时，AWS Authentication UI 会打开此界面，显示已配置的身份提供方选项，并返回登录成功、取消或错误结果。
    disableEffect: 使用 AWS Authentication UI 的应用将无法通过其登录界面登录。
