i18n:
  en:
    description: The Empatica Link Bluetooth component bundled with SSJ connects to Empatica E3 and E4
      wristbands. When the app searches for a band, it discovers nearby devices, subscribes to their readings,
      and forwards sensor data to the app.
    disableEffect: Empatica wristband discovery, connection, and sensor data will stop.
  zh-CN:
    description: 随 SSJ 打包的 Empatica Link 蓝牙组件用于连接 Empatica E3 和 E4 腕带。应用搜索腕带时，它会发现附近设备、订阅设备数据并将传感器读数传给应用。
    disableEffect: 应用将无法发现或连接 Empatica 腕带，也无法接收其传感器数据。
