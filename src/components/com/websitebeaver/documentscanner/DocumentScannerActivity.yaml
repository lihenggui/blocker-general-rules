i18n:
  en:
    description: WebsiteBeaver Document Scanner opens this camera-based document capture screen when an
      app starts a scan. It detects page edges, lets the user adjust the crop, and returns the scanned
      page images.
    disableEffect: The app's document scan screen and its cropped image results will be unavailable.
  zh-CN:
    description: 应用开始扫描时，WebsiteBeaver Document Scanner 会打开此相机文档采集界面。它会识别页面边缘，供用户调整裁剪范围，并返回扫描后的页面图像。
    disableEffect: 应用将无法打开文档扫描界面或取得裁剪后的图像。
