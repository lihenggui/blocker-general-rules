i18n:
  en:
    description: wlwoon ContactPicker opens this screen when an app asks the user to choose contacts.
      It reads and sorts the contact list, supports single or multiple selection, and returns the chosen
      contacts to the app.
    disableEffect: Apps that use this picker can no longer choose and return contacts through its screen.
  zh-CN:
    description: 应用请求用户选择联系人时，wlwoon ContactPicker 会打开此页面。它读取并排序联系人列表，支持单选或多选，并将所选联系人返回应用。
    disableEffect: 使用此选择器的应用将无法通过此页面选择并返回联系人。
