recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:01:20Z'
i18n:
  en:
    description: Kaustubh Patange’s App Updater library runs this Provider when the app starts and checks
      whether it was signed by an approved publisher. If the signature is not on the library’s built-in
      list, the app is closed.
    disableEffect: Disabling it stops that signature check, so an app with an unlisted signing certificate
      will no longer be closed by the library.
  zh-CN:
    description: 应用启动时，Kaustubh Patange 的 App Updater 库会通过此 Provider 检查应用是否由许可发布者签名；如果签名不在库内置的名单中，应用就会被关闭。
    disableEffect: 停用后将不再进行此签名检查，签名未列入名单的应用也不会因此被库关闭。
