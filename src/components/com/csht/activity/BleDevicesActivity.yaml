i18n:
  en:
    description: The Zhongruan Gaoke ID-card reader SDK opens this page when the app asks the user to
      choose a Bluetooth reader. It scans for nearby low-energy Bluetooth card readers and lets the user
      connect to one.
    disableEffect: Users cannot find or connect to a Bluetooth card reader through this page, so Bluetooth-based
      card reading may stop working.
  zh-CN:
    description: 应用需要用户选择蓝牙读卡器时，中软高科身份证阅读 SDK 会打开此页面。它搜索附近的低功耗蓝牙读卡器，并允许用户连接其中一台。
    disableEffect: 用户将无法通过此页面查找或连接蓝牙读卡器，依赖蓝牙的读卡功能可能无法使用。
