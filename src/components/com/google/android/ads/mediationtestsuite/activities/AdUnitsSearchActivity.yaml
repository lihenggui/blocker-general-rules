recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:15:26Z'
i18n:
  en:
    description: Google Mobile Ads Mediation Test Suite opens this screen when a developer searches its
      configured ad units. It filters the list as the query changes and opens the selected unit's detail
      page.
    disableEffect: Developers lose search access to the test suite's configured ad units; regular ad delivery
      is unaffected.
  zh-CN:
    description: 开发者搜索 Google Mobile Ads 中介测试套件中的已配置广告单元时，会打开此页面。页面会随搜索内容筛选列表，并可打开所选单元的详情。
    disableEffect: 开发者将无法搜索测试套件中已配置的广告单元；常规广告投放不受影响。
