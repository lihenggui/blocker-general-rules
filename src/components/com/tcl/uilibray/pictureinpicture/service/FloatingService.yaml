i18n:
  en:
    description: When TCL VHall live video is moved out of its room page, this service places the live
      player in a movable floating window. Tapping the window returns to the live room.
    disableEffect: Live video will not continue in a floating window after leaving the room page; watching
      inside the room still works.
  zh-CN:
    description: 当用户把 TCL 版 VHall 直播画面移出直播间页面时，此 Service 会将播放器放入可移动的悬浮窗。点击悬浮窗可返回直播间。
    disableEffect: 停用后，离开直播间页面时直播不会继续显示在悬浮窗中；在直播间内观看仍可使用。
