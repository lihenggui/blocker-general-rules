  en:
    description: During a connected RevTwo support call, this screen displays frames from the shared phone
      screen. It provides controls to stop sharing, change call audio, or end the call.
    disableEffect: The support agent will not be able to view the phone screen through RevTwo screen sharing,
      and its call controls may be unavailable.
  zh-CN:
    description: RevTwo 支持通话接通期间，此界面显示共享的手机屏幕画面，并提供停止共享、切换通话音频或结束通话的控制。
    disableEffect: 支持人员将无法通过 RevTwo 屏幕共享查看手机画面，相关通话控制也可能无法使用。
