      call plans, records, and tasks.
    disableEffect: The app’s Sobot support-calling workspace and its call-management options will be unavailable.
  zh-CN:
    description: 宿主应用打开 Sobot 客服呼叫功能时，此页面会按配置的呼叫模式显示坐席工作台。坐席可在这里登录、切换状态、拨打电话以及查看计划、记录和任务。
    disableEffect: 应用中的 Sobot 客服呼叫工作台及其通话管理功能将无法使用。
