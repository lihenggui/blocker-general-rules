recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:58:41Z'
i18n:
  en:
    description: The Jinxiyang RequestPermission library opens this transparent screen when an app asks
      for several groups of runtime permissions. It requests each group, collects the grant results, and
      returns them to the caller.
    disableEffect: This permission flow will not show its prompts or return their results, so app features
      that need those permissions can fail.
  zh-CN:
    description: Jinxiyang RequestPermission 库在应用请求多组运行时权限时打开此透明界面。它会逐组请求权限、收集授权结果并返回给调用方。
    disableEffect: 停用后，此流程无法显示权限请求或返回结果，依赖这些权限的应用功能可能无法使用。
