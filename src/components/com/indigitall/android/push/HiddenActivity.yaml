recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:45:59Z'
i18n:
  en:
    description: When a user opens an indigitall push notification, this Activity records the open and
      follows its destination, returning to the app if that destination cannot be opened.
    disableEffect: Opening indigitall push notifications may no longer navigate to their destination;
      normal app screens remain available.
  zh-CN:
    description: 用户打开 indigitall 推送通知时，此 Activity 会记录打开操作并跳转到通知目标；若目标无法打开，则返回应用。
    disableEffect: 打开 indigitall 推送通知后可能无法跳转到目标页面；应用的普通页面仍可使用。
