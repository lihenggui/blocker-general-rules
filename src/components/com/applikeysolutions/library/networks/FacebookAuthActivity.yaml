  en:
    description: AppliKey SocialManager opens this screen when Facebook is selected for sign-in. It completes
      Facebook authorization, retrieves profile details, and returns the result to the app.
    disableEffect: Facebook sign-in through this library can no longer complete, so an account flow that
      depends on it will fail.
  zh-CN:
    description: AppliKey SocialManager 在用户选择 Facebook 登录时打开此页面，完成 Facebook 授权、读取个人资料并将结果返回应用。
    disableEffect: 该库将无法完成 Facebook 登录，依赖此方式的账号流程也会失败。
