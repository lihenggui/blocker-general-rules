i18n:
  en:
    description: Teliver's trip-tracking SDK starts this service for active trips. It receives device-location
      updates, sends trip positions for live tracking, and displays an ongoing location notification.
    disableEffect: Active Teliver trips will stop sending live positions, so related trip-progress screens
      may no longer update.
  zh-CN:
    description: Teliver 行程跟踪 SDK 会为进行中的行程启动此服务。它接收设备位置更新、发送行程位置以供实时跟踪，并显示持续的定位通知。
    disableEffect: 停用后，Teliver 行程将停止发送实时位置，相关的行程进度页面可能无法更新。
