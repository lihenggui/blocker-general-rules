i18n:
  en:
    description: The DHSZ ad SDK uses this provider to give Android temporary access to a downloaded APK
      when opening it in the installer.
    disableEffect: The installer may be unable to read a downloaded APK, so app downloads offered by ads
      can fail to install.
  zh-CN:
    description: DHSZ 广告 SDK 将下载的 APK 交给安装程序时，会通过此提供程序临时开放文件读取权限。
    disableEffect: 安装程序可能无法读取下载的 APK，广告提供的应用将无法安装。
