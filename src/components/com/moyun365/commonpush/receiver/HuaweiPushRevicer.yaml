    description: CommonPush (Moyun365) handles Huawei push registration, messages, connection status and
      notification taps. It saves the Huawei registration token and sends event details to the library's
      registered app callbacks.
    disableEffect: Huawei push registration, messages and notification-tap events will no longer reach
      CommonPush.
