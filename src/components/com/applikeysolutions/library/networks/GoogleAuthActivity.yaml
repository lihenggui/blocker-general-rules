  en:
    description: AppliKey SocialManager opens this screen when Google is selected for sign-in. It runs
      Google Sign-In and returns the selected account result to the app.
    disableEffect: Google sign-in through this library can no longer complete, so an account flow that
      depends on it will fail.
  zh-CN:
    description: AppliKey SocialManager 在用户选择 Google 登录时打开此页面，执行 Google 登录并将所选账号结果返回应用。
    disableEffect: 该库将无法完成 Google 登录，依赖此方式的账号流程也会失败。
