i18n:
  en:
    description: When a PACE page asks to open a link, the PACE Cloud SDK opens it in an in-app web page
      or a Chrome custom tab and passes the return result back to the original page.
    disableEffect: PACE page links that leave the app and need to return to the original page will not
      complete.
  zh-CN:
    description: PACE 页面要求打开链接时，PACE Cloud SDK 会在应用内网页或 Chrome 自定义标签页中打开，并将返回结果交还原页面。
    disableEffect: 禁用后，从 PACE 页面跳出并需要返回原页面的链接流程将无法完成。
