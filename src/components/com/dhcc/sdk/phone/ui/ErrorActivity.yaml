i18n:
  en:
    description: DHCC’s crash handler opens this Activity after an app crash; it shows an error screen,
      sends crash details and lets the user restart or close the app.
    disableEffect: The SDK’s crash-report and restart screen will be unavailable, which can leave the
      app closed after a crash.
  zh-CN:
    description: DHCC 崩溃处理器会在应用崩溃后打开此 Activity；它显示错误页面、发送崩溃信息，并允许用户重启或关闭应用。
    disableEffect: SDK 的崩溃上报和重启页面将无法使用，应用崩溃后可能只能关闭。
