i18n:
  en:
    description: Amazon Publisher Services' mobile advertising SDK opens this Activity to show a full-screen
      interstitial ad with its ad content and close control.
    disableEffect: Amazon Publisher Services interstitial ads will not appear; the app's other features
      remain available.
  zh-CN:
    description: Amazon Publisher Services（Amazon）的移动广告 SDK 会在展示插屏广告时打开此界面，铺开广告内容并显示关闭控件。
    disableEffect: Amazon Publisher Services 的插屏广告将不再显示；应用其他功能仍可使用。
