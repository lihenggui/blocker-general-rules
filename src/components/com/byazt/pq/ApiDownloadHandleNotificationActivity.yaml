  en:
    description: When Pangle needs to show a download notification, this Activity requests Android's notification
      permission on newer versions or passes a notification action to the download handler.
    disableEffect: Pangle may be unable to request permission for download notifications or handle taps
      on them.
  zh-CN:
    description: Pangle 需要显示下载通知时，此 Activity 会在较新 Android 版本上请求通知权限，或把通知操作交给下载处理程序。
    disableEffect: Pangle 可能无法请求下载通知权限，也无法处理用户对通知的点击。
