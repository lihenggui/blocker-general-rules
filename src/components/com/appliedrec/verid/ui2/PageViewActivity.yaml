i18n:
  en:
    description: Applied Recognition's Ver-ID 2 UI registers this Activity for swipeable guidance pages
      such as face-capture tips. It has no separate content and is not opened directly by the SDK.
    disableEffect: The SDK's face-session and visible tips screens are separate Activities, so this entry
      can be disabled without removing those screens.
  zh-CN:
    description: Applied Recognition 的 Ver-ID 2 界面会注册此 Activity 来承载可滑动的指引页面，例如人脸采集提示。它没有独立内容，SDK 不会直接打开它。
    disableEffect: 人脸核验和实际显示的提示页由其他 Activity 提供，停用此项不会移除那些页面。
