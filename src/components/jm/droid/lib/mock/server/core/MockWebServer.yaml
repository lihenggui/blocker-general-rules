i18n:
  en:
    description: Mock API Server (Jiang Junmin) runs a local mock-response server after its startup Provider
      connects to it. It loads configured test data when starting and stops the server when the service
      ends.
    disableEffect: App requests configured to use this local mock server may fail or lose their mock responses.
  zh-CN:
    description: Mock API Server（Jiang Junmin）会在启动 Provider 连接后运行本地模拟响应服务器。启动时会载入设置的测试数据，Service 结束时则停止服务器。
    disableEffect: 设置为使用此本地模拟服务器的应用请求可能失败或无法取得模拟响应。
