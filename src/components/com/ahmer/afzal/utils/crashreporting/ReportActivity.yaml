lastUpdateTime: '2026-10-28T18:42:08Z'
i18n:
  en:
    description: AhmerUtils (Ahmer Afzal) opens this activity after an uncaught app error to prepare a
      crash report with the error, app and device details, and available logs or screenshot. It then opens
      the system chooser to send the report by email.
    disableEffect: The app’s built-in crash-report email flow will not be available.
  zh-CN:
    description: AhmerUtils（Ahmer Afzal）会在应用发生未捕获错误后打开此 Activity，整理错误、应用和设备信息以及可用的日志或截图，再打开系统选择器通过邮件发送报告。
    disableEffect: 应用内置的崩溃报告邮件流程将无法使用。
