i18n:
  en:
    description: The NetEase Yunxin (CommsEase) common UI SDK opens this portrait screen when a photo
      needs to be selected or cropped. The user can adjust the crop and save the resulting image for the
      app to use.
    disableEffect: Photo flows that require Yunxin cropping will not return a cropped image, so uploads
      that depend on that result can fail.
  zh-CN:
    description: NetEase Yunxin（CommsEase）通用 UI SDK 会在需要选择或裁剪照片时打开此竖屏界面。用户可以调整裁剪范围并保存图片，供应用后续使用。
    disableEffect: 停用后，依赖 Yunxin 裁剪的照片流程无法获得裁剪结果，依赖该结果的上传可能失败。
