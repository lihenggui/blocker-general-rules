i18n:
  en:
    description: This component is part of the StreetHawk mobile engagement SDK. On newer Android versions,
      StreetHawk starts this Service to scan for nearby Bluetooth beacons. It parses detected beacon signals
      and sends matching proximity reports to StreetHawk.
    disableEffect: StreetHawk beacon detection and proximity campaigns will stop on devices using this
      scanner.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。在较新的 Android 版本上，StreetHawk 会启动此服务扫描附近的蓝牙信标。它会解析检测到的信号，并向 StreetHawk
      发送匹配的邻近报告。
    disableEffect: 使用此扫描器的设备将停止 StreetHawk 信标检测和邻近活动。
