i18n:
  en:
    description: Scanzy Barcode Scanner opens this screen when an app requests a barcode scan with the
      newer camera picker. It starts the camera scanner and returns the decoded barcode text and type.
    disableEffect: Disabling it prevents Scanzy barcode requests using this camera picker from completing.
  zh-CN:
    description: 应用通过新版相机选择器请求扫描条码时，Scanzy Barcode Scanner 会打开此页面。它启动相机扫描，并返回解码后的条码文本和类型。
    disableEffect: 禁用后，使用此相机选择器的 Scanzy 条码扫描请求无法完成。
