i18n:
  en:
    description: Android starts this background service for scheduled video-upload work in older MetaMap
      flows; it sends recorded verification videos to MetaMap.
    disableEffect: Disabling it prevents required video evidence from uploading, so a video-based verification
      cannot finish.
  zh-CN:
    description: 旧版 MetaMap 核验流程安排视频上传后，Android 会在后台启动此服务，将录制的核验视频发送给 MetaMap。
    disableEffect: 停用后，所需的视频材料无法上传，依赖视频的身份核验无法完成。
