i18n:
  en:
    description: When a Webex Connect notification action opens a web destination, this Activity displays
      the page in an embedded browser. It loads the destination URL from the incoming request.
    disableEffect: Webex Connect notification links that open in this browser will stop working; other
      app pages remain available.
  zh-CN:
    description: Webex Connect 通知操作打开网页目标时，此 Activity 会在内置浏览器中显示页面，并从请求中读取目标网址。
    disableEffect: 通过此浏览器打开的 Webex Connect 通知链接将无法使用，但应用的其他页面仍可打开。
