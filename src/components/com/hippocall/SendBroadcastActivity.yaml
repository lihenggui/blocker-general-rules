i18n:
  en:
    description: During a Hippo Calling (Jungle Works) call, this silent listener watches for Jitsi conference-ended
      or participant-left events and notifies Hippo's ongoing-call service. It does not display a call
      screen.
    disableEffect: No user-visible effect is expected; Hippo still registers its call-end listener during
      call setup.
  zh-CN:
    description: Hippo Calling（Jungle Works）通话期间，这个静默监听器会关注 Jitsi 会议结束或参与者离开的事件，并通知 Hippo 的通话服务。它不显示通话界面。
    disableEffect: 停用后预计不会产生用户可见的影响；Hippo 仍会在通话设置期间注册通话结束监听。
