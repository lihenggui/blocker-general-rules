i18n:
  en:
    description: Gimbal location tracking starts this background service to initialize nearby-place and
      beacon monitoring for location events.
    disableEffect: Nearby-place and beacon events stop being processed, which can break location-triggered
      features that rely on Gimbal.
  zh-CN:
    description: Gimbal 定位功能会启动此后台服务，初始化附近地点和信标监测，以处理位置事件。
    disableEffect: 停用后，附近地点和信标事件将无法处理，依赖 Gimbal 的位置触发功能可能受影响。
