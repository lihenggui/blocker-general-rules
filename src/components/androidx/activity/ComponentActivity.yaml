recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: AndroidX Activity provides a basic app screen for showing content and remembering its
      state as the app pauses or restarts. It also handles the system Back button and requests that open
      other screens; the analyzed manifests give it no launch entry, so an app or test must start it directly.
    disableEffect: Tests or app actions that directly open this basic screen will no longer be able to
      use it.
  zh-CN:
    description: AndroidX Activity 提供可显示内容的基础应用界面，并在应用暂停或重新启动时保存和恢复界面状态。它还处理系统返回操作以及打开其他界面后返回的结果；分析到的清单没有为它配置启动入口，因此只有应用或测试直接启动时才会打开。
    disableEffect: 直接打开此基础界面的测试或应用操作将无法再使用它。
