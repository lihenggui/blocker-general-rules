i18n:
  en:
    description: This AndroidX Room service keeps data up to date when different parts of the app use
      the same database. When one part changes a table, it notifies the others so they can refresh.
    disableEffect: A change made in one part of the app may not appear in another until it reloads, leaving
      information out of date.
  zh-CN:
    description: 当应用的不同部分使用同一个数据库时，这个 AndroidX Room 服务会帮助它们保持数据同步。一处修改数据后，它会通知其他部分刷新。
    disableEffect: 应用一处所做的修改可能不会及时显示在其他部分，信息可能暂时过期。
