  en:
    description: When Huawei Mobile Services delivers an AppMetrica push message or refreshes the app’s
      token, this Service passes the update to AppMetrica Push.
    disableEffect: AppMetrica pushes and token updates delivered through Huawei Mobile Services will not
      be processed.
  zh-CN:
    description: Huawei Mobile Services 送达 AppMetrica 推送或更新应用令牌时，此 Service 会将消息或令牌交给 AppMetrica Push 处理。
    disableEffect: 禁用后，通过 Huawei Mobile Services 送达的 AppMetrica 推送和令牌更新将无法处理。
