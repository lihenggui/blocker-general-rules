    description: When an Android-Job alarm for a scheduled task fires, this receiver directs the due background
      task to the appropriate service, including exact-time jobs.
    disableEffect: Background tasks delivered by the alarm fallback may not run.
  zh-CN:
    description: Android-Job 为已安排的任务设置的闹钟触发时，此接收器会将到期任务交给相应服务处理，包括定时任务。
    disableEffect: 停用后，通过闹钟备用方式触发的后台任务可能无法运行。
