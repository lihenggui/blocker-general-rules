    description: ZHRecorder opens this camera screen when the app starts a video-recording session. Users
      can record multiple clips, switch cameras, adjust the beauty filter, remove a segment, and preview
      the merged video.
    disableEffect: The app will lose ZHRecorder’s in-app video-recording flow and camera controls.
  zh-CN:
    description: 应用开始视频录制时，ZHRecorder 会打开此相机界面。用户可以录制多个片段、切换摄像头、调整美颜滤镜、删除片段并预览合成视频。
    disableEffect: 应用将无法使用 ZHRecorder 的视频录制流程和相机控制。
