i18n:
  en:
    description: DingTalk OpenAuth opens an in-app sign-in page when the app requests account authorization.
      After the user signs in, it returns the authorization response through the app's requested redirect.
    disableEffect: DingTalk sign-in and account authorization flows that use this page will not complete.
  zh-CN:
    description: 钉钉 OpenAuth 会在应用发起账号授权时打开内置登录页面。用户登录后，它会通过应用指定的回跳地址返回授权结果。
    disableEffect: 停用后，使用此页面的钉钉登录和账号授权流程无法完成。
