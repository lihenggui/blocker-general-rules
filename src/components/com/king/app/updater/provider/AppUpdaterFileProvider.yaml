i18n:
  en:
    description: Jenly AppUpdater uses this provider after an update APK has been downloaded so Android's
      installer can read the file. It shares the update file through a temporary content link.
    disableEffect: The updater cannot hand its downloaded APK to Android's installer, so the update installation
      flow can fail.
  zh-CN:
    description: Jenly AppUpdater 会在下载更新 APK 后通过此文件提供方让 Android 安装程序读取文件，并为安装提供临时内容链接。
    disableEffect: 更新程序无法将下载的 APK 交给 Android 安装程序，因此更新安装流程可能失败。
