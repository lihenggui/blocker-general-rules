    disableEffect: AR scenes assigned to this helper process will not run, including their recording and
      sharing controls.
  zh-CN:
    description: Rokid Tatooine Lite SDK 会在独立的辅助进程中运行基于相机的 AR 场景。场景可提供录制和分享控件。
    disableEffect: 分配到此辅助进程的 AR 场景将无法运行，录制和分享控件也无法使用。
