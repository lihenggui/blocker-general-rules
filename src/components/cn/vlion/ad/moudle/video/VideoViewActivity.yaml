recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: VLion starts this screen when it has a video ad to display. It plays the ad, reports
      playback and click events, and opens the ad's landing page or end card when clicked or finished.
    disableEffect: VLion video ads and their click-through pages will not display; the host app's ordinary
      features remain available.
  zh-CN:
    description: VLion 有视频广告需要展示时会打开此界面。它播放广告、报告播放和点击事件，并在用户点击或视频结束时打开广告落地页或结束页。
    disableEffect: VLion 视频广告及其点击后的页面将不再显示，但宿主应用的日常功能仍可使用。
