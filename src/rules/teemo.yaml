  en:
    name: Teemo
    description: "## Primary Location\nFrance (Paris) [Crunchbase, 01](https://www.crunchbase.com/organization/databerries)\n\
      ## Website\n[https://www.teemo.co](https://www.teemo.co)\n## About\nTeemo claims to run the \"World's\
      \ first and biggest persistent geolocation targeting database\".  They provide \"solutions\" for\
      \ \"retail advertisers\" and \"app publishers\". [Teemo, 01](http://teemo.co). \n## Ownership\n\
      Teemo\n## Documentation\nhttps://teemo.co/sdkguidelines/\n## Products and Services\n_Retail Advertisers\
      \ - Real Life Targeting:_ \"We target your prospects based on the places they attend in real life\
      \ with the geolocation of millions smartphones continuously.\"  \n  * Exclusive Teemo Data  \n \
      \ * SDK accurate collection  \n  * 10 to 15 meters accuracy  \n  * 100k+ points of Interest redefined\
      \  \n  * 1,170 billion + geolocation data points  \n  * World's Biggest Real Life Targeting DMP\
      \  \nOffline measurement & insight:  \nTeemo measures the exact number of people who visit your\
      \ point of sale and give you insights on their habits.  \n  * 7-day attribution  \n  * Exhaustive\
      \ data  \n  * Provenance of your customers  \n  * Customer loyalty index  \n_App Publishers - We\
      \ Monetize Your Geolocation Data:_ \"Our SDK:  \n  * Anonymous collection of IDFA and GAID  \n \
      \ * Data collection only  \n  * Only 25 KB  \n### Methods\nTeemo utilizes geolocation collection\
      \ through the Databerries (Teemo) SDK.\n## Privacy Policy\nTeemo states that even without a device\
      \ identifier, such as Apple's IDFA, they can still identify users: \"without the IDFA, and only\
      \ with the address and the place of work of a person, to find any French would take 5 seconds to\
      \ a team of 20 people\", is it added in the article\" (French-English translation; see [L'Expansion,\
      \ 01](https://lexpansion.lexpress.fr/high-tech/teemo-la-start-up-qui-traque-10-millions-de-francais-en-continu_1937638.html)).\
      \  \n\"The Databerries / Teemo SDK collects location information, for example precise location using\
      \ GPS, wireless networks, cell towers, and Wi-Fi access points. You must ensure that all applications\
      \ that use the Databerries / Teemo SDK comply with all of the Google Play's developer requirements\
      \ and Apple's App Store requirements (collectively, the **'Requirements'**) including obtaining\
      \ appropriate consent to the collection of location information... Each application that uses the\
      \ Databerries / Teemo SDK must (a) notify users of the application's use of location data for third-party\
      \ advertising purposes via a custom notification window, and (b) provide user of the application\
      \ the ability to consent or withhold consent through an 'Allow' / 'Don't Allow' option, 'Accept'\
      \ / 'Don't Accept' option, or similarly-worded option... Each application that uses the Databerries\
      \ / Teemo SDK must inform users of relevant data collection practices and choices available to them.\
      \ Users of such applications must consent to the collection of location and device information and\
      \ the sharing of such information with third parties such as Databerries / Teemo. Applications that\
      \ use the Databerries / Teemo SDK must be provided with an accurate, current and complete privacy\
      \ policy that:\na. is available prior to download (i.e. from all applicable app storefronts) and\
      \ from within the settings of the app;  \nb. is in compliance with all applicable laws and self-regulatory\
      \ principles;  \nc. clearly and truthfully describes what data is collected from the app, how such\
      \ data is used, and the circumstances under which it is disclosed;  \nd. discloses that location\
      \ information and other user information will be shared with third parties for advertising purposes;\
      \ and  \ne. explains to users how to opt out of the collection of information about their precise\
      \ location and how to opt out of the use of information about their app usage for interest-based\
      \ advertising purposes through the settings available on their Android or iOS device.\"  \nThe Databerries\
      \ / Teemo SDK may not be used in apps designed for use by children below the age of 13 (or the age\
      \ of consent where offered, if higher than 13) \"or be used to collect information from any user\
      \ known to be under the age of 13 or under the age of consent where they reside\". [Teemo, 03](https://teemo.co/sdkguidelines)\
      \  \n_Information Collected Automatically Through the Services:_\n\"In order to help advertisers\
      \ reach their audiences and understand the effect of their advertising, we automatically collect\
      \ certain information when you access mobile applications that incorporate the Services.  This information\
      \ does not identify you personally, but it does reflect information about the mobile applications\
      \ you use, your location, and how you interact with our Services.  This information includes:\n\
      \  * Location Information: When you use mobile apps that integrate the Services, we may collect\
      \ information about your precise location using various technologies, including GPS, wireless networks,\
      \ cell towers, Wi-Fi access points, and other sensors, such as gyroscopes, accelerometers, compasses,\
      \ and barometers. For information about how to opt out of the collection of certain location information,\
      \ please see 'Your Choices' below.   \n  * Device Information: We collect information about your\
      \ mobile device, including the advertising identifiers assigned to your device, IP address, device\
      \ type, operating system, and mobile carrier.   \n  * Usage Data: We collect information about the\
      \ mobile apps you use that integrate our Services, including the date and time your device accesses\
      \ such apps.\"   \n_Information Teemo Collects from Other Sources:_\nTeemo \"may also obtain information\
      \ from other sources and combine that with information we collect through our Services.  For example,\
      \ we may collect information about you from third parties, including our business partners, other\
      \ advertising companies, and publicly available sources.\"\n_Sharing of Information:_\nTeemo \"\
      may share the information we collect as follows or as otherwise described in this Privacy Policy:\
      \  \n  * With vendors, consultants and other service providers who need access to such information\
      \ to carry out work or perform services on our behalf;  \n  * In response to a request for information\
      \ if we believe disclosure is in accordance with, or required by, any applicable law, rule, regulation\
      \ or legal process;  \n  * If we believe your actions are inconsistent with our user agreements\
      \ or policies, or to protect the rights, property or safety of Databerries or others;  \n  * In\
      \ connection with, or during negotiations of, any merger, sale of company assets, financing or acquisition\
      \ of all or a portion of our business by another company;  \n  * Between and among Databerries and\
      \ any current or future parent, subsidiary and/or affiliated company; and  \n  * With your consent\
      \ or at your direction.\"  \nTeemo \"may also share aggregated or de-identified information, which\
      \ cannot reasonably be used to identify you.  For example, we may share de-identified information\
      \ with the partners that use our technology about the users of their apps.\"  \n_Your Choices:_\
      \  \n\"Location Tracking: You can stop the collection of precise location information by individual\
      \ apps or by your device as a whole changing the preferences in the settings of your mobile device.\
      \  \nOpting Out of Teemo Services: You can stop the collection of information from Teemo by opting\
      \ out of our service. You can opt-out from our service either from our ads or by asking us by contacting\
      \ us at privacy@teemo.co  \nOpting Out of Personalized Ads: You may opt out of the use of information\
      \ about your mobile app activities to serve ads that are targeted to your interests using the settings\
      \ available on your mobile device.  For information about how to opt out on your Android device,\
      \ click here.  For information about how to opt out on your iOS device, click [here](https://support.apple.com/en-us/HT202074).\
      \  If you wish to opt out on multiple devices, you must repeat the process on each device where\
      \ you wish to opt out\" [Teemo, 04](https://teemo.co/privacy)\"\n## Relationships\n_Customers:_\
      \ Volkswagon / MyMedia / Intersport / Havas / dentsu / OMD / WPP / Publics Groupe / Carrefour /\
      \ Toys\"R\"Us / McDonald's / Ford / Decathlon / FNAC / Leclerc [Teemo, 01](http://teemo.co)\n##\
      \ Details\n_Financial details:_ Teemo (then Databerries) \"raised $16m (?15m) in a Series A funding\
      \ round led by new investor Index Ventures with support from existing investors ISAI and Mosaic\
      \ Ventures and new individual investors Greg Coleman and Pascal Gauthier. The company will use the\
      \ funds to launch its product in the US and double its workforce.\" [Go4Venture, 01](http://go4venture.com/hti/usd-16m-a-mar-2017-databerries)\
      \  \n_Background and history:_ Formerly known as Databerries, Teemo \"reinvents offline marketing.\
      \ Its mobile marketing solution combines user offline behavior understanding and algorithms to drive\
      \ in-store sales. Its performance-based marketing solution delivers relevant, personalized ads that\
      \ generate in-store sales it can measure. Co-founded in 2014 by Guillaume Charhon, François Wyss\
      \ and Benoit Grouchko, Teemo has 50 employees in Paris and New-York.\" [Teemo, 02](https://teemo.co/about)\
      \   \n\"Founded in 2014, Databerries offers brick and mortar retailers a mobile marketing solution,\
      \ refferred to as Real Life Targeting, that targets mobile users based on locations they have visited\
      \ in the past and measures the impact of marketing campaigns on store visits. The solution allows\
      \ retailers to target users who have visited their stores and those of their competitors. The company’s\
      \ technology collects geolocation and navigation data from mobile users and targets them with relevant\
      \ and personalised ads. This allows retailers to generate store visits with a significantly lower\
      \ cost per physical visit (CPV). Databerries enables retailers to count the cost per visit and therefore\
      \ measure the impact of a campaign on point-of-sale traffic, offering retailers a solution that\
      \ works for offline marketing while combining online advertising standards such as accurate targeting,\
      \ personalisation, performance measurement and return on investment optimisation.\nHeadquartered\
      \ in Paris, Databerries employs 40 people and plans to double its workforce by the end of 2017.\
      \ Since its launch, the solution has generated more than one million in-store visits and supports\
      \ more than 20 prestigious advertisers on a daily basis. It serves more than 100 brick and mortar\
      \ retailers including Carrefour, Decathlon, FNAC, Leclerc, McDonald's (NYSE: MCD) and Volkswagen\
      \ (ETR: VOW3).\nAccording to the company, offline retailers spend more than $100bn (€93.9bn) on\
      \ advertising every year, relying largely on outdoor and other offline channels to increase store\
      \ visits with limited ability to track the performance of their advertising campaigns. According\
      \ to a report by MarketsandMarkets, the cross-platform and mobile advertising market is estimated\
      \ to grow from $25.2bn (€23.7bn) in 2015 to $80.5bn (€75.6bn) by 2020, at a CAGR of 26.1%.\" [Go4Venture,\
      \ 01](http://go4venture.com/hti/usd-16m-a-mar-2017-databerries)\n_Slogans:_ \n* \"Real-life Targeting,\
      \ Offline Measurement\" \n* \"Reinventing offline marketing\"\n_Devices:_ Android (Google Android\
      \ ID) and Apple (IDFA)\n## References\n* _Crunchbase, 01._ [https://www.crunchbase.com/organization/databerries](https://www.crunchbase.com/organization/databerries)\n\
      * _Teemo, 01._ [http://teemo.co](http://teemo.co)  \n* _Teemo, 02._ [https://teemo.co/about](https://teemo.co/about)\
      \ \n* _Teemo, 03._ [https://teemo.co/sdkguidelines](https://teemo.co/sdkguidelines)   \n* _Teemo,\
      \ 04._ [https://teemo.co/privacy](https://teemo.co/privacy)\n## External Links\n* _Go4Venture, 01:_\
      \ [http://go4venture.com/hti/usd-16m-a-mar-2017-databerries](http://go4venture.com/hti/usd-16m-a-mar-2017-databerries)\
      \  \n* _L'Expansion, 01:_ [https://lexpansion.lexpress.fr/high-tech/teemo-la-start-up-qui-traque-10-millions-de-francais-en-continu_1937638.html](https://lexpansion.lexpress.fr/high-tech/teemo-la-start-up-qui-traque-10-millions-de-francais-en-continu_1937638.html)"
