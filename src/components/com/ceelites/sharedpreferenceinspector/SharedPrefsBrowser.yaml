    description: Prasham Trivedi’s SharedPreferencesInspector opens this screen when the app explicitly
      starts its inspector; it lists the app’s stored settings files and lets the user browse a selected
      file.
    disableEffect: The in-app settings inspector becomes unavailable, while the app’s saved settings continue
      to work.
  zh-CN:
    description: Prasham Trivedi 的 SharedPreferencesInspector 在应用主动打开检查器时显示此界面；它列出应用保存的设置文件，并可打开其中一个查看。
    disableEffect: 应用内的设置检查器将无法使用，但已保存的应用设置仍可正常工作。
