    description: Activity used as a bridge to [SpaActivity] with package scheme for application usage.
      Since [SpaActivity] is not exported, [SpaActivity] could not be the target activity of <activity-alias>,
      otherwise all its pages will be exported. So need this bridge activity to sit in the middle of <activity-alias>
      and [SpaActivity].
