  en:
    description: The Nabla Compose Gallery Picker opens this Activity when an app asks the user to choose
      a photo. It displays the device gallery and returns the selected photo to the app.
    disableEffect: The app cannot let users choose gallery photos in flows that rely on this picker.
  zh-CN:
    description: 应用要求用户选择照片时，Nabla Compose Gallery Picker 会打开此 Activity。它显示设备相册，并将选中的照片返回应用。
    disableEffect: 依赖此选择器的流程将无法让用户从相册中选择照片。
