i18n:
  en:
    description: The ksrainarthas Utils file provider initializes the utility library automatically when
      Android starts the app and supplies shareable file links for app files. It runs as part of startup,
      before a screen is shown.
    disableEffect: Utility initialization and file-sharing flows that use this provider may fail.
  zh-CN:
    description: Android 启动应用时，ksrainarthas Utils 文件提供器会自动初始化工具库，并为应用文件提供可分享的链接。它会在显示界面前参与启动过程。
    disableEffect: 依赖此提供器的工具库初始化和文件分享功能可能会失败。
