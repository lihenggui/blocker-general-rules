i18n:
  en:
    description: The Sobot customer-service SDK starts this Service after a service-agent login to maintain
      and reconnect its live connection. It passes incoming visitor messages to the app and can show new-message
      notifications.
    disableEffect: The Sobot service console stops receiving live messages and related new-message notifications
      while this Service is disabled.
  zh-CN:
    description: 客服人员登录 Sobot 在线客服后会启动此 Service，以维持实时连接并在网络变化后重连；它会把收到的访客消息传给应用，也可显示新消息通知。
    disableEffect: 停用后，Sobot 客服控制台将无法接收实时消息和相关的新消息通知。
