    description: AMap Location SDK starts this service while the app is obtaining or maintaining a location
      fix. It runs the positioning engine and handles the foreground notification needed during location
      work.
    disableEffect: AMap-based location selection and sharing may stop working if this service is disabled.
  zh-CN:
    description: 高德地图定位 SDK 会在应用获取或持续更新位置时启动此服务。它运行定位引擎，并处理定位期间所需的前台通知。
    disableEffect: 停用后，应用中的高德地图选点和位置分享可能无法使用。
