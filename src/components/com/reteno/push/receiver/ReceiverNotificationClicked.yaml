i18n:
  en:
    description: When Reteno reports that a notification was clicked, this Receiver forwards the notification
      data to registered click-event listeners.
    disableEffect: App code listening for Reteno notification-click events no longer receives those callbacks.
  zh-CN:
    description: 当 Reteno 报告通知被点按时，此 Receiver 会把通知数据转发给已注册的点击事件监听器。
    disableEffect: 停用后，监听 Reteno 通知点击事件的应用代码将无法收到这些回调。
