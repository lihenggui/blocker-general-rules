    description: Sunshuntao’s Livery Android library opens this Activity for an app web page or web link;
      it loads the supplied address in an embedded browser and supports page navigation.
    disableEffect: Web pages that the app routes through Livery will no longer open inside the app.
  zh-CN:
    description: 应用打开网页或网页链接时，Sunshuntao 的 Livery 安卓库会启动此 Activity；它在内置浏览器中加载指定地址并支持网页跳转。
    disableEffect: 应用通过 Livery 打开的网页将无法在应用内显示。
