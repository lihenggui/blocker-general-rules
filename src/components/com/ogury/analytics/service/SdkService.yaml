i18n:
  en:
    description: Ogury (Presage) starts this Service for its background advertising and analytics work.
      It can also handle SDK work when the screen turns off.
    disableEffect: Disabling it stops or limits Ogury's background ad and analytics work; the host app's
      own screens and features remain available.
  zh-CN:
    description: Ogury（Presage）会启动此服务来处理广告和统计后台任务。屏幕熄灭时，它也可继续处理 SDK 任务。
    disableEffect: 禁用后，Ogury 的广告和统计后台任务会停止或受限；应用本身的界面和功能仍可使用。
