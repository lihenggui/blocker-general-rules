i18n:
  en:
    description: This ByteDance RheaTrace receiver listens for commands to start or stop a performance
      trace. It runs only when one of those tracing commands is sent.
    disableEffect: Those commands can no longer start or stop RheaTrace; the app’s normal features remain
      available.
  zh-CN:
    description: 这个字节跳动 RheaTrace 接收器会响应开始或停止性能跟踪的命令。只有发送这类跟踪命令时它才会运行。
    disableEffect: 禁用后，这些命令将无法启动或停止 RheaTrace，但应用的日常功能仍可使用。
