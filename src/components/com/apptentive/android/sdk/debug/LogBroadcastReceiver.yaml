i18n:
  en:
    description: When a user chooses a diagnostic log action from an Apptentive notification, this receiver
      sends the logs to an email app or stops log monitoring. It is part of the SDK's optional debugging
      tools.
    disableEffect: Apptentive diagnostic log sharing and its notification controls will stop working.
  zh-CN:
    description: 用户在 Apptentive 通知中选择诊断日志操作时，此接收器会将日志交给邮件应用，或停止日志监控；它属于 SDK 的可选调试工具。
    disableEffect: Apptentive 诊断日志分享及其通知控制将无法使用。
