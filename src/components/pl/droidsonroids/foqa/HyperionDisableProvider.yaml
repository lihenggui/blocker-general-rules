i18n:
  en:
    description: The Droids On Roids FoQA quality-assurance tools run this Provider when the app starts.
      In Firebase Test Lab it detects the test environment and disables Hyperion's startup tools; elsewhere
      it has no effect.
    disableEffect: In Firebase Test Lab, Hyperion may stay enabled; regular app features are unaffected.
  zh-CN:
    description: 应用启动时，Droids On Roids 的 FoQA 质量检查工具会运行此 Provider。它会检测 Firebase Test Lab 环境并关闭 Hyperion
      的启动工具；其他情况下不做处理。
    disableEffect: 在 Firebase Test Lab 中，Hyperion 可能会继续启用；应用的常规功能不受影响。
