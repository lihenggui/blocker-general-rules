  en:
    description: When a merchant app requests a MinkasuPay two-factor operation, the SDK opens this Activity
      for the authentication step and reports the result to the app. The flow can use device biometrics
      for payment authentication.
    disableEffect: Payment authentication through MinkasuPay will not complete, blocking payment flows
      that depend on it.
  zh-CN:
    description: 商户应用请求 MinkasuPay 双重验证操作时，SDK 会打开此 Activity 完成身份验证，并将结果返回应用。支付验证流程可以使用设备生物识别。
    disableEffect: MinkasuPay 支付身份验证将无法完成，依赖它的支付流程也会受阻。
