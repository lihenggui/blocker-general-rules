recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T14:59:21Z'
i18n:
  en:
    description: JPush uses this provider behind the scenes to pass information between its background
      push service and the app. Android opens it when JPush starts or handles a push request.
    disableEffect: JPush's background service will lose this internal handoff, so push delivery and message
      handling may stop.
  zh-CN:
    description: JPush 使用此 provider 在后台推送服务与应用之间传递信息。JPush 启动推送服务或处理推送请求时会用到它。
    disableEffect: JPush 的后台服务将无法通过此 provider 交接请求，推送送达和消息处理可能停止。
