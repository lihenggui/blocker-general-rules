recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: AndroidX Biometric opens this Activity when an authentication prompt uses the phone lock-screen
      credential; it starts the credential check and returns its result to the app.
    disableEffect: Apps that use AndroidX Biometric for a device PIN, pattern, or password check may fail
      to complete authentication.
  zh-CN:
    description: 认证提示需要使用手机锁屏凭据时，AndroidX Biometric 会打开此 Activity，启动凭据验证并将结果返回应用。
    disableEffect: 使用 AndroidX Biometric 验证设备 PIN 码、图案或密码的应用可能无法完成认证。
