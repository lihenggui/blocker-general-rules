i18n:
  en:
    description: The CSHT (中软高科) ID-card reader SDK opens this screen when an app starts an NFC card-reading
      request. It checks that NFC is available, initializes the reader, and returns card data or the read
      result to the app.
    disableEffect: NFC ID-card reading through the CSHT SDK will not be available.
  zh-CN:
    description: 中软高科身份证读卡 SDK 在应用发起 NFC 读卡请求时打开此界面。它会检查 NFC 是否可用、初始化读卡器，并将卡片数据或读取结果返回给应用。
    disableEffect: 停用后，应用将无法使用中软高科 SDK 进行 NFC 身份证读取。
