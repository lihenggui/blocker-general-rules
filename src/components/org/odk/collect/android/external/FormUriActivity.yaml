i18n:
  en:
    description: When another app opens a form or saved-response link in ODK Collect, this screen checks
      the project and passes the request to the form screen. It is part of the Samagra ODK Collect client.
    disableEffect: External links will no longer be able to open forms or saved responses in ODK Collect.
  zh-CN:
    description: 其他应用通过链接在 ODK Collect 中打开表单或已保存答卷时，此页面会检查项目并将请求交给表单页面处理。 它是 Samagra 构建的 ODK Collect 客户端的一部分。
    disableEffect: 停用后，外部链接将无法在 ODK Collect 中打开表单或已保存答卷。
