i18n:
  en:
    description: Bilibili Boxing presents this picker as a collapsible bottom sheet with a selected-media
      preview. The user can choose photos or videos and return the selection to the app.
    disableEffect: Apps using the bottom-sheet picker cannot choose and preview media through it if it
      is disabled.
  zh-CN:
    description: Bilibili Boxing 会以可收起的底部面板显示此选择器，并预览已选媒体。用户可以选择照片或视频，再把结果交还给应用。
    disableEffect: 停用后，使用此底部面板的应用无法通过它选择和预览媒体。
