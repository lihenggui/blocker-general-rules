recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T15:21:12Z'
i18n:
  en:
    description: When the launcher requests a scrolling collection in an AndroidX Glance AppWidget, this
      Service supplies the collection rows for that widget. It starts or resumes the widget content needed
      to fill the list.
    disableEffect: List sections in affected Glance widgets may appear blank or unavailable.
  zh-CN:
    description: 桌面启动器请求显示 AndroidX Glance 小组件中的滚动列表时，此 Service 会提供列表项，并启动或恢复填充列表所需的小组件内容。
    disableEffect: 受影响的 Glance 小组件中的列表部分可能为空或无法使用。
