    description: When Huawei Ads needs to show an ad screen loaded as part of an ad, this Activity displays
      that screen.
    disableEffect: Those dynamically supplied ad screens will not appear; the rest of the app remains
      available.
  zh-CN:
    description: 华为 Ads 需要显示随广告加载的页面时，此 Activity 会展示该广告界面。
    disableEffect: 停用后，这类动态加载的广告界面不会显示；应用的其他功能仍可使用。
