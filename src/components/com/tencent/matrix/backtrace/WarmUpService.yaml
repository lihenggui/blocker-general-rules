recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:18:39Z'
i18n:
  en:
    description: Tencent Matrix Backtrace starts this Service in a separate process when it prepares a
      native library for stack capture. It warms the library for later crash and call-stack analysis.
    disableEffect: Matrix cannot prepare native libraries through this service, limiting native crash
      and call-stack diagnostics.
  zh-CN:
    description: Tencent Matrix Backtrace 需要为原生调用栈采集准备库文件时，会在独立进程中启动此 Service，以支持后续的崩溃和调用栈分析。
    disableEffect: 停用后，Matrix 无法通过此服务准备原生库文件，相关崩溃和调用栈诊断能力会受限。
