i18n:
  en:
    description: The IAMPASS SDK opens this screen when the app removes one or more registered users in
      a single operation. It deletes those registrations from the service and the saved device list.
    disableEffect: Bulk removal of IAMPASS registrations will fail, leaving the selected user entries
      registered.
  zh-CN:
    description: 应用一次移除一名或多名已注册用户时，IAMPASS SDK 会打开此页面。页面从服务端和设备保存列表中删除这些注册信息。
    disableEffect: 批量移除 IAMPASS 注册将失败，所选用户仍会保持注册状态。
