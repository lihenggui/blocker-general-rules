  en:
    description: When a user is asked to rate a customer-service conversation, Sobot's customer-service
      chat SDK shows this dialog. It collects a satisfaction score and optional comment and submits the
      evaluation.
    disableEffect: The user will not be able to submit a satisfaction rating for the Sobot support conversation.
  zh-CN:
    description: 当用户需要评价客服会话时，Sobot 客服聊天 SDK 会显示此对话框。它收集满意度评分和可选意见并提交评价。
    disableEffect: 用户将无法提交对此次 Sobot 客服会话的满意度评价。
