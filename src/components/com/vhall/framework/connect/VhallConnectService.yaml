i18n:
  en:
    description: The Vhall live streaming SDK binds this service while it initializes or joins a live
      room. It keeps the room's message and chat connections open and delivers incoming room events to
      the SDK's live features.
    disableEffect: Live room chat, event updates, and other features that rely on the room connection
      stop working.
  zh-CN:
    description: Vhall（微吼）直播 SDK 在初始化或加入直播间时绑定此服务。它维持房间消息和聊天连接，并将收到的房间事件交给直播功能处理。
    disableEffect: 停用后，依赖房间连接的直播聊天、事件更新和其他功能将无法工作。
