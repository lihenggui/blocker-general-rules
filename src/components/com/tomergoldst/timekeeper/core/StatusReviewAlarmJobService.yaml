i18n:
  en:
    description: The TimeKeeper alarm scheduling SDK by Tomer Goldstein runs this Service as a maintenance
      task about every five to six hours. It checks that a backup alarm is still scheduled and, if it
      is missing, schedules it again and restores the app’s saved alarms.
    disableEffect: If TimeKeeper alarms need recovery, disabling this Service can leave them unscheduled
      and app actions may be missed.
  zh-CN:
    description: Tomer Goldstein 的 TimeKeeper 闹钟调度 SDK 大约每五到六小时运行一次此 Service 进行维护。它会检查备用闹钟是否仍已安排；如果闹钟不存在，就重新安排备用闹钟并恢复应用保存的闹钟。
    disableEffect: 如果 TimeKeeper 闹钟需要恢复，停用此 Service 可能会使闹钟无法调度，导致应用操作错过。
