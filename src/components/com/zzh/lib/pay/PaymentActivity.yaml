i18n:
  en:
    description: HPay opens this payment Activity to start or resume a WeChat Pay or UnionPay transaction.
      It hands the order to the payment flow and processes the response when the user returns.
    disableEffect: WeChat Pay or UnionPay transactions using HPay may fail to start or return a result.
  zh-CN:
    description: HPay 会在发起或恢复微信支付、银联支付时打开此支付 Activity。它会将订单交给支付流程处理，并在用户返回后接收支付结果。
    disableEffect: 通过 HPay 使用微信支付或银联支付时，支付可能无法启动或无法返回结果。
