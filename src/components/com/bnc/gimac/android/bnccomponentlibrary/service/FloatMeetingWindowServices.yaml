i18n:
  en:
    description: When a BNC GIMAC call continues after the user leaves its screen, this Service shows
      a movable call window with video and a way to return to the call. Disabling it stops calls from
      remaining visible in a floating window.
    disableEffect: The user may lose the floating call window and have trouble returning to a call in
      progress.
  zh-CN:
    description: 用户离开 BNC GIMAC 通话界面后，此 Service 会显示可移动的通话浮窗和视频画面，并允许用户回到通话。停用后，通话无法继续以浮窗形式显示。
    disableEffect: 用户可能看不到通话浮窗，也可能不便返回正在进行的通话。
