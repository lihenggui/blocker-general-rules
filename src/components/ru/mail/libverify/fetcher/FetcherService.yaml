i18n:
  en:
    description: Mail.ru libverify starts this Service for fetcher start or stop requests and for a fetch
      check when no action is supplied. It runs background retrieval used by the phone verification SDK.
    disableEffect: Mail.ru libverify may stop running background fetch checks, which can leave phone verification
      without current data.
  zh-CN:
    description: Mail.ru libverify 会在收到启动、停止或未指定操作的检查请求时运行此 Service，为手机验证 SDK 获取后台数据。
    disableEffect: Mail.ru libverify 可能无法执行后台获取检查，手机验证所需的数据可能无法及时更新。
