i18n:
  en:
    description: When Tuna Software's Tuna payment SDK requests a card scan, this Activity opens the camera
      and reads the card number, name, and expiration date for checkout.
    disableEffect: The app will not receive card details from Tuna's scanning screen, which can block
      a payment flow that uses it.
  zh-CN:
    description: Tuna Software 的 Tuna 支付 SDK 请求扫描银行卡时，此 Activity 会打开相机，读取卡号、持卡人姓名和有效期并交给结账流程。
    disableEffect: 关闭后，应用无法从 Tuna 扫卡页面获取银行卡信息，使用该流程的支付可能无法继续。
