recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T20:25:31Z'
i18n:
  en:
    description: This Millicast (Dolby.io) provider runs automatically as the app starts and prepares
      the context that Millicast live audio and video features need. It does not show a screen or handle
      media itself.
    disableEffect: Millicast publishing or playback may fail to initialize, so apps that use its live
      streams may stop streaming.
  zh-CN:
    description: 此 Millicast（Dolby.io）Provider 会在应用启动时自动运行，为 Millicast 实时音视频功能做好初始化准备。它本身不显示界面，也不处理媒体内容。
    disableEffect: 停用后，Millicast 的发布或播放可能无法初始化，依赖实时音视频的功能会无法使用。
