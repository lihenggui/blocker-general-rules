recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:33:17Z'
i18n:
  en:
    description: When a user taps a Reteno notification, this Activity records the interaction, closes
      the notification, and opens its linked page or the app. It can also route a Reteno in-app message.
    disableEffect: Reteno notification taps can no longer be tracked or routed to their linked pages.
  zh-CN:
    description: 当用户点按 Reteno 通知时，此 Activity 会记录交互、关闭通知，并打开通知链接或应用。它也可处理 Reteno 应用内消息的跳转。
    disableEffect: 停用后，Reteno 通知点击将无法记录，也无法跳转到对应页面。
