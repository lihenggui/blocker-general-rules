i18n:
  en:
    description: The iAdvize conversation SDK opens this chat screen when the app presents an active or
      targeted support conversation. Users can read and send messages, attach files, and start a video
      escalation from the chat.
    disableEffect: Users will lose iAdvize in-app support chat, including its message, attachment, and
      video-escalation entry points.
  zh-CN:
    description: iAdvize 会话 SDK 会在应用展示正在进行或符合触发条件的客服会话时打开此聊天页面。用户可收发消息、添加附件，并从聊天发起视频求助。
    disableEffect: 用户将无法使用 iAdvize 应用内客服聊天，包括消息、附件和视频求助入口。
