    description: When the app moves to the background, older Proxi.cloud releases use this service to
      upload saved event history; a later inspected release has no visible action.
    disableEffect: Proxi.cloud event history may upload less often in older releases; the app remains
      usable.
  zh-CN:
    description: 应用转入后台时，旧版 Proxi.cloud 会用此服务上传已保存的事件记录；较新的已检查版本没有可见操作。
    disableEffect: 在旧版 SDK 中禁用它可能降低 Proxi.cloud 事件记录的上传频率，但应用仍可使用。
