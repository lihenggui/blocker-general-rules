i18n:
  en:
    description: When Requestly's notification clear-history action runs, this Service deletes saved HTTP
      transactions and dismisses their notifications.
    disableEffect: The notification action cannot clear Requestly's saved HTTP history; other inspector
      controls may still work.
  zh-CN:
    description: Requestly 通知中的清除历史记录操作运行时，此 Service 会删除已保存的 HTTP 请求记录并关闭相关通知。
    disableEffect: 通知操作将无法清除 Requestly 保存的 HTTP 历史记录；检查工具的其他控制项仍可能可用。
