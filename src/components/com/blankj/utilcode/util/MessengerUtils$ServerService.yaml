i18n:
  en:
    description: The Blankj AndroidUtilCode messaging service starts when the app sends a message between
      processes or another process connects through the app-specific messaging action. It forwards messages
      to registered parts of the app.
    disableEffect: App features that use this service will stop receiving messages from other processes.
  zh-CN:
    description: Blankj AndroidUtilCode 的消息服务会在应用发送跨进程消息，或其他进程通过应用专属消息入口连接时启动，并把消息转给应用中已登记的接收方。
    disableEffect: 依赖此服务的应用功能将无法再接收来自其他进程的消息。
