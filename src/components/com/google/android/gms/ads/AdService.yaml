i18n:
  en:
    description: Google Mobile Ads uses this background Service to process ad notification work when the
      SDK sends it. It runs without showing a screen.
    disableEffect: Ad notification work handled by Google Mobile Ads will stop.
  zh-CN:
    description: Google 移动广告会在 SDK 发来广告通知任务时，通过此后台服务进行处理。它运行时不会显示界面。
    disableEffect: Google 移动广告通过此服务处理的广告通知任务将停止。
