i18n:
  en:
    description: This service is in charge of starting/stopping the alarm. It will bring up and manage
      the [AlarmActivity] as well as [AlarmKlaxon]. Registers a broadcast receiver to listen for snooze/dismiss
      intents. The broadcast receiver exits early if AlarmActivity is bound to prevent double-processing
      of the snooze/dismiss intents.
