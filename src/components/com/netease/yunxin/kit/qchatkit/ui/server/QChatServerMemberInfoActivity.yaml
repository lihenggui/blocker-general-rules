  en:
    description: The NetEase Yunxin QChat UI SDK opens this screen when a user selects a server member.
      It shows the member's profile and roles; authorized users can edit a nickname, change role membership,
      or remove the member from the server.
    disableEffect: Users cannot view or manage a selected member's server details through the built-in
      QChat screen.
  zh-CN:
    description: 网易云信 QChat 界面库会在用户选中服务器成员时打开此页。页面显示成员资料和角色；有权限的用户可以修改昵称、调整角色成员关系或将其移出服务器。
    disableEffect: 用户无法通过 QChat 内置界面查看或管理所选成员的服务器资料。
