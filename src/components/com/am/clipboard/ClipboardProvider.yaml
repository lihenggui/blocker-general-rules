recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:24:29Z'
i18n:
  en:
    description: When an app uses Alex Mofer Super Clipboard to copy or paste rich content, Android routes
      the data through this provider. It stores temporary items in app storage and supplies them in the
      requested format.
    disableEffect: Copy-and-paste features that rely on this library stop working, especially for images
      or other rich content.
  zh-CN:
    description: 应用使用 Alex Mofer Super Clipboard 复制或粘贴富媒体内容时，Android 会通过此内容提供程序传递数据。它会在应用存储中暂存内容，并按请求的格式提供数据。
    disableEffect: 依赖此库的复制和粘贴功能将无法使用，图片等富媒体内容尤其会受影响。
