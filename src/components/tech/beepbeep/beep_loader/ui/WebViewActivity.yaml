i18n:
  en:
    description: When Beep Android Loader opens a URL for a cashless-payment or telematics workflow, this
      Activity loads it in the SDK's embedded browser and forwards requests between the page and the loader.
    disableEffect: Beep Loader cannot display its URL-based pages, preventing workflows that use those
      pages from finishing.
  zh-CN:
    description: Beep Android Loader 为无现金付款或车联网流程打开网址时，此 Activity 会在 SDK 内置浏览器中加载页面，并转发网页与加载器之间的请求。
    disableEffect: 停用后，Beep 加载器无法显示网址页面，依赖这些页面的流程将无法完成。
