i18n:
  en:
    description: When a user chooses to scan a card in a PayTabs payment flow, PayTabs Card Recognizer
      opens this Activity to capture card details and return them to the payment screen.
    disableEffect: The card-scan step cannot open, so a payment flow that requires it will not continue.
  zh-CN:
    description: 用户选择在 PayTabs 付款流程中扫描银行卡时，PayTabs 卡片识别功能会打开这个 Activity 获取卡片信息并交回付款页面。
    disableEffect: 禁用后，银行卡扫描步骤无法打开，要求扫描的付款流程无法继续。
