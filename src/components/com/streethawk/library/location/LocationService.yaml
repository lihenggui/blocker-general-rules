i18n:
  en:
    description: This component is part of the StreetHawk mobile engagement SDK. StreetHawk starts this
      older Service to receive device location updates through Google Play Services. It filters repeated
      or nearby readings and queues qualifying coordinates for StreetHawk reports.
    disableEffect: Older StreetHawk location reporting and location-triggered campaigns will stop updating.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。StreetHawk 会启动此旧版服务，通过 Google Play 服务接收设备位置更新。它会过滤重复或过近的位置读数，并将符合条件的坐标排队发送给
      StreetHawk。
    disableEffect: StreetHawk 旧版位置报告和位置触发活动将停止更新。
