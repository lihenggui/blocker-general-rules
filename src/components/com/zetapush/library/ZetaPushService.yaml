i18n:
  en:
    description: ZetaPush (InsurlyTech Android client) opens an authenticated connection when the app
      requests ZetaPush messaging or services. It reports connection status to the app and keeps the session
      credentials used by that connection.
    disableEffect: Apps that rely on this connection may lose live messages and other ZetaPush features.
  zh-CN:
    description: ZetaPush（InsurlyTech Android 客户端）会在应用请求 ZetaPush 消息或服务时建立经过身份验证的连接。它会向应用报告连接状态，并保存连接所用的会话凭据。
    disableEffect: 依赖此连接的应用可能无法接收实时消息或使用其他 ZetaPush 功能。
