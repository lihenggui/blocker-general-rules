i18n:
  en:
    description: When Android opens a SIP, contact, or supported messaging call link, the NXCloud SIP
      calling SDK turns it into a call target and may ask which number or call type to use before starting
      the call.
    disableEffect: External SIP links and contact call actions will no longer start calls through the
      SDK.
  zh-CN:
    description: Android 打开 SIP、联系人或受支持的消息服务通话链接时，NXCloud SIP 通话 SDK 会将其转换为通话目标；必要时先让用户选择号码或通话类型，再发起通话。
    disableEffect: 外部 SIP 链接和联系人通话操作将无法再通过 SDK 发起通话。
