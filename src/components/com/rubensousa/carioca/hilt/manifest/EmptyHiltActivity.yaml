i18n:
  en:
    description: Carioca's Hilt test helper provides a blank screen for automated tests that need to launch
      an Activity with Hilt enabled; it applies an optional test theme when opened.
    disableEffect: Only tests that use this Hilt test screen stop working; the app's normal features are
      unaffected.
  zh-CN:
    description: Carioca 的 Hilt 测试辅助库为需要启动 Hilt 界面的自动化测试提供空白页面；页面打开时会应用可选的测试主题。
    disableEffect: 停用后，依赖此页面的 Hilt 自动化测试无法启动；应用的日常功能不受影响。
