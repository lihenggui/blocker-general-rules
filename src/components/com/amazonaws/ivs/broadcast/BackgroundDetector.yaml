i18n:
  en:
    description: Amazon IVS Broadcast registers this provider at app startup to watch screen lifecycle
      changes and notify the broadcast engine when the app moves to the background or returns, when lifecycle
      reporting is enabled.
    disableEffect: IVS Broadcast may not respond correctly when the user leaves or returns to the app.
  zh-CN:
    description: Amazon IVS Broadcast 会在应用启动时注册此组件；启用生命周期报告后，它会监测界面变化，并在应用进入后台或返回时通知直播引擎。
    disableEffect: 用户离开应用或返回时，IVS Broadcast 可能无法正确响应。
