i18n:
  en:
    description: When an AppMetrica push notification reaches its expiry time, this Receiver removes it
      and records that it expired.
    disableEffect: Expired AppMetrica notifications will not be removed through this receiver, and their
      expiry callbacks will not run.
  zh-CN:
    description: AppMetrica 推送通知到期时，此 Receiver 会将其移除并记录通知已过期。
    disableEffect: 禁用后，过期的 AppMetrica 通知不会通过此 Receiver 移除，相应的过期回调也不会运行。
