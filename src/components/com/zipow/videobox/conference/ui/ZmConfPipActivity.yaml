    description: The Zoom Meeting SDK opens this Activity when a user puts an ongoing meeting into picture-in-picture
      mode. It keeps the meeting visible in a small floating window.
    disableEffect: Meeting video cannot stay visible in the floating picture-in-picture window.
  zh-CN:
    description: 用户将正在进行的会议切换到画中画模式时，Zoom Meeting SDK 会打开此页面，让会议继续显示在小型悬浮窗口中。
    disableEffect: 会议视频将无法继续显示在画中画悬浮窗口中。
