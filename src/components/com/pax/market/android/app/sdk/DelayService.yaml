  en:
    description: When a legacy PAXSTORE client sends terminal parameters, the PAXSTORE Android SDK waits
      briefly, then starts the app's follow-up handler for those parameters.
    disableEffect: Apps that rely on this SDK path may not process terminal parameters sent by older PAXSTORE
      clients.
  zh-CN:
    description: 旧版 PAXSTORE 客户端发送终端参数后，PAXSTORE Android SDK 会短暂等待，再启动应用中处理这些参数的后续程序。
    disableEffect: 依赖此 SDK 流程的应用可能无法处理旧版 PAXSTORE 客户端发送的终端参数。
