i18n:
  en:
    description: Microsoft's identity library uses this Activity for browser authorization that remains
      in the current task. It receives the redirect, completes authorization, and closes the temporary
      sign-in screen.
    disableEffect: Current-task browser authorization cannot complete or return its result.
  zh-CN:
    description: Microsoft 身份库会在需要保持当前任务的浏览器授权流程中使用此界面。它接收重定向、完成授权并关闭临时登录界面。
    disableEffect: 保持在当前任务中的浏览器授权将无法完成或返回结果。
