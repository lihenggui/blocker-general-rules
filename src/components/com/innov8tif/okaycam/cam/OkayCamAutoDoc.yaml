i18n:
  en:
    description: OkayCam (Innov8tif) opens this screen when an app requests automatic document capture.
      It guides the user to position the document, captures its front and back, and sends the photos to
      the app for review.
    disableEffect: The app cannot complete automatic document capture through OkayCam if this screen is
      disabled.
  zh-CN:
    description: 应用请求自动采集证件时，OkayCam（Innov8tif）会打开此界面，引导用户摆正证件并自动拍摄正反面照片，再交由应用检查。
    disableEffect: 停用后，应用无法通过 OkayCam 完成自动证件采集。
