i18n:
  en:
    description: At app startup, DoingLab FoodLens saves shared app information used by its screens and
      clears leftover scan images from earlier sessions. This prepares image and resource access for the
      SDK's UI.
    disableEffect: FoodLens screens may fail when they need this saved information, and old scan images
      will not be cleaned up.
  zh-CN:
    description: 应用启动时，DoingLab FoodLens 会保存界面所需的应用信息，并清理之前会话遗留的扫描图像，为 SDK 界面准备图片和资源访问。
    disableEffect: 停用后，FoodLens 页面可能无法取得所需信息，旧扫描图像也不会被清理。
