i18n:
  en:
    description: The Rokid Kaleido SDK opens this activity to launch an app on a separate glasses display
      and keep that app window in step with the display’s pause and resume state.
    disableEffect: Apps using Rokid Kaleido cannot open or manage their screens on the extra glasses display.
  zh-CN:
    description: Rokid Kaleido SDK 会通过此活动在独立眼镜屏幕上打开应用，并根据该屏幕上的暂停和恢复状态管理应用窗口。
    disableEffect: 停用后，使用 Rokid Kaleido 的应用无法在额外的眼镜屏幕上打开或管理应用画面。
