i18n:
  en:
    description: Tencent Cloud IM (TIM)'s Huawei push provider starts with the app and registers its connector.
      When registration is requested, it enables Huawei push and returns the registration result.
    disableEffect: Huawei push registration stops, and a later token callback from the still-enabled Huawei
      messaging service can fail because this provider is missing.
  zh-CN:
    description: 腾讯云 IM（TIM）的华为推送提供方会在应用启动时注册连接器。收到注册请求后，它会启用华为推送并返回注册结果。
    disableEffect: 华为推送注册会停止；如果仍启用的华为消息服务之后回传令牌，回调可能因该提供方缺失而失败。
