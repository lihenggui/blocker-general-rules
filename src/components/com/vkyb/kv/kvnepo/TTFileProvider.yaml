recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:29:28Z'
i18n:
  en:
    description: Pangle uses this provider to share downloaded app files with Android’s installer when
      a user installs an app offered by an ad.
    disableEffect: Android’s installer cannot access APKs downloaded by Pangle, so ad-offer installations
      may fail.
  zh-CN:
    description: 用户安装广告应用时，Pangle 会通过此 Provider 把已下载的应用文件提供给 Android 安装器。
    disableEffect: Android 安装器将无法访问 Pangle 下载的应用安装包，广告应用安装可能失败。
