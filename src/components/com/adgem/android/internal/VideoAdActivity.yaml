i18n:
  en:
    description: When AdGem starts a cached video ad, this full-screen activity plays it, shows the remaining
      time, and opens the ad's ending card when playback completes.
    disableEffect: AdGem video ads will not play, and rewards for watching ads will no longer be granted.
  zh-CN:
    description: AdGem 开始展示已缓存的视频广告时，此全屏页面会播放视频、显示剩余时间，并在播放完毕后打开广告结束画面。
    disableEffect: 停用后，AdGem 视频广告无法播放，观看广告获得的奖励也不会发放。
