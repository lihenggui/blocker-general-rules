  en:
    description: VoiceControls by Frank Zickert runs this Service for configured voice forms. It sends
      answers to the VoiceControls backend and presents follow-up questions as notification prompts that
      accept replies.
    disableEffect: Voice form requests that need backend interpretation or follow-up answers will not
      complete.
  zh-CN:
    description: Frank Zickert 的 VoiceControls 使用此 Service 处理已配置的语音表单。它会将回答发送到 VoiceControls 后端，并通过可回复的通知提出后续问题。
    disableEffect: 停用后，需要后端解析或后续回答的语音表单请求将无法完成。
