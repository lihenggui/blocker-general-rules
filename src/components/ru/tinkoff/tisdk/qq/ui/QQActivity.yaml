    description: 在旧版 Tinkoff 保险 OSAGO 快速报价流程中，此 Activity 收集简要报价信息，并在表单有效时计算估价。随后可显示结果或继续填写完整保单申请。
    disableEffect: 用户将无法申请快速报价或继续填写完整保单。
