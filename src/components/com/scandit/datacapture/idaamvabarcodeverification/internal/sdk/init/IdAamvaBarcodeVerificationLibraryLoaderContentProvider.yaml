i18n:
  en:
    description: Android starts this Scandit Data Capture AAMVA barcode verification provider with the
      app process. It prepares AAMVA barcode verification used to check data from US driver's-license
      barcodes before the app uses that feature.
    disableEffect: Disabling it can prevent Scandit AAMVA barcode verification features from initializing
      when the app needs them.
  zh-CN:
    description: Android 会在应用进程启动时启动此 Scandit Data Capture AAMVA barcode verification Provider。它会在应用使用相关功能前准备用于核验美国驾照条码数据的
      AAMVA 条码验证。
    disableEffect: 禁用后，应用需要使用 Scandit AAMVA barcode verification 功能时，该功能可能无法初始化。
