i18n:
  en:
    description: When Android finishes updating the host app, this receiver refreshes FlowSense app details
      and restarts location monitoring for registered devices.
    disableEffect: FlowSense monitoring may not restart or refresh after an app update; unrelated host
      app features remain available.
  zh-CN:
    description: Android 完成宿主应用更新后，此接收器会刷新 FlowSense 应用信息，并为已注册设备重新启动位置监测。
    disableEffect: 停用后，应用更新后 FlowSense 监测可能无法重新启动或刷新；宿主应用的其他功能仍可使用。
