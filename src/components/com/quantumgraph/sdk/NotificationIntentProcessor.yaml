i18n:
  en:
    description: The older Appier AIQUA SDK uses this receiver for screen-unlock and notification-action
      events, then passes them to its notification service.
    disableEffect: AIQUA will no longer refresh or process notifications through these events; the app’s
      other features remain available.
  zh-CN:
    description: 较早版本的 Appier AIQUA SDK 使用此接收器处理屏幕解锁和通知操作事件，再将事件交给通知服务。
    disableEffect: AIQUA 将无法再通过这些事件更新或处理通知，应用的其他功能仍可使用。
