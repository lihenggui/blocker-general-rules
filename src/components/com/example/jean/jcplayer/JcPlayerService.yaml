  en:
    description: JCPlayer (Jean Carlos) binds this Service for playlist audio playback. It plays tracks
      from a web address, device file or app resource and reports playback progress and completion to
      the app and its notification.
    disableEffect: The app may lose playlist audio playback that relies on this Service.
  zh-CN:
    description: JCPlayer（Jean Carlos）通过此 Service 播放播放列表中的音频。曲目可来自网址、本地文件或应用资源，播放进度与完成状态会反馈给应用和播放通知。
    disableEffect: 依赖此 Service 的播放列表音频功能可能无法使用。
