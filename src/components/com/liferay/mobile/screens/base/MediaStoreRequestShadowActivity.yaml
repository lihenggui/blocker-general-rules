  en:
    description: Liferay Screens opens this screen when a feature asks the user to choose a photo or video,
      or capture one with the camera. It returns the selected media to the requesting feature.
    disableEffect: Photo/video selection and camera capture in Liferay Screens will fail.
  zh-CN:
    description: Liferay Screens 的功能需要用户选择照片或视频、或使用相机拍摄时，会打开此页面。它会将选中的媒体返回给发起请求的功能。
    disableEffect: Liferay Screens 中的照片或视频选择、相机拍摄功能将无法使用。
