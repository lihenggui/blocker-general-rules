i18n:
  en:
    description: Android runs this provider with the app, and the Custom Activity on Crash SDK uses it
      so a crash can show the SDK’s recovery screen.
    disableEffect: The SDK's custom crash screen will no longer be installed; ordinary app screens do
      not depend on this provider.
  zh-CN:
    description: Android 启动应用时会运行此内容提供程序，Custom Activity on Crash SDK 通过它启用自己的崩溃恢复界面。
    disableEffect: 停用后，应用日常功能仍可使用，但崩溃后不会显示 SDK 的自定义恢复界面。
