    description: "## Primary Location\nUnited States (Boston) [Localytics, 01](https://www.localytics.com/company/about)\n\
      ## Website\n[https://www.localytics.com](https://www.localytics.com)\n## About\nLocalytics offers\
      \ an analytics and marketing platform for targeted and personalized engagement campaigns on mobile\
      \ [Localytics, 01](https://www.localytics.com/company/about); [Crunchbase, 01](https://www.crunchbase.com/organization/localytics).\n\
      ## Ownership\nSelf-owned\n## Products and Services\nLocalytics performs a variety of services for\
      \ clients:  \n* Uniquely identify users and devices via the Localytics tracker: \"The Localytics\
      \ SDK automatically captures and uploads device IDs which the Localytics backend uses to uniquely\
      \ identify users. Some apps connect to their own backend systems that use different IDs for uniquely\
      \ identifying users\" [Localytics, 04](https://docs.localytics.com/dev/android.html#android)  \n\
      * Store and transmit user personal information, such as end user name [Localytics, 05](http://docs.localytics.com/dev/ios.html#identifying-users-ios)\
      \  \n* Identify users who uninstall an app containing the tracker [Localytics, 06](http://docs.localytics.com/dev/ios.html#uninstall-tracking-ios)\n\
      * Track detailed geolocation, even without the use of GPS: \"Most apps don't track user geolocation\
      \ so Localytics uses an IP-to-location lookup service to determine which country they are located\
      \ in. If your app does track user geolocation, you can use the following code to set latitude and\
      \ longitude in Localytics much more precisely\" [http://docs.localytics.com/dev/ios.html#location-ios](http://docs.localytics.com/dev/ios.html#location-ios)\n\
      Localytics leverages the same tracking platform in iOS and Android.\n## Privacy Policy\n_Personally\
      \ identifiable information collection (via Services):_ Localytics requests that its Customers not\
      \ provide to it PII about their End Users. However, Localytics states that End Users should be aware\
      \ Customers may request PII for their own use for their mobile apps. To the extent that Localytics\
      \ does receive PII from Customers, it pledges to maintain the confidentiality of the PII. Localytics\
      \ does obtain information from website log files, and maintains the right to combine automatically\
      \ collected log data with other information they have about you. \n_Information sharing:_ Localytics\
      \ \"does not rent, sell or share PII, including your Personal Information, with any third parties\"\
      \ expect with your express consent, or in the event of \"a merger, acquisition, or sale of all or\
      \ a portion of its assets\", at which case you will be prominently notified \"of any change in ownership\
      \ or uses of your Personal Information, as well as any choices you may have regarding your Personal\
      \ Information\" [Localytics, 07](https://www.localytics.com/privacy-policy)\n## Relationships\n\
      _Customers:_ Comcast / A&E / OLA / Runkeeper / Microsoft / CVS Pharmacy / The New York Times / Avis\
      \ / Salesforce Marketing Cloud / Amazon / Wendy's / Zipcar [Localytics, 02](https://www.localytics.com)\
      \ / Oracle Marketing Cloud / Adobe Marketing Cloud / Facebook Marketing Partners / Twitter \n_Alliance\
      \ partners:_ Bitbang / Cainkade / Cube Loco / Epicfy / Exicon / Jackrabbit / Jargon / Kapitec Software\
      \ / Keystone Solutions / Mobiquity / NorthBay / Northout / Pollfish / Rocket Insights / Scholarly\
      \ iQ / Scientific Computers Ltd. / Semba  Mobile / Social Fulcrum / Somo / SP2 Serviços Empresariais\
      \ Ltda / Stratigent / Vendus Labs Inc.\n_Technology partners:_ Aarki / adjust / Applift / Applovin\
      \ / AppsFlyer / Apptimize / Apsalar / Branch Metrics / ExactTarget / Facebook / Fiksu / Greystripe\
      \ / IBM PartnerWorld / Impact Radius / InMobi / Jampp / Kochava / Liftoff / Mag+ / Marketo / Method\
      \ Mill / Millennial Media / NativeX / Optimizely / Phunware / Pinsight Media+ / Rocket Fule / StrikeAd\
      \ / Supersonic / Tapstream / Taptica / Textur / TUNE / Twitter / Yozio [Localytics, 03](https://www.localytics.com/company/partners)\n\
      ## Details\n_Financial details:_ Localytics was founded in 2009 and and has raised over $69 million\
      \ from funders [Localytics, 01](https://www.localytics.com/company/about); [Crunchbase, 01](https://www.crunchbase.com/organization/localytics).\n\
      ## References\n* _Localytics, 01._ [https://www.localytics.com/company/about](https://www.localytics.com/company/about)\
      \  \n* _Localytics, 02._ [https://www.localytics.com](https://www.localytics.com)  \n* _Localytics,\
      \ 03._ [https://www.localytics.com/company/partners](https://www.localytics.com/company/partners)\
      \  \n* _Localytics, 04._ [https://docs.localytics.com/dev/android.html#android](https://docs.localytics.com/dev/android.html#android)\
      \  \n* _Localytics, 05._ [http://docs.localytics.com/dev/ios.html#identifying-users-ios](http://docs.localytics.com/dev/ios.html#identifying-users-ios)\
      \  \n* _Localytics, 06._ [http://docs.localytics.com/dev/ios.html#uninstall-tracking-ios](http://docs.localytics.com/dev/ios.html#uninstall-tracking-ios)\
      \  \n* _Localytics, 07._ [https://www.localytics.com/privacy-policy](https://www.localytics.com/privacy-policy](https://www.localytics.com/privacy-policy)"
