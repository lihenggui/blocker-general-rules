    name: Google Crashlytics
    description: "## Primary Location\nUnited States (Boston) [Crunchbase, 01](https://www.crunchbase.com/organization/crashlytics)\n\
      ## Website\n[http://try.crashlytics.com](http://try.crashlytics.com)\n## About\nCrashlytics offers\
      \ a crash reporting solution for app developers.\n## Ownership\nGoogle [Recode, 01](https://www.recode.net/2017/1/18/14313164/google-twitter-acquisition-fabric-crashlytics)\n\
      ## Documentation\n[https://fabric.io/kits/android/crashlytics](https://fabric.io/kits/android/crashlytics)\n\
      ## Products and Services\nCrashlytics offers a variety of services for app developers. Crashlytics:\n\
      * Receives and analyzes app crash reports which may contain user and device-specific data.\n* Performs\
      \ analytics on app logs \"even the exact line of code your app crashed on\" [Crashlytics, 03](https://fabric.io/kits/ios/crashlytics)\n\
      * Performs analytics on app users and utilizes social media advertising. \"Get insight into your\
      \ users, what they’re doing, and inject live social content to delight them\" [Fabric, 01](https://get.fabric.io)\n\
      * Performs cross-device user identity and authentication via \"Fabric\" [Wired, 01](https://www.wired.com/2014/10/twitter-fabric-sdk)\n\
      ## Privacy Policy\nCrashlytics Privacy Policy can be viewed at [Crashlytics, 04](https://try.crashlytics.com/terms/privacy-policy.pdf).\n\
      ## Relationships\n_Customers:_ Square / Walmart / Paypal / Yelp / Paperless Post / Blackboard /\
      \ Path / Groupon / Domino's / Expedia / Orbitz / Kayak / 5 Infinity / Waze / OpenTable [Crashlytics,\
      \ 01](https://try.crashlytics.com)\n_Integrations:_ Redmine / Pivotal Tracker / Jira / PagerDuty\
      \ / Asana / OpsGenie / GitHub / Campfire / Sprintly / Hall / YouTrack / Bitbucket / Trello / FogBugz\
      \ / Zoho / Slack / GitLab / Asana / YouTrack / Sprint.ly / Bitbucket / HipChat [Crashlytics, 02](http://try.crashlytics.com/integrations)\n\
      ## Details\n_Financial details:_ Crashlytics was founded in 2011 and had raised $6 million from\
      \ funders. Twitter acquired Crashlytics in in 2013 for a reported $38 million [Crunchbase, 01](https://www.crunchbase.com/organization/crashlytics);\
      \ [Boston Business Journal, 01](https://www.bizjournals.com/boston/blog/techflash/2013/10/twitter-crashlytics-bluefin-labs.html).\
      \ In 2017, Google acquired Twitter's developer suite Fabric, which included Crashlytics, for integration\
      \ into Google Firebase. The details of the deal were not publicly disclosed [Recode, 01](https://www.recode.net/2017/1/18/14313164/google-twitter-acquisition-fabric-crashlytics).\
      \ Crashlytics is a business division of Google, Inc. [Crashlytics, 04](https://try.crashlytics.com/terms/privacy-policy.pdf).\n\
