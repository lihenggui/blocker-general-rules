  en:
    description: When Firebase delivers a Webex Connect push message or updates its token, this Service
      sends the data to Webex Connect's push handler.
    disableEffect: Firebase-delivered Webex Connect push notifications and token updates will stop; in-app
      messaging remains available.
  zh-CN:
    description: Firebase 送达 Webex Connect 推送消息或更新令牌时，此 Service 会将数据交给 Webex Connect 推送处理器。
    disableEffect: Firebase 送达的 Webex Connect 推送通知和令牌更新将停止，但应用内消息功能仍可使用。
