recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:42:17Z'
i18n:
  en:
    description: The Oneway ad runtime uses this provider when an ad module loaded at runtime needs to
      read or write shared content or open a file.
    disableEffect: Loaded ad experiences that need this provider may stop working, while features outside
      Oneway ads remain available.
  zh-CN:
    description: Oneway 广告运行环境会在动态加载的广告模块需要读取、写入共享内容或打开文件时使用此 Provider。
    disableEffect: 依赖此 Provider 的动态广告内容可能无法运行，Oneway 广告以外的应用功能仍可使用。
