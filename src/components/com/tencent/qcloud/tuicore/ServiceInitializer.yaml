i18n:
  en:
    description: Tencent Cloud TUI Kit Core runs this provider at app startup to prepare shared navigation
      and settings; current TUI Kit versions also apply shared themes and initialize installed TUI modules.
    disableEffect: TUI screens and modules that rely on this startup setup may fail to initialize or open.
  zh-CN:
    description: 腾讯云 TUI Kit Core 会在应用启动时运行此提供程序，准备共享的导航和设置；当前 TUI Kit 版本还会应用通用主题并初始化已安装的 TUI 模块。
    disableEffect: 依赖此启动初始化流程的 TUI 页面和模块可能无法正常初始化或打开。
