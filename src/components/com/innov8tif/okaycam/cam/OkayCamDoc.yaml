i18n:
  en:
    description: OkayCam (Innov8tif) opens this screen when an app requests guided document capture. The
      user takes document photos in the camera frame, then reviews them and confirms or retakes them.
    disableEffect: The app cannot capture and receive document photos through this OkayCam flow if this
      screen is disabled.
  zh-CN:
    description: 应用请求引导式证件采集时，OkayCam（Innov8tif）会打开此界面，让用户按取景框拍摄证件照片，再确认或重拍。
    disableEffect: 停用后，应用无法通过此 OkayCam 流程拍摄并接收证件照片。
