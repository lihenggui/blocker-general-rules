i18n:
  en:
    description: RongCloud IM push runs this background service to connect to the push server and handle
      registration, heartbeat and network-change events. It supports delivery of notifications while the
      app is idle.
    disableEffect: RongCloud push connectivity and background message notifications may stop, while opening
      the app can still use its normal conversation screens.
  zh-CN:
    description: 融云 IM 推送通过此后台服务连接推送服务器，并处理注册、心跳和网络变化事件。它支持应用空闲时送达通知。
    disableEffect: 融云推送连接和后台消息通知可能停止，但打开应用后仍可使用常规会话界面。
