i18n:
  en:
    description: LikeMinds Master Feed SDK (LikeMinds) opens this Activity when the user creates a poll
      for a community post; it can also receive an existing poll for editing. The screen contains the
      poll composer.
    disableEffect: Users cannot create or edit polls through the LikeMinds feed.
  zh-CN:
    description: 用户为社区帖子创建投票时，LikeMinds Master Feed SDK（LikeMinds）会打开此 Activity；它也可以载入已有投票供用户编辑。此界面用于编辑投票内容。
    disableEffect: 停用后，用户无法通过 LikeMinds 动态创建或编辑投票。
