recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:22:24Z'
i18n:
  en:
    description: When PushPole asks for device-identifier access, this screen presents its privacy prompt.
      If the user agrees and Android grants phone-state access, the SDK can read the device identifier
      and send the response to PushPole.
    disableEffect: PushPole will not be able to show this consent prompt or submit its response and permitted
      device identifier.
  zh-CN:
    description: PushPole 请求访问设备标识时，此页面会显示隐私说明；用户同意且 Android 授予电话状态权限后，SDK 可以读取设备标识并向 PushPole 提交选择结果。
    disableEffect: PushPole 将无法显示此授权提示，也无法提交用户选择及获准读取的设备标识。
