i18n:
  en:
    description: The YYXXGame shared support SDK starts this Activity when it requests app permissions;
      it checks the requested permissions, opens Android's permission prompt or Settings, and returns
      the results.
    disableEffect: SDK permission requests cannot complete, so game features that need those permissions
      may be unavailable.
  zh-CN:
    description: YYXXGame 通用支持 SDK 在请求应用权限时启动此 Activity；它检查所需权限、打开 Android 权限提示或系统设置，并返回检查结果。
    disableEffect: SDK 的权限申请流程无法完成，因此需要这些权限的游戏功能可能无法使用。
