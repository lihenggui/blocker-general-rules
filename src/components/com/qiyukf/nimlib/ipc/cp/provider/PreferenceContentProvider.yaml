i18n:
  en:
    description: When Qiyu starts its messaging process, it uses this provider to read login details,
      SDK settings, reconnect timing, and dynamically supplied login tokens or extensions.
    disableEffect: Without this provider, the messaging process cannot get the login data and settings
      it needs, so sign-in and message delivery can fail.
  zh-CN:
    description: 七鱼客服 SDK 启动消息进程时，会通过此内容提供程序读取登录信息、SDK 设置、重连时间，以及动态提供的登录令牌或扩展信息。
    disableEffect: 禁用后，消息进程无法取得所需的登录信息和设置，登录或消息收发可能失败。
