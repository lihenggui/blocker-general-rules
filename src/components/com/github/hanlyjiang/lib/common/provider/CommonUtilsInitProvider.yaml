i18n:
  en:
    description: Android Common Utils by Hanlyjiang runs this Provider automatically at app startup. It
      initializes helpers that report app foreground and background changes and network connectivity changes.
    disableEffect: The SDK's app-visibility and network-change helpers will not initialize, so app behavior
      relying on those updates may stop working correctly.
  zh-CN:
    description: Hanlyjiang 的 Android Common Utils 会在应用启动时自动运行此 Provider，初始化用于报告应用前后台变化和网络连接变化的辅助功能。
    disableEffect: 屏蔽后，SDK 的应用状态和网络变化辅助功能不会初始化，依赖这些更新的应用行为可能无法正常工作。
