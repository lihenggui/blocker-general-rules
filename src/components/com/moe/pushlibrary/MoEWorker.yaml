i18n:
  en:
    description: MoEngage starts this background service when its alarm requests an upload of queued interaction
      data. It sends that data and then releases the alarm's wake lock.
    disableEffect: MoEngage interaction data will no longer upload through this background service.
  zh-CN:
    description: MoEngage 的定时任务请求上传待处理的互动数据时，会启动这个后台服务。服务上传数据后会释放定时任务持有的唤醒锁。
    disableEffect: MoEngage 将无法再通过此后台服务上传互动数据。
