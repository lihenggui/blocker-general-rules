i18n:
  en:
    description: The TimeKeeper alarm scheduling SDK by Tomer Goldstein receives Android’s broadcast after
      the device starts and asks its alarm service to restore the app’s saved alarms.
    disableEffect: TimeKeeper alarms saved by the app will not be registered again after a device restart,
      so scheduled app actions may be missed.
  zh-CN:
    description: Tomer Goldstein 的 TimeKeeper 闹钟调度 SDK 会在设备启动后接收 Android 的启动广播，并让闹钟服务恢复应用保存的闹钟。
    disableEffect: 设备重启后，应用保存的 TimeKeeper 闹钟将不会重新注册，因此计划执行的应用操作可能会错过。
