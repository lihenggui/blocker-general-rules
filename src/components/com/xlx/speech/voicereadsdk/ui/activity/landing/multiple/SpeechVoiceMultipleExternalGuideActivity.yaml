recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:01:15Z'
i18n:
  en:
    description: When an ad offer provides a swipe guide, the Xinliangxiang Voice Read SDK opens this
      page after the user swipes up. It plays a configured video or animation that shows the return gesture
      and explains how to continue the task.
    disableEffect: Blocking it removes the configured swipe-back guide, interrupting ad tasks that use
      this return flow; rewards for those tasks will no longer be granted.
  zh-CN:
    description: 当广告任务页配置了滑动指引时，用户上滑后 Xinliangxiang Voice Read SDK 会打开本页，播放视频或动画示范下滑返回并继续任务。
    disableEffect: 停用后，使用此返回流程的广告任务将无法显示滑动指引并继续完成，相关广告奖励将无法领取。
