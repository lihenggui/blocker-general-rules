i18n:
  en:
    description: When 233 reports that its game service is under maintenance, this Activity shows the
      maintenance notice and a quit-game control; it can also close after the configured maintenance interval.
    disableEffect: The maintenance notice and its quit option will not appear, and the affected 233 game
      service may remain unavailable.
  zh-CN:
    description: 233 报告游戏服务正在维护时，此 Activity 会显示维护公告和退出游戏按钮；设定的维护时长结束后，页面也会自动关闭。
    disableEffect: 停用后将看不到维护公告和退出选项，受影响的 233 游戏服务仍可能无法使用。
