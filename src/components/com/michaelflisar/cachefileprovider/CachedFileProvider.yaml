recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:59:20Z'
i18n:
  en:
    description: The CacheFileProvider library serves read-only files from the app cache when another
      app opens a file link shared by the app.
    disableEffect: Other apps can no longer open files shared from the app cache, including log files
      shared by libraries that use this provider.
  zh-CN:
    description: CacheFileProvider 库会在其他应用打开共享文件链接时，从应用缓存中提供只读文件。
    disableEffect: 其他应用将无法打开从应用缓存共享的文件，包括使用此提供程序共享的日志文件。
