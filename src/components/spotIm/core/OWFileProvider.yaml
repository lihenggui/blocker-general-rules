  en:
    description: The OpenWeb (Spot.IM) community SDK uses this provider when a user takes a photo for
      a discussion. It gives the camera a shareable link to the saved image.
    disableEffect: Disabling it breaks the OpenWeb photo capture flow when the saved image is returned
      to the app.
  zh-CN:
    description: OpenWeb（Spot.IM）社区 SDK 会在用户为讨论拍摄照片时使用此 Provider，为已保存的图片提供可安全传递的链接。
    disableEffect: 停用后，拍摄讨论照片并将图片交回应用的流程会失败。
