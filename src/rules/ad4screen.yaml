    name: Ad4Screen
    description: "## Primary Location\nFrance (Paris). [Crunchbase, 01](https://www.crunchbase.com/organization/ad4screen)\n\
      ## Website\n[http://www.ad4screen.com](http://www.ad4screen.com)\n[http://www.accengage.com](https://www.accengage.com)\n\
      ## About\nAd4Screen is \"a marketing and advertising pioneer on Mobile Net (Smartphones, Tablets...)\"\
      .  They help companies \"to set up performant Mobile advertising campaigns and to increase App User\
      \ engagement, retention and conversion.\" [Ad4Screen, 02](http://www.ad4screen.com/en/presentation)\n\
      ## Ownership\nAd4Screen\n## Documentation\nVia Accengage [https://docs.accengage.com/display/AND/Integration](https://docs.accengage.com/display/AND/Integration)\n\
      ## Products and Services\nAd4Screen advises clients on \"the best possible strategy to limit your\
      \ risks and we manage, for you, the establishment and management of your campaigns from A to Z!\"\
      \ (translated from French) [Ad4Screen, 03](http://www.ad4screen.com/publicite-mobile).\n### Products\
      \ and Services for Mobile Advertising\nBranding Campaign / Promote Mobile Sites / Promote Mobile\
      \ Apps / Mobile RTB / Mobile Tracking / App Store Optimization / Event Driven Strategy (Drive In-Store)\
      \ [Ad4Screen, 01](http://www.ad4screen.com/en), [Ad4Screen, 02](http://www.ad4screen.com/en/presentation)\
      \  \n_Branding Campaigns:_ \"The best sites & APPS available; Many available targeting criteria’s\
      \ (socio-demographics…); Geo-target campaigns; Thematic packages (CSP+, Media, Finance, Sports...);\
      \ Innovative formats (interstial ads, rich media, videos…)  \n_Promoting Mobile Sites:_ \"Thanks\
      \ to Mobile advertising key results, Ad4Screen enables you to harness the power of your brand, generate\
      \ more traffic, leads (CPL) and sales on your Mobile Sites and Tablets. Often the gap between click\
      \ and real visits might be significantly important. With the objective to maximize performance,\
      \ Ad4Screen guarantees an effective Cost Per Visit (CPV).\"    \nDisplay / Rich Media / Videos:\
      \ \"Our Ad Hoc Experts select the best formats, supports, publishers and Ad-Exchanges in the marketplace\
      \ in order to efficiently enhance the key advantages and offers of your Mobile Sites and Tablets.\"\
      \    \nFacebook & Twitter campaigns: \"Our teams are Experts in setting up specific mobile campaigns\
      \ on Facebook and Twitter. Share high visibility and drive a Performance Business Model forward!\
      \ Many available targeting criteria specific for Mobile and for each specific plateform. Ensure\
      \ an Ongoing Performance\"  \n_Promote Mobile Apps:_ \"Thanks to Mobile advertising, Ad4Screen helps\
      \ you to enhance your brand reputation, gain in-depth visibility and increase your volume of APP\
      \ downloads. Ad4Screen’s specific business goal lies on the guarantee to capture a growing share\
      \ of Cost Per Download (CPD).\" Display / Videos: \"Our Experts select the market’s best set of\
      \ formats, supports and well known players in the market in order to empower your Mobile APP or\
      \ Tablet, whether iOS or Android.   \n   \n  * Traditional formats: banners, interstitials\n  *\
      \ Banners, interstitials HTML5   \n  * Interstitials videos   \n  * Pre-roll videos   \n  * Geolocalisation\
      \   \n  * Native Formats (referring to Facebook, Viadeo, Twitter).    \nFacebook & Twitter App install\
      \ campaigns: \"Our teams are Experts on monitoring Facebook and Twitter campaigns on Mobile. (Mobile\
      \ Ad Formats exclusively designed to install; Share high exposure and drive a Performance Model\
      \ forward; Many targeting & optimization criteria; Possibility to track APP installs). Search: \"\
      All Queries made on Google from Smartphones and Tablets are explode! It is today’s business imperative\
      \ to benefit from Search Query Data to obtain high quality users. Our Operations Team is in charge\
      \ of your Mobile Adwords campaigns from beginning to end.   \n  * Buy with CPC   \n  * Double Click\
      \ Download  \n  * Track In-APP conversion with keywords  \n_Mobile RTB Insights:_ \"Our Media Buying\
      \ & Planning team uses the best next generation Mobile technologies (DSP) in order to program Mobile\
      \ RTB campaigns. We work with the main 100% Mobile Ad-Exchanges in the market (MoPub, Flurry, Smaato,\
      \ La Place Média…).  \n  * Gain wide access to apps ad inventory (80% ad impressions & non available\
      \ on Web AdEx)  \n  * Use conversion tracking to see in-app activity  \n  * Leverage intelligent\
      \ algorithms in real time based on in-app conversion  \n  * Communicating to the best with digital\
      \ savvy shoppers  \n  * Identify your look-alike best prospects  \n  * Invite your Mobile Site Visitors\
      \ to download your APP\")  \n_Mobile Tracking:_ \"Our main concern is to accurately follow conversion\
      \ on mobile acquisition campaigns to overall revenue. Our ad hoc experts group has the know-how\
      \ for the best acquisitions and tracking plateforms in the right private marketplaces.    \n  *\
      \ Track where your users come from (lever, design, adWord...)  \n  * Analyse and compare specific\
      \ conversion rates per sources, operating systems, countries, segments…  \n  * Track how your users\
      \ interact with your app  \n  * Improve overall ROI by our Experts  \n_App Store Optimization:_\
      \ \"Benefit from our Trends Report to optimize your organic SEO on App Store.\"  \n  * Optimize\
      \ your ranking on Google Play and iTunes  \n  * Improve your APP Ranking in your own category  \n\
      \  * Create strong viral effects (Earned media)  \n  * Generate an increase on your organic installs\
      \ from 10% to 40% per day!\"  \n_Event Driven Strategy:_ \"For today’s consumer, Mobile has become\
      \ the ultimate Digital Shopping Tool. Ad4Screen Operations Team helps you generate more Drive In-Store\
      \ traffic and positively impact on sales conversion.\nWe use the most pertinent Marketing Drive\
      \ In-Store Tools:  \n  * Mobile Retargeting\n  * Push Notification\n  * GeoTargeted Mobile Advertising\n\
      \  * iBeacon, Geofencing, QR Code...\nAd4Screen implements contest specific rules:\n  * Instant\
      \ Win Games\n  * Sweepstake\n  * In-APP & Mobile Web animations  [Ad4Screen, 05](http://www.ad4screen.com/en/mobile-advertising)\n\
      ### Products and Services for Mobile CRM\nPush Notifications / Customer Loyalty Programs (Relationship\
      \ Programs) / Mobile Retargeting / Email Responsive (Responsive Email Templates) / Mobile Couponing\
      \ (Mobile Email Tag) / Passbook [Ad4Screen, 01](http://www.ad4screen.com/en), [Ad4Screen, 02](http://www.ad4screen.com/en/presentation)\n\
      _Support:_ Sales Team / Advisory Board / Mobile CRM Experts / Media Buying & Planning / IT Team\
      \ / Data Mining Team / Support Team   \n_Sales Team:_ \"We analyze with you all your requirements\
      \ and needs to create adapted and breakthrough projects maximizing your ROI.\"  \n_Advisory Board:_\
      \ \"The Advisory Services Team covers App Store SEO, ROI Optimization, International Acquisition\
      \ Campaigns Management…\"  \n_Mobile CRM Experts:_ \"Our team of experts will support you with setting\
      \ up Customer Loyalty Programs.\"  \n_Media Buying & Planning_: \"We will identify the best traffic\
      \ sources, getting the best price (CPC, CPL, CPV, CPD...).\"  \n_IT Team:_ \"We choose next generation\
      \ Mobile Marketing technologies, at the cutting-edge of innovation.\"  \n_Data Mining Team:_ \"\
      We manage the extraction, integration and analysis of large volumes of DATA to optimize your targeting.\"\
      \  \n_Support Team:_ \"We are here to help you planning, implementing SDK, training, preserving,\
      \ updating...\" [Ad4Screen, 02](http://www.ad4screen.com/en/presentation)  \n* (translated from\
      \ French:) \"Our Experts select the best formats, supports, boards and Ad-Exchanges of the market\
      \ to effectively highlight the benefits and offers of your mobile site and / or tablet.\" [Ad4Screen,\
      \ 03](http://www.ad4screen.com/publicite-mobile)\nAd4Screen also helps clients set up trigger marketing\
      \ campaigns [Ad4Screen, 01](http://www.ad4screen.com/en).\n## Privacy Policy\nAd4Screen does not\
      \ appear to list a privacy policy for End Users; see [Ad4Screen, 07](http://www.ad4screen.com/en/privacy-police).\n\
      ## Relationships\nAdd4Screen lists 200 customers and 5,000 mobile campaigns [Ad4Screen, 02](http://www.ad4screen.com/en/presentation)\n\
      _\"They Trust Us\":_ Betclic / Bouyges Telecom / Europcar / SFR / numericable / ebookers / La Tribune\
      \ / Le Figaro / Universal Music / Axa / Airfrance KLM / Danone / Saxo Banque / Capcom / Cadremploi.fr\
      \ / nexity / pole emploi / Rocket Internet / Condé Nast / Nestle / vente-privee.com / Pages Jaunes\
      \ / Groupe Casino / Voyages-sncf.com / The Walt Disney Company / Price Minister (Rakuten Group)\
      \ / Club Med / Century 21 / TF1 / Monoprix / keljob.com / kobojo / Explorimmo / easyflirt / Le Monde\
      \ / LA Tribune / La Redoute / Malakoff-Médéric / Le PointNathan / Radio France / Orange S.A. (ex\
      \ France Télécom S.A.) / Pôle emploi (government agency for unemployed) [Ad4Screen, 02](http://www.ad4screen.com/en/presentation),\
      \ [Ad4Screen, 05](http://www.ad4screen.com/en/mobile-advertising)  OTC Agregator [Ad4Screen, 01](http://www.ad4screen.com/en),\
      \ [Ad4Screen, 04](http://www.ad4screen.com/en/nos-references)  \n_Mobile First Alliance:_ In 2014,\
      \ Ad4Screen \"split its activities into two separate and independent companies\", Accengage and\
      \ Ad4Screen. Accengage offers a Mobile CRM technology while Ad4Screen specializes in \"mobile media\
      \ buying and mobile relationship marketing consulting\". The Mobile First Alliance was formed thereafter,\
      \ composed of three companies: Accengage, Ad4Screen, and Relatia. (Quotes are translated from French.)\
      \ [Marketing web mobile, 01](http://marketing-webmobile.fr/2014/09/ad4screen-separe-ses-activites-dediteur-de-logiciels-de-mobile-crm-et-dagence-de-publicite-mobile).\n\
      ## Details\n_Financial details:_ Ad4Screen was founded in 2010 and has raised $10 million [Ad4Screen,\
      \ 02](http://www.ad4screen.com/en/presentation); [Crunchbase, 01](https://www.crunchbase.com/organization/ad4screen).\
      \ They were crowdfunded by OTC Agregator, a big French Insurance Company (MMA) and Web contractors\
      \ (Business Interactive Founders as WCube, Betclic, Boncoin or Poweo) [Ad4Screen, 02](http://www.ad4screen.com/en/presentation).\n\
      _Devices:_ Mobile and tablet media; iOS and Android [Ad4Screen, 03](http://www.ad4screen.com/publicite-mobile);\
      \ works with iBeacons [Ad4Screen, 07](http://www.ad4screen.com/ibeacon).\n### Methods\nRetargeting\
      \ / Push Notifications / GeoTargeted Mobile Advertising / iBeacon, Geofencing, QR Code / Mobile\
      \ tracking (including across apps) / Conversion tracking (including intelligent algorithms for in-app\
      \ conversion)    \n_Mobile Push Notification & In-app Message:_  \"Do you have a smartphone app?\
      \ Benefit from push notification, the new and efficient communication channel to interact with your\
      \ app visitors. Communicate in real time, by sending the right message, to the right person, at\
      \ the right time toward the right place inside the app. Our CRM Mobile Experts help you build customer\
      \ loyalty programs in order to create more proximity and engagement with your app users.\"  \n_Customer\
      \ Loyalty Programs:_ \"Ad4Screen enables you to set up a True Value added customer loyalty programs\
      \ with your savvy shoppers to dialog with them at each touchpoint of their life cycle.  \n  * Set\
      \ up trigger marketing scenarios (send fully automated follow-ups according to mobile user behavior)\"\
      \  \n  * Display a welcome message at first open  \n  * Send out alerq messages tbox messages in\
      \ an application’s life-cycle (last update, error messages, news feed…)  \n  * Send out good deals\
      \ to capture a growing share of revenue  \n  * Reactive abandoned shopping carts    \n_Mobile Retargeting:_\
      \ \"2 retargeting methods roll into action to retarget your digital device users:  \n  * From opt-in\
      \ to push notification, mobile users are identified by Ad4Screen as having abandoned their shopping\
      \ cart and reminded via customized push notifications  \n  * No opt-in to push are retargeted in\
      \ a display mode through targeted customized banners and interstitials    \n_Responsive Email:_\
      \ \"Ad4Screen delivers a Customer Seamless Experience to read your newsletter on Smartphone by displaying\
      \ the email according to the device used by the user.  \nNet benefits with responsive email:  \n\
      \  * Email designed according to the screen size of the device  \n  * Make it easier to read and\
      \ interact with your current and prospective customers    \n  * Optimize Click-Through-Rates (Click-to-Open\
      \ Rates, Click Conversation Rates)  \n  * Yield a significant ROI  \n_Mobile Email Tag:_ \"Discover\
      \ belong your subscribers who read your newsletters from a smartphone and display them in real time\
      \ a bespoke banner offering to download your app.  \nNet benefits with Mobile Email Tag:  \n  *\
      \ Redefine smartphone users to individual profile  \n  * Complete mobile user’s status  \n  * Enrich\
      \ profiles according to the device used  \n  * Drive more traffic and generate high quality installs!\
      \  \n_Passbook:_ \"Thanks to Ad4Screen, discover Passbook and boost your in-store traffic. The application\
      \ is able to stock reward cards, ad spend coupons and other tickets. With Passbook you can:\n  *\
      \ Dematerialize your loyalty reward cards, ad spend coupons, tickets… without the need to develop\
      \ an app dedicate for it  \n  * Generate in-store traffic by sending a relevant message or a push\
      \ based on user’s location  \n  * Plan specific events and remind them the last discount day  \n\
      \  * Recommend to install your iPhone app  [Ad4Screen, 06](http://www.ad4screen.com/en/push-notifications)\n\
