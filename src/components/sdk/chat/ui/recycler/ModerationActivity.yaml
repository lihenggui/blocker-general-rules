i18n:
  en:
    description: Chat SDK opens this screen when an authorized user selects a member in a group conversation.
      Depending on permissions, it can show that member's profile, change their role or speaking access,
      or remove them from the group.
    disableEffect: Authorized users cannot manage group-member roles, speaking access, or removal through
      this screen.
  zh-CN:
    description: 有权限的用户在群聊中选择成员时，Chat SDK 会打开此界面。根据权限，用户可查看成员资料、修改其角色或发言权限，或将其移出群聊。
    disableEffect: 有权限的用户无法通过此界面管理群成员角色、发言权限或移除成员。
