i18n:
  en:
    description: Honor Ads SDK displays a full-screen interstitial ad when an ad is ready to show and
      reports whether the display was closed or failed.
    disableEffect: Honor full-screen ads will no longer appear, while the host app's other features remain
      available.
  zh-CN:
    description: 广告准备展示时，Honor 广告 SDK 会打开此全屏插屏广告，并记录广告关闭或展示失败的结果。
    disableEffect: 屏蔽后，Honor 全屏广告将无法显示，应用的其他功能仍可使用。
