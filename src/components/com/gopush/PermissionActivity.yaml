i18n:
  en:
    description: When goPUSH (iWinBack) requests notification permission on Android 13 or later, this
      Activity shows the system prompt and returns the user’s choice to the SDK.
    disableEffect: Users who have not granted notification permission will not be able to grant it through
      goPUSH, so its notifications may remain off.
  zh-CN:
    description: goPUSH（iWinBack）在 Android 13 及更高版本请求通知权限时，此 Activity 会显示系统提示，并将用户的选择交还给 SDK。
    disableEffect: 尚未授权的用户无法通过 goPUSH 完成通知授权，因此可能收不到 goPUSH 通知。
