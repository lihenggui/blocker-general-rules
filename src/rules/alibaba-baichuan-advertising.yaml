  en:
    name: Alibaba Baichuan Advertising
    description: Ali Baichuan opens up Taobao's e-commerce capabilities to help app developers quickly
      and cost-effectively build wireless e-commerce shopping guide businesses in various scenarios, develop
      user consumption demands, and achieve commercial monetization. Whether it is an entrance-type app,
      a shopping guide app, a vertical app, or a utility app, all can use Ali Baichuan's e-commerce SDK
      to find suitable scenarios for monetization. It can be used with H5 to realize the "in-app transaction
      closed loop" or launch mobile Taobao to realize the "outbound hand-Taobao transaction closed loop".
    sideEffect: Unknown
    company: Alibaba
  zh-CN:
    name: 阿里百川广告
    description: 阿里百川开放淘系电商能力，帮助APP开发者在各种场景下快速、低成本搭建无线电商导购业务，开发用户消费需求，实现商业变现。无论是入口类APP、导购类APP、垂直类APP、工具类APP，均可利用阿里百川的电商SDK找到合适场景进行变现，可以用H5实现“APP内交易闭环”或拉起手机淘宝实现“外呼手淘交易闭环”。
    sideEffect: 未知
    company: 阿里巴巴
