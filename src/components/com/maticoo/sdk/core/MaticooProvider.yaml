recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:06:16Z'
i18n:
  en:
    description: Maticoo Ads sets up automatic app-activity tracking when the host app starts. The SDK
      uses it to follow activity changes while its ads are in use.
    disableEffect: Maticoo's automatic activity tracking will not start; the host app's normal screens
      remain available.
  zh-CN:
    description: Maticoo 广告 SDK 会在宿主应用启动时初始化自动的页面活动跟踪，供其广告功能使用。
    disableEffect: Maticoo 的自动活动跟踪不会启动；宿主应用的普通页面仍可使用。
