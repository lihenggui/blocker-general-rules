    description: When Sensors Focus launches an in-app campaign, this Activity displays its pop-up content
      over the current screen and records whether it was shown.
    disableEffect: Sensors Focus in-app campaign pop-ups and app flows that depend on them will no longer
      appear.
  zh-CN:
    description: Sensors Focus 启动应用内活动时，此 Activity 会在当前页面上显示弹出内容，并记录内容是否成功展示。
    disableEffect: Sensors Focus 应用内活动弹窗及依赖这些弹窗的应用流程将无法显示。
