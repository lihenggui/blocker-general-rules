i18n:
  en:
    description: When KOOM receives a request to analyze a saved Java heap dump, this service runs in
      the separate `:heap_analysis` process, analyzes the dump, and returns the result.
    disableEffect: KOOM will no longer analyze heap dumps through this service, so its Java memory diagnostic
      result will be unavailable.
  zh-CN:
    description: KOOM 收到分析 Java 堆转储文件的请求时，此 Service 会在独立的 `:heap_analysis` 进程中分析文件并返回结果。
    disableEffect: KOOM 将无法通过此 Service 分析堆转储文件，因此不会生成相应的 Java 内存诊断结果。
