recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Clover Connector starts this Service when a supported USB payment reader is set up, connected,
      or disconnected. It opens the reader connection and carries payment messages between the app and
      the reader.
    disableEffect: The app will not be able to communicate with a Clover reader over USB, so transactions
      that rely on it may fail.
  zh-CN:
    description: 设置、连接或断开受支持的 USB 支付读卡器时，Clover Connector 会启动此 Service。它会打开读卡器连接，并在应用与读卡器之间传递支付消息。
    disableEffect: 应用将无法通过 USB 与 Clover 读卡器通信，因此依赖该读卡器的交易可能失败。
