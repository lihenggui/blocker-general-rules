i18n:
  en:
    description: Vivo Push sends registration updates, foreground messages, and call messages here. This
      receiver passes them to EngageLab’s push and call handling.
    disableEffect: Vivo-delivered EngageLab notifications stop, and apps that rely on its call messages
      may miss incoming calls.
  zh-CN:
    description: Vivo Push 会将注册更新、前台消息和通话消息发送给此接收器；它再转交给 EngageLab 的推送和通话处理流程。
    disableEffect: Vivo 渠道的 EngageLab 通知将停止；依赖此通话消息的应用可能无法收到来电。
