i18n:
  en:
    description: When the Requestly in-app HTTP inspector shares an exported request or response file,
      this Provider makes the file available to Android's share sheet.
    disableEffect: File-based Requestly exports cannot be shared and may fail when the inspector tries
      to create a share link.
  zh-CN:
    description: Requestly 应用内 HTTP 检查工具分享导出的请求或响应文件时，此 Provider 会将文件提供给 Android 分享面板。
    disableEffect: Requestly 将无法分享文件形式的导出内容，检查工具生成分享链接时也可能失败。
