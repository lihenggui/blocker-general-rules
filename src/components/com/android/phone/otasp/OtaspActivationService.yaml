  en:
    description: 'otasp activation service handles all logic related with OTASP call. OTASP is a CDMA-specific
      feature: OTA or OTASP == Over The Air service provisioning In practice, in a normal successful OTASP
      call, events come in as follows: - SPL_UNLOCKED within a couple of seconds after the call starts
      - PRL_DOWNLOADED and MDN_DOWNLOADED and COMMITTED within a span of 2 seconds - poll cdma subscription
      from RIL after COMMITTED - SIM reloading with provisioned MDN and MIN'
