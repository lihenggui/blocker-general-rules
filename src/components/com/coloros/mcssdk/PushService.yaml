i18n:
  en:
    description: The OPPO/Heytap push SDK starts this Service to handle platform push messages and registration
      results, then forwards them to the app's configured push handlers.
    disableEffect: OPPO-channel push registration and message handling will stop, so notifications through
      that channel will not reach the app.
  zh-CN:
    description: OPPO/Heytap 推送 SDK 会启动此 Service 处理平台推送消息和注册结果，再转交给应用配置的推送处理器。
    disableEffect: 停用后，OPPO 通道的推送注册和消息处理会停止，应用将收不到该通道的通知。
