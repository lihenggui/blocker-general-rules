i18n:
  en:
    description: When an app using CarterChen247 Alarm Scheduler starts, this provider makes the app's
      context available so the scheduler can use Android alarm services. Disabling it can prevent the
      app's scheduled alarms from being set up.
    disableEffect: The app's alarm scheduler may fail to create or restore reminders and background tasks.
  zh-CN:
    description: 使用 CarterChen247 Alarm Scheduler 的应用启动时，此提供程序会为调度器准备应用上下文，使其能够使用 Android 闹钟服务。禁用后，应用可能无法设置定时任务。
    disableEffect: 应用的调度器可能无法创建或恢复提醒及后台任务。
