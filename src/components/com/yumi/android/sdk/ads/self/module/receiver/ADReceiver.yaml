i18n:
  en:
    description: Yumi Mediation Ads SDK receives Android's download-complete broadcast for its ad downloads.
      It finds the matching Yumi download and processes the resulting APK.
    disableEffect: Downloaded Yumi ad or offer files may not finish processing, so related ads can fail
      to open.
  zh-CN:
    description: Yumi 广告中介 SDK 会接收其广告下载对应的 Android 下载完成广播，找到相应任务并处理下载的 APK。
    disableEffect: 停用后，Yumi 广告或推广应用的下载文件可能无法处理完成，相关广告也可能无法打开。
