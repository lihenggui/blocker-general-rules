recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:15:26Z'
i18n:
  en:
    description: Google Mobile Ads Mediation Test Suite opens this screen for a selected configured item.
      It lists that item's mediation sources and can load test ads from sources selected by the developer.
    disableEffect: Developers can no longer review that item's mediation sources or run batch test-ad
      requests; regular ad delivery is unaffected.
  zh-CN:
    description: 开发者在 Google Mobile Ads 中介测试套件中选择一项配置后，会打开此页面。页面列出该项的中介来源，并可从开发者选中的来源加载测试广告。
    disableEffect: 开发者将无法在此查看该配置项的中介来源或批量请求测试广告；常规广告投放不受影响。
