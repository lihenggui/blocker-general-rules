  en:
    description: Chalk Digital's CD Ads SDK starts this service for one-time or ongoing device location
      updates and address lookups. It sends location changes to the SDK's tracking service.
    disableEffect: CD Ads will stop receiving location updates for its location-based ad features and
      tracking.
  zh-CN:
    description: Chalk Digital 的 CD Ads 广告 SDK 会启动此服务，获取一次性或持续的设备位置更新及地址信息，并将位置变化发送给 SDK 的追踪服务。
    disableEffect: 停用后，CD Ads 的位置相关广告和追踪将无法收到位置更新。
