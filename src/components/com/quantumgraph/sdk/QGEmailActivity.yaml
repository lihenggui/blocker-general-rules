i18n:
  en:
    description: When an older Appier AIQUA campaign requests an email, this screen can ask permission
      to read email addresses saved in Android accounts and add them to the AIQUA profile.
    disableEffect: That optional account-based email collection will no longer run; the app’s other features
      remain available.
  zh-CN:
    description: 较早版本的 Appier AIQUA 营销活动请求电子邮箱时，此页面可申请读取 Android 账户中保存的邮箱地址，并将其添加到 AIQUA 用户资料。
    disableEffect: 此可选的账户邮箱收集功能将无法运行，应用的其他功能仍可使用。
