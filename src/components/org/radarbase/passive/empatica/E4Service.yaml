i18n:
  en:
    description: When RADAR-base collection is configured for an Empatica E4 wristband, this service scans
      for and connects to the band, then collects movement, pulse, blood-volume pulse, skin response,
      heartbeat intervals, temperature, battery, and device status.
    disableEffect: RADAR-base will stop connecting to Empatica E4 wristbands and collecting their sensor
      readings.
  zh-CN:
    description: 当 RADAR-base 配置为采集 Empatica E4 腕带数据时，此服务会搜索并连接腕带，然后采集运动、脉搏、血容量脉搏、皮肤反应、心搏间隔、温度、电量和设备状态。
    disableEffect: RADAR-base 将无法连接 Empatica E4 腕带或继续采集其传感器数据。
