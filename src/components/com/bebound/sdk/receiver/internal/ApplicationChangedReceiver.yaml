recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: The Be-Bound messaging SDK receives Android broadcasts when apps are installed, updated,
      or removed and checks whether the changed package is Be-Bound Services. If that service package
      changes, it signals the host app and unregisters the messaging setup when the service is removed.
    disableEffect: The SDK will not detect Be-Bound Services changes, so its automatic messaging registration
      and cleanup may be left out of date.
  zh-CN:
    description: Be-Bound 消息 SDK 会接收 Android 在应用安装、更新或卸载时发出的广播，并检查发生变化的包名是否属于 Be-Bound Services。该服务安装、更新或移除时，它会通知宿主应用；移除时还会注销消息注册。
    disableEffect: SDK 将无法发现 Be-Bound Services 的变化，因此自动消息注册或清理可能无法及时进行。
