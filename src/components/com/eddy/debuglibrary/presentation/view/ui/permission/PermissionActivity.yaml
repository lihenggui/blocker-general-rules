recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:25:53Z'
i18n:
  en:
    description: The visibledebugtool library by snaps-eddy opens this Activity when its floating log
      viewer needs permission to appear over other apps. Its prompt can take the user to Android's overlay
      permission settings.
    disableEffect: The tool cannot guide the user to grant overlay access, so its log viewer may remain
      unavailable until that permission is enabled in system settings.
  zh-CN:
    description: snaps-eddy 的 visibledebugtool 库在悬浮日志面板需要显示在其他应用上层的权限时打开此 Activity，并可引导用户前往 Android 悬浮窗权限设置。
    disableEffect: 停用后，该工具无法引导用户开启悬浮窗权限；如果尚未授予权限，日志面板可能无法使用。
