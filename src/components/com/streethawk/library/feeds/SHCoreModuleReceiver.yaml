i18n:
  en:
    description: This component is part of the StreetHawk mobile engagement SDK. When StreetHawk's app-status
      response reports a changed feed timestamp, this receiver notifies the feed listener and announces
      that a new feed item is available in the app.
    disableEffect: New StreetHawk feed items may not be announced or refreshed in the app's feed.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。StreetHawk 的应用状态响应报告信息流时间戳变化时，此接收器会通知信息流监听器，并告知应用有新的信息流内容。
    disableEffect: 应用可能无法收到新 StreetHawk 信息流内容的提示或刷新信息流。
