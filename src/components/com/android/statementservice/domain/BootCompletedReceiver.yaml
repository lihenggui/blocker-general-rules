  en:
    description: Handles [Intent.ACTION_BOOT_COMPLETED] to schedule recurring maintenance [WorkManager]
      tasks and run a one-time retry request to attempt to verify domains that may have failed or been
      added since last device reboot. Note that this requires the user to have unlocked the device, since
      [WorkManager] cannot handle the encrypted user data directories.
