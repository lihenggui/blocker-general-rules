recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:31:15Z'
i18n:
  en:
    description: The VisibleDebugTool visible_logcat library starts this service when its floating log
      viewer is enabled. It places the live log panel over other apps and handles searches from that panel.
    disableEffect: Disabling it removes the floating log panel and its search and clear controls, while
      the host app continues to work normally.
  zh-CN:
    description: VisibleDebugTool visible_logcat 日志库在启用悬浮日志查看器时启动此服务。它会把实时日志面板显示在其他应用上方，并处理面板中的搜索操作。
    disableEffect: 停用后，悬浮日志面板及其搜索和清除功能不可用，宿主应用仍可正常使用。
