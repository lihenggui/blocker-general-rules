i18n:
  en:
    description: The Bemobi Medescope download library starts this service after a download finishes or
      its notification is tapped. It matches the Android download to the app request and sends the completion
      result or opens the queue.
    disableEffect: The app may not receive Medescope download results, and download notification taps
      may stop opening the queue.
  zh-CN:
    description: Bemobi Medescope 下载库会在下载完成或用户点击下载通知后启动此服务，将系统下载与应用请求对应起来，再传回完成结果或打开下载队列。
    disableEffect: 停用后，应用可能收不到 Medescope 下载结果，点击下载通知也可能无法打开队列。
