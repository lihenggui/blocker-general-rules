  en:
    description: Ddnosh's ARabbit Android development SDK opens this Activity when the app requests a
      web page; it displays the supplied address, or ARabbit's default page, in an in-app browser with
      loading progress and back navigation.
    disableEffect: Web pages opened through ARabbit's in-app browser will no longer be available.
  zh-CN:
    description: Ddnosh 的 ARabbit Android 开发库会在应用请求打开网页时启动此 Activity；它会在应用内浏览器中显示指定地址或 ARabbit 默认页面，并提供加载进度和返回导航。
    disableEffect: 通过 ARabbit 应用内浏览器打开的网页将无法使用。
