i18n:
  en:
    description: RongCloud IM push uses this receiver to pass incoming push events to its background service.
      The service can then process the event without opening the chat screen.
    disableEffect: RongCloud push events will not reach the background push service, so background message
      notifications may stop.
  zh-CN:
    description: 融云 IM 推送使用此接收器把收到的推送事件交给后台服务。随后服务会处理事件，而无需打开聊天页面。
    disableEffect: 融云推送事件将无法交给后台推送服务，因此应用在后台时可能不再收到消息通知。
