recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:51:41Z'
i18n:
  en:
    description: When the app opens the InAd Network offer wall, this Activity loads promoted app offers
      and lets users open the advertised app or page; it also records clicks and checks completed installs.
    disableEffect: The offer wall and its install offers disappear, and users will no longer earn credits
      for completing those offers.
  zh-CN:
    description: 应用打开 InAd Network 任务墙时，此 Activity 会加载推广应用的任务，并允许用户打开广告中的应用或页面；它还会记录点击并检查安装是否完成。
    disableEffect: 任务墙及其中的安装任务将消失，用户也无法再通过完成这些任务获得积分。
