i18n:
  en:
    description: The Tinkoff Acquiring SDK opens this Activity from its card-entry screen when the shopper
      chooses NFC card scanning. It reads a supported card's NFC data and returns the parsed card details
      to the payment form.
    disableEffect: The older SDK's NFC card-scanning option will not work.
  zh-CN:
    description: 用户在 Tinkoff 收单 SDK 的银行卡输入页面选择 NFC 扫卡时，SDK 会打开此 Activity。它读取兼容银行卡的 NFC 数据，解析后将卡片信息返回支付表单。
    disableEffect: 旧版 SDK 的 NFC 扫卡功能将无法使用。
