  en:
    description: Purchasely opens this Activity for Huawei AppGallery purchase or update results; it reads
      the result and returns the purchase state to Purchasely.
    disableEffect: Disabling it can prevent Huawei purchase outcomes from reaching Purchasely, so Huawei-billed
      subscriptions may fail to complete or update.
  zh-CN:
    description: Purchasely 会用此 Activity 处理华为应用市场的购买或更新结果，并把购买状态交回 SDK。
    disableEffect: 停用后，华为购买结果可能无法返回 Purchasely，用户可能无法完成或更新华为渠道的订阅。
