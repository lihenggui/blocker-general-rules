  en:
    description: AuthMe NFC and OCR NFC flows open this Activity to read supported identity-document chips.
      It accepts document details, activates NFC reading, and returns scanned data and a photo.
    disableEffect: Apps using AuthMe NFC document reading cannot complete the scan.
  zh-CN:
    description: AuthMe NFC 和 OCR NFC 流程会打开此界面读取受支持的身份证件芯片。它接收证件信息、启动 NFC 读取，并返回扫描数据和照片。
    disableEffect: 使用 AuthMe NFC 证件读取的应用将无法完成扫描。
