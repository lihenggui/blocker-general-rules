i18n:
  en:
    description: Baidu Push starts this receiver for incoming messages, notification events, and registration
      callbacks. Pushwoosh forwards message content to its notification handling and records successful
      or failed registration.
    disableEffect: Pushwoosh will stop receiving Baidu push messages and registration updates.
  zh-CN:
    description: 百度推送送达消息、通知事件或注册回调时会启动此接收器；Pushwoosh 会处理消息内容并记录注册成功或失败的状态。
    disableEffect: Pushwoosh 将无法再接收百度推送消息和注册状态更新。
