i18n:
  en:
    description: When an app asks for a place search, Google Places SDK for Android opens this older search
      screen; users can enter a place and send the result back to the app.
    disableEffect: Apps that use this place-search screen will lose place suggestions and selection.
  zh-CN:
    description: 应用请求地点搜索时，Google Places SDK for Android 会打开此旧版搜索页面；用户输入地点后，可将结果返回应用。
    disableEffect: 使用此地点搜索页面的应用将无法显示地点建议或返回所选地点。
