i18n:
  en:
    description: ExtScreen's ad player opens a full-screen Activity for an ad video, loads the supplied
      video resource, and plays it. It stops the video when the screen leaves view.
    disableEffect: Video ads handled by ExtScreen will not play.
  zh-CN:
    description: ExtScreen 广告播放器会为视频广告打开全屏 Activity，加载给定的视频资源并播放；界面离开前台时会停止视频。
    disableEffect: ExtScreen 处理的视频广告将无法播放。
