recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:05:32Z'
i18n:
  en:
    description: The Xlythe Message Based Notifications library uses this receiver to restore a saved
      notification value from Android's system-held copy when the value is requested. The restored value
      is put back into the library's cache.
    disableEffect: The library may lose saved conversation and message data needed to rebuild notifications
      after it leaves memory.
  zh-CN:
    description: Xlythe Message Based Notifications 库需要读取保存的通知数据时，会通过此接收器从 Android 暂存的数据中恢复对应值，再放回库的缓存。
    disableEffect: 应用进程退出后，库可能无法恢复重建通知所需的会话和消息数据。
