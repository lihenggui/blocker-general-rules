  en:
    description: The EGLS (EasyGames) support library opens this embedded browser for SDK web pages, external
      return links, and web-payment or promotion flows. It also accepts browsable links such as the configured
      Twitter return link.
    disableEffect: Players cannot complete web-based payments or return through links handled by the SDK
      browser.
  zh-CN:
    description: EGLS（EasyGames）支持库会在打开 SDK 网页、处理外部返回链接以及网页支付或推广流程时显示此内置浏览器。它也会接收可浏览的链接，例如已配置的 Twitter
      返回链接。
    disableEffect: 停用后，玩家无法完成网页支付，也无法通过 SDK 浏览器处理的链接返回应用。
