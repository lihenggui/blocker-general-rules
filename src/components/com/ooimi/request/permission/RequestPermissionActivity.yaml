recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:07:44Z'
i18n:
  en:
    description: When an app uses OOIMI AndroidLibraryX to request runtime permissions, this Activity
      asks Android for the requested access and returns whether it was granted or denied. It can also
      guide users to Settings when a permission has been permanently denied.
    disableEffect: The app cannot use OOIMI's permission screen to request access, so features that need
      those permissions may be unavailable.
  zh-CN:
    description: 应用通过 OOIMI AndroidLibraryX 申请运行时权限时，此 Activity 会向 Android 请求所需权限，并返回获批或拒绝的结果。若权限已被永久拒绝，它还可以引导用户前往系统设置。
    disableEffect: 应用将无法通过 OOIMI 的权限界面申请权限，因此依赖这些权限的功能可能无法使用。
