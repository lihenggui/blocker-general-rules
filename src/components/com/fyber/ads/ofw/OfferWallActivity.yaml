i18n:
  en:
    description: Fyber OfferWall Edge and FairBid display an in-app offer wall with advertiser offers.
      It opens when the app launches the offer wall; disabling it also makes rewards tied to those offers
      unavailable.
    disableEffect: The in-app Fyber offer wall and rewards tied to its offers will be unavailable; ordinary
      app features continue.
  zh-CN:
    description: Fyber OfferWall Edge 和 FairBid 会在应用内显示广告主提供的任务和优惠。应用打开 Offer Wall 时会运行此页面；禁用后，与这些优惠关联的奖励也无法领取。
    disableEffect: 禁用后，Fyber 应用内 Offer Wall 和其中关联的奖励将无法使用；应用的普通功能不受影响。
