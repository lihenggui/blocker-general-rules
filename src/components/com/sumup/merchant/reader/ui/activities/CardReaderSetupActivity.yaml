i18n:
  en:
    description: When a merchant connects a SumUp card reader, this Activity discovers and pairs Bluetooth
      readers, handles connection permissions, and can install firmware updates; it also supports a wired
      setup path.
    disableEffect: If disabled, merchants cannot set up or connect a card reader, so payments that require
      the reader may fail.
  zh-CN:
    description: 商户连接 SumUp 读卡器时，此 Activity 会搜索并配对蓝牙读卡器、处理连接权限和固件更新，也支持有线连接。
    disableEffect: 停用后，商户无法设置或连接读卡器，需要读卡器的付款可能失败。
