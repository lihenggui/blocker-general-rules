  en:
    description: When ShopLive requests permissions for a live-streaming feature, this Activity presents
      the Android permission flow and returns the user's decision to the SDK.
    disableEffect: Disabling it breaks ShopLive permission requests, so features that need camera or microphone
      access cannot continue.
  zh-CN:
    description: ShopLive 的直播功能请求权限时，此 Activity 会显示 Android 权限流程，并将用户的选择返回给 SDK。
    disableEffect: 停用后，ShopLive 权限请求会中断，需要摄像头或麦克风的功能将无法继续。
