i18n:
  en:
    description: The lavalike OkHttp network SDK starts this provider with the app to save its application
      context and register activity tracking used by the networking library. This initialization happens
      before the app shows a screen.
    disableEffect: The SDK's networking setup may be missing, and calls that rely on it can fail.
  zh-CN:
    description: 应用启动时，lavalike 的 OkHttp 网络 SDK 会通过此提供器保存应用上下文，并注册网络库使用的界面生命周期跟踪。此初始化会在显示界面前发生。
    disableEffect: SDK 的网络初始化可能缺失，依赖它的网络请求可能失败。
