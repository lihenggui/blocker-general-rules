i18n:
  en:
    description: When a VideoEngager call loses its internet connection, this Activity shows a reconnect
      screen; tapping reconnect asks the SDK to try the connection again.
    disableEffect: The call’s reconnect screen and retry action will not open, so the app may not recover
      properly after a connection loss.
  zh-CN:
    description: VideoEngager 通话失去网络连接时，此 Activity 会显示重连界面；点击重连后，SDK 会再次尝试连接。
    disableEffect: 通话的重连界面和重试操作将无法打开，网络中断后应用可能无法恢复通话。
