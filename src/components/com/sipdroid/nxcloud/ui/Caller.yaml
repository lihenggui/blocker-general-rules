i18n:
  en:
    description: When Android reports an outgoing phone call, the NXCloud SIP calling SDK checks the selected
      call mode and may route the number through internet calling instead of the phone network. It also
      handles answer or reject actions during an active call when Bluetooth audio is available.
    disableEffect: Outgoing calls will no longer be intercepted for the SDK's internet-call routing or
      its related active-call handling.
  zh-CN:
    description: Android 通知有外拨电话时，NXCloud SIP 通话 SDK 会根据所选模式判断是否改用网络通话，而不是电话网络；蓝牙音频可用时，它也会处理当前通话的接听或拒接操作。
    disableEffect: 外拨电话将不再经过 SDK 的网络通话路由，相关的当前通话处理也会失效。
