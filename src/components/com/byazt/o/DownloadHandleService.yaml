recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T16:04:13Z'
i18n:
  en:
    description: Pangle starts this Service when an ad download needs waking or another process reports
      download activity, so its download status can be updated.
    disableEffect: Ad downloads that rely on background or cross-process updates may not start or show
      current progress.
  zh-CN:
    description: 广告下载需要唤醒，或其他进程报告下载变化时，Pangle 会启动此 Service 更新下载状态。
    disableEffect: 依赖后台或跨进程更新的广告下载可能无法开始或显示最新进度。
