i18n:
  en:
    description: The Yoyo image-recognition SDK starts this service when it binds for camera access; the
      service loads a USB camera and keeps the camera connection available to the SDK while active.
    disableEffect: The Yoyo SDK will not be able to use its USB camera path for image capture and recognition.
  zh-CN:
    description: Yoyo 图像识别 SDK 绑定摄像头时会启动此服务；服务会加载 USB 摄像头，并在运行期间为 SDK 保持摄像头连接。
    disableEffect: 停用后，Yoyo SDK 将无法通过此服务使用 USB 摄像头进行图像采集和识别。
