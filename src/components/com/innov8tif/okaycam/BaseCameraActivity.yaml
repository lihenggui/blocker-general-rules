i18n:
  en:
    description: OkayCam (Innov8tif) uses this shared camera Activity beneath its document and selfie
      screens. It handles camera permission, preview, focus and still-photo capture for those screens.
    disableEffect: It has no separate camera screen, so disabling this entry does not remove those functions
      from the actual OkayCam capture screens.
  zh-CN:
    description: OkayCam（Innov8tif）在证件和自拍界面中继承这个共享相机 Activity。它负责相机权限、预览、对焦和拍照。
    disableEffect: 它没有独立的相机界面，停用此组件入口不会移除实际 OkayCam 拍摄界面的这些功能。
