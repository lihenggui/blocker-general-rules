  en:
    description: RocketBucket (Rocket Internet) opens this screen after an experiment is selected from
      the list. It shows the available groups and lets the user keep automatic assignment or choose a
      group manually.
    disableEffect: Users can no longer change an experiment between automatic assignment and a manually
      chosen group.
  zh-CN:
    description: 在实验列表中选择一项后，RocketBucket（Rocket Internet）会打开此界面。它会显示可用组别，并允许用户保留自动分配或手动选择组别。
    disableEffect: 用户将无法再为实验切换自动分配或手动选择组别。
