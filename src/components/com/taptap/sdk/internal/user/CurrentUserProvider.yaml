i18n:
  en:
    description: TapTap Login exposes the current signed-in account and access information to TapTap components
      that query the app's private user provider.
    disableEffect: TapTap components will no longer be able to read the signed-in user's profile and access
      information from this provider.
  zh-CN:
    description: TapTap Login 会通过应用的私有用户信息提供器，向查询它的 TapTap 组件提供当前登录账户和访问信息。
    disableEffect: TapTap 组件将无法再通过此提供器读取已登录用户的资料和访问信息。
