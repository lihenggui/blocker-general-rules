i18n:
  en:
    description: When Worldpay Access Checkout broadcasts session responses, this receiver collects the
      requested session results and returns them, or an error, to the checkout flow.
    disableEffect: The checkout flow cannot receive Worldpay's session results, which can stop card payments
      from completing.
  zh-CN:
    description: Worldpay Access Checkout 广播会话响应时，此接收器会收集所需结果并将结果或错误返回给结账流程。
    disableEffect: 停用后结账流程无法收到 Worldpay 会话结果，银行卡支付可能无法完成。
