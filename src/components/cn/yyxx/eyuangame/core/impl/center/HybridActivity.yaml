i18n:
  en:
    description: The Eyuan (YYXXGame) game SDK opens this Activity with a page address when a game feature
      needs an in-game web page; it displays the page, handles links and file selection, and passes page
      actions back to the game.
    disableEffect: Game features that use these web pages, including their links or file selection, will
      not work.
  zh-CN:
    description: 易元（YYXXGame）游戏 SDK 在游戏功能需要打开网页时，会把页面地址交给此 Activity；它显示游戏内网页、处理链接和文件选择，并把页面操作传回游戏。
    disableEffect: 依赖这些网页的游戏功能将无法使用，其中包括网页链接和文件选择。
