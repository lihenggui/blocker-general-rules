i18n:
  en:
    description: Tencent Cloud IM (TIM)'s Firebase push provider starts with the app and registers its
      FCM connector. When the IM SDK requests registration, it obtains the app's Google FCM token and
      returns it.
    disableEffect: FCM registration through Tencent Cloud IM stops; if its still-enabled messaging service
      later reports a token, that callback can fail because this provider is missing.
  zh-CN:
    description: 腾讯云 IM（TIM）的 Firebase 推送提供方会随应用启动并注册连接器。IM 请求注册时，它会获取应用的 Google FCM 令牌并返回。
    disableEffect: 腾讯云 IM 的 FCM 注册会停止；如果仍启用的消息服务之后报告令牌，回调可能因该提供方缺失而失败。
