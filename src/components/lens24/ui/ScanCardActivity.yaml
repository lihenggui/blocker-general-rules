i18n:
  en:
    description: The Lens24 card-scanning SDK opens this screen when the app requests a card scan; it
      uses the camera to read payment-card details and returns the recognized card data or a cancellation
      result to the app.
    disableEffect: Disabling it prevents the app's credit or payment-card scanning flow and leaves the
      caller without scanned card details.
  zh-CN:
    description: Lens24 卡片扫描 SDK 在应用请求扫描银行卡时打开此页面，使用相机识别卡片信息，并将识别结果或取消结果返回应用。
    disableEffect: 停用后，应用无法使用信用卡或支付卡扫描流程，调用方也收不到扫描出的卡片信息。
