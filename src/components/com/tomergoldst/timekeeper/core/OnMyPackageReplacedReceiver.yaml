i18n:
  en:
    description: The TimeKeeper alarm scheduling SDK by Tomer Goldstein receives Android’s broadcast after
      an app update and asks its alarm service to restore the app’s saved alarms.
    disableEffect: Saved TimeKeeper alarms may not be registered again after an app update, so scheduled
      app actions may be missed.
  zh-CN:
    description: Tomer Goldstein 的 TimeKeeper 闹钟调度 SDK 会接收 Android 在应用更新后发出的广播，并让闹钟服务恢复应用保存的闹钟。
    disableEffect: 应用更新后，保存的 TimeKeeper 闹钟可能不会重新注册，因此计划执行的应用操作可能会错过。
