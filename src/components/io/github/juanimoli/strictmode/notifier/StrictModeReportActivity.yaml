recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:57:34Z'
i18n:
  en:
    description: Juan Imoli’s StrictMode Notifier enables this report screen when its diagnostics are
      installed; it lists saved warnings, lets the user turn reporting on or off, and opens a selected
      warning.
    disableEffect: Blocking it removes the warning list and its controls, while the app’s normal features
      continue to work.
  zh-CN:
    description: 安装 Juan Imoli 的 StrictMode Notifier 诊断工具后会启用此报告界面；界面会列出已保存的警告，允许用户开关报告功能并查看选中的警告。
    disableEffect: 停用后，用户将无法查看警告列表或使用相关开关，但应用的正常功能不受影响。
