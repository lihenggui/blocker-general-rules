  en:
    description: The Leap Creator Android SDK developer screen opens from its debug dashboard and lets
      developers edit SDK connection settings, project and locale details, and custom user properties.
      It also controls diagnostic logging and links to saved logs.
    disableEffect: The SDK's developer settings and custom-property controls become unavailable; the app's
      regular screens remain available.
  zh-CN:
    description: Leap Creator Android SDK 的开发者界面从调试面板打开，可修改 SDK 连接设置、项目和语言信息以及自定义用户属性。它还可控制诊断日志并打开已保存的日志。
    disableEffect: SDK 的开发者设置和自定义属性工具将无法使用，应用的日常界面仍可使用。
