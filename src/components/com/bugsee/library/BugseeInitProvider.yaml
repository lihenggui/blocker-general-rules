i18n:
  en:
    description: The Bugsee Android bug reporting SDK runs this Provider at app startup to register app
      lifecycle tracking and start Bugsee automatically when its app settings include a token.
    disableEffect: Bugsee's automatic startup and diagnostic collection will stop, while the host app
      can still open.
  zh-CN:
    description: Bugsee Android 问题报告 SDK 会在应用启动时运行此 Provider，以登记应用生命周期追踪，并在应用设置中提供令牌时自动启动 Bugsee。
    disableEffect: 停用后，Bugsee 将不再自动启动或收集诊断信息，但宿主应用仍可打开。
