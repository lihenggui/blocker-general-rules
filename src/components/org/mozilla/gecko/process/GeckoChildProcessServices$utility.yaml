recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:46:27Z'
i18n:
  en:
    description: Mozilla GeckoView, including the CENO Developers fork for CENO Browser, starts this Service
      when it requests a separate utility process. The Service starts Gecko there and connects the process
      to the engine.
    disableEffect: If GeckoView requests this process while it is disabled, utility work assigned to it
      cannot start and browser features that require that work may fail.
  zh-CN:
    description: Mozilla GeckoView（包括 CENO Developers 为 CENO Browser 提供的分支）请求独立辅助进程时会启动此服务。此服务会在该进程中启动
      Gecko，并将其连接到引擎。
    disableEffect: 停用后，GeckoView 请求此进程时，分配给它的辅助任务将无法启动，依赖这些任务的浏览器功能可能异常。
