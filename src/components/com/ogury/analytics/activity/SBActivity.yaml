recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: After checking whether the app has been idle, the Ogury (Presage) ad SDK briefly opens
      this transparent Activity as a background helper; it closes itself shortly afterward.
    disableEffect: Blocking it stops this Ogury background check from opening its helper screen and may
      reduce SDK tracking or ad maintenance; the app's own screens continue to work.
  zh-CN:
    description: 检查应用是否长时间未活动后，Ogury（Presage）广告 SDK 会短暂打开这个透明 Activity 作为后台辅助界面，随后自动关闭。
    disableEffect: 禁用后，Ogury 无法打开此辅助界面完成后台检查，SDK 的统计或广告维护可能减少；应用自身界面仍可使用。
