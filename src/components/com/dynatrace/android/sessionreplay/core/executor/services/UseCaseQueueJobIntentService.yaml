    description: When Dynatrace Session Replay schedules background work, Android starts this service
      to process session replay data.
    disableEffect: Blocking it stops Dynatrace Session Replay tasks from being processed, while the host
      app continues to work.
  zh-CN:
    description: Dynatrace Session Replay 安排后台工作时，Android 会启动此 Service 处理会话回放数据。
    disableEffect: 禁用后，Dynatrace Session Replay 任务不会得到处理，但宿主应用仍可正常使用。
