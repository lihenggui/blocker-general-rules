recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Octopus runs this background service when a user chooses to download an app promoted
      by an ad. It downloads the package and opens Android’s installer when the download finishes.
    disableEffect: Apps promoted by Octopus ads cannot be downloaded and installed through this service.
  zh-CN:
    description: 用户选择下载广告推广的应用时，Octopus 会启动此后台服务下载安装包，并在完成后打开 Android 安装程序。
    disableEffect: Octopus 广告推广的应用将无法通过此服务下载和安装。
