i18n:
  en:
    description: Android starts this Service when Pangle's scheduled retry is due and the required network
      is available, then it returns the download task to the downloader.
    disableEffect: Interrupted Pangle downloads may not resume automatically after the scheduled delay
      and network conditions are met.
  zh-CN:
    description: Pangle 安排的重试时间到达且网络条件满足时，Android 会启动此 Service，再由它把下载任务交回下载器。
    disableEffect: 中断的 Pangle 下载在等待时间结束且网络恢复后，可能无法自动继续。
