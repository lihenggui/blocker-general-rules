i18n:
  en:
    description: From the forgotten-password option on the sign-in screen, the EGLS (EasyGames) Android
      Game Platform SDK lets a player request a password reset after confirming their registered email
      or phone number with a one-time code.
    disableEffect: Players lose the SDK's email and phone account-recovery path.
  zh-CN:
    description: 玩家在登录界面选择找回密码后，EGLS（EasyGames）Android 游戏平台 SDK 会通过已登记的电子邮箱或手机号发送验证码，并据此提交密码重置请求。
    disableEffect: 停用后，玩家无法通过 SDK 使用电子邮箱或手机号找回账号密码。
