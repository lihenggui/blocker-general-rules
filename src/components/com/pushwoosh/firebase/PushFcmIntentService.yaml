i18n:
  en:
    description: Firebase starts this Pushwoosh service when a push message arrives or the device's push
      token changes. The service forwards both events to Pushwoosh notification handling.
    disableEffect: Pushwoosh will stop receiving Firebase messages and updated push tokens.
  zh-CN:
    description: Firebase 收到推送消息或设备推送令牌变更时，会启动 Pushwoosh 的此服务；该服务会把消息和令牌更新交给 Pushwoosh 处理。
    disableEffect: Pushwoosh 将无法再接收 Firebase 消息和更新后的推送令牌。
