  en:
    description: Starts when an app selects a USB-connected till through the Interswitch Smart Till SDK.
      It connects to the till and carries payment and status messages between the terminal and app.
    disableEffect: The app cannot communicate with a USB-connected till or complete payments through it.
  zh-CN:
    description: 应用通过 Interswitch Smart Till SDK 选择 USB 收银终端时，此服务会启动并连接终端，在应用与终端之间传送支付和状态消息。
    disableEffect: 应用将无法与 USB 收银终端通信，也无法通过它完成支付。
