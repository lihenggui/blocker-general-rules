  en:
    description: When a Mati identity check opens its signing-document PDF, this Provider lets a PDF viewer
      read the document from the app. It is used during that document handoff.
    disableEffect: The signing document may fail to open, preventing the related verification step from
      completing.
  zh-CN:
    description: Mati 身份核验需要打开签署文件 PDF 时，此 Provider 会让 PDF 阅读器读取应用中的文档，并完成文件交接。
    disableEffect: 签署文件可能无法打开，相关核验步骤也可能无法完成。
