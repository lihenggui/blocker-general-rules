  en:
    description: AndroidX XR Projected opens this bridge when a projected-device app needs permissions;
      it forwards the request to a screen on the host device and returns the user's decision.
    disableEffect: Projected-device apps cannot use this flow to request permissions from the host device.
  zh-CN:
    description: AndroidX XR Projected 会在投影设备上的应用需要权限时打开此中转界面，将请求转交给宿主设备上的界面，并返回用户的选择。
    disableEffect: 停用后投影设备上的应用无法通过此流程向宿主设备请求权限。
