i18n:
  en:
    description: Pranav Pandey’s Dynamic Engine listens for Android phone-state broadcasts. When a call
      starts or ends, it sends the corresponding state event to the app’s dynamic task engine.
    disableEffect: Call-aware tasks will no longer receive call start or end updates.
  zh-CN:
    description: Pranav Pandey 的 Dynamic Engine 会监听 Android 电话状态广播。通话开始或结束时，它会向应用的动态任务引擎发送相应状态事件。
    disableEffect: 依赖通话状态的任务将无法再收到通话开始或结束通知。
