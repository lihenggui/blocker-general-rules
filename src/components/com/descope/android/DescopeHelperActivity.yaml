i18n:
  en:
    description: Descope Android SDK opens a supplied sign-in or account-link URL in a Chrome custom tab
      and detects when the user returns or closes it.
    disableEffect: Browser-based sign-in flows using Descope may fail to open or report the user's return
      to the app.
  zh-CN:
    description: Descope Android SDK 会在 Chrome 自定义标签页中打开传入的登录或账号关联网址，并检测用户返回或关闭页面的情况。
    disableEffect: 停用后，使用 Descope 的浏览器登录流程可能无法打开，或无法将用户返回应用的情况告知登录流程。
