i18n:
  en:
    description: Aircore Media starts this Service when a media session needs to keep running in the background.
      It keeps the session in Android’s foreground and shows the app’s playback notice.
    disableEffect: Without it, an Aircore voice or audio session loses its background support and may
      stop when the app is no longer visible.
  zh-CN:
    description: Aircore Media 在媒体会话需要于后台继续运行时启动此 Service。它让会话保持在 Android 前台，并显示应用的播放通知。
    disableEffect: 禁用后，Aircore 的语音或音频会话将失去后台支持，应用不在前台时可能停止。
