i18n:
  en:
    description: Mercado Pago Android SDK opens this Activity before payment submission when the checkout
      is configured to review the order. It shows the items, amount, discount, and selected payment details,
      and can display the terms and conditions.
    disableEffect: The buyer cannot review or confirm the configured order before payment, so that checkout
      flow cannot complete as designed.
  zh-CN:
    description: 结账配置为付款前检查订单时，Mercado Pago Android SDK 会打开此 Activity。它会显示商品、金额、折扣和所选付款信息，并可展示条款。
    disableEffect: 用户无法在付款前检查或确认已配置的订单，因此该结账流程无法按预期完成。
