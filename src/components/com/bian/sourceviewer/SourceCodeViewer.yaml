  en:
    description: Bianling's SourceView viewer opens this Activity when the app requests a source snippet.
      It looks up the requested text in the app's bundled source files and displays it.
    disableEffect: The app's built-in source-snippet viewer will no longer open.
  zh-CN:
    description: 应用请求查看源码片段时，Bianling 的 SourceView 查看器会打开此 Activity。它会从应用自带的源码文件中查找相应内容并显示出来。
    disableEffect: 应用内置的源码片段查看器将无法打开。
