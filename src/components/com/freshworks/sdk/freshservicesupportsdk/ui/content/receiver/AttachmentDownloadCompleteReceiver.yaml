  en:
    description: Freshservice Support listens for Android's completed-download broadcast and opens a support
      attachment after Download Manager finishes downloading it. It runs when an attachment download completes.
    disableEffect: Disabling it can stop a completed support attachment from opening automatically.
  zh-CN:
    description: Freshservice Support 会监听 Android 下载完成广播，并在下载管理器完成附件下载后打开支持附件。附件下载完成时会运行此接收器。
    disableEffect: 禁用后，已下载的支持附件可能不会自动打开。
