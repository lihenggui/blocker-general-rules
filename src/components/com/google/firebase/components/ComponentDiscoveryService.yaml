i18n:
  en:
    description: When Firebase starts, this background service helps it find and set up the Firebase tools
      included in the app. It does not show a screen or handle a user action.
    disableEffect: Firebase tools that rely on this setup may not start, which can make their app features
      unavailable.
  zh-CN:
    description: Firebase 启动时，此后台服务会帮助它查找并准备应用中包含的 Firebase 功能。它不会显示页面，也不处理用户操作。
    disableEffect: 依赖此初始化流程的 Firebase 功能可能无法启动，导致应用中的相关功能无法使用。
