  en:
    description: PluggableAI Fanmeter briefly opens this screen when it needs location access or a location
      setting for event participation. It launches the Android permission or settings prompt and returns
      control to Fanmeter after the user responds.
    disableEffect: Fanmeter cannot request these location permissions or complete location setup, so event
      participation that needs location access may fail.
  zh-CN:
    description: PluggableAI Fanmeter 在活动参与需要位置权限或位置设置时会短暂打开此页面。它会启动 Android 权限或设置提示，并在用户操作后将控制权交还给 Fanmeter。
    disableEffect: Fanmeter 将无法请求这些位置权限或完成位置设置，因此需要位置访问权限的活动参与可能会失败。
