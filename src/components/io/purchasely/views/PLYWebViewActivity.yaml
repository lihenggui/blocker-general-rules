i18n:
  en:
    description: When a Purchasely presentation opens a web page, this Activity displays the supplied
      URL in an in-app browser and routes ordinary web links outward.
    disableEffect: Disabling it prevents Purchasely web pages or checkout links from opening, which can
      block part of a subscription flow.
  zh-CN:
    description: Purchasely 展示内容需要打开网页时，此 Activity 会在应用内显示指定网址，并将普通网页链接交给外部浏览器。
    disableEffect: 停用后，Purchasely 网页或结账链接无法打开，订阅流程的一部分可能中断。
