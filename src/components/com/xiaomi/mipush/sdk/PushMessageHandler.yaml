i18n:
  en:
    description: Xiaomi Mi Push starts this service to parse incoming push work and dispatch messages
      or command results to the app's configured receiver; it also handles small SDK data uploads.
    disableEffect: Xiaomi push messages, command results, and related callbacks will stop being processed.
  zh-CN:
    description: 小米推送会启动此服务解析到达的推送任务，并将消息或指令结果交给应用配置的接收器；它也会处理小米 SDK 的小型数据上传。
    disableEffect: 停用后，小米推送消息、指令结果及相关回调将无法处理。
