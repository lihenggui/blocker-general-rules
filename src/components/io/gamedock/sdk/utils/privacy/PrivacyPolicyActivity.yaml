i18n:
  en:
    description: When Gamedock requests a privacy choice or the user opens privacy settings, this Activity
      shows controls for personalized ads and content, saves the selection, and can continue SDK initialization.
    disableEffect: Blocking it prevents users from completing or changing Gamedock privacy choices and
      may interrupt initialization that waits for consent.
  zh-CN:
    description: Gamedock 请求隐私选择或用户打开隐私设置时，此 Activity 会显示个性化广告和内容选项、保存选择，并可继续 SDK 初始化。
    disableEffect: 停用后，用户无法完成或更改 Gamedock 隐私选择，等待同意结果的初始化流程也可能中断。
