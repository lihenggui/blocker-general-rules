i18n:
  en:
    description: Venom (YarikSOffice) is a developer tool for testing process-death behavior. This Activity
      waits about a second after opening, then ends the app process; one test mode moves the app to the
      background first.
    disableEffect: Blocking it disables the Venom process-death test, while normal app features continue
      to work.
  zh-CN:
    description: Venom（YarikSOffice）是用于测试进程退出行为的开发工具。此 Activity 打开约一秒后会结束应用进程；一种测试模式会先将应用移至后台。
    disableEffect: 停用它会使 Venom 进程退出测试无法运行，但应用的正常功能仍可使用。
