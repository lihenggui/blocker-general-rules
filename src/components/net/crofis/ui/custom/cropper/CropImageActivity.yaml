  en:
    description: The Crofis Android UI Kit opens this screen when the app asks to crop an existing image.
      Users can adjust the crop, rotate the image, and return the saved result.
    disableEffect: Disabling it prevents the Crofis crop flow from returning an edited image.
  zh-CN:
    description: 应用请求裁剪现有图片时，Crofis Android UI Kit 会打开此页面。用户可以调整裁剪范围、旋转图片，并返回保存后的结果。
    disableEffect: 停用后，Crofis 图片裁剪流程无法返回编辑后的图片。
