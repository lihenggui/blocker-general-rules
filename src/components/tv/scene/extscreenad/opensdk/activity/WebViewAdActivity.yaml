recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: ExtScreen's ad player loads a supplied web address in a full-screen web view and supports
      back navigation within the page. It is used for web ads and destinations opened from ads.
    disableEffect: ExtScreen web ads and their landing pages will not open.
  zh-CN:
    description: ExtScreen 广告播放器会在全屏网页视图中加载给定的网址，并支持在页面内返回。它用于展示网页广告及广告打开的落地页。
    disableEffect: ExtScreen 网页广告及其落地页将无法打开。
