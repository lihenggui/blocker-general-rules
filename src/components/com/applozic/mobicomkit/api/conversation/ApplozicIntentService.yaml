i18n:
  en:
    description: The Kommunicate (Applozic) chat SDK runs this background service after a network or device-clock
      change. It synchronizes queued and deleted messages and user status, or refreshes the time offset
      used for chat timestamps.
    disableEffect: Queued messages, deletions, or user status may remain out of sync after reconnecting,
      and chat times may be wrong after a clock change.
  zh-CN:
    description: Kommunicate（Applozic）聊天 SDK 在网络或设备时间变化后运行此后台服务。它会同步待发送和已删除的消息及用户状态，或更新聊天时间使用的时差。
    disableEffect: 重新联网后，待发送消息、删除状态或用户状态可能无法同步；设备时间变化后，聊天时间也可能不准确。
