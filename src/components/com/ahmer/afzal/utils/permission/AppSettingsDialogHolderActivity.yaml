i18n:
  en:
    description: AhmerUtils (Ahmer Afzal) opens this Activity to explain a denied permission and launch
      Android’s app settings when the app needs the user to restore that permission. It returns the result
      to the screen that requested the dialog.
    disableEffect: The app cannot show this permission-recovery dialog or open settings through this flow.
  zh-CN:
    description: AhmerUtils（Ahmer Afzal）会打开此 Activity 说明被拒绝的权限，并在应用需要恢复该权限时跳转到 Android 应用设置；结果会返回给发起对话框的页面。
    disableEffect: 应用将无法通过此流程显示权限恢复对话框或打开设置。
