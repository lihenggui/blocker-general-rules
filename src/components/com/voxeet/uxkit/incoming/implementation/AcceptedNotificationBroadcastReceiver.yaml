i18n:
  en:
    description: When a user accepts a Dolby incoming-call notification, this receiver opens the app's
      incoming-call screen and stops the temporary notification service.
    disableEffect: The notification's Accept action can no longer open the incoming call, so users may
      be unable to join from that notification.
  zh-CN:
    description: 用户接受 Dolby 来电通知时，此接收器会打开应用的来电界面，并停止临时通知服务。
    disableEffect: 通知中的“接听”操作将无法打开来电界面，用户可能无法从该通知加入通话。
