i18n:
  en:
    description: When the app requests GPS location through Netposa's location SDK, this service watches
      for GPS changes and location fixes, then sends coordinates and an address back to the app.
    disableEffect: The app will lose this GPS location source, which can break location-based screens
      or tasks.
  zh-CN:
    description: 当应用通过 Netposa 定位 SDK 请求 GPS 定位时，此 Service 会监听 GPS 状态和定位结果，再将坐标及地址返回给应用。
    disableEffect: 停用后，应用将失去这一 GPS 定位来源，依赖定位的页面或任务可能无法正常工作。
