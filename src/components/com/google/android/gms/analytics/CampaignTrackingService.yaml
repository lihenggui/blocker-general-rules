i18n:
  en:
    description: Older Google Play services Analytics releases start this background service to process
      install-referrer campaign details; the newer analyzed release retains it as an empty legacy service.
    disableEffect: If disabled, older releases lose install-campaign attribution; the host app’s screens
      and regular use remain available.
  zh-CN:
    description: 较旧的 Google Play 服务 Analytics 版本会启动此后台服务处理安装来源活动信息；较新的分析版本保留了该旧服务条目，但不执行处理。
    disableEffect: 停用后，旧版将无法记录安装活动归因；宿主应用页面及常规使用仍可继续。
