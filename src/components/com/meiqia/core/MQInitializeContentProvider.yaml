i18n:
  en:
    description: At app startup, the Meiqia customer-service SDK tracks which app screen is currently
      visible so it can show Meiqia in-app notification messages there.
    disableEffect: Meiqia may no longer know which screen is active, so its in-app notification messages
      may not appear.
  zh-CN:
    description: 应用启动时，Meiqia 客服 SDK 会记录当前显示的应用页面，以便在该页面上展示 Meiqia 应用内通知。
    disableEffect: Meiqia 可能无法获知当前页面，因此应用内通知可能不会显示。
