  en:
    description: In newer Mindcafe Android SDK releases from Atommerce, this screen displays the web page
      configured by the service flow inside the app. The user can return from it using the page’s navigation
      controls.
    disableEffect: Users cannot open configured Mindcafe service pages that use this in-app web screen.
  zh-CN:
    description: 在 Atommerce 较新的 Mindcafe Android SDK 版本中，此页面会在应用内显示服务流程指定的网页。用户可通过页面的导航控件返回。
    disableEffect: 用户将无法打开使用此应用内网页界面的 Mindcafe 服务页面。
