    description: "## Primary Location\nUnited States (San Francisco) [Crunchbase, 01](https://www.crunchbase.com/organization/safegraph)\n\
      ## Website\n[https://www.safegraph.com](https://www.safegraph.com)\n## About\nSafeGraph specializes\
      \ in the collection of physical location data for data mining and analytics.\n## Ownership\nSafeGraph\n\
      ## Documentation\n[https://github.com/OpenLocate/openlocate-android](https://github.com/OpenLocate/openlocate-android)\n\
      ## Products and Services\nSafeGraph is a data company which aims to build a robust and detailed\
      \ location-based tracking service for advertisers, industry, government and researchers. Products\
      \ and services include:\n* _SafeGraph Movement Panel:_ SafeGraph's \"database of ultra-accurate\
      \ GPS-location data that comes from anonymized mobile devices.\" The Movement panel offers:\n  *\
      \ _Sink detection:_ Detection of inaccurate location data based on \" specific coordinates occurring\
      \ at impossibly high rates\".\n  * _Teleporting detection:_ Detection of inaccurate location data\
      \ when \"devices appear to move at impossibly fast speeds, ostensibly traveling large distances\
      \ between data points that occur next to each other\" in data streams like bid streams.\n  * _Jumpiness\
      \ detection:_ Detection of innacurate location data when \"we see two consecutive points in time\
      \ that are fairly close but still implausibly spaced\" (eg, \"the GPS receiver in your phone lags\
      \ or if a nearby skyscraper interferes with the location signal\") [SafeGraph, 01](https://blog.safegraph.com/less-than-10-of-bid-stream-location-data-is-high-quality-and-we-know-how-to-find-it-3a2c0df35475)\n\
      * _SafeGraph Places API:_ This \"to easily find the places of interest that are near a given lat/long,\
      \ ordered by distance or relevance\" [SafeGraph, 03](https://developers.safegraph.com/docs/places.html).\n\
      * _OpenLocate:_ The OpenLocate SDK will \"collect location data (like GPS) from phones\" [SafeGraph,\
      \ 04](https://github.com/OpenLocate). This includes an Android and iOS SDK.  The service is built\
      \ to provide developers complete control over their location data.  Developers can build location-enabled\
      \ features into their apps and \"maintain complete control over how end-user data is collected,\
      \ where it is stored, and which APIs it will be sent to\". This includes sending to storage services\
      \ (like Amazon S3) or APIs (such as Google Places API or SafeGraph's Places API) [SafeGraph, 05](https://blog.safegraph.com/introducing-openlocate-the-open-source-location-sdk-f5c5d2739a48).\n\
      Other services include:\n* \"Detailed polygon maps on 50+ million U.S. places of interest\n* Understanding\
      \ of each business's popularity, taxonomy, hours, etc.\n* Core investments in benchmarking via truth\
      \ sets\"\n  * This includes Explicit Truth Sets (Check-ins, Daily diaries, Web surveys) and Implicit\
      \ Truth Sets (Credit card data, Receipt data, First-party transactions) \nData from visits may include:\n\
      * _Core truth set for matching:_\n  * High-res GPS data\n  * Deterministic data\n  * Explicit and\
      \ implicit truth\n  * Data collected in background from large population\n* _Deep places map:_\n\
      \  * Best polygons\n  * Footprint geometries\n  * Metadata\n  * Categories\n  * Hours of operation\n\
      * Machine learning technology\n  * Cross-validated against multiple independent 3rd party truth\
      \ sets about where people go\n* _Truth and accuracy_\n  * High Precision // Low false positive rate;\
      \ High recall // Low false negative rate\" [SafeGraph, 06](https://www.safegraph.com/truth)\n##\
      \ Privacy Policy\n_Data collection (method and use):_ SafeGraph collects data from \"trusted third-party\
      \ data partners such as mobile application developers, through APIs and other delivery methods\"\
      . The data collection and use is \"governed by the privacy policy and legal terms of the data collector\
      \ and the website using the data; it is not governed by SafeGraph.\" SafeGraph \"aggregates data\
      \ collected from our data partners, and allows third party customers to access the Data for a variety\
      \ of purposes such as ad targeting, traffic analysis, and market research.\" SafeGraph may also\
      \ use data for their own \"internal and operational purposes\", and share data in response to requests\
      \ from law enforcement or a governmental agency, \"to protect or enforce our rights or those of\
      \ others, or to investigate potential wrongdoing.\"  Data can also be transferred to a successor\
      \ entity in the event of a merger or acquisition.\n_Information collected:_ Information collected\
      \ includes \"data regarding a device’s precise geographic location, as well as other mobile identifiers\
      \ such as Apple IDFAs and Google Android IDs, and other information about users and their devices.\"\
      \  \n_Jurisdictions:_ \"SafeGraph stores and processes information on servers in many countries\
      \ around the world. We therefore may process your information on a server located outside the country\
      \ where you live... Our customers (or companies that help us process the Data) may be located in\
      \ other countries, so the Data we provide may be processed or used in a variety of countries, other\
      \ than those our users reside in.\"  Customers of SafeGraph may create cross-device capabilities\
      \ \"to enable marketers to target users across various channels and devices.\"\n_Opt-out:_ SafeGraph\
      \ informs users of opt-out procedures for interest-based advertising and location tracking.  To\
      \ opt out of interest-based advertising, they state, users can adjust settings in their Android\
      \ or iOS devices.  This procedure, which they note may change, is mentioned in the SafeGraph privacy\
      \ policy \"purely for informational purposes.\"  SafeGraph further notes that \"You also can remove\
      \ your consent to having your location data collected by changing the settings on your device. (Certain\
      \ services may lose functionality as a result.)\"  SafeGraph's Privacy Policy provides links to\
      \ the Network Advertising Initiative and the Digital Advertising Alliance, as well as www.youronlinechoices.com.\
      \  It informs users that these websites may provide additional opt-out options.\n_Retention:_ Information\
      \ SafeGraph collects is \"retained indefinitely unless there has been a direct opt-out with us as\
      \ directed above.\"\n_Security:_ SafeGraph has security policies and procedures to \" ensure compliance\
      \ with industry best practices.\"  They state, \"no physical or technological safeguards are 100\
      \ percent secure, we do not guarantee the security of any particular elements of Data that we hold\"\
      \ [SafeGraph, 07](https://www.safegraph.com/privacy-policy).\n## Relationships\n_Clients and partners:_\
      \ Statiq / AirSage / Stanford University / GroundTruth (formerly xAd) / UCLA / Baylor University\
      \ / Weborama / Tufts University / The University of Chicago / Alphonzo / Freckle IoT / Georgia Tech\
      \ / Esri / Appnext / 4Info / Research Now / Tapfwd / Arrivalist / Placecast / ThinkNear by Telenav\
      \ / Pitney Bowes / Columbia University / Purdue University / UC San Diego / Sidewalk Labs / Temple\
      \ University / Citilabs / PlaceIQ / Moovit / Skyhook / Postie / PicsArt / Oklahoma State University\
      \ / Santa Clara University / OpenLocate\n## Details\n_Financial details:_ SafeGraph was founded\
      \ in 2016, and has raised $16 million from funders [Crunchbase, 01](https://www.crunchbase.com/organization/safegraph);\
      \ [SafeGraph, 02](https://blog.safegraph.com/safegraph-raises-16-million-series-a-e8e88eeb7beb)\
      \  \n_Scope:_ SafeGraph \"has access to super-accurate, anonymized location data on over 5% of all\
      \ mobile phones in the U.S. (as of August 2017)\" and is \"increasing that percentage every day\"\
      \ [SafeGraph, 01](https://blog.safegraph.com/less-than-10-of-bid-stream-location-data-is-high-quality-and-we-know-how-to-find-it-3a2c0df35475).\n\
      _Slogans:_\n* \"SafeGraph maintains the ground truth dataset for human movement across the globe\"\
      \n* \"We provide high-quality location data products to help organizations make better decisions\
      \ and improve lives\"\n## References\n* _Crunchbase, 01._ [https://www.crunchbase.com/organization/safegraph](https://www.crunchbase.com/organization/safegraph)\
      \  \n* _SafeGraph, 01._ [https://blog.safegraph.com/less-than-10-of-bid-stream-location-data-is-high-quality-and-we-know-how-to-find-it-3a2c0df35475](https://blog.safegraph.com/less-than-10-of-bid-stream-location-data-is-high-quality-and-we-know-how-to-find-it-3a2c0df35475)\
      \  \n* _SafeGraph, 02._ [https://blog.safegraph.com/safegraph-raises-16-million-series-a-e8e88eeb7beb](https://blog.safegraph.com/safegraph-raises-16-million-series-a-e8e88eeb7beb)\
      \  \n* _SafeGraph, 03._ [https://developers.safegraph.com/docs/places.html](https://developers.safegraph.com/docs/places.html)\
      \  \n* _SafeGraph, 04._ [https://github.com/OpenLocate](https://github.com/OpenLocate)  \n* _SafeGraph,\
      \ 05._ [https://blog.safegraph.com/introducing-openlocate-the-open-source-location-sdk-f5c5d2739a48](https://blog.safegraph.com/introducing-openlocate-the-open-source-location-sdk-f5c5d2739a48)\
      \  \n* _SafeGraph, 06._ [https://www.safegraph.com/truth](https://www.safegraph.com/truth)  \n*\
      \ _SafeGraph, 07._ [https://www.safegraph.com/privacy-policy](https://www.safegraph.com/privacy-policy)\n\
