i18n:
  en:
    description: Enro, Isaac Udy's Android navigation library, opens this Activity when it routes a screen
      through its standard activity host. It displays the destination selected by the app.
    disableEffect: Screens assigned to this navigation path cannot open, which can break app navigation.
  zh-CN:
    description: Isaac Udy 的 Enro Android 导航库会在应用通过标准 Activity 导航打开页面时使用此界面，并显示应用指定的目标页面。
    disableEffect: 禁用后，通过此导航方式打开的页面无法显示，应用的页面导航可能受影响。
