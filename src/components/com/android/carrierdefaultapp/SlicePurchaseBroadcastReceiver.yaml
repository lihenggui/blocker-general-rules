    description: The SlicePurchaseBroadcastReceiver listens for SlicePurchaseController#ACTION_START_SLICE_PURCHASE_APP
      from the SlicePurchaseController in the phone process to start the slice purchase application. It
      displays the performance boost notification to the user and will start the SlicePurchaseActivity
      to display the WebView to purchase performance boosts from the user's carrier.
