i18n:
  en:
    description: When a compatible Custom Tabs browser binds this AndroidX Browser service, it forwards
      browser-ready and browser message callbacks to the app.
    disableEffect: Custom Tabs message channels stop working, which can interrupt app flows that rely
      on browser-to-app messages.
  zh-CN:
    description: 兼容的 Custom Tabs 浏览器绑定此 AndroidX Browser 服务后，它会将浏览器就绪和浏览器消息回调传递给应用。
    disableEffect: 停用后，Custom Tabs 消息通道将停止工作，依赖浏览器向应用传递消息的流程可能中断。
