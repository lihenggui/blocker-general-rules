i18n:
  en:
    description: Android starts this Scandit Data Capture text provider with the app process. It prepares
      text recognition used by document and text capture before the app uses that feature.
    disableEffect: Disabling it can prevent Scandit text features from initializing when the app needs
      them.
  zh-CN:
    description: Android 会在应用进程启动时启动此 Scandit Data Capture text Provider。它会在应用使用相关功能前准备文档和文字采集使用的文字识别。
    disableEffect: 禁用后，应用需要使用 Scandit text 功能时，该功能可能无法初始化。
