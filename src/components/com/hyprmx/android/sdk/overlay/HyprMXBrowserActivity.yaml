recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:38:48Z'
i18n:
  en:
    description: The HyprMX ad SDK opens this in-app browser for an advertiser's landing page or web-based
      ad experience. Users can navigate the page and close it from the HyprMX screen.
    disableEffect: HyprMX ad landing pages will not open in the in-app browser; the host app's other features
      remain available.
  zh-CN:
    description: HyprMX 广告 SDK 会使用此应用内浏览器打开广告主落地页或网页广告内容。用户可在页面中导航并关闭浏览器。
    disableEffect: HyprMX 广告落地页将无法在应用内打开；应用的其他功能仍可使用。
