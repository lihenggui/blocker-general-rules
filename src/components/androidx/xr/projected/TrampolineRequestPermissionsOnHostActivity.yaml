recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: AndroidX XR Projected opens this short-lived screen when an XR app requests permissions
      for a projected device; it forwards the request to Android's permission prompt in that device's
      context and returns the results.
    disableEffect: Projected-device permission requests cannot complete through this flow, preventing
      features that need those permissions from working.
  zh-CN:
    description: AndroidX XR Projected 会在 XR 应用为投影设备请求权限时打开此临时界面，在该设备的 Android 权限提示中转交请求并返回结果。
    disableEffect: 停用后投影设备的权限请求无法通过此流程完成，依赖这些权限的功能也无法使用。
