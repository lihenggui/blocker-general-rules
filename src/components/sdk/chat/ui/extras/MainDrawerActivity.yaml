i18n:
  en:
    description: When the host app uses Chat SDK's drawer layout, this activity provides its main chat
      screen. The drawer navigates configured chat tabs and includes the user's profile and sign-out options.
    disableEffect: The drawer-based Chat SDK home screen and its chat navigation cannot open.
  zh-CN:
    description: 宿主应用使用 Chat SDK 的抽屉式布局时，此界面会提供聊天主屏幕。抽屉可切换已配置的聊天标签，并提供用户资料和退出登录选项。
    disableEffect: Chat SDK 的抽屉式主屏幕及聊天导航将无法打开。
