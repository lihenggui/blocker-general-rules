contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:13:45Z'
i18n:
  en:
    description: Tencent Bugly Beta and the Tencent Cloud Tinker wrapper use this service after a Tinker
      patch finishes. It reports patch success or failure, removes the downloaded patch file, and may
      restart the app so a successful patch takes effect.
    disableEffect: Patch completion callbacks and restart handling may stop, so an installed fix may not
      become active.
  zh-CN:
    description: 腾讯 Bugly Beta 和腾讯云 Tinker 封装会在 Tinker 热修复完成后使用此服务。它会报告补丁成功或失败、清理已下载的补丁文件，并可能重启应用以启用成功的补丁。
    disableEffect: 补丁完成回调和重启处理可能停止，已安装的修复可能无法生效。
