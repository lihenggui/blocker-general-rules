recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:48:16Z'
i18n:
  en:
    description: When Android reports another app being installed or removed, the Youmi Overseas Offers
      Wall SDK processes that app for its install-task tracking. It is also registered for package replacement
      and keyboard-change notices.
    disableEffect: App-install offers will stop receiving app-change updates, while the host app’s other
      screens remain available.
  zh-CN:
    description: Android 通知有应用安装或卸载时，Youmi 海外积分墙 SDK 会处理该应用的信息，用于跟踪安装类任务。它还注册接收应用替换和输入法切换通知。
    disableEffect: 安装类任务将无法再收到应用变化信息，但宿主应用的其他页面仍可使用。
