i18n:
  en:
    description: When a flow verifies an individual, this screen collects personal details such as name,
      date of birth, contact information, and tax ID, then submits them for checking. The MetaMap identity
      verification SDK opens this screen when the configured flow reaches this step.
    disableEffect: Disabling it prevents individual-verification flows from collecting and submitting
      the required details.
  zh-CN:
    description: 核验流程验证个人身份时，此页面会收集姓名、出生日期、联系方式和税号等信息并提交检查。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，个人身份核验流程无法收集并提交所需信息。
