i18n:
  en:
    description: Enioka Scan (Enioka) opens this Activity when the app starts its built-in barcode-scanning
      screen. It shows scanner status and recent results, supports manual barcode entry, and offers a
      camera option when the optional camera scanner is included.
    disableEffect: Users lose the built-in scanning screen, including its scanner controls and manual-entry
      option.
  zh-CN:
    description: Enioka Scan（Enioka）会在应用打开内置条码扫描界面时显示此 Activity。它展示扫描器状态和最近的扫描结果，支持手动输入条码；如果应用还集成了可选的相机扫描功能，也可以切换到相机扫描。
    disableEffect: 用户将无法打开内置扫描界面，也无法使用其中的扫描控制和手动输入功能。
