i18n:
  en:
    description: When a game starts on Android 13 or later, Google Play Sidekick starts its in-game overlay
      support, which can show Play Games content and offers over the game.
    disableEffect: The game continues to run, but the Sidekick overlay and its in-game content and offers
      will not appear.
  zh-CN:
    description: Android 13 及以上版本的游戏启动时，Google Play Sidekick 会准备游戏内浮层，以便在游戏画面上显示 Play Games 内容和优惠。
    disableEffect: 游戏仍可运行，但 Sidekick 游戏内浮层、内容和优惠不会显示。
