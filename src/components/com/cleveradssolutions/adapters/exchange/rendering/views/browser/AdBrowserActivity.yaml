recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: CAS.AI's Exchange ad adapter opens an advertiser's web page and video in this in-app
      browser when an ad needs a landing page. Users can navigate the page or open a link in another app.
    disableEffect: CAS Exchange ads will not be able to open their in-app landing pages or videos; other
      app screens continue to work.
  zh-CN:
    description: CAS.AI 的 Exchange 广告适配器会在广告需要落地页时，用此应用内浏览器打开广告主网页和视频；用户可浏览页面或在其他应用中打开链接。
    disableEffect: CAS Exchange 广告将无法打开应用内落地页或视频，应用的其他页面仍可使用。
