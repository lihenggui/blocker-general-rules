i18n:
  en:
    description: TENQUBE Visual opens this popup after a parsed transaction when popup display is enabled.
      It shows purchase details and monthly spending information, and can also display an ad.
    disableEffect: Purchase-detail and spending-summary popups from TENQUBE Visual will no longer appear.
  zh-CN:
    description: 启用弹窗显示后，TENQUBE Visual 会在解析到交易时打开此弹窗。弹窗展示购买详情和本月支出信息，也可能显示广告。
    disableEffect: TENQUBE Visual 的购买详情和支出汇总弹窗将不再显示。
