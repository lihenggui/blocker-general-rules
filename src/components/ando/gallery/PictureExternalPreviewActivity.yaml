i18n:
  en:
    description: Ando Gallery opens this viewer when the app asks to preview supplied photos or videos
      outside the picker. It lets the user browse the items and, when enabled, delete or save them.
    disableEffect: External media preview and its enabled save or delete actions will stop working.
  zh-CN:
    description: 应用要求在选择器之外预览指定照片或视频时，Ando Gallery 会打开此查看页面。用户可浏览媒体，并在相关选项启用时删除或保存文件。
    disableEffect: 外部媒体预览以及已启用的保存或删除操作将无法使用。
