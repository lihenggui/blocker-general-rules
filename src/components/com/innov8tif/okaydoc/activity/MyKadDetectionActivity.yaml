  en:
    description: OkayDoc (Innov8tif document-authenticity SDK) opens the camera for a still-image or video
      check of a Malaysian MyKad. It guides card framing and checks the captured card before returning
      a result.
    disableEffect: The app cannot run OkayDoc Malaysian identity-card authenticity checks if this screen
      is disabled.
  zh-CN:
    description: OkayDoc（Innov8tif 证件真伪检测 SDK）会打开相机，对马来西亚 MyKad 身份证进行照片或视频检测，引导用户摆正卡片并检查采集结果。
    disableEffect: 停用后，应用无法通过 OkayDoc 检测马来西亚 MyKad 身份证真伪。
