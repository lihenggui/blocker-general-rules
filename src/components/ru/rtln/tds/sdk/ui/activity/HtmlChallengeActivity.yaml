i18n:
  en:
    description: The Tinkoff Acquiring 3-D Secure SDK opens this Activity when a card issuer requires
      an HTML verification challenge during payment. It displays the issuer's page and submits the shopper's
      response to the payment flow.
    disableEffect: Payments that require this challenge cannot be authenticated and may fail.
  zh-CN:
    description: 发卡行在付款时要求通过 HTML 页面验证时，Tinkoff 收单 3-D Secure SDK 会打开此 Activity。它显示发卡行提供的验证页面，并把用户提交的结果交回支付流程。
    disableEffect: 需要此验证的付款将无法完成身份验证，可能会失败。
