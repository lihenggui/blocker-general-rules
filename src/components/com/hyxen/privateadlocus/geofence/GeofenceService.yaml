i18n:
  en:
    description: The HyXen AdLocus private ad SDK starts this background service to add or remove monitored
      regions and check device location; matching a region sends an SDK event.
    disableEffect: Disabling it stops AdLocus location-triggered ad events but leaves the host app's other
      features available.
  zh-CN:
    description: HyXen AdLocus 私有广告 SDK 通过此后台服务添加或删除监控区域并检查设备位置；位置匹配时会发送 SDK 事件。
    disableEffect: 停用后，AdLocus 的位置触发广告事件会停止，但宿主应用的其他功能仍可使用。
