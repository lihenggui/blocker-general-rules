i18n:
  en:
    description: Proton AG's Proton Core Android SDK opens this secure dialog when the app starts device
      recovery for an account. It presents the recovery step for that user and closes or returns when
      the step is finished.
    disableEffect: If disabled, users who need this account-recovery step may be unable to restore access
      to the account.
  zh-CN:
    description: Proton AG 的 Proton Core Android SDK 会在应用为账户启动设备恢复时打开此安全对话框，显示该用户的恢复步骤，并在完成或退出时返回。
    disableEffect: 停用后，需要此恢复步骤的用户可能无法重新访问账户。
