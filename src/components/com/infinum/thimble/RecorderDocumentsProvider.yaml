recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:45:36Z'
i18n:
  en:
    description: When Android's document picker lists available file sources, this Infinum Thimble Provider
      exposes saved screenshots and screen recordings for browsing.
    disableEffect: The Thimble files disappear from Android's document picker, so saved screenshots and
      recordings cannot be browsed there; the app's regular features continue to work.
  zh-CN:
    description: 当 Android 文档选择器列出可用文件来源时，此 Infinum Thimble Provider 会提供已保存的屏幕截图和录屏，供用户浏览。
    disableEffect: Thimble 文件将不再显示在 Android 文档选择器中，用户无法在那里浏览已保存的截图和录屏；应用的日常功能仍可正常使用。
