i18n:
  en:
    description: At app startup, the Nodes OkHttp Utils Provider stores the app context used to open its
      network-error screen.
    disableEffect: Without this startup context, requests that need the error screen can fail while the
      SDK tries to display it.
  zh-CN:
    description: 应用启动时，Nodes OkHttp Utils 的 Provider 会保存用于打开网络错误界面的应用上下文。
    disableEffect: 缺少这份启动时保存的上下文后，SDK 尝试显示网络错误界面时，请求错误处理可能失败。
