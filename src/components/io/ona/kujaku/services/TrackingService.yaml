i18n:
  en:
    description: When an app requests continuous location tracking for a Kujaku map or check-in, this
      foreground service collects GPS updates and provides them to tracking listeners.
    disableEffect: Ongoing GPS updates stop, so map features that depend on continuous location tracking
      no longer work.
  zh-CN:
    description: 应用为 Kujaku 地图或签到功能请求持续定位时，此前台服务会获取 GPS 更新并提供给位置监听程序。
    disableEffect: 持续 GPS 更新将停止，依赖连续定位的地图功能也将无法使用。
