    name: Facebook Flipper
    description: 'Mobile app debugger

      *The Flipper desktop app and the mobile native SDK establish a connection which is used to send
      data to and from the device. Flipper does not make any restrictions on what kind of data is being
      sent. This enables a lot of different use-cases where you want to better understand what is going
      inside your app. For example you can visualize the state of local caches, events happening or trigger
      actions on your app from the desktop.*

