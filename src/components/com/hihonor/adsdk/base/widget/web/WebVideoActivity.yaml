i18n:
  en:
    description: Honor Ads SDK opens an ad's landing page when the ad is set to play video there, then
      displays the video with ad playback controls.
    disableEffect: Video ads that use this page and their landing-page controls will no longer work, while
      the host app's other features remain available.
  zh-CN:
    description: 当 Honor 广告设置为在落地页播放视频时，SDK 会打开该页面并显示视频及广告播放控件。
    disableEffect: 屏蔽后，依赖此页面的视频广告及落地页控件将无法使用，应用的其他功能仍可运行。
