i18n:
  en:
    description: The XiaoE (Xiaoe) Shop WebCore SDK opens this Activity when embedded web content asks
      to use the camera or microphone. It requests the Android permission and passes the result back to
      the web feature.
    disableEffect: Photo capture or audio recording in those web pages may stop working because the page
      cannot obtain the required permission.
  zh-CN:
    description: 小鹅通 WebCore SDK 的网页内容需要使用摄像头或麦克风时会打开此 Activity。它申请 Android 权限，并把允许或拒绝的结果交回网页功能。
    disableEffect: 网页中的拍照或录音功能可能无法使用，因为页面无法取得所需权限。
