recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: When an Appcues in-app experience asks the user to enable notifications, this Activity
      requests Android's notification permission and returns the user's choice. Disabling it stops that
      Appcues permission prompt.
    disableEffect: Appcues experiences can no longer show their notification-permission prompt through
      this Activity.
  zh-CN:
    description: Appcues 站内体验请求用户启用通知时，此 Activity 会申请 Android 通知权限并返回用户的选择。禁用后，Appcues 的权限提示将停止。
    disableEffect: Appcues 站内体验将无法通过此 Activity 显示通知权限提示。
