  en:
    description: Upnext BeaconControl starts this service when a client begins scanning; it monitors configured
      Bluetooth beacon regions and reports when the device enters, leaves, or moves near a beacon.
    disableEffect: BeaconControl will no longer detect nearby beacons or trigger beacon-based campaigns.
  zh-CN:
    description: 应用开始扫描后，Upnext BeaconControl 会启动此服务监测配置的蓝牙信标区域，并报告设备进入、离开或靠近信标的情况。
    disableEffect: 禁用后，BeaconControl 将无法检测附近信标或触发基于信标的活动。
