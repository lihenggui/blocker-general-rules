    description: 6xyun Mediaer 媒体库在需要把图片交给安卓界面进行选择或裁剪时，通过此文件提供方生成临时文件链接。
    disableEffect: 需要通过此链接传递图片的 Mediaer 操作（包括裁剪）可能无法完成。
