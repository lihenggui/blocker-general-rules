recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:48:03Z'
i18n:
  en:
    description: Shake opens this Activity when it needs a runtime permission or screen-capture consent
      for a reporting feature. It shows Android's permission prompt and returns the user's choice to Shake.
    disableEffect: Shake cannot request those permissions through its own flow, so permission-gated report
      tools such as screen recording will be unavailable.
  zh-CN:
    description: Shake 需要运行时权限或录屏授权时会打开此界面，显示 Android 权限提示，并把用户选择交回 Shake。
    disableEffect: Shake 无法通过自己的界面申请这些权限，依赖授权的报告工具（例如录屏）也无法使用。
