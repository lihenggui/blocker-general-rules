i18n:
  en:
    description: When an app requests magnetic-sensor updates from SYRF's location and sensor SDK, this
      service reads the device's three-axis magnetic-field data and sends it to the app.
    disableEffect: App features that rely on SYRF magnetic-field readings, such as compass behavior, will
      no longer update.
  zh-CN:
    description: 应用向 SYRF 位置与传感器 SDK 请求磁传感器数据时，此服务会读取设备的三轴磁场数据并发送给应用。
    disableEffect: 停用后，依赖 SYRF 磁场数据的功能（例如指南针方向）将无法更新。
