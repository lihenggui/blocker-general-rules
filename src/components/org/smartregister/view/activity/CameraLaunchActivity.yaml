i18n:
  en:
    description: OpenSRP Client Core opens this Activity when a health record requests a photo; it starts
      the device camera, saves a resized image, and attaches it to a woman or child record.
    disableEffect: Users cannot take and attach photos to eligible-couple or child records.
  zh-CN:
    description: 健康档案需要照片时，OpenSRP Client Core 会打开此页面调用设备相机，保存缩小后的照片并关联到妇女或儿童记录。
    disableEffect: 用户将无法为符合条件的夫妇或儿童档案拍摄并添加照片。
