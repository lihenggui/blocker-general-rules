recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Android creates this Adsail (Haorui) provider during app startup. It tracks when the
      app moves between foreground and background so the advertising SDK can follow app activity.
    disableEffect: Adsail will lose app lifecycle tracking; the host app screens remain available.
  zh-CN:
    description: Android 会在应用启动时创建 Adsail（Haorui）内容提供器。它跟踪应用进入前台或后台的状态，供广告 SDK 使用。
    disableEffect: Adsail 将无法跟踪应用的前后台状态，但应用自身页面仍可使用。
