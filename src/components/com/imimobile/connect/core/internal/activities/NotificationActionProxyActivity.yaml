recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:10:44Z'
i18n:
  en:
    description: When a user taps an action in a Webex Connect push notification, this Activity sends
      the selected action to its destination in the app and then closes.
    disableEffect: Actions on Webex Connect push notifications will no longer open their destination;
      the app's in-app screens remain available.
  zh-CN:
    description: 用户点击 Webex Connect 推送通知中的操作时，此 Activity 会将所选操作送到应用中的目标页面，然后关闭。
    disableEffect: Webex Connect 推送通知中的操作将无法打开目标页面，但应用内页面仍可使用。
