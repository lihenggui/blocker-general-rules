recommendToBlock: false
i18n:
  en:
    description: A android.content.BroadcastReceiver which takes care of recreating the long lived alarm
      which helps track force stops for an application. This is the target of the alarm set by ForceStopRunnable
      in setAlarm(Context).
  zh-CN:
    description: 负责重新创建长期运行的闹钟的广播接收器，用于跟踪应用程序的强制停止事件。这是由 setAlarm(Context) 中的 ForceStopRunnable 设置的闹钟的目标。
