    description: The VoiceControls sample app by Frank Zickert exposes this launcher Activity. It starts
      a sample delivery request asking what the user wants to order, displays demo callbacks, and then
      closes.
    disableEffect: Only the VoiceControls sample launcher flow is removed; the app's normal screens remain
      available.
