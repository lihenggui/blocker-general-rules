    description: Unblu Mobile SDK opens this camera screen when a user chooses to take a photo or video
      for a support conversation. It lets the user capture and preview the media before returning it to
      the conversation.
    disableEffect: Users cannot capture and attach a new photo or video through Unblu.
  zh-CN:
