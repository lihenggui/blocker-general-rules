    description: When Reteno broadcasts that a push message was received, this Receiver forwards the message
      data to registered Reteno listeners.
    disableEffect: App code listening for Reteno push-received events no longer receives those callbacks.
  zh-CN:
    description: 当 Reteno 广播收到推送消息时，此 Receiver 会把消息数据转发给已注册的 Reteno 监听器。
    disableEffect: 停用后，监听 Reteno 推送接收事件的应用代码将无法收到这些回调。
