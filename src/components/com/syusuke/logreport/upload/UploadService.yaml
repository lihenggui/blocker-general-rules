i18n:
  en:
    description: The ksrainarthas LogReport SDK starts this background Service when a log upload is requested.
      It bundles saved logs with available crash reports and sends the archive to the configured reporting
      destination.
    disableEffect: Crash reports and diagnostic log archives will no longer be sent to the configured
      destination.
  zh-CN:
    description: 请求上传日志时，ksrainarthas LogReport SDK 会启动此后台服务。它会将已保存的日志与可用的崩溃报告打包，并发送到配置的报告接收端。
    disableEffect: 崩溃报告和诊断日志压缩包将无法发送到配置的接收端。
