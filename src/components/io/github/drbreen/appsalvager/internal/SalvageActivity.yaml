recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:43:12Z'
i18n:
  en:
    description: When AppSalvager detects repeated startup crashes, it opens this Activity in a separate
      process and shows the app-configured recovery screen with the crash cause.
    disableEffect: The recovery screen will not appear, so the app may remain stuck if it keeps crashing
      at startup.
  zh-CN:
    description: AppSalvager 检测到反复的启动崩溃后，会在独立进程中打开此 Activity，并显示应用配置的恢复界面及崩溃原因。
    disableEffect: 恢复界面将无法显示；如果应用持续在启动时崩溃，可能无法恢复使用。
