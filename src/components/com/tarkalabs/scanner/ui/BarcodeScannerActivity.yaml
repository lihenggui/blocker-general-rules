  en:
    description: Tarka Labs Barcode Scanner opens a full-screen camera scanner when the app starts its
      scan flow. It returns the scanned text to the screen that opened it, or returns a cancellation or
      error result.
    disableEffect: The app's barcode-scanning flow will not open, so users cannot scan a code with this
      library.
