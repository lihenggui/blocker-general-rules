i18n:
  en:
    description: Yanzhenjie Album uses this provider to give the camera capture flow a shareable file
      link for its saved photo or video.
    disableEffect: On Android 7 and later, disabling this provider stops the camera flow from passing
      its output file to the camera app, so the captured photo or video cannot be returned.
  zh-CN:
    description: Yanzhenjie Album 会通过此 Provider 为相机拍摄流程生成可分享的文件链接，以便访问保存的照片或视频。
    disableEffect: 在 Android 7 及更高版本上停用此 Provider 后，相机流程无法将输出文件交给相机应用，因此拍摄的照片或视频无法返回。
