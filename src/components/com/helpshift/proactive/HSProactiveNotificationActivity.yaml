i18n:
  en:
    description: When a user taps a proactive Helpshift notification, this Helpshift SDK X Activity clears
      the alert, records the interaction, and follows the notification’s configured action, such as opening
      support or the app.
    disableEffect: Tapping a proactive Helpshift notification no longer opens its configured destination;
      the app’s other screens remain available.
  zh-CN:
    description: 用户点击 Helpshift 主动通知时，此 Helpshift SDK X Activity 会清除通知、记录操作，并执行通知设置的动作，例如打开支持页面或应用。
    disableEffect: 停用后，点击 Helpshift 主动通知将无法打开其指定页面；应用的其他页面仍可使用。
