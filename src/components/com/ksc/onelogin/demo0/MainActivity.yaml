i18n:
  en:
    description: When launched through its MAIN/LAUNCHER entry, the Kingsoft Cloud (KSC) One Login Activity
      shows its screen and initializes the One Login SDK.
    disableEffect: This launcher screen and its KSC One Login initialization will not run; if it is the
      app's only launcher Activity, the app may no longer open from the home screen.
  zh-CN:
    description: 通过 MAIN/LAUNCHER 入口启动时，金山云（KSC）One Login Activity 会显示页面并初始化 One Login SDK。
    disableEffect: 此启动页面及 KSC One Login 初始化将无法运行；如果它是应用唯一的启动 Activity，应用可能无法从主屏幕打开。
