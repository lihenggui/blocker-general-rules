i18n:
  en:
    description: The HiLeia.PS SDK opens this screen when a user chooses photos or takes a new one. It
      requests the needed media and camera access, shows photo albums, and can launch the camera.
    disableEffect: The SDK's photo selection and capture screens will not open, preventing photo-based
      features such as adding call media.
  zh-CN:
    description: 用户选择照片或拍摄新照片时，HiLeia.PS 会打开此界面。该界面会请求所需的媒体和相机权限、显示相册，并可启动相机。
    disableEffect: HiLeia.PS 的照片选择和拍摄界面将无法打开，依赖照片的功能（例如在通话中添加媒体）将无法使用。
