recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:13:09Z'
i18n:
  en:
    description: WonderAndroid’s Google and Google MAX ad integrations use this Firebase service when
      an SDK push message or device-token update arrives. It handles the message, can show its notification,
      and forwards the token to the ad SDK.
    disableEffect: The ad integrations will stop receiving their Firebase messages and showing related
      notifications.
  zh-CN:
    description: WonderAndroid 的 Google 和 Google MAX 广告适配会在收到 SDK 推送消息或设备令牌更新时使用此 Firebase 服务。它处理消息、显示相关通知，并把令牌传给广告
      SDK。
    disableEffect: 这些广告适配将无法接收 Firebase 消息或显示相关通知。
