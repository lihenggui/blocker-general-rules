  en:
    description: Vungle (Liftoff) prepares its ad service automatically when the app starts so the app
      can request and show Vungle ads later.
    disableEffect: Vungle ads may no longer initialize or appear; the app's other features remain available.
  zh-CN:
    description: Vungle（Liftoff）会在应用启动时自动准备广告服务，供应用之后请求并展示 Vungle 广告。
    disableEffect: 停用后，Vungle 广告可能无法初始化或展示；应用的其他功能仍可使用。
