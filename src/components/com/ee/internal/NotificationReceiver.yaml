i18n:
  en:
    description: Senspark EE-X uses this receiver when a scheduled local reminder is due. It shows the
      saved title and message as a notification, which opens the app's selected screen when tapped.
    disableEffect: Reminders scheduled through Senspark EE-X will not appear, so app features that rely
      on them will stop notifying users.
  zh-CN:
    description: Senspark EE-X 会在预定的本地提醒到期时运行此接收器，显示保存的标题和消息；点击通知后会进入应用指定页面。
    disableEffect: 通过 Senspark EE-X 设置的提醒不会再显示，依赖这些提醒的应用功能会停止通知用户。
