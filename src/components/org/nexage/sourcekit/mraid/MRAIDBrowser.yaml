i18n:
  en:
    description: The Nexage MRAID browser bundled with Appodeal opens rich-media ad destinations in an
      in-app web view. It provides navigation controls and handles supported links from the ad.
    disableEffect: Rich-media ad pages and their landing links may no longer open; the host app's non-ad
      features remain available.
  zh-CN:
    description: Appodeal 内置的 Nexage MRAID 浏览器会在应用内网页中打开富媒体广告页面，并提供导航控件和广告支持的链接处理。
    disableEffect: 富媒体广告页面及其落地链接可能无法打开；应用的非广告功能仍可使用。
