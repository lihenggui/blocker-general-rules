i18n:
  en:
    description: TapTap Common exposes the app's TapTap client settings and selected language to TapTap
      components that request them.
    disableEffect: TapTap components will no longer be able to read these settings from this provider,
      which can prevent TapTap login and configured features from working.
  zh-CN:
    description: TapTap Common 会向请求设置的 TapTap 组件提供应用的 TapTap 客户端配置和所选语言。
    disableEffect: TapTap 组件将无法再通过此提供器读取这些设置，TapTap 登录及依赖配置的功能可能因此无法使用。
