i18n:
  en:
    description: Liftoff Ads opens this screen to show a full-screen HTML interstitial. It displays the
      ad with a close control and countdown and records when the ad is viewed.
    disableEffect: Rewards for watching this HTML ad will no longer be granted; if the app requests one,
      Liftoff does not recover from a failed screen launch and the app may close.
  zh-CN:
    description: Liftoff Ads 展示全屏 HTML 插屏广告时会打开此页面。页面显示广告、关闭控件和倒计时，并记录广告展示情况。
    disableEffect: 停用后，观看此类 HTML 广告可获得的奖励将不再发放；如果应用仍请求展示广告，Liftoff 无法处理页面启动失败，应用可能因此退出。
