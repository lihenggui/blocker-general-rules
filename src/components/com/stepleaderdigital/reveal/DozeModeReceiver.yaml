recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:04:27Z'
i18n:
  en:
    description: When Android reports a device idle-state change, Reveal checks the power state and processes
      queued beacon-visit events when the device leaves idle mode.
    disableEffect: Reveal may leave queued beacon-visit events unprocessed after the device wakes; regular
      app screens remain available.
  zh-CN:
    description: Android 通知设备空闲状态变化时，Reveal 会检查电源状态，并在设备退出空闲模式后处理排队的信标访问事件。
    disableEffect: 设备唤醒后，Reveal 可能无法处理排队的信标访问事件；应用的常规界面仍可使用。
