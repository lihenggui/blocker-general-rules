i18n:
  en:
    description: At app startup, Android creates the BStartUp provider, which reads the app's registered
      startup tasks and starts them.
    disableEffect: App initialization tasks registered with BStartUp will not run, so features that depend
      on them may fail.
  zh-CN:
    description: 应用启动时，Android 会创建 BStartUp Provider；它会读取应用登记的启动任务并运行这些任务。
    disableEffect: 通过 BStartUp 登记的初始化任务将不会运行，依赖它们的功能可能无法使用。
