i18n:
  en:
    description: When PayEase Webox starts active face-liveness verification, this Activity opens the
      camera, checks prompted face movements and whether the face is live, and returns the result and
      image.
    disableEffect: Disabling it prevents the camera-based liveness check required by some identity and
      payment flows.
  zh-CN:
    description: PayEase Webox 启动主动式人脸活体核验时，此 Activity 会打开摄像头，检查提示的面部动作及真人状态，并返回结果和图像。
    disableEffect: 停用后，部分身份和支付流程所需的摄像头活体检测无法进行。
