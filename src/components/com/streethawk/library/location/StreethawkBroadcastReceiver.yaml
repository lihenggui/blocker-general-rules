i18n:
  en:
    description: This component is part of the StreetHawk mobile engagement SDK. Android starts this older
      receiver for boot, time-zone, Bluetooth, network, location-provider, and StreetHawk notification-response
      events. It restarts the SDK's location or beacon services and handles queued campaign actions.
    disableEffect: StreetHawk tracking, beacon monitoring, and campaign actions will not resume after
      these events.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。设备启动、时区、蓝牙、网络、位置服务或 StreetHawk 通知响应发生变化时，Android 会启动此旧版接收器。它会重启
      SDK 的位置或信标服务，并处理排队的活动操作。
    disableEffect: 这些事件发生后，StreetHawk 的跟踪、信标监控和活动操作将无法恢复。
