i18n:
  en:
    description: This is part of Mrocigno's Sandman diagnostic toolkit. When a user selects a captured
      request in Sandman's network history, this screen shows its request and response details.
    disableEffect: Sandman's individual network-request details will be unavailable; the app's network
      connections continue to work.
  zh-CN:
    description: 这是 Mrocigno 的 Sandman 诊断工具的一部分。用户在 Sandman 网络记录中选择一条请求后，此页面会显示请求和响应详情。
    disableEffect: 停用后，Sandman 无法查看单条网络请求详情；应用的网络连接仍可正常工作。
