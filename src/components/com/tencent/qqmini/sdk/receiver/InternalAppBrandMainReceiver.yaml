i18n:
  en:
    description: QQ Mini Game uses this Receiver for internal messages in its private mini-game task.
      It prepares the runtime there and passes each message to the SDK.
    disableEffect: The SDK cannot handle messages for this private task, so game work assigned there may
      fail to start or respond.
  zh-CN:
    description: QQ 小游戏 SDK 在专用小游戏任务中使用此 Receiver 处理内部消息。它会准备运行环境，并把消息交给 SDK 继续处理。
    disableEffect: 停用后 SDK 无法处理此专用任务的内部消息，分配到这里的游戏可能无法启动或响应。
