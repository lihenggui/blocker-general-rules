i18n:
  en:
    description: When Enioka Scan searches for Bluetooth barcode readers, this service finds paired or
      newly connecting devices and connects supported readers so their scans can reach the app.
    disableEffect: The app may no longer discover or use supported Bluetooth barcode readers, breaking
      scanning with those accessories.
  zh-CN:
    description: Enioka Scan 搜索蓝牙条码扫描器时，此服务会查找已配对或新连接的设备，并连接受支持的扫描器，让应用能够接收扫描结果。
    disableEffect: 应用可能无法再发现或使用受支持的蓝牙条码扫描器，导致这些设备无法扫描。
