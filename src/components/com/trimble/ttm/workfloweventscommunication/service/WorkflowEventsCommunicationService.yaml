  en:
    description: When Trimble Driver Workflow sends a workflow event through the Instinct integration,
      this service forwards the event to the app’s registered listener.
    disableEffect: If disabled, the app stops receiving Trimble Driver Workflow events, so features that
      depend on those updates cannot respond to them.
  zh-CN:
    description: Trimble Driver Workflow 通过 Instinct 集成发送工作流事件时，此服务会将事件转发给应用注册的监听器。
    disableEffect: 停用后，应用将无法接收 Trimble Driver Workflow 事件，依赖这些更新的功能也无法响应。
