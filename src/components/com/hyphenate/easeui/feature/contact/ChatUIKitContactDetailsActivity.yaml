  en:
    description: When a user opens a contact’s details in the Easemob chat UI, this screen shows profile
      information and offers actions such as muting notifications, blocking the contact, clearing the
      conversation, or searching messages.
    disableEffect: If disabled, these contact-management and per-contact conversation actions will be
      unavailable.
  zh-CN:
