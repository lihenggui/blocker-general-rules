i18n:
  en:
    description: Espreccino’s PepperTalk chat library receives Android connectivity and Wi-Fi state changes
      here and uses them to update its chat connection when the device goes offline or changes networks.
    disableEffect: The chat service will miss network-change notices and may not reconnect automatically
      after connectivity changes.
  zh-CN:
    description: 设备断网或切换网络时，Espreccino 的 PepperTalk 聊天库会通过此 Receiver 接收 Android 的网络和 Wi-Fi 状态变化，并据此更新聊天连接。
    disableEffect: 屏蔽后，聊天服务收不到网络变化通知，网络切换后可能无法自动重新连接。
