  en:
    description: When the app opens the Yongzheng7 camera module to take a photo or video, this Activity
      shows the camera preview, requests camera and storage access, and handles capture controls. It also
      supports timed and face-triggered photo capture.
    disableEffect: Users may lose the camera capture screen and be unable to take photos or videos through
      this module.
  zh-CN:
    description: 应用使用 Yongzheng7 相机模块拍摄照片或视频时，此 Activity 会显示相机预览、申请相机和存储权限并处理拍摄操作；它也支持定时和人脸触发拍照。
    disableEffect: 用户可能无法打开此模块的拍摄界面，也无法通过它拍照或录制视频。
