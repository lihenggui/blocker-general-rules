  en:
    description: The XING Android OAuth SDK opens this Activity when the app starts XING sign-in. It displays
      the authorization page, processes the sign-in return, and hands the token result back to the app.
    disableEffect: XING sign-in through this SDK will not complete.
  zh-CN:
    description: 应用发起 XING 登录时，XING Android OAuth SDK 会打开这个界面。它显示授权网页、处理登录返回，并将令牌结果交回应用。
    disableEffect: 停用后，通过该 SDK 进行的 XING 登录将无法完成。
