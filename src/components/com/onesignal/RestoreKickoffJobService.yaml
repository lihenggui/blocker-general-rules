i18n:
  en:
    description: After an app update on Android 8.0 or later, OneSignal schedules this job to begin restoring
      notifications that were still active. It starts the restore process from the saved notification
      list.
    disableEffect: Active OneSignal notifications may not be restored after an app update on Android 8.0
      or later.
  zh-CN:
    description: Android 8.0 及更高版本在应用更新后，OneSignal 会调度此任务来恢复仍有效的通知，并从已保存的通知列表开始处理。
    disableEffect: Android 8.0 及更高版本在应用更新后，OneSignal 中仍有效的通知可能无法恢复。
