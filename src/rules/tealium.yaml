    name: Tealium
    description: "## Primary location\nUnited States (San Diego) [Crunchbase, 01](https://www.crunchbase.com/organization/tealium)\n\
      ## Website\n[https://www.tealium.com](https://www.tealium.com)\n## About\nTealium offers a universal\
      \ data hub that unites its clients' tools and teams with \"universally acceptable, real-time customer\
      \ data\" [Tealium, 01](https://www.tealium.com).\n## Ownership\nTealium\n## Documentation\nhttps://community.tealiumiq.com/t5/Tealium-for-Android/Adding-Tealium-to-Your-Android-App/ta-p/16846\n\
      ## Products and Services\nTealium integrates technologies and services. Products and services include:\n\
      * Build & Stitch Profiles\n* Define Audiences\n* Trigger Actions\n* Analytics\n* Big Data\n* Customer\
      \ Relations Management\n* Display Ad\n* Email\n* Personalization\n* Search\n* Social [Tealium, 01](https://www.tealium.com)\n\
      Products include:\n* _Tealium iQ Tag Management:_ Integrate with other vendors through tags [Telium,\
      \ 02](https://tealium.com/products/tealium-iq-tag-management-system).\n* _Tealium Event Stream:_\
      \ Data collection from any source (web, mobile, OTT), monitor data stream in real time, and leverage\
      \ data in real time, especially for use on mobile devices [Tealium, 03](https://tealium.com/products/tealium-eventstream).\n\
      * _Tealium AudienceStream Customer Data Platform:_ A CDP that offers \"robust audience management\
      \ and data enrichment capabilities resulting in unified customer profiles and the ability to take\
      \ immediate, relevant action... Tealium AudienceStream allows users to connect all of their customer\
      \ data, creating a single view of customers and the ability to automate actions across every channel,\
      \ touchpoint and vendor in your entire digital ecosystem\". Tealium's Audience Sizing \"allows users\
      \ to connect all of their customer data, creating a single view of customers and the ability to\
      \ automate actions across every channel, touchpoint and vendor in your entire digital ecosystem\"\
      \ [Tealium, 04](https://tealium.com/products/audiencestream).\n* _Tealium DataAccess:_ DataAccess\
      \ \"offers the richest source of clean and correlated omnichannel, event and audience data collected\
      \ across web and mobile touch points, and makes that data available for real-time action\". It focuses\
      \ on unifying data and offers the capacity to \"Correlate and stitch online and offline data assets\
      \ to provide a rich “ready to query” visitor dataset\" [Tealium, 05](https://tealium.com/products/tealium-dataaccess).\n\
      Tealium's \"Visitor Stitching\" tracks user behavior on and offline, across devices. With this technology,\
      \ Tealium states, \"Previously anonymous visitor behavior will fulfill critical gaps in customer\
      \ knowledge when cross device activity is merged with known customer profiles\". Tealium has a patent\
      \ on their visitor stitching approach that combines the details from two or more profiles into one.\
      \ Their \"proprietary technology ‘replays’ the data from each of the stitched profiles back in order,\
      \ so that the profile can be built taking into account the sequence of the customer’s journey\"\
      .  \nTealium \"tracks visitor IDs from a variety of sources including Facebook, Amazon, Twitter,\
      \ LinkedIn, Google Plus and more. When any known ID is matched, visitors, their behaviors, and devices\
      \ are automatically stitched together. AudienceStream then enables you to take actions using these\
      \ profile-based attributes and create unique audiences, facilitating compelling omnichannel campaigns\
      \ that may begin on a mobile device and follow the user to his or her desktop\" [Tealium, 06](https://tealium.com/resources/visitor-stitching).\n\
      ## Privacy Policy\nTealium lists a Privacy Policy on its website; it is unclear if there are any\
      \ differences in policy as it applies to their mobile tracker.  \n_Data collection:_ Tealium collects\
      \ both PII and non-PII from individuals visiting its website or using its services. PII may be collected\
      \ when signing up for Tealium services. Non-PII may be collected when visiting the Tealium website\
      \ from a web browser or mobile device. Tealium collects information from web browser through the\
      \ use of cookies and web beacons. They also collect data on IP addresses to \" administer the Tealium\
      \ Website, analyze trends, track visitor movements, and gather broad demographic information that\
      \ assists us in identifying visitor preferences\". They \"may collect aggregated data regarding\
      \ use of the Services and the Tealium Website, including, without limitation, number of Site Visitors,\
      \ frequency and patterns of use, tag usage, feedback request trends, etc. (“Aggregated Data”)\"\
      . They state they use \"Aggregated Data as a statistical measure and not in a manner that would\
      \ identify you personally\" and that they \"may make use of, or make such Aggregated Data available\
      \ to, third parties, in any manner in our sole discretion\". Details on what constitutes \"aggregated\
      \ data\" or not available.  \n_Data sharing:_ Tealium shares data with service providers, affiliates,\
      \ partners and affiliated businesses not controlled by Tealium, billing, and when compelled by authorities.\n\
      _International law:_ Tealium \"participates in and has certified its compliance with the EU-U.S.\
      \ Privacy Shield Framework (Privacy Shield) and Swiss Safe Harbor\".\n_Opt-out:_ Tealium states,\
      \ \"You may correct, update and delete your Customer Information, change your choices for alerts\
      \ and other messages, choose whether to receive offers and promotions from us or you may request\
      \ access to the Personal Information we hold about you and ask us to amend or delete such Personal\
      \ Information. You can send your request to support@tealium.com.\" They also honor Do Not Track\
      \ headers and \"allows its users to opt‐out of having their personal information collected by Tealium\"\
      . It is not clear how individuals could opt-out of data collection from the Telium mobile device\
      \ tracker.\n_Data retention:_ Tealium \" retains the information we receive as described in this\
      \ Privacy Statement for as long as needed to provide our Services, comply with our legal obligations,\
      \ resolve disputes, establish legal defenses, conduct audits, pursue legitimate business purposes,\
      \ and enforce our agreements\".\n_Security:_ Tealium states that it \"takes precautions, including\
      \ administrative, technical, and physical measures – to help safeguard Customer Information against\
      \ loss, theft, and misuse as well as unauthorized access, disclosure, alteration, and destruction.\
      \ While we follow generally accepted standards to protect information submitted to us, no method\
      \ of storage or transmission is 100% secure. Users are solely responsible for protecting their passwords,\
      \ limiting access to their computers, and signing out of the Services after their sessions\" [Tealium,\
      \ 07](https://tealium.com/privacy).\n## Relationships\n_Integrations (technological):_ Amazon Web\
      \ Services / Bronto / Campaign Monitor / Twitter Campaigns / Facebook / CheetahMail / Criteo / Demandware\
      \ [Tealium, 01](https://www.tealium.com).\n## Details\n_Financial details:_ Tealium was founded\
      \ in 2008 and has raised over $112 million from funders [Crunchbase, 01](https://www.crunchbase.com/organization/tealium).\n\
      ## References\n* _Crunchbase, 01._ [https://www.crunchbase.com/organization/tealium](https://www.crunchbase.com/organization/tealium)\
      \  \n* _Tealium, 01._ [https://www.tealium.com](https://www.tealium.com)  \n* _Tealium, 02._ [https://tealium.com/products/tealium-iq-tag-management-system](https://tealium.com/products/tealium-iq-tag-management-system)\
      \  \n* _Tealium, 03._ [https://tealium.com/products/tealium-eventstream](https://tealium.com/products/tealium-eventstream)\
      \  \n* _Tealium, 04._ [https://tealium.com/products/audiencestream](https://tealium.com/products/audiencestream)\
      \  \n* _Tealium, 05._ [https://tealium.com/products/tealium-dataaccess](https://tealium.com/products/tealium-dataaccess)\
      \  \n* _Tealium, 06._ [https://tealium.com/resources/visitor-stitching](https://tealium.com/resources/visitor-stitching)\
      \  \n* _Tealium, 07._ [https://tealium.com/privacy](https://tealium.com/privacy)\n## External Links\n\
