recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:25:28Z'
i18n:
  en:
    description: The Haodanku BianXian monetization SDK starts this provider with the app and uses it
      to save or retrieve its own user and Android device identifiers. Its shopping pages read these values
      from app-local storage when needed.
    disableEffect: BianXian can no longer retrieve its saved user and device identifiers for attribution;
      other app screens remain available.
  zh-CN:
    description: 好单库 BianXian 变现 SDK 会在应用启动时启用此数据提供程序，用来保存或读取 SDK 自己的用户标识和 Android 设备标识。SDK 的购物页面需要这些值时，会从应用本地存储中读取。
    disableEffect: BianXian 将无法读取已保存的用户和设备标识，相关归因会停止；应用的其他页面仍可使用。
