    description: When VCloud needs to explain a camera or microphone permission for a call, this Activity
      shows the matching permission dialog and closes after the user responds.
    disableEffect: The in-app camera or microphone permission explanation cannot open, which can interrupt
      starting a voice or video call.
  zh-CN:
