i18n:
  en:
    description: Jamun Pickers opens its language-selection screen when an app requests language choices.
      It supports single or multiple selection and returns the selected languages to the app.
    disableEffect: Users cannot select and return languages through this Jamun Pickers screen.
  zh-CN:
    description: 应用请求选择语言时，Jamun Pickers 会打开语言选择界面。它支持单选或多选，并会将所选语言返回应用。
    disableEffect: 停用后，用户将无法通过此 Jamun Pickers 界面选择语言并返回结果。
