recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:04:01Z'
i18n:
  en:
    description: When the older Gamedock (Azerion) Android SDK starts a Gamedock interstitial or rewarded
      video, this Activity provides its full-screen loading, cancel, and ad-display flow.
    disableEffect: Blocking it stops these Gamedock ads; users will not receive rewards for rewarded videos
      handled by this flow.
  zh-CN:
    description: 较旧版本的 Gamedock（Azerion）Android SDK 启动 Gamedock 插屏广告或激励视频时，此 Activity 会提供全屏加载、取消和广告展示流程。
    disableEffect: 停用后，这些 Gamedock 广告将无法播放；通过此流程观看激励视频的用户不会获得奖励。
