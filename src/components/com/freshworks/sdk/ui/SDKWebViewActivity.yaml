i18n:
  en:
    description: Freshworks SDK displays a support conversation in its web view and handles attached files,
      photos, or videos selected for the conversation. The SDK opens it when the app starts a support
      conversation.
    disableEffect: Disabling it can prevent Freshworks support conversations from opening or accepting
      file attachments.
  zh-CN:
    description: Freshworks SDK 会在内置网页视图中显示支持对话，并处理为对话选择的文件、照片或视频附件。应用启动支持对话时会打开此页面。
    disableEffect: 禁用后，应用可能无法打开 Freshworks 支持对话或添加对话附件。
