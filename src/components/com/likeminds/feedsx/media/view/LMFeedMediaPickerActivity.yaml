i18n:
  en:
    description: LikeMinds Feed SX opens this Activity when the user attaches media to a feed post. It
      lets the user browse folders, select images or videos, and choose documents from Android's file
      picker.
    disableEffect: Users cannot attach media or documents through the Feed SX picker.
  zh-CN:
    description: 用户为动态帖子添加媒体时，LikeMinds Feed SX 会打开此 Activity。用户可以浏览文件夹、选择图片或视频，也可以使用 Android 文件选择器挑选文档。
    disableEffect: 停用后，用户无法通过 Feed SX 选择器为帖子添加媒体或文档。
