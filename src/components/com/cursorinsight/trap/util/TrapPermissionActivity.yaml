i18n:
  en:
    description: Cursor Insight's Trap sensor-collection library uses this activity to request Bluetooth,
      location, or Wi-Fi permissions from Android and report the result to the library.
    disableEffect: Disabling it prevents Trap from requesting permissions needed for its Bluetooth, location,
      and Wi-Fi data collection.
  zh-CN:
    description: Cursor Insight 的 Trap 传感器采集库会通过此界面向 Android 申请蓝牙、位置或 Wi-Fi 权限，并将结果返回给该库。
    disableEffect: 停用后，Trap 将无法申请蓝牙、位置和 Wi-Fi 数据采集所需的权限。
