i18n:
  en:
    description: The Azerion Ads SDK opens this Activity for full-screen interstitial or rewarded video
      ads. It displays image, HTML, or video creatives and grants the configured reward when a rewarded
      video is completed.
    disableEffect: Interstitial and rewarded ads served here will not display, and watching a rewarded
      ad will no longer grant its reward.
  zh-CN:
    description: Azerion Ads SDK 会为全屏插屏广告或激励视频广告打开此 Activity。它显示图片、HTML 或视频广告素材，并在激励视频播放完成后发放相应奖励。
    disableEffect: 停用后将无法显示此处承载的插屏和激励广告，观看激励广告也不再获得奖励。
