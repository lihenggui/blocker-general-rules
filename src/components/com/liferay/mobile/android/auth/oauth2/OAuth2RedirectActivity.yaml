  en:
    description: Liferay Mobile SDK declares this Activity to receive OAuth sign-in return links. When
      Android opens the link here, it passes it to the AppAuth sign-in flow and closes this screen.
    disableEffect: OAuth sign-ins that use this Liferay redirect will not return to the app and may fail.
  zh-CN:
    description: Liferay Mobile SDK 使用此 Activity 接收 OAuth 登录返回链接。Android 打开链接后，它会将链接交给 AppAuth 登录流程，然后关闭此页面。
    disableEffect: 使用此 Liferay 回调的 OAuth 登录无法返回应用，可能会失败。
