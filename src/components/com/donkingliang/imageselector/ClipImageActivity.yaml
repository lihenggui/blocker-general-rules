  en:
    description: The Donking Liang image selector opens this screen when a chosen photo needs cropping.
      It crops the photo to the requested shape, saves the result, and returns it to the app.
    disableEffect: Apps that need a cropped photo cannot finish that image-selection step if this screen
      is disabled.
  zh-CN:
    description: Donking Liang 图片选择库会在用户需要裁剪所选照片时打开此页面。它按请求的比例裁剪并保存照片，再把结果交还给应用。
    disableEffect: 停用后，依赖裁剪结果的图片选择流程无法完成。
