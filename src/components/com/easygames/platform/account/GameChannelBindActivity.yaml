  en:
    description: The EGLS (EasyGames) Android Game Platform SDK opens this screen when a player links
      a game account to a sign-in channel or verifies a phone number or email address. It handles the
      selected account provider and confirmation code.
    disableEffect: Players cannot link sign-in accounts or add and update verified contact details through
      the SDK.
  zh-CN:
    description: 玩家关联登录渠道，或验证手机号、电子邮箱时，EGLS（EasyGames）Android 游戏平台 SDK 会打开此界面。界面会处理所选账号渠道和验证码。
    disableEffect: 停用后，玩家无法通过 SDK 关联登录账号，也无法添加或更新已验证的联系方式。
