i18n:
  en:
    description: Devsu Push Client starts this Service when Google refreshes the app’s GCM push token.
      It requests a fresh registration so Devsu notifications can continue to arrive.
    disableEffect: The app will not refresh its Devsu GCM registration when Google changes the push token.
  zh-CN:
    description: Google 更新应用的 GCM 推送令牌时，Devsu Push Client 会启动此 Service，并重新注册令牌以继续接收 Devsu 通知。
    disableEffect: 停用后，Google 更换推送令牌时，应用将无法更新 Devsu GCM 注册信息。
