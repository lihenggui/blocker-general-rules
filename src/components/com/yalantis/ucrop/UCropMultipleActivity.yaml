    description: 应用请求裁剪多张所选图片时，LuckSiege 的 uCrop 会打开此页面。它按裁剪设置处理图片，并将编辑后的图片返回应用。
    disableEffect: 应用的多图裁剪流程将无法打开或返回裁剪结果。
