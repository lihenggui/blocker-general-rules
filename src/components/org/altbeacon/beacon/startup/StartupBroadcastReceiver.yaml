recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:46:33Z'
i18n:
  en:
    description: When the device restarts or Android reports a background Bluetooth scan, AltBeacon checks
      whether the app is monitoring beacons and resumes or processes that scan.
    disableEffect: Beacon detection may not resume after a restart or background scan, so app features
      that depend on nearby beacons can fail.
  zh-CN:
    description: 设备重启或 Android 报告后台蓝牙扫描时，AltBeacon 会检查应用是否正在监测信标，并恢复检测或处理扫描结果。
    disableEffect: 重启后或系统报告后台扫描时，信标检测可能无法恢复，依赖附近信标的应用功能可能失效。
