recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:04:01Z'
i18n:
  en:
    description: When Gamedock's AIR permission path requests one or more Android permissions, this Activity
      asks the user and returns the permission results to Gamedock.
    disableEffect: Blocking it prevents permission requests through this Gamedock path, which may disable
      features that need those permissions.
  zh-CN:
    description: Gamedock 的 AIR 权限流程请求一个或多个 Android 权限时，此 Activity 会向用户发起请求，并将权限结果返回给 Gamedock。
    disableEffect: 停用后，Gamedock 将无法通过此流程请求权限，依赖这些权限的功能可能不可用。
