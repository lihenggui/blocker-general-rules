    description: Xiaomi Mi Push sends incoming-message and registration callbacks to this Pushwoosh receiver.
      It forwards messages to Pushwoosh and updates the push token after successful registration.
    disableEffect: Pushwoosh will stop receiving Xiaomi messages and registration token updates.
  zh-CN:
    description: 小米推送会把收到的消息和注册回调发送到此 Pushwoosh 接收器；它会转交消息，并在注册成功后更新推送令牌。
    disableEffect: Pushwoosh 将无法再接收小米推送消息和注册令牌更新。
