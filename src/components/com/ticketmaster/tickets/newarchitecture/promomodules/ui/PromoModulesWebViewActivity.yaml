  en:
    description: When a user opens a Ticketmaster promotional module, the Ticketmaster Tickets SDK displays
      its linked page and hands installed-app links to the matching app.
    disableEffect: Users will not be able to open that promotional page; ticket screens remain available.
  zh-CN:
    description: 用户打开 Ticketmaster 推广模块时，Ticketmaster Tickets SDK 会显示其链接页面，并把可由已安装应用处理的链接交给对应应用。
    disableEffect: 用户将无法打开该推广页面；门票页面仍可使用。
