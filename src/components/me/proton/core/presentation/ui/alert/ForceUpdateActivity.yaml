recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:42:44Z'
i18n:
  en:
    description: Proton AG's Proton Core Android SDK opens this Activity when the server tells the app
      that an update is required. It displays the blocking update message and can offer a learn-more link.
    disableEffect: If disabled, users may be unable to continue when the service requires a newer app
      version.
  zh-CN:
    description: Proton AG 的 Proton Core Android SDK 会在服务器要求应用更新时打开此 Activity，显示阻止继续使用的更新提示，并可提供了解详情的链接。
    disableEffect: 停用后，当服务要求使用较新版本时，用户可能无法继续操作。
