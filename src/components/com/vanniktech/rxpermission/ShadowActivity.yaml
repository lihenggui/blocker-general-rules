i18n:
  en:
    description: When an app using RxPermissions requests access to the camera, location, or another protected
      feature, this Activity opens the Android permission prompt and returns the user’s choice.
    disableEffect: Permission requests through this library will stop working, so app features that need
      those permissions may fail.
  zh-CN:
    description: 应用通过 RxPermissions 请求相机、位置或其他受保护功能的权限时，此 Activity 会打开 Android 权限提示，并将用户的选择返回给应用。
    disableEffect: 通过此库发起的权限请求将无法正常完成，依赖这些权限的应用功能可能会失效。
