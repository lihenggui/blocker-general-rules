      page may fail to open.
  zh-CN:
    description: 天九电商商品 SDK 打开 DCloud UniMP 小程序页面时，会在此页面检查已安装版本；需要更新时下载并安装资源包，然后打开指定页面。
    disableEffect: 停用后，此流程无法下载或更新小程序资源包，因此指定页面可能无法打开。
