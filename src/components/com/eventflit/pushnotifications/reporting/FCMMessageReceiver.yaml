i18n:
  en:
    description: When Google Cloud Messaging delivers an Eventflit message with tracking data, this Receiver
      queues a delivery report for the Eventflit push service.
    disableEffect: Eventflit will stop recording delivery reports for received pushes; message handling
      through the other service is unaffected.
  zh-CN:
    description: Google Cloud Messaging 收到带有跟踪信息的 Eventflit 消息时，此 Receiver 会为 Eventflit 推送服务排队提交送达报告。
    disableEffect: 屏蔽后，Eventflit 不再记录已收到推送的送达报告；其他服务处理消息的流程不受影响。
