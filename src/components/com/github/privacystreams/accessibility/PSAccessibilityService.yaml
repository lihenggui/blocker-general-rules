recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:04:42Z'
i18n:
  en:
    description: The PrivacyStreams framework’s accessibility Service runs after the user enables it in
      Android settings; it forwards accessibility changes and the current window’s content to PrivacyStreams
      handlers.
    disableEffect: PrivacyStreams will stop receiving accessibility event data, while the app’s other
      screens remain available.
  zh-CN:
    description: 用户在 Android 设置中启用后，PrivacyStreams 框架的辅助功能 Service 会把界面变化和当前窗口内容交给 PrivacyStreams 处理。
    disableEffect: PrivacyStreams 将无法再接收辅助功能事件数据，但应用的其他界面仍可使用。
