i18n:
  en:
    description: When Kumulos requests notification permission on Android 13 or newer, this Activity asks
      the user for permission and closes after the response.
    disableEffect: Kumulos will not be able to ask for notification permission through this Activity,
      so its push notifications may remain disabled.
  zh-CN:
    description: Kumulos 在 Android 13 或更高版本请求通知权限时，此 Activity 会向用户请求授权，并在收到结果后关闭。
    disableEffect: Kumulos 将无法通过此 Activity 请求通知权限，因此其推送通知可能无法启用。
