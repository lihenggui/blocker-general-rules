i18n:
  en:
    description: Appinfra’s AppsFerry Core starts automatically with the app and initializes modules registered
      for app-start and foreground/background callbacks.
    disableEffect: AppsFerry modules that need startup or app-lifecycle callbacks will not initialize,
      so features they provide may stop working.
  zh-CN:
    description: Appinfra 的 AppsFerry Core 会随应用启动，并初始化已注册的启动及前后台生命周期模块。
    disableEffect: 禁用后，需要启动或应用生命周期回调的 AppsFerry 模块无法初始化，其提供的功能可能停止工作。
