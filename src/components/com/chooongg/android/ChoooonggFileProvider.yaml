i18n:
  en:
    description: ChooonggKtx lets the app share files with other apps through temporary file links, such
      as when the user shares an attachment or opens it in another app. It exposes only the app's configured
      sharing locations.
    disableEffect: The app may no longer be able to share or open files through this provider.
  zh-CN:
    description: ChooonggKtx 可通过临时文件链接把文件交给其他应用，例如分享附件或用其他应用打开附件；它只开放应用配置的分享目录。
    disableEffect: 停用后，应用可能无法通过此组件分享文件或将文件交给其他应用打开。
