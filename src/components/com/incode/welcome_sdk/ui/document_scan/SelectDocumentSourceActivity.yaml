i18n:
  en:
    description: When identity documents are needed, this screen lets the user choose how to provide the
      requested document and whether to show the scan tutorial. The MetaMap identity verification SDK
      opens this screen when the configured flow reaches this step.
    disableEffect: Disabling it prevents users from selecting a document path required by the verification
      flow.
  zh-CN:
    description: 需要身份证件时，此页面让用户选择如何提供所需证件，以及是否查看扫描说明。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法选择核验流程所需的证件提交方式。
