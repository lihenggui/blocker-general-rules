i18n:
  en:
    description: The Serenegiant USB-camera library runs this Service when an app connects an external
      USB video camera. It manages the camera connection and supplies live video to the app.
    disableEffect: Apps that rely on this Service cannot connect to or receive video from the external
      camera.
  zh-CN:
    description: 应用连接外置 USB 摄像头时，Serenegiant USB 摄像头库会运行此 Service，管理摄像头连接并向应用提供实时画面。
    disableEffect: 依赖此 Service 的应用将无法连接外置摄像头或接收其实时画面。
