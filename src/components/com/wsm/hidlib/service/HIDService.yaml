i18n:
  en:
    description: The Szeasco HID device library uses this service when the app connects to a USB HID reader
      or controller. It reads device data, sends commands, and passes responses back to the app.
    disableEffect: Apps that use this service for a connected HID reader or controller will lose communication
      with that device.
  zh-CN:
    description: Szeasco HID 设备库在应用连接 USB HID 读卡器或控制器时使用此服务；它负责读取设备数据、发送指令并将响应交回应用。
    disableEffect: 依赖此服务连接 HID 读卡器或控制器的应用将无法与该设备通信。
