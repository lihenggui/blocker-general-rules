    description: The PSPDFKit/Nutrient PDF SDK runs this private provider as the app process starts to
      prepare its PDF features before documents are opened.
    disableEffect: Apps that rely on this automatic setup may fail to open PDF documents or use the SDK's
      viewing and editing tools.
  zh-CN:
    description: PSPDFKit/Nutrient PDF SDK 会在应用进程启动时自动运行此私有组件，为打开文档准备 PDF 功能。
    disableEffect: 依赖此自动初始化的应用可能无法打开 PDF 文档或使用 SDK 的阅读和编辑工具。
