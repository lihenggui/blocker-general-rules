    description: The YYXXGame YLink instant-messaging SDK opens this Activity when a player attaches a
      photo or video to a conversation; it launches Android's media picker and returns the selected item
      to the chat.
    disableEffect: Players cannot select photos or videos to attach to YLink conversations.
  zh-CN:
    description: 玩家在 YYXXGame 的 YLink 即时通信 SDK 聊天中添加照片或视频时，SDK 会打开此 Activity；它启动 Android 媒体选择器，并把选中的内容返回给聊天界面。
    disableEffect: 玩家无法选择照片或视频作为 YLink 聊天附件。
