i18n:
  en:
    description: When Firebase Cloud Messaging delivers a message, LINE ABC's remote notification SDK
      passes it to the app's registered notification handlers; it also forwards new registration tokens
      and deleted-message notices.
    disableEffect: LINE ABC's notification handlers will stop receiving messages through this Service
      and will not receive its token updates.
  zh-CN:
    description: Firebase Cloud Messaging 收到消息时，LINE ABC 远程通知 SDK 会将消息转交给应用注册的通知处理器；此 Service 也会转交新的注册令牌和消息删除通知。
    disableEffect: 停用后，LINE ABC 的通知处理器将无法通过此 Service 收到推送消息或令牌更新。
