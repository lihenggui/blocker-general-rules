i18n:
  en:
    description: The iQNECT iQKIT SDK uses this manifest alias as its public camera-search entry point.
      It opens the scanner Activity used in that SDK version so users can search by barcode or product
      image.
    disableEffect: If disabled, the app cannot open the iQNECT camera-search entry point through this
      alias.
  zh-CN:
    description: iQNECT iQKIT SDK 将此清单别名用作相机搜索入口。它会打开对应版本的扫描界面，让用户通过条码或商品图像进行搜索。
    disableEffect: 停用后，应用无法通过此别名打开 iQNECT 的相机搜索入口。
