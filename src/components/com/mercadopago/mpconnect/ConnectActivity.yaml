i18n:
  en:
    description: Mercado Pago Connect Android SDK opens this Activity when the user authorizes an app
      to connect with Mercado Pago. It shows Mercado Pago’s authorization page and returns the resulting
      credentials to the app.
    disableEffect: The user cannot authorize or finish connecting the app to Mercado Pago.
  zh-CN:
    description: 用户授权应用连接 Mercado Pago 时，Mercado Pago Connect Android SDK 会打开此 Activity。它会显示 Mercado Pago
      的授权页面，并将生成的凭据返回给应用。
    disableEffect: 用户无法授权或完成应用与 Mercado Pago 的连接。
