i18n:
  en:
    description: When a flow checks a selfie against the face on an identity document, this screen presents
      the face-match step and its outcome. The MetaMap identity verification SDK opens this screen when
      the configured flow reaches this step.
    disableEffect: Disabling it prevents users from completing flows that require this face comparison.
  zh-CN:
    description: 核验流程将自拍与身份证件上的人脸进行比对时，此页面会展示人脸比对步骤和结果。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法完成要求此人脸比对的核验流程。
