    description: The Open Campaign Link (OCL) health campaign SDK opens this screen to scan a campaign
      QR code with the camera. When it recognizes a code, it returns its text to the app and closes the
      scanner.
    disableEffect: Disabling it prevents the app from scanning QR codes for OCL campaign links.
  zh-CN:
    description: Open Campaign Link（OCL）健康活动 SDK 会打开此页面，通过相机扫描活动二维码。识别成功后，二维码内容会返回给应用，扫描页面随即关闭。
    disableEffect: 停用后，应用将无法扫描 OCL 活动链接二维码。
