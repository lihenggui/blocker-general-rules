recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:30:48Z'
i18n:
  en:
    description: Fyber FairBid installs its crash-reporting handler automatically when the app starts.
      It reports uncaught errors to FairBid and then lets the previous handler continue.
    disableEffect: FairBid will stop automatically sending uncaught-error reports; ordinary app features
      continue.
  zh-CN:
    description: Fyber FairBid 会在应用启动时自动安装崩溃报告处理器。它会向 FairBid 报告未捕获的错误，然后继续调用原有处理器。
    disableEffect: 禁用后，FairBid 将不再自动接收应用崩溃报告；应用的普通功能不受影响。
