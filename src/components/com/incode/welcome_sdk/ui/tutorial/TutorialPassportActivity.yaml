  en:
    description: Before a passport is scanned, this screen explains how to capture it and applies the
      document-specific scan settings supplied by the flow. The MetaMap identity verification SDK opens
      this screen when the configured flow reaches this step.
    disableEffect: Disabling it prevents users from reaching passport capture when this tutorial is required.
  zh-CN:
    description: 扫描护照前，此页面会说明拍摄方式，并应用流程提供的护照扫描设置。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，教程为必需步骤时，用户无法进入护照拍摄。
