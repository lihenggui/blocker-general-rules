  en:
    description: When the PAXSTORE client delivers a cloud message, PAXSTORE's cloud-messaging SDK decrypts
      it, shows enabled notifications, and passes notification or data content to the app.
    disableEffect: PAXSTORE cloud notifications and messages will no longer reach the app.
