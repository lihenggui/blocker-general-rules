i18n:
  en:
    description: The JioPay Payment Gateway SDK opens this checkout screen when the app begins a payment.
      It loads JioPay's payment page in an embedded browser, handles returns from UPI apps, and sends
      the result or error back to the app.
    disableEffect: JioPay checkout will not open, so payments using this flow cannot be completed or returned
      to the app.
  zh-CN:
    description: JioPay 支付网关 SDK 在应用发起付款时打开此结算界面。它会在内嵌浏览器中加载 JioPay 支付页面、处理 UPI 应用返回结果，并将付款结果或错误交回应用。
    disableEffect: 停用后，JioPay 结算界面无法打开，使用此流程的付款将无法完成或将结果返回应用。
