i18n:
  en:
    description: Taifuno's Android SDK opens this Activity when the app or user opens its in-app chat.
      It shows the conversation and lets the user exchange messages through the Taifuno service.
    disableEffect: If disabled, the app's Taifuno chat screen will not open, so in-app conversations will
      be unavailable.
  zh-CN:
    description: Taifuno 的 Android SDK 会在应用或用户打开内置聊天时启动此 Activity，显示对话，并通过 Taifuno 服务收发消息。
    disableEffect: 停用后，应用中的 Taifuno 聊天页面将无法打开，内置对话也无法使用。
