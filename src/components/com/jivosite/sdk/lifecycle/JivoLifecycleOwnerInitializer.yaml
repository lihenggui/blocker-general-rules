recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:54:58Z'
i18n:
  en:
    description: At app startup, this Jivo Chat Provider registers callbacks for screen start and stop
      events so the SDK can track when the app moves between the foreground and background.
    disableEffect: Jivo will no longer receive these app foreground and background changes for its chat
      lifecycle handling.
  zh-CN:
    description: 应用启动时，Jivo 客服聊天 SDK 的此 Provider 会注册页面启动和停止回调，以跟踪应用何时进入前台或后台。
    disableEffect: Jivo 将无法再通过这些回调感知应用的前后台切换，聊天相关的生命周期处理会受到影响。
