i18n:
  en:
    description: OkayID Mobile (Innov8tif identity-document SDK) opens this camera screen for the document
      type requested by the app. It guides the user to photograph the configured document sides and sends
      the images for review.
    disableEffect: The app cannot capture and receive the requested document images through OkayID Mobile
      if this screen is disabled.
  zh-CN:
    description: OkayID Mobile（Innov8tif 身份证件 SDK）会根据应用请求的证件类型打开此相机界面，引导用户拍摄所需的证件面，并将照片交由后续界面确认。
    disableEffect: 停用后，应用无法通过 OkayID Mobile 拍摄并接收所需的证件图像。
