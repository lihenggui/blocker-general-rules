recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:23:00Z'
i18n:
  en:
    description: The Replay.io Android client schedules this background Service as a six-hour watchdog
      to upload queued session replay data that is still waiting to be sent.
    disableEffect: Some saved Replay.io session data may remain unsent, reducing the session recordings
      available for review; the app itself continues to work.
  zh-CN:
    description: Replay.io Android 客户端每六小时安排此后台 Service 检查并上传仍在等待发送的会话回放数据。
    disableEffect: 部分 Replay.io 会话数据可能无法发送，可供查看的会话记录会减少；应用本身仍可运行。
