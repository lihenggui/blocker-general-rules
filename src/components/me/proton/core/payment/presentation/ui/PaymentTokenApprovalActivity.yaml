i18n:
  en:
    description: Proton AG's Proton Core Android SDK opens this Activity when a payment provider requires
      a secure approval page for a payment token. It loads that page and returns whether the token is
      ready to charge.
    disableEffect: If disabled, payments requiring this approval step may not complete.
  zh-CN:
    description: Proton AG 的 Proton Core Android SDK 会在付款提供方要求安全页面批准付款令牌时打开此 Activity。它加载该页面，并返回令牌是否可用于扣款。
    disableEffect: 停用后，需要此批准步骤的付款可能无法完成。
