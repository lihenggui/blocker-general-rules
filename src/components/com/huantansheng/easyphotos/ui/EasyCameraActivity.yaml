i18n:
  en:
    description: EasyPhotos (Joker-Fu’s photo picker) opens this camera screen when a user chooses to
      take a photo or video; it uses either the phone’s camera app or EasyPhotos’ built-in camera and
      returns the captured media to the picker.
    disableEffect: Users can no longer take a new photo or video from EasyPhotos, although choosing existing
      media remains available.
  zh-CN:
    description: 用户在 EasyPhotos（Joker-Fu 的照片选择 SDK）中选择拍照或录像时会打开此相机界面；它会调用手机相机或使用 SDK 自带相机，并将拍摄结果返回给选择界面。
    disableEffect: 停用后，用户无法再通过 EasyPhotos 拍摄照片或视频，但仍可选择已有媒体。
