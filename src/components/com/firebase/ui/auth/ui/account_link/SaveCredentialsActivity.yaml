i18n:
  en:
    description: After an older FirebaseUI Auth sign-in succeeds, this Activity offers to save the account
      in Google Smart Lock, including its email, password, and supported provider details.
    disableEffect: Blocking it can interrupt sign-in flows that invoke credential saving, and saved login
      details will not be offered.
  zh-CN:
    description: 较早版本的 FirebaseUI Auth 登录成功后，此 Activity 会通过 Google Smart Lock 提供保存账号的选项，包括邮箱、密码和受支持的身份提供方信息。
    disableEffect: 停用后，调用凭据保存步骤的登录流程可能中断，也不会再提供保存登录信息的选项。
