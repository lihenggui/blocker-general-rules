i18n:
  en:
    description: When started by the app or a LevelUp Beacon SDK receiver, this service scans for nearby
      LevelUp beacons while scanning is enabled and the battery is not low, then reports discoveries to
      the app.
    disableEffect: The app will no longer detect nearby LevelUp beacons or receive their discovery events.
  zh-CN:
    description: 应用或 LevelUp Beacon SDK 的 Receiver 启动此服务后，只要扫描已启用且电量不低，服务就会搜索附近的 LevelUp 信标并向应用报告发现结果。
    disableEffect: 应用将无法再检测附近的 LevelUp 信标或收到信标发现事件。
