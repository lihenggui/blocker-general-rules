recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:42:26Z'
i18n:
  en:
    description: HPay uses this receiver when WeChat asks the app to refresh its registration. It registers
      the configured app with WeChat so the payment handoff can continue.
    disableEffect: WeChat may not recognize or refresh the app registration, disrupting HPay’s WeChat
      payment flow.
  zh-CN:
    description: 微信要求应用刷新注册信息时，HPay 会通过此 Receiver 向微信重新注册应用，以便继续支付跳转。
    disableEffect: 微信可能无法识别或刷新应用注册信息，从而影响 HPay 的微信支付流程。
