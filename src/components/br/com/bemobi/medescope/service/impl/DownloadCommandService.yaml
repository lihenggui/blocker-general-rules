recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T15:31:40Z'
i18n:
  en:
    description: The Bemobi Medescope download library starts this service when the app queues or cancels
      a file, requests progress, or handles a finished download. It submits downloads to Android Download
      Manager and reports progress and results to the app.
    disableEffect: Files downloaded through Medescope may not start, cancel, or report progress and results
      correctly, breaking app features that use those downloads.
  zh-CN:
    description: 应用通过 Bemobi Medescope 下载库添加或取消文件、请求进度或处理已完成的下载时，此服务会执行相应操作，并把进度和结果传回应用。
    disableEffect: 停用后，通过 Medescope 下载的文件可能无法正常开始、取消或报告进度和结果，依赖这些下载的应用功能也会受影响。
