recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: This ByteDance AppLog Receiver accepts analytics events sent within the app and forwards
      them to the tracking SDK. It runs when the SDK sends an event for collection.
    disableEffect: AppLog may stop recording events delivered through this receiver, while the app’s normal
      screens and features remain available.
  zh-CN:
    description: 这个字节跳动 AppLog 接收器会接收应用内部发送的分析事件，并交给追踪 SDK 处理。SDK 发送待收集事件时会触发它。
    disableEffect: 禁用后，AppLog 可能无法记录通过此接收器传递的事件，但应用的日常页面和功能仍可使用。
