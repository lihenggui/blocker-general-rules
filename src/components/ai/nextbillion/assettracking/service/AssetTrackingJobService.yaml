i18n:
  en:
    description: Android runs this scheduled job for the NextBillion Asset Tracking SDK when its tracking
      job is due. It restores the saved tracking settings and starts asset-location tracking if tracking
      is not already running.
    disableEffect: Background asset tracking may fail to restart or resume after Android stops its tracking
      service.
  zh-CN:
    description: NextBillion Asset Tracking SDK 的跟踪任务到期时，Android 会运行此计划任务。它会恢复已保存的跟踪设置，并在跟踪尚未运行时启动资产位置跟踪。
    disableEffect: Android 停止跟踪服务后，后台资产跟踪可能无法重新启动或恢复。
