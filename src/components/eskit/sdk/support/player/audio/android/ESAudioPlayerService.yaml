i18n:
  en:
    description: ExtScreen's Android audio module binds this Service when the app requests audio playback.
      It plays audio and handles controls such as pause, seeking, and volume.
    disableEffect: Audio that the app routes through this ExtScreen player will fail to start or respond
      to playback controls.
  zh-CN:
    description: 应用请求播放音频时，ExtScreen 的 Android 音频模块会绑定此 Service。它负责播放音频并处理暂停、定位和音量等控制。
    disableEffect: 应用通过此 ExtScreen 播放器播放的音频将无法启动或响应播放控制。
