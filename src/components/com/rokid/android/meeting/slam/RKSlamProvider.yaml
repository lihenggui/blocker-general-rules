i18n:
  en:
    description: The Rokid Meeting SLAM SDK creates this provider at app startup to check whether the
      device supports its shared AR meeting mode and send that capability to the meeting service.
    disableEffect: Rokid Meeting no longer receives the device’s SLAM support status, so it cannot enable
      shared AR through this capability check.
  zh-CN:
    description: Rokid Meeting SLAM SDK 会在应用启动时创建此内容提供器，检查设备是否支持共享增强现实会议模式，并将这一能力告知会议服务。
    disableEffect: 停用后，Rokid Meeting 无法收到设备的 SLAM 支持状态，也就无法通过此能力检查启用共享增强现实模式。
