recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:45:36Z'
i18n:
  en:
    description: When Infinum Thimble is opened, this Activity provides controls for layout grids, mockup
      overlays, a pixel magnifier, screenshots, and screen recording, and requests permission to draw
      over other apps.
    disableEffect: Thimble's design and screen-capture controls cannot be opened, while the host app's
      regular features continue to work.
  zh-CN:
    description: 当用户打开 Infinum Thimble 时，此 Activity 会提供布局网格、设计稿覆盖层、像素放大镜、屏幕截图和录屏控制，并请求在其他应用上层显示的权限。
    disableEffect: Thimble 的设计检查和屏幕捕获控制界面将无法打开，但宿主应用的日常功能仍可正常使用。
