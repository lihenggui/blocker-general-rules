  en:
    description: Ogury (Presage) uses this Activity to open a saved home-screen shortcut for an ad experience.
      When someone taps the shortcut, it loads that experience in the SDK's browser.
    disableEffect: The Ogury ad shortcut will no longer open its linked experience if this Activity is
      disabled.
