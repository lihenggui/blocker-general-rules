i18n:
  en:
    description: Roamcharge (DeepFleet) opens this map when the host app launches its charging-station
      screen. It fetches electric-vehicle charging station names and locations and marks them on the map.
    disableEffect: The charging-station map cannot open, so users cannot find stations through this screen.
  zh-CN:
    description: Roamcharge（DeepFleet）会在宿主应用打开充电站页面时显示这张地图。它会获取电动车充电站的名称和位置，并在地图上标出站点。
    disableEffect: 停用后，充电站地图无法打开，用户不能通过此页面查找站点。
