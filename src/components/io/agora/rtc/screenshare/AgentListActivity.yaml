i18n:
  en:
    description: The LiveStoreHub SHAS screen-sharing library displays available support agents; choosing
      one requests a connection for a screen-sharing session. Disabling it prevents users from selecting
      an agent and starting a session from this screen.
    disableEffect: Users will not be able to choose a support agent or start screen sharing from this
      screen.
  zh-CN:
    description: LiveStoreHub SHAS 屏幕共享库会显示可联系的客服人员；选择一位后会为屏幕共享请求连接。禁用后，用户无法在此界面选择客服并开始共享。
    disableEffect: 用户将无法在此界面选择客服或开始屏幕共享。
