i18n:
  en:
    description: When an app opens a web3 site through Particle Network Wallet Service, this screen displays
      it in the wallet's decentralized-app browser and supports wallet interactions with the site.
    disableEffect: Blocking it prevents users from opening sites through this wallet browser and using
      its connected wallet interactions.
  zh-CN:
    description: 应用通过 Particle Network Wallet Service 打开 web3 网站时，此页面会在钱包内的去中心化应用浏览器中显示网站，并支持网站与钱包交互。
    disableEffect: 禁用后，用户将无法通过此钱包浏览器打开网站或使用其中的钱包交互功能。
