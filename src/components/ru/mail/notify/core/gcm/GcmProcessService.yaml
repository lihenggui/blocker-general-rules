i18n:
  en:
    description: Mail.ru's libverify/libnotify core uses this background service to process push data,
      including notification and verification messages, and pass related server updates to the SDK.
    disableEffect: Disabling it can interrupt Mail.ru libverify background requests in apps that use that
      SDK, as well as stop libnotify push messages from being processed.
  zh-CN:
    description: Mail.ru 的 libverify/libnotify 核心库会通过此后台服务处理推送数据（包括通知和验证消息），并将相关服务器更新交给 SDK。
    disableEffect: 停用后，使用 Mail.ru libverify 的应用可能无法完成后台验证请求，libnotify 推送消息也将无法处理。
