i18n:
  en:
    description: In Logto Android SDK versions that use embedded sign-in, this screen displays the authorization
      page in an in-app web view and supports the SDK web-based social sign-in flow. Closing it cancels
      the pending sign-in.
    disableEffect: Users cannot sign in through the embedded Logto page in app versions that use this
      flow.
  zh-CN:
    description: 使用内嵌登录流程的 Logto Android SDK 版本会在此页面中显示授权网页，并支持 SDK 的网页社交登录流程。关闭页面会取消当前登录。
    disableEffect: 停用后，使用此流程的应用版本将无法通过 Logto 内嵌页面登录。
