i18n:
  en:
    description: The OnciZL Daemon SDK starts this foreground Service to keep background work active.
      While it runs, it repeatedly starts the companion worker that restarts the app's registered background
      tasks.
    disableEffect: The SDK's background keep-alive and automatic service restarts will stop.
  zh-CN:
    description: OnciZL Daemon SDK 会启动此前台 Service 来维持后台工作。运行期间，它会反复启动配套服务，以重新启动应用登记的后台任务。
    disableEffect: SDK 的后台保活和自动服务重启将停止。
