i18n:
  en:
    description: When started by the Befrest push library, this Service maintains a server connection,
      receives push messages, and broadcasts them to the app; it also reconnects after interruptions.
    disableEffect: Befrest push messages and connection updates will stop; the app's other features remain
      available.
  zh-CN:
    description: Befrest 推送库启动此 Service 后，它会维持与服务器的连接、接收推送消息并通知应用；连接中断后也会尝试重连。
    disableEffect: 停用后，Befrest 推送消息和连接状态更新将停止；应用的其他功能仍可使用。
