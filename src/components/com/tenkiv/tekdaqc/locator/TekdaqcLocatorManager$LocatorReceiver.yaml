i18n:
  en:
    description: When the TenKiv locator broadcasts a board update, this receiver turns it into app notifications
      for newly found, updated, or removed TekDAQC boards.
    disableEffect: Disabling it prevents the app from receiving board discovery and availability changes
      from the TenKiv locator.
  zh-CN:
    description: TenKiv 定位器广播采集板状态时，这个接收器会将信息转成应用通知，报告新发现、状态更新或移除的 TekDAQC 设备。
    disableEffect: 停用后，应用将无法收到 TenKiv 定位器发来的设备发现和可用状态变化。
