recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: When Firebase Cloud Messaging delivers a push or refreshes the device token, the EZPush
      Android SDK uses this service to handle its messages and commands and register the new token.
    disableEffect: EZPush notifications, commands, and token updates will no longer be handled, while
      the rest of the host app remains available.
  zh-CN:
    description: Firebase Cloud Messaging 投递推送或刷新设备令牌时，EZPush Android SDK 会通过此服务处理消息和命令，并登记新令牌。
    disableEffect: 禁用后，EZPush 通知、命令和令牌更新将无法处理，但宿主应用的其他功能仍可使用。
