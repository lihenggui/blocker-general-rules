recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:51:03Z'
i18n:
  en:
    description: When a T-ID sign-in page reports that there is no network connection, this screen explains
      the error and lets the user go back or close the attempt.
    disableEffect: Blocking it removes the sign-in flow’s network-error screen and its expected way to
      return from the failed attempt.
  zh-CN:
    description: T-ID 登录页面报告没有网络连接时，此界面会显示错误信息，并允许用户返回或关闭本次尝试。
    disableEffect: 停用后，登录流程无法显示此网络错误界面，也无法按预期从失败页面返回。
