  en:
    description: The Sparkcentral customer-support SDK binds to this background service while its chat
      features run. It manages the SDK's user and conversation work, including loading conversations and
      sending messages.
    disableEffect: Apps that use Sparkcentral chat will no longer be able to load or send support conversations.
