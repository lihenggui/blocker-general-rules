recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:06:39Z'
i18n:
  en:
    description: The SuprSend Android SDK invokes this Receiver when one of its push notifications is
      dismissed. It reports the dismissal to SuprSend for notification activity tracking.
    disableEffect: SuprSend will stop recording when its notifications are dismissed; other app screens
      remain available.
  zh-CN:
    description: SuprSend Android SDK 发出的推送通知被划掉时，此 Receiver 会向 SuprSend 上报这次关闭事件，用于记录通知互动情况。
    disableEffect: 停用后，SuprSend 将无法记录其通知被关闭的情况；应用的其他页面仍可使用。
