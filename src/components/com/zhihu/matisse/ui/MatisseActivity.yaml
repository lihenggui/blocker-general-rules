i18n:
  en:
    description: The Chat SDK-bundled Matisse picker opens when the app asks the user to choose media.
      It lists device albums, manages photo or video selections, and can launch the camera when capture
      is enabled.
    disableEffect: Any app flow that uses this picker to choose chat or profile media stops working.
  zh-CN:
    description: 应用请求用户选择媒体时，Chat SDK 内置的 Matisse 选择器会打开。它会列出设备相册、管理图片或视频选择，并可在启用拍摄功能时打开相机。
    disableEffect: 依赖此选择器挑选聊天或个人资料媒体的应用流程会停止工作。
