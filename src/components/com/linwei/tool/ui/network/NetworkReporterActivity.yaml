i18n:
  en:
    description: XTool (WeiShuaiDev) opens this screen when a user chooses network reports from its diagnostic
      menu. It has separate lists for HTTP requests and app logs and can clear saved logs.
    disableEffect: Users will lose XTool's network and app-log lists and the option to clear them.
  zh-CN:
    description: 用户从 XTool（WeiShuaiDev）的诊断菜单选择网络报告时会打开此页面。页面分别列出 HTTP 请求和应用日志，并可清除已保存的日志。
    disableEffect: 用户将无法查看 XTool 的网络和应用日志列表，也无法在此清除日志。
