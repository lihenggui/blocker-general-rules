i18n:
  en:
    description: Mapir Live Tracking starts this service for a tracking session; it requests location
      updates and sends the device's coordinates to Mapir's server at the configured interval. Background
      sessions use a foreground notification.
    disableEffect: Live-location publishing and background tracking in the app will stop.
  zh-CN:
    description: Mapir 实时追踪 SDK 会在追踪期间启动此服务，按设定间隔获取位置并将设备坐标发送到 Mapir 服务器；后台追踪时会显示持续通知。
    disableEffect: 停用后，应用的实时位置上传和后台追踪将停止。
