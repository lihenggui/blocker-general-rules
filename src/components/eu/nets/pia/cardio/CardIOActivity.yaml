    description: When NETS Netaxept (PiA) opens its card-entry screen, this Activity scans a payment card
      with the camera and offers manual entry if scanning is unavailable.
    disableEffect: The SDK cannot open this card-scanning and manual-entry screen, which may prevent a
      card payment from continuing.
  zh-CN:
    description: NETS Netaxept (PiA) 打开银行卡录入页面时，此页面会调用摄像头扫描卡片；无法扫描时，还可改为手动输入卡片信息。
    disableEffect: 停用后，SDK 无法打开此银行卡扫描和手动录入页面，可能导致银行卡支付无法继续。
