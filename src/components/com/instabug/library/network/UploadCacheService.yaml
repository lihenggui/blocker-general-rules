i18n:
  en:
    description: Older Instabug Core versions use this service to check network availability and upload
      feedback reports saved on the device. The connectivity Receiver starts it when network connectivity
      returns.
    disableEffect: Saved Instabug reports will not be uploaded by this background service.
  zh-CN:
    description: 旧版 Instabug Core 会通过此 Service 检查网络，并上传保存在设备上的反馈报告；网络恢复后由连接状态 Receiver 启动它。
    disableEffect: 设备上保存的 Instabug 报告将无法通过此后台服务上传。
