i18n:
  en:
    description: When a VGS Collect payment form requests a card scan, this adapter opens Bouncer’s card
      capture screen and returns the scanned details to the form.
    disableEffect: The card-scanning checkout path will stop working, and checkout may fail if the app
      requires scan results.
  zh-CN:
    description: VGS Collect 支付表单请求扫描银行卡时，此适配器会打开 Bouncer 的银行卡采集界面，并将扫描结果返回给表单。
    disableEffect: 结账流程中的银行卡扫描将无法使用；如果应用要求通过扫描获取卡片信息，结账可能会失败。
