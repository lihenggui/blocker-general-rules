recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:21:08Z'
i18n:
  en:
    description: When Android runs a connectivity recheck scheduled by Yandex Maps Runtime, this Service
      notifies the SDK when network access is available again.
    disableEffect: MapKit and NaviKit may miss network-state changes, so online map data may not refresh
      correctly after connectivity changes.
  zh-CN:
    description: Android 运行 Yandex Maps Runtime 安排的网络重查任务时，此 Service 会把网络状态变化通知 SDK。
    disableEffect: MapKit 和 NaviKit 可能收不到网络状态变化，网络恢复后在线地图数据可能无法正确刷新。
