recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:25:19Z'
i18n:
  en:
    description: Tencent Cloud IM (TIM)'s Honor messaging adapter receives Honor push events. It sends
      refreshed Honor registration tokens to Tencent Cloud IM; incoming-message callbacks are only recorded
      by this adapter.
    disableEffect: Tencent Cloud IM stops receiving Honor token updates through this service, so Honor
      offline-push registration stops refreshing.
  zh-CN:
    description: 这是腾讯云 IM（TIM）的荣耀推送消息适配器，会接收荣耀推送事件，并把更新后的注册令牌交给腾讯云 IM；此适配器只记录收到的消息回调。
    disableEffect: 腾讯云 IM 无法再通过此服务接收荣耀令牌更新，荣耀离线推送注册也会停止刷新。
