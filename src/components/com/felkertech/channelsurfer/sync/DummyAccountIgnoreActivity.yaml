recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:55:18Z'
i18n:
  en:
    description: ChannelSurfer's account setup opens this Activity when its authenticator blocks adding
      another sync account. It displays a brief refusal and closes; it can also show the same kind of
      message for a removal request.
    disableEffect: Android's account flow may not complete ChannelSurfer's add-account refusal screen,
      and account setup or channel sync can be disrupted.
  zh-CN:
    description: ChannelSurfer 的账户设置在阻止添加另一个同步账户时会打开此 Activity。它会显示简短的拒绝提示后关闭；收到移除请求时也会显示类似提示。
    disableEffect: Android 的账户流程可能无法完成 ChannelSurfer 的拒绝提示界面，账户设置或频道同步可能受到影响。
