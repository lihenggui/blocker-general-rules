i18n:
  en:
    description: After boot or a power connection change, this receiver wakes the TVTechService beacon
      library when background monitoring is active and forwards passive scan results.
    disableEffect: The SDK will no longer resume beacon monitoring after these broadcasts, so background
      proximity detection can stop after a restart or power event.
  zh-CN:
    description: 设备启动或电源连接状态变化后，如果后台监测已启用，此 Receiver 会唤醒 TVTechService 信标库并转交被动扫描结果。
    disableEffect: 停用后，SDK 不会再因这些广播恢复信标监测，设备重启或电源状态变化后后台邻近检测可能停止。
