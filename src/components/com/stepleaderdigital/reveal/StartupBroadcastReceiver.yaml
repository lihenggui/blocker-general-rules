recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:04:27Z'
i18n:
  en:
    description: When Android broadcasts a device boot or power-connection change, Reveal checks whether
      its background startup has already been handled; this receiver does not start beacon scans itself.
    disableEffect: Reveal will miss this startup check, while beacon monitoring started from within the
      app remains available.
  zh-CN:
    description: Android 广播设备启动或电源连接状态变化时，Reveal 会检查后台启动状态是否已处理；此接收器本身不会启动信标扫描。
    disableEffect: 停用后，Reveal 将收不到这项启动检查，但应用内部启动的信标监测仍可运行。
