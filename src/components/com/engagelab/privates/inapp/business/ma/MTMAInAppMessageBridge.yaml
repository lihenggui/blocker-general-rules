i18n:
  en:
    description: When an event matches an EngageLab in-app campaign, this receiver forwards the event
      data to the in-app message manager. It also relays clicks from in-app message notifications.
    disableEffect: EngageLab event-triggered in-app messages and their click reporting may stop.
  zh-CN:
    description: EngageLab 应用内营销活动匹配事件到达时，此接收器会将事件数据交给应用内消息管理器，也会转发应用内通知的点击事件。
    disableEffect: EngageLab 由事件触发的应用内消息及其点击记录可能停止。
