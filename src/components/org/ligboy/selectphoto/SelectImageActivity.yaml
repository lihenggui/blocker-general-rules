i18n:
  en:
    description: When an app asks the user to choose a photo, Ligboy's SelectPhoto image picker offers
      camera capture or the device's image picker and returns the selected image, cropping it when requested.
    disableEffect: The app cannot use SelectPhoto to choose or capture a photo.
  zh-CN:
    description: 应用请求用户选择照片时，Ligboy 的 SelectPhoto 图片选择库会提供相机拍摄和设备图片选择功能，并返回所选照片；需要时还会裁剪图片。
    disableEffect: 应用无法通过 SelectPhoto 选择或拍摄照片。
