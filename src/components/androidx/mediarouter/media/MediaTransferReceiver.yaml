    description: AndroidX MediaRouter includes this receiver so Android’s system interface can offer media-transfer
      controls for apps that route playback to other devices.
    disableEffect: Android’s media-transfer interface will no longer offer this app’s routed playback
      for moving between devices.
  zh-CN:
    description: AndroidX MediaRouter 通过声明此接收器，让 Android 系统界面为支持媒体路由的应用提供媒体传输控件。
    disableEffect: Android 系统将无法通过媒体传输界面把此应用正在播放的内容切换到其他设备。
