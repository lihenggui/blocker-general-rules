recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:53:32Z'
i18n:
  en:
    description: When a user chooses Copy in Android DbInspector, this background Service copies the selected
      database file into a folder named for the app on external storage.
    disableEffect: The inspector can no longer copy a database file to external storage; the host app's
      ordinary features are unaffected.
  zh-CN:
    description: 用户在 Android DbInspector 中选择复制数据库时，此后台 Service 会将所选文件复制到外部存储中以应用名称命名的文件夹。
    disableEffect: 停用后，检查器无法将数据库文件复制到外部存储，宿主应用的普通功能不受影响。
