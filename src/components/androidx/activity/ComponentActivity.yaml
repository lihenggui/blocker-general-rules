recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T15:29:31Z'
i18n:
  en:
    description: AndroidX Activity provides a basic screen used by Compose testing; Duckie QuackQuack
      UI/core and YTag also include this same Activity entry. It has no home-screen launch entry and only
      opens when app or test code starts it directly.
    disableEffect: Compose tests or code that explicitly opens this basic screen cannot use it; ordinary
      app screens and QuackQuack or YTag controls remain available.
  zh-CN:
    description: AndroidX Activity 提供 Compose 测试所用的基础界面；Duckie QuackQuack UI/核心库和 YTag 也包含相同的 Activity
      声明。它没有主屏幕启动入口，只有应用或测试代码明确启动时才会打开。
    disableEffect: Compose 测试或明确打开此基础界面的代码将无法使用它；普通应用界面以及 QuackQuack 或 YTag 控件仍可使用。
