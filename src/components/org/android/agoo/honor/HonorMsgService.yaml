i18n:
  en:
    description: When Honor Push delivers a message or token, this Umeng adapter forwards the message
      to Agoo and registers the token for Umeng Push.
    disableEffect: Honor Push messages and tokens will no longer reach Umeng Agoo; the app's other features
      continue to work.
  zh-CN:
    description: 荣耀推送发送消息或令牌时，此友盟适配服务会将消息交给 Agoo，并为友盟推送注册令牌。
    disableEffect: 停用后，荣耀推送消息和令牌将无法交给友盟 Agoo；应用的其他功能仍可使用。
