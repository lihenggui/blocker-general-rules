i18n:
  en:
    description: Older releases of AnyLife DownloadInstaller use this provider when passing a downloaded
      app package to Android's installer. It gives the installer access to the downloaded file.
    disableEffect: Disabling it can prevent a downloaded app from opening in Android's installer.
  zh-CN:
    description: AnyLife DownloadInstaller 的旧版本在将下载的应用安装包交给 Android 安装程序时使用此提供程序，让安装程序能够读取下载文件。
    disableEffect: 停用后，下载的应用可能无法在 Android 安装程序中打开。
