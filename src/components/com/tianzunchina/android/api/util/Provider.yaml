i18n:
  en:
    description: When an app requests a file through Tianzun China's TZAPIForAndroid sharing feature,
      this provider makes files in configured locations available to other apps through an access-controlled
      link.
    disableEffect: Other apps may fail to open files that the host app shares through TZAPIForAndroid.
  zh-CN:
    description: 应用通过天尊中国 TZAPIForAndroid 的文件共享功能请求文件时，此 Provider 会通过受访问授权保护的链接，向其他应用提供已配置位置中的文件。
    disableEffect: 其他应用可能无法打开宿主应用通过 TZAPIForAndroid 共享的文件。
