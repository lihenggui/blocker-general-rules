i18n:
  en:
    description: Instabug Core uses this provider at app startup to read the app's Instabug token, initialize
      the SDK, and start in-app tracking.
    disableEffect: Instabug's automatic startup initialization and in-app feedback or diagnostics may
      not be available.
  zh-CN:
    description: 应用启动时，Instabug Core 会通过此 Provider 读取应用的 Instabug 令牌、初始化 SDK 并启动应用内跟踪。
    disableEffect: Instabug 将无法自动完成启动初始化，应用内反馈或诊断功能可能无法使用。
