i18n:
  en:
    description: BluetoothPairingRequest is a receiver for any Bluetooth pairing request. It checks if
      the Bluetooth Settings is currently visible and brings up the PIN, the passkey or a confirmation
      entry dialog. Otherwise it starts the BluetoothPairingService which starts a notification in the
      status bar that can be clicked to bring up the same dialog.
