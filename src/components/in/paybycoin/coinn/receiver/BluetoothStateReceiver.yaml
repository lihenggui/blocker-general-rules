i18n:
  en:
    description: When Android reports that Bluetooth has turned on or off, the Coinn Delivery SDK checks
      whether cash-on-delivery is active and starts or stops its nearby beacon broadcast.
    disableEffect: Coinn cash-on-delivery beacon broadcasting will no longer follow Bluetooth state changes.
  zh-CN:
    description: Android 报告蓝牙开启或关闭时，Coinn Delivery SDK 会检查货到付款功能是否正在运行，并相应地启动或停止附近信标广播。
    disableEffect: 停用后，Coinn 货到付款信标广播将不再跟随蓝牙状态变化。
