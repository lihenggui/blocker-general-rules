i18n:
  en:
    description: When an app requests regular selfie capture, OkayCam (Innov8tif) opens the front camera
      so the user can take a photo. It then shows the image for confirmation or retaking.
    disableEffect: The app cannot complete this OkayCam selfie flow or receive its photo if this screen
      is disabled.
  zh-CN:
    description: 应用请求普通自拍采集时，OkayCam（Innov8tif）会打开前置相机供用户拍照，随后显示照片以便确认或重拍。
    disableEffect: 停用后，应用无法完成此 OkayCam 自拍流程或接收拍摄的照片。
