recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:46:33Z'
i18n:
  en:
    description: AlphaPush (AppsPress) receives Firebase push messages and routes them to the app’s push
      handlers unless notifications are muted. It also saves updated push-delivery tokens.
    disableEffect: The app will stop receiving or handling AlphaPush notifications and may not register
      refreshed push-delivery tokens.
  zh-CN:
    description: AlphaPush（AppsPress）会接收 Firebase 推送消息；通知未静音时，它会把消息交给应用的推送处理程序。它也会保存更新后的推送令牌。
    disableEffect: 应用将无法接收或处理 AlphaPush 通知，也可能无法登记更新后的推送令牌。
