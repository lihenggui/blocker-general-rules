i18n:
  en:
    description: The mReady PhotoPicker file provider creates a temporary content link for a photo file
      so the camera can save the image and the app can read it.
    disableEffect: The camera mode cannot receive the file link needed to save a photo, so that photo-capture
      flow will fail.
  zh-CN:
    description: mReady PhotoPicker 的文件提供程序会为照片文件创建临时内容链接，供相机保存照片并让应用读取。
    disableEffect: 停用后，相机模式无法获得保存照片所需的文件链接，该拍摄流程会失败。
