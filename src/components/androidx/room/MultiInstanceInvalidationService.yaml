recommendToBlock: false
i18n:
  en:
    description: 'A Service for remote invalidation among multiple InvalidationTracker instances.

      This service runs in the main app process. All the instances of InvalidationTracker (potentially
      in other processes) has to connect to this service.'
  zh-CN:
    description: 用于多个 InvalidationTracker 实例之间的远程失效服务。此服务在应用程序主进程中运行。所有 InvalidationTracker 的实例（可能在其他进程中）都必须连接到此服务。
