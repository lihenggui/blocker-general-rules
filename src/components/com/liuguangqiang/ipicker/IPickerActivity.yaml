  en:
    description: IPicker opens this Activity when the app asks the user to choose photos. It lists local
      photos, supports single or multiple selection, can take a new photo, and can open the crop screen.
    disableEffect: The app's IPicker photo-selection and in-picker camera flow will be unavailable.
  zh-CN:
    description: 应用请求用户选择照片时，IPicker 会打开此 Activity 显示本机照片，支持单选或多选，也可拍摄新照片并进入裁剪界面。
    disableEffect: 停用后，应用通过 IPicker 选择照片或在选择器内拍照的流程将无法使用。
