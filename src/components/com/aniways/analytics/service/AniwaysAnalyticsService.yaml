i18n:
  en:
    description: The Aniways Android SDK starts this Service in the background to queue, batch, and upload
      usage and error events. Disabling it stops Aniways analytics and error reporting while its conversation
      features remain available.
    disableEffect: Aniways usage and error events will no longer be uploaded.
  zh-CN:
    description: Aniways Android SDK 会在后台启动此 Service，将使用和错误事件排队、打包并上传。禁用后，Aniways 的统计和错误报告停止发送，聊天功能仍可使用。
    disableEffect: Aniways 的使用事件和错误事件将不再上传。
