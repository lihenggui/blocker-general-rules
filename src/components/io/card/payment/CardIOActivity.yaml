recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:36:55Z'
i18n:
  en:
    description: Card.io opens this card-entry screen when a checkout requests card scanning. It reads
      card details with the camera, can allow manual entry when the integration permits it, and returns
      the result to checkout.
    disableEffect: Disabling it stops card scanning and any card entry routed through Card.io; payment
      screens that launch it may fail or lose card input.
  zh-CN:
    description: 结账流程请求扫描银行卡时，Card.io 会打开此页面读取卡片信息；集成允许时，用户也可手动输入，并将结果返回结账流程。
    disableEffect: 停用后，银行卡扫描及经 Card.io 进行的输入将停止，调用它的支付页面可能失败或无法取得卡片信息。
