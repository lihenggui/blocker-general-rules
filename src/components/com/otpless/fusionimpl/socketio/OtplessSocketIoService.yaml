  en:
    description: During an OTPless Socket.IO connection, the SDK starts and binds this foreground service
      to open a live connection and pass sign-in messages and connection status to the active flow.
    disableEffect: OTPless Fusion connection and authentication messages can stop working while this service
      is disabled.
  zh-CN:
    description: OTPless Socket.IO 建立连接时，SDK 会启动并绑定此 Service，以建立实时连接并将登录消息和连接状态传给当前流程。
    disableEffect: 停用后，OTPless Fusion 的连接和身份验证消息可能无法正常工作。
