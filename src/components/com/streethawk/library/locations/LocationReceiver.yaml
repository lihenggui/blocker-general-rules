recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:03:24Z'
i18n:
  en:
    description: This component is part of the StreetHawk mobile engagement SDK. Android starts this receiver
      when location providers change and during StreetHawk's scheduled status checks. If location reporting
      is enabled, it sends the last known coordinates or a location-disabled event to StreetHawk.
    disableEffect: StreetHawk will stop reporting location changes and scheduled location updates.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。位置来源变化或 StreetHawk 定时检查运行时，Android 会启动此接收器。启用位置上报后，它会向 StreetHawk
      发送最后已知坐标或位置服务关闭事件。
    disableEffect: StreetHawk 将停止报告位置变化和定时位置更新。
