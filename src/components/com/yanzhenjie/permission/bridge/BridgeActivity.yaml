  en:
    description: AndPermission opens Android's permission dialog or a system settings page when the app
      requests runtime access, notification access, app installation, or overlay access.
    disableEffect: The app cannot request or confirm those Android permissions and settings through AndPermission.
  zh-CN:
    description: 应用请求运行时访问、通知访问、安装应用或悬浮显示权限时，AndPermission 会打开 Android 权限对话框或系统设置页面。
    disableEffect: 应用无法通过 AndPermission 请求或确认这些 Android 权限和设置。
