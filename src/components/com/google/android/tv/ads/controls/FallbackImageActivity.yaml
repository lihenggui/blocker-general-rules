recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:22:34Z'
i18n:
  en:
    description: When a viewer selects an ad icon that cannot open its linked content, Google TV Ads opens
      this screen to show an alternate image and description or an error message.
    disableEffect: Ad-icon fallback images and their click-through panel will not be shown; app content
      remains available.
  zh-CN:
    description: 观众点选的广告图标无法打开关联内容时，Google TV Ads 会打开此页面显示备用图片和说明，或显示错误提示。
    disableEffect: 广告图标的备用图片和点击后面板将不再显示，应用内容仍可使用。
