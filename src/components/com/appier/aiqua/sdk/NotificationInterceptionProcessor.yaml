recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Android invokes this Appier AIQUA receiver when the screen is unlocked; it passes the
      event and notification actions to AIQUA’s background notification handler.
    disableEffect: AIQUA will no longer receive this screen-unlock trigger or process notification actions
      through this receiver; the app’s other features remain available.
  zh-CN:
    description: 屏幕解锁时，Android 会调用 Appier AIQUA 的此接收器；它会将该事件和通知操作交给 AIQUA 的后台通知处理程序。
    disableEffect: AIQUA 将无法再通过此接收器接收屏幕解锁事件或处理通知操作，应用的其他功能仍可使用。
