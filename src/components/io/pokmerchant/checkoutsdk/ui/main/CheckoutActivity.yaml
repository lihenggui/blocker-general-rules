i18n:
  en:
    description: PokPay's RPAY checkout SDK uses this Activity for its checkout screen and payment return
      links; it displays the checkout flow and returns the result to the app.
    disableEffect: Disabling it prevents RPAY checkout from opening, so users may be unable to pay in
      the app.
  zh-CN:
    description: PokPay 的 RPAY 结账 SDK 会在打开支付页面或处理支付返回链接时使用此 Activity；它显示结账流程并把结果交回应用。
    disableEffect: 停用后，RPAY 结账页面无法打开，用户可能无法在应用内完成付款。
