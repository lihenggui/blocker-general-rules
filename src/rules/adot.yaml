    name: Adot
    description: 'Adot (formerly Adotmob) is a technology company founded in 2014 in Paris that provides
      agencies and advertisers with powerful insights on their audiences for a more accurate media activation.

      Adot (formerly Adotmob) uses both online and offline data sources.

      Thanks to its exclusive partnership with vente-privee, Adot (formerly Adotmob) has access to a pool
      of exclusive e-commerce data: declared socio-demographic data and e-commerce intent data. Our last
      online data source arises from our earned bid requests, that allows the company to identify navigation
      media patterns, in particular through the analysis of keywords based on the visited pages and media
      interest by topic. Lastly, Adot (formerly Adotmob) owns geolocation data generated through proprietary
      technology integrated in partners’ mobile apps.'
