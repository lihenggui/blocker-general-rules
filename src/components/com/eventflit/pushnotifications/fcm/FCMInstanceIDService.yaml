i18n:
  en:
    description: When Firebase refreshes the device’s messaging token, the Eventflit Push Notifications
      SDK passes it to the app’s configured token-refresh handler.
    disableEffect: Eventflit may stop registering updated tokens, so future push notifications may not
      reach the app.
  zh-CN:
    description: Firebase 刷新设备的消息令牌时，Eventflit Push Notifications SDK 会把新令牌交给应用配置的令牌更新处理器。
    disableEffect: 屏蔽后，Eventflit 可能无法注册更新后的令牌，之后的推送通知可能无法送达应用。
