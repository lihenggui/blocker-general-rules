i18n:
  en:
    description: After a traditional LoginRadius sign-in, the SDK opens this screen when account configuration
      requires profile details that are missing. It displays the required fields and returns the sign-in
      result after they are completed.
    disableEffect: A sign-in that requires additional profile details cannot finish if this screen is
      disabled.
  zh-CN:
    description: LoginRadius 传统登录完成后，如果账号配置要求填写尚缺少的个人资料，SDK 会打开此界面。界面显示必填信息，并在用户补齐后返回登录结果。
    disableEffect: 停用后，需要补充个人资料的登录流程无法完成。
