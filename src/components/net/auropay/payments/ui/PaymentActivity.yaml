  en:
    description: The AuroPay Payments SDK opens this screen when the app starts checkout. It shows merchant
      and order details, runs the payment flow, and returns the result to the app.
    disableEffect: Disabling it prevents AuroPay checkout from opening, so payments through this SDK cannot
      complete.
  zh-CN:
    description: 应用开始付款时，AuroPay 支付 SDK 会打开此页面。页面展示商户和订单信息，处理付款流程，并把结果返回给应用。
    disableEffect: 停用后，AuroPay 收银页面无法打开，用户不能通过此 SDK 完成付款。
