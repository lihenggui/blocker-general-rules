i18n:
  en:
    description: Docutain SDK Barcode opens this Activity when the app requests a multi-barcode scan.
      It uses the camera to collect several barcode values and returns them as a list.
    disableEffect: Users cannot scan and return a batch of barcodes through Docutain.
  zh-CN:
    description: 应用请求批量扫描条码时，Docutain SDK Barcode 会打开此 Activity。它使用相机采集多个条码，并将结果列表返回应用。
    disableEffect: 停用后，用户无法通过 Docutain 批量扫描并返回多个条码。
