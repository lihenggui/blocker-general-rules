  en:
    description: OkayID Lite (Innov8tif OCR SDK) validates its license and requests camera or image permissions
      before opening MyKad scanning. It reports license or permission failures to the app.
    disableEffect: The app cannot start OkayID Lite MyKad scanning or receive its result if this screen
      is disabled.
  zh-CN:
    description: OkayID Lite（Innov8tif OCR SDK）会先验证授权并请求相机或图像权限，再打开 MyKad 扫描界面；授权或权限失败时会向应用报告错误。
    disableEffect: 停用后，应用无法启动 OkayID Lite MyKad 扫描或接收扫描结果。
