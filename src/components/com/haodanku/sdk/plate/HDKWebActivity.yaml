i18n:
  en:
    description: When Haodanku's BianXian SDK opens a single shopping or service page, this screen loads
      the supplied web address inside the app. The page type controls whether an in-app back button is
      shown.
    disableEffect: BianXian's selected shopping or service page will not open; the rest of the host app
      remains available.
  zh-CN:
    description: 好单库 BianXian SDK 打开单个购物或服务页面时，此界面会在应用内加载提供的网址。页面类型会决定是否显示返回按钮。
    disableEffect: BianXian 选中的购物或服务页面将无法打开；宿主应用的其他功能仍可使用。
