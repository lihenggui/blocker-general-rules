i18n:
  en:
    description: Displays a list of AppWidgetProviderInfo widgets, along with any injected special widgets
      specified through AppWidgetManager#EXTRA_CUSTOM_INFO and AppWidgetManager#EXTRA_CUSTOM_EXTRAS. When
      an installed AppWidgetProviderInfo is selected, this activity will bind it to the given AppWidgetManager#EXTRA_APPWIDGET_ID,
      otherwise it will return the requested extras.
