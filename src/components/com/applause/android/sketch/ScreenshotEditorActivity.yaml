    description: The Applause Android SDK opens this editor when a user attaches an image or video to
      a report, so they can review, adjust, save, or discard the attachment.
    disableEffect: Users will no longer be able to edit report screenshots or videos in Applause; other
      app features remain available.
  zh-CN:
