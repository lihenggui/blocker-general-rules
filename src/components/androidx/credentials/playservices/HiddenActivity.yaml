i18n:
  en:
    description: AndroidX Credentials Play Services Auth opens this hidden Activity while Google Play
      services handles sign-in, password saving, or passkey creation; it presents Google's pending screen
      and returns the result to Credential Manager.
    disableEffect: These Play services credential flows may fail because their sign-in or confirmation
      screen cannot open.
  zh-CN:
    description: Google Play 服务处理登录、密码保存或通行密钥创建时，AndroidX Credentials Play Services Auth 会打开这个隐藏 Activity；它显示
      Google 的待处理界面，并将结果返回给 Credential Manager。
    disableEffect: 登录或确认界面无法打开，这些 Play 服务凭据流程可能失败。
