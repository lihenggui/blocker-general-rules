i18n:
  en:
    description: Started by the Rover Estimote SDK, this Service combines location updates with beacon
      visits, fetches nearby geofences, and monitors them for location-triggered cards.
    disableEffect: Rover Estimote will stop monitoring location visits and nearby geofences, so its location-triggered
      cards will not arrive.
  zh-CN:
    description: Rover Estimote SDK 启动此 Service 后，它会结合定位更新和信标到访、获取附近的地理围栏，并监测位置触发的卡片。
    disableEffect: Rover Estimote 将停止监测位置到访和附近地理围栏，因此不会再收到它的位置触发卡片。
