recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Android creates this provider during app startup; it gives FirebaseUI Auth the application
      context used to prepare its sign-in features.
    disableEffect: Without it, FirebaseUI Auth may lack its required startup context and its sign-in flow
      can fail.
  zh-CN:
    description: 应用启动时，Android 会创建此 Provider；它为 FirebaseUI Auth 提供准备登录功能所需的应用上下文。
    disableEffect: 停用后，FirebaseUI Auth 可能无法取得启动所需的应用上下文，导致登录流程失败。
