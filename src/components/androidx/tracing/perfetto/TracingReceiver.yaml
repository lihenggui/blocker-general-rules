recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: This AndroidX Tracing Perfetto receiver runs when a developer tool asks to record performance
      data now, start tracing on a later app launch, or clear that setup. These requests require Android’s
      DUMP permission.
    disableEffect: Developers can no longer control Perfetto tracing through these requests, but the app’s
      own features continue to work.
  zh-CN:
    description: 开发者工具请求立即记录性能数据、在下次启动时开始跟踪或清除相关设置时，这个 AndroidX Tracing Perfetto 接收器会运行。这些请求需要 Android
      的 DUMP 权限。
    disableEffect: 开发者将无法再通过这些请求控制 Perfetto 跟踪，但应用自身的功能仍可正常使用。
