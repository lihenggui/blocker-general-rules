    description: "## About\n[Cuebiq](https://www.cuebiq.com/about/) is a location data intelligence and\
      \ analytics company with 51-200 employees. It has offices in New York, San Francisco, Chicago, Milan,\
      \ Italy, and Shanghai, China.  [See also: OpenCorporates](https://opencorporates.com/companies/us_de/5068833)\n\
      ## Ownership\nCuebiq was founded by Antonio Tomarchio in 2011. The privately-held company's investors\
      \ include: Goldman Sachs Principal Strategic Investments (PSI), Nasdaq Ventures, DRW Venture Capital,\
      \ Tribeca Venture Partners, Tribeca Angels, and TLcom Capital. [Source: BusinessWire](https://www.businesswire.com/news/home/20180518005397/en/Cuebiq-Raises-27-Million-Growth-Capital)\n\
      Its trusted partners include: Clear Channel, Oracle, Google, Facebook, Ubimo, and more. [Source:\
      \ website](https://go.cuebiq.com/trusted-partners.html)\n## What it does\n* Location Tracking (iBeacons,\
      \ WiFi, NFC or Near Field Communication) & Analytics\n* Footfall Attribution\n* Mobile Data Triangulation\n\
      * Blockchain-based open-data marketing platform\n## Privacy Policy\n[Policy as of 18/5/2018, reviewed\
      \ 18/11/2018:](https://www.cuebiq.com/privacypolicy/)\n* Cuebiq uses a blockchain platform it developed\
      \ to encrypt and anonymize the personally identifiable information it collects. This is advantageous\
      \ because (1) it more seamlessly complies with GDPR and (2) enables its partners to efficiently\
      \ access its ledgers.\n* Cuebiq's policy openly states it ignores DNR (Do Not Track) requests in\
      \ web browsers. \n* Cuebiq's policy states that it shares information with third parties such as\
      \ \"advertising agency trading desks, proximity solution providers, [and] advertising technology\
      \ providers\" in addition to \"other companies and organizations... for instance (without limitation)\
      \ for scientific, medical, civic, meteorological, automotive, and market-related research.\"\n*\
      \ For users outside the EU looking to opt-out, they may limit disclosure by \"adjusting the settings\
      \ on [their] mobile device\" and web browsers.  Users are refered to the Network Advertising Initiative’s\
      \ [website](http://optout.networkadvertising.org/?c=1#!%2F) and the Digital Advertising Alliance\
      \ (DAA) [website](http://optout.aboutads.info/?c=2&lang=EN) regarding cookies and interest-based\
      \ advertising.  Users are also refered to unnamed individual Publishers and Advertisers, who \"\
      may also provide ways [] to opt out from or limit their collection of information.\""
