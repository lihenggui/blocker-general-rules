  en:
    description: HeyTap enhanced-data messages start this service for OPPO Callkit. It passes incoming-call
      messages to JPush.
    disableEffect: Incoming-call messages delivered through OPPO Callkit will not reach the app, so keep
      it enabled if the app relies on that route for calls.
  zh-CN:
    description: HeyTap 增强数据服务收到 OPPO Callkit 消息时会启动此服务。它会把来电消息交给 JPush。
    disableEffect: 通过 OPPO Callkit 送达的来电消息将无法到达应用；如果应用依赖此通道接听来电，请保持启用。
