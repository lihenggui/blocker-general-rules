i18n:
  en:
    description: When Android creates the app process, the Contus FlyChat SDK's initialization provider
      sets up the chat manager before chat features are used.
    disableEffect: The chat SDK may not initialize, so its chat screens, messaging, and file transfers
      can fail.
  zh-CN:
    description: Android 创建应用进程时，Contus FlyChat SDK 的初始化 Provider 会先设置聊天管理器，再供聊天功能使用。
    disableEffect: 禁用后，聊天 SDK 可能无法初始化，其聊天界面、消息和文件传输功能可能失效。
