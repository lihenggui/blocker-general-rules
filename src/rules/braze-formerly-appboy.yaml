    name: Braze (formerly Appboy)
    description: "## Primary Location\nUnited States (New York City) [Crunchbase, 01](https://www.crunchbase.com/organization/braze)\n\
      ## Website\n[https://www.braze.com](https://www.braze.com)\n## About\nBraze is a mobile marketing\
      \ company that offers CRM solutions and mobile marketing automation software for mobile applications.\n\
      ## Ownership\n## Products and Services\n_Cross-Channel Personalization:_ Target customers based\
      \ on personal interests, location, past purchases, and more [Braze, 02](https://www.braze.com/product/cross-channel-personalization)\n\
      _Identification and Analytics:_ Profile users, segment audiences, and utilize analytics for targeted\
      \ advertisements [Braze, 02](https://www.braze.com/product/cross-channel-personalization); [Braze,\
      \ 02](https://www.braze.com/product/cross-channel-personalization); [Braze, 01](https://www.braze.com);\
      \ [Braze, 02](https://www.braze.com/product/cross-channel-personalization); [Braze, 03](https://www.slideshare.net/Appboy/appboy-urban-outfitters-placeiq-case-study)\n\
      ### Advertising Networks\n* Data sharing (vague) [Braze, 07](https://www.braze.com/product/integrations)\n\
      ## Privacy Policy\n_Data Collection:_ Braze collects data through the use of Developer apps. This\
      \ includes:\n* Device information (OS version, IP address, carrier information, country code) and\
      \ a unique Braze-generated ID\n* Application usage\n* Personally identifiable information: Braze\
      \ \"may collect personally identifiable information shared with Developer Applications. We may also\
      \ collect personally identifiable information from third parties used for authentication, such as\
      \ when a user logs in to a Developer Application using a Facebook account, and from third party\
      \ partners such as Facebook, Twitter, and Klout. Personally identifiable information collected may\
      \ include information like name, email address, location, gender, interests, device, app usage,\
      \ user ID, and contact information\".\n_Location Information:_ Braze \"may collect device location\
      \ information if location services are enabled for any Developer Applications on the device. We\
      \ use location information to provide Developers with information about the use of their Developer\
      \ Applications\".\n_Information Use:_ Braze can \"use information we collect to provide partner\
      \ Developers with information about usage of Developer Applications that integrate the Braze Service.\"\
      \n_Data Sharing:_ Data is shared with app Developers \"in the form of aggregated, anonymous data\
      \ about the way Developer Applications are used so that Developers can improve their respective\
      \ Developer Applications.\" Braze may disclose information to third parties as required by law;\
      \ to trusted service providers working on their behalf; to protect their rights, the safety of others,\
      \ or in response to a government request; and in conjunction with a merger, acquisition, or sale\
      \ of Braze.\n_Automatic Data Collection:_ Braze will \"automatically collect information about how\
      \ Developer Applications are used, such as the frequency and duration of usage. This includes details\
      \ about mobile devices, such as a unique Braze-generated ID for the mobile device. We share anonymous\
      \ information about use of their respective Developer Applications with Developers, including which\
      \ Developer Applications users have downloaded and the way those Developer Applications are used,\
      \ which facilitates improvements to Developer Applications.\"\n_Opt-Out:_ End users may opt out\
      \ of location collection by turning off location services for Developer apps in their mobile device.\
      \ They can opt out of personally identifiable information by not providing that information to the\
      \ Developer apps, and in the case of third parties, not providing that information to the third\
      \ parties. Braze states, \"You can prevent collection of all information by uninstalling Developer\
      \ Applications that integrate the Braze Service.\"\n_Data retention:_ Braze \"will retain information\
      \ collected throughout the life of each user’s use of Developer Applications except where prohibited\
      \ by law.\" Users can email privacy@braze.com to request data deletion. Braze \"will keep anonymous\
      \ information and may need to retain some identifying information to ensure that your request continues\
      \ to be honored. Your information will be deleted from our active database but may remain in our\
      \ archives. If we are required to maintain certain information about you, we will comply with your\
      \ deletion request after fulfilling any legal requirements.\"\n_International Law:_ Braze complies\
      \ with the U.S.-EU Safe Harbor Framework and the U.S.-Swiss Safe Harbor Framework.\n_Consent:_ Braze\
      \ states, \"By using a Developer Application, you are consenting to our collection and processing\
      \ of information as set forth in this Privacy Policy now and as amended by us. 'Processing' means\
      \ using cookies on a computer/hand held device or using or touching information in any way, including,\
      \ but not limited to, collecting, storing, deleting, using, combining and disclosing information,\
      \ all of which activities will take place in the United States. If you reside outside the U.S. your\
      \ information will be transferred to the U.S., and processed and stored there under U.S. privacy\
      \ standards. By using the Application and providinginformation to us, you consent to such transfer\
      \ to, and processing in, the U.S.\" [Braze, 11](https://www.braze.com/privacy).\n## Relationships\n\
      ABC News / Citi / GAP / Axel Springer / Dominos / Delivery Hero / Hearst / KFC / Microsoft / Nascar\
      \ / iHeartMedia / RTR / Postmates / OKCupid / Urban Outfitters [Braze, 01](https://www.braze.com)\
      \ / American Cancer Society / Dots / ibotta / 1-800-Flowers.com / Momondo [Braze, 02](https://www.braze.com/customers)\n\
      ## Details\n_Financial details:_ Braze was founded in 2011 and has raised over $95 million from\
      \ funders. Braze changed its name from Appboy in 2017 [Crunchbase, 01](https://www.crunchbase.com/organization/braze).\n\
      ### Methods\n* Targeted advertisments [Braze, 01](https://www.braze.com) \n* Location-based targeting\
      \ [Braze, 07](https://www.braze.com/product/integrations)\n* Real-world location targeting (including\
      \ real-time targeting) [Braze, 02](https://www.braze.com/product/cross-channel-personalization)\
      \ [Braze, 03](https://www.slideshare.net/Appboy/appboy-urban-outfitters-placeiq-case-study); [Braze,\
      \ 07](https://www.braze.com/product/integrations); [Braze, 08](https://www.braze.com/academy/User_Targeting);\
      \ [Braze, 09](https://www.braze.com/blog/appboy-location-targeting-tool); [Braze, 10](http://www.prweb.com/releases/2013/10/prweb11275487.htm)\n\
      * Targeted advertising based on consumer actions [Braze, 02](https://www.braze.com/product/cross-channel-personalization)\n\
      * Timed advertisements [Braze, 02](https://www.braze.com/product/cross-channel-personalization)\n\
      * Targeting across devices and channels [Braze, 02](https://www.braze.com/product/cross-channel-personalization)\n\
      * Real-time services [Braze, 04](https://www.braze.com/customers/postmates); [Braze, 05](https://www.braze.com/product/lifecycle-engagement-orchestration)\n\
      * Artificial intelligence for analytics [Braze, 06](https://www.braze.com/product/optimization-ai)\n\
      * Reports for clients [Braze, 06](https://www.braze.com/product/optimization-ai)\n## References\n\
