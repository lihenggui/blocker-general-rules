i18n:
  en:
    description: WormholeLogger uses this provider at app startup to initialize its logging client and
      connect to the optional cloud-logging service.
    disableEffect: The app can still run, but WormholeLogger will not connect its client for cloud log
      forwarding.
  zh-CN:
    description: WormholeLogger 会在应用启动时通过此 Provider 初始化日志客户端，并连接可选的云端日志服务。
    disableEffect: 应用仍可运行，但 WormholeLogger 将无法连接日志客户端并转发云端日志。
