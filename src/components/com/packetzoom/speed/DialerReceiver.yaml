i18n:
  en:
    description: PacketZoom listens for a special secret-code broadcast from the phone dialer and opens
      its configuration screen. The screen lets an operator change development and metrics server settings
      and toggle PacketZoom networking.
    disableEffect: PacketZoom's hidden configuration screen will no longer open from the dialer; ordinary
      app screens remain available.
  zh-CN:
    description: PacketZoom 会监听拨号器发出的特殊代码广播，并打开配置页面。该页面可更改开发服务器和数据服务器设置，也可切换 PacketZoom 网络功能。
    disableEffect: 无法再从拨号器打开 PacketZoom 隐藏配置页面，应用的常规页面仍可使用。
