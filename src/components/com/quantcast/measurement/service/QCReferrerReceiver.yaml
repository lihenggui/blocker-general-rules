i18n:
  en:
    description: When Android reports a store installation referral, Quantcast reads the referral details
      and forwards them to other configured receivers for campaign attribution.
    disableEffect: Quantcast stops receiving install-referral data; the app’s other features remain available.
  zh-CN:
    description: Android 报告应用商店安装来源时，Quantcast 会读取来源信息并转交给其他已配置的 Receiver，用于统计推广来源。
    disableEffect: Quantcast 将无法收到安装来源数据，但应用的其他功能仍可使用。
