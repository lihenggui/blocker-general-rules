i18n:
  en:
    description: When an app starts or binds to the KmpTor Runtime, this background service hosts the
      Tor runtime and follows device network changes while Tor is active.
    disableEffect: Disabling it prevents apps that use KmpTor from starting or maintaining Tor connections.
  zh-CN:
    description: 应用启动或绑定 KmpTor Runtime 时，此后台服务会承载 Tor 运行环境，并在 Tor 运行期间跟踪设备网络变化。
    disableEffect: 停用后，使用 KmpTor 的应用将无法启动或维持 Tor 连接。
