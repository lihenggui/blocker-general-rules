  en:
    description: Cloud273 Localization receives system language-change broadcasts and reloads the app’s
      saved language preference so the app can use the updated setting.
    disableEffect: The app will not automatically reload its language preference after the device language
      changes.
  zh-CN:
    description: Cloud273 Localization 会接收系统语言变更广播，并重新载入应用保存的语言偏好，使应用能够使用更新后的设置。
    disableEffect: 设备语言更改后，应用将无法自动重新载入语言偏好。
