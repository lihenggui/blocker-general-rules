  en:
    description: Machbird (APUS Group) uses this receiver for app-promotion notifications and links. When
      a user taps a promotion, it can open the app's store page or campaign link, or remove the notification.
    disableEffect: Machbird promotion notifications and their store or campaign links will no longer be
      handled.
  zh-CN:
    description: Machbird（APUS Group）通过此接收器处理应用推广通知和链接。用户点击推广内容时，它可打开应用商店页面或活动链接，也可移除通知。
    disableEffect: Machbird 推广通知及其商店或活动链接将无法处理。
