i18n:
  en:
    description: When an app requests VK sign-in, this Activity opens VK’s authorization page and returns
      the result to the app after the user completes or cancels the flow.
    disableEffect: VK sign-in cannot finish, so app features that require a VK account will be affected.
  zh-CN:
    description: 应用请求 VK 登录时，这个 Activity 会打开 VK 授权页面，并在用户完成或取消流程后把结果返回应用。
    disableEffect: 禁用后，VK 登录无法完成，依赖 VK 账户的应用功能会受影响。
