recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Android battery-level broadcasts trigger the NextBillion Asset Tracking SDK receiver.
      It forwards the percentage so the tracking service can include it with location records and show
      low-battery warnings.
    disableEffect: Disabling the manifest entry does not stop location tracking or battery updates during
      an active tracking session; the SDK also listens for battery changes while tracking.
  zh-CN:
    description: Android 电量变化广播会触发 NextBillion Asset Tracking SDK 的接收器。它会转发电量百分比，供跟踪服务随位置记录上报并显示低电量提醒。
    disableEffect: 禁用清单中的此项不会停止位置跟踪或活动跟踪期间的电量更新；SDK 在跟踪时也会接收电量变化。
