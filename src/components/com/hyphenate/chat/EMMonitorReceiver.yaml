i18n:
  en:
    description: Android triggers this Easemob receiver when the device boots or the user unlocks it;
      it restarts the background chat service so support messages can keep arriving.
    disableEffect: Easemob cannot restore its background message service at boot or unlock, so support
      messages may be delayed or missed.
  zh-CN:
    description: 设备启动或用户解锁时，Android 会触发此 Easemob Receiver；它会重新启动后台聊天服务，让客服消息继续送达。
    disableEffect: 禁用后，设备启动或解锁时 Easemob 无法通过此 Receiver 恢复后台消息服务，客服消息可能延迟或漏收。
