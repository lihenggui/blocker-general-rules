  en:
    description: When the host app starts an Amwal Payment sheet, this Activity checks the payment configuration
      and presents the SDK's in-app payment screen. It returns the payment result to the app when the
      flow ends.
    disableEffect: The app cannot open and complete its Amwal payment flow.
  zh-CN:
    description: 应用启动 Amwal Payment 付款页时，此 Activity 会检查付款配置并显示 SDK 的应用内付款界面；流程结束后会把付款结果返回给应用。
    disableEffect: 停用后，应用无法通过 Amwal SDK 打开并完成付款流程。
