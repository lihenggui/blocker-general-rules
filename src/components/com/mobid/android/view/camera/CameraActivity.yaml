i18n:
  en:
    description: The MobId KYC SDK opens this camera screen when identity verification needs a photo.
      Users can take a verification photo or choose one from the gallery, and the screen uploads it with
      the current verification session.
    disableEffect: The app cannot capture and upload a verification photo through MobId.
  zh-CN:
    description: 身份核验需要照片时，MobId KYC SDK 会打开此相机页面。用户可以拍摄核验照片或从图库中选择照片，页面会将照片上传到当前核验会话。
    disableEffect: 禁用后，应用无法通过 MobId 拍摄并上传核验照片。
