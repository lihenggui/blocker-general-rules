recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:25:19Z'
i18n:
  en:
    description: Tencent Cloud IM (TIM)'s Meizu adapter receives Meizu registration, message, and status
      callbacks. It sends Meizu registration IDs to Tencent Cloud IM; its message callbacks are only recorded
      here.
    disableEffect: Tencent Cloud IM stops receiving Meizu registration updates through this receiver,
      so Meizu offline-push registration stops refreshing.
  zh-CN:
    description: 这是腾讯云 IM（TIM）的魅族推送适配器，会接收魅族注册、消息和状态回调，并把魅族注册 ID 交给腾讯云 IM；此处只记录消息回调。
    disableEffect: 腾讯云 IM 无法再通过此接收器接收魅族注册更新，魅族离线推送注册也会停止刷新。
