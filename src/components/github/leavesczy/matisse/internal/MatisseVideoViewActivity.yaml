  en:
    description: When the user opens a selected video for preview, Matisse by LeavesCZY plays that video's
      content in this screen. Playback position is retained while the user temporarily leaves and returns.
    disableEffect: Users will lose in-app playback of selected videos, and apps that rely on this preview
      flow may fail.
  zh-CN:
    description: 用户预览选中的视频时，LeavesCZY 的 Matisse 会在此界面播放视频。用户暂时离开后再返回时，播放位置会保留。
    disableEffect: 用户将无法在应用内播放选中的视频；依赖此预览流程的应用功能可能失败。
