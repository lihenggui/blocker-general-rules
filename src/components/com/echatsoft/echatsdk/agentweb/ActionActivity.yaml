  en:
    description: When an EChatSoft embedded web page requests a permission or asks to attach a file, photo,
      or video, this Activity opens the matching Android prompt or chooser and returns the result.
    disableEffect: Embedded EChat pages may be unable to request permissions or select files and media
      for upload.
  zh-CN:
    description: EChatSoft 的内嵌网页请求权限或需要选择文件、照片、视频时，这个 Activity 会打开相应的 Android 提示或选择器，并返回操作结果。
    disableEffect: 停用后，EChat 内嵌网页可能无法申请权限，也无法选择要上传的文件或媒体。
