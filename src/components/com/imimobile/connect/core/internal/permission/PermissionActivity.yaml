i18n:
  en:
    description: When Webex Connect needs a runtime permission, this Activity requests it from the user
      and returns the result to the SDK. It can also explain why a permission is needed.
    disableEffect: Permission-dependent Webex Connect features may stop working because the SDK cannot
      complete their permission requests.
  zh-CN:
    description: Webex Connect 需要运行时权限时，会通过此 Activity 向用户请求权限，并将结果返回 SDK；页面也可说明请求原因。
    disableEffect: 由于 SDK 无法完成权限请求，需要这些权限的 Webex Connect 功能可能无法使用。
