  en:
    description: The Android APP Factory WebView helper starts this Service in a separate web process
      when engine preloading is enabled; WebView pages use that process.
    disableEffect: WebView pages may fail to initialize or display correctly.
  zh-CN:
    description: 启用引擎预加载时，Android APP Factory 的 WebView 辅助组件会在独立网页进程中启动此 Service，网页会使用该进程。
    disableEffect: WebView 页面可能无法初始化或正常显示。
