i18n:
  en:
    description: Android creates this InMobi Mobile Ads provider as the app starts, and it performs the
      SDK's automatic initialization before ads are requested.
    disableEffect: Apps relying on this automatic startup initialization may not load InMobi ads unless
      they initialize the SDK another way.
  zh-CN:
    description: 应用启动时 Android 会创建 InMobi Mobile Ads 提供程序，它会在请求广告前自动初始化 SDK。
    disableEffect: 依赖此自动启动初始化的应用可能无法加载 InMobi 广告，除非通过其他方式初始化 SDK。
