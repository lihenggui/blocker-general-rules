i18n:
  en:
    description: YooMoney's YooKassa payments SDK receives phone-state changes while its payment security
      checks are active. It passes these events to the checks as device-risk signals.
    disableEffect: The payment security checks will no longer receive phone-state signals, which may prevent
      a payment that depends on them from completing.
  zh-CN:
    description: YooMoney 的 YooKassa 支付 SDK 会在支付安全检查运行时接收电话状态变化，并将这些事件作为设备风险信号交给检查流程。
    disableEffect: 支付安全检查将无法再收到电话状态信号，依赖这些信号的付款可能无法完成。
