recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: The AppNexus (Xandr) mobile ads SDK opens this Activity for full-screen ad content, expanded
      ads, or its in-app browser when a user follows an ad link.
    disableEffect: AppNexus full-screen and expanded ads, and its in-app ad browser, will not open; other
      app features remain available.
  zh-CN:
    description: AppNexus（Xandr）移动广告 SDK 会打开此 Activity 显示全屏或展开式广告，也会在用户点击广告链接时打开应用内浏览器。
    disableEffect: AppNexus 全屏广告、展开式广告和应用内广告浏览器将无法打开，应用的其他功能仍可使用。
