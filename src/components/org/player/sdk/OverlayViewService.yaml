  en:
    description: The MyGuide (EdCast) guide SDK starts this service while playing a walkthrough. It places
      guide steps over the app and provides controls to continue, go back, or close.
    disableEffect: Disabling it prevents MyGuide walkthrough steps from appearing over the app.
  zh-CN:
    description: MyGuide（EdCast）指南 SDK 会在播放界面引导时启动此服务，在应用界面上显示引导步骤，并提供继续、返回和关闭控件。
    disableEffect: 停用后，MyGuide 的界面引导步骤将无法显示。
