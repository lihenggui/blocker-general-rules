    description: The CanHub Android Image Cropper uses this provider to pass camera-captured photos to
      the cropping flow through a private content link. Its manifest also configures the image files the
      cropper can share.
    disableEffect: The cropper may fail to open the camera or pass its captured image to the cropping
      screen.
  zh-CN:
