i18n:
  en:
    description: AndroidX Credentials Play Services Auth opens this hidden Activity when Google returns
      a pending screen for creating or retrieving a digital credential; it sends the user's result back
      to Credential Manager.
    disableEffect: Google digital-credential creation or sign-in through this adapter may fail.
  zh-CN:
    description: Google 返回用于创建或获取数字凭据的待处理界面时，AndroidX Credentials Play Services Auth 会打开这个隐藏 Activity；它会将用户结果返回给
      Credential Manager。
    disableEffect: 通过此实现创建数字凭据或使用数字凭据登录的流程可能失败。
