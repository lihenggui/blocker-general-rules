    description: The LiG Player SDK (Light Generation Technology) opens this screen when an AR scene requests
      a Bluetooth Low Energy connection. It requests Bluetooth access, scans for nearby devices, lets
      the user choose one, and connects to it.
    disableEffect: The scene’s Bluetooth device selection and connection feature will not work.
  zh-CN:
    description: LiG Player SDK（Light Generation Technology）会在 AR 场景需要连接蓝牙低功耗设备时打开此页面。页面请求蓝牙权限、扫描附近设备，供用户选择并连接。
    disableEffect: 场景中的蓝牙设备选择和连接功能将无法使用。
