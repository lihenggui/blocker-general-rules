i18n:
  en:
    description: E. Rikov FilePicker exposes internal storage as a source in Android’s document picker
      and lets that picker list, open, create, and delete documents.
    disableEffect: Internal storage is no longer available through this provider in Android’s document
      picker, which can interrupt file selection or editing.
  zh-CN:
    description: E. Rikov FilePicker 会将内部存储作为来源提供给 Android 文档选择器，并让该选择器列出、打开、创建和删除文档。
    disableEffect: 禁用后，Android 文档选择器将无法通过此 Provider 访问内部存储，文件选择或编辑流程可能中断。
