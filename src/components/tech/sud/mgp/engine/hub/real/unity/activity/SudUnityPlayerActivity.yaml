i18n:
  en:
    description: SudMGP uses this Activity when an app starts a Unity-powered mini-game. It initializes
      the game player used to render the mini-game inside the app.
    disableEffect: SudMGP mini-games that use this player may fail to open or display correctly.
  zh-CN:
    description: 应用启动 Unity 小游戏时，SudMGP 会使用此界面初始化游戏播放器，在应用中呈现游戏画面。
    disableEffect: 停用后，依赖此播放器的 SudMGP 小游戏可能无法打开或正常显示。
