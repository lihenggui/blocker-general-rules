recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:01:09Z'
i18n:
  en:
    description: Woody230's Ktx Intent library starts this provider with the app and uses it when the
      app opens a web link. It passes the link to whichever browser or app can handle it.
    disableEffect: Links that use this library will no longer open from the app.
  zh-CN:
    description: Woody230 的 Ktx Intent 库会随应用启动此提供程序，并在应用打开网页链接时调用它。它会把链接交给系统中能够处理该链接的浏览器或应用。
    disableEffect: 应用内通过此库打开的网页链接将无法正常跳转。
