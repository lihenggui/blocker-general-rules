i18n:
  en:
    description: If required parts of an app are missing after installation, Google Play Core opens this
      screen to explain that the app must be reinstalled and, when possible, offers a button to reinstall
      from Play.
    disableEffect: Without the recovery screen, an app missing required components may remain unusable.
  zh-CN:
    description: 安装后若应用缺少必需部分，Google Play Core 会打开此页面说明需要重新安装，并在可用时提供从 Play 重新安装的按钮。
    disableEffect: 没有此恢复页面时，缺少必需组件的应用可能无法使用。
