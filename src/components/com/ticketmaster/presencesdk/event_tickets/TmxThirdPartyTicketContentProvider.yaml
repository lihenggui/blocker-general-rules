  en:
    description: When Ticketmaster Presence SDK shares a third-party ticket PDF, this exported ContentProvider
      gives the receiving app read-only access to that PDF in the app's private storage.
    disableEffect: Other apps will not be able to open the shared ticket PDF.
  zh-CN:
    description: Ticketmaster Presence SDK 分享第三方票券 PDF 时，此导出 ContentProvider 会让接收该文件的应用以只读方式打开应用私有存储中的
      PDF。
    disableEffect: 其他应用将无法打开分享的票券 PDF。
