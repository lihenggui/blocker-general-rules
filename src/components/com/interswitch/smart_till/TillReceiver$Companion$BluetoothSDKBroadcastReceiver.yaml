  en:
    description: Runs when the Interswitch Smart Till SDK reports a Bluetooth connection change or receives
      a terminal message. It passes connection status, errors and transaction replies to the app.
    disableEffect: The app may not receive Bluetooth till status or transaction replies, so payments through
      that terminal can fail.
  zh-CN:
    description: Interswitch Smart Till SDK 报告蓝牙连接状态变化或收到终端消息时，此接收器会把连接状态、错误和交易回复传给应用。
    disableEffect: 应用可能无法收到蓝牙终端状态或交易回复，导致通过该终端进行的支付失败。
