recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: This Activity is a screen slot that ByteDance's Pangle SDK fills with an ad page loaded
      while the app is running. Blocking it prevents those ad pages from opening.
    disableEffect: Ads that need a Pangle page loaded at runtime may not open or continue.
  zh-CN:
    description: 此 Activity 是字节跳动 Pangle SDK 的广告页面容器，用于显示应用运行时加载的页面。停用后，这些广告页面将无法打开。
    disableEffect: 需要运行时加载 Pangle 页面才能展示或继续的广告可能无法正常工作。
