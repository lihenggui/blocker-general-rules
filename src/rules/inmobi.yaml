  en:
    name: Inmobi
    description: "## About\n[InMobi](https://www.inmobi.com/) is a private, Indian-based advertising behemoth.\
      \  It has relationships with over 30,000 companies and app developers. It has approximately 1,500\
      \ employees in offices in 12 different countries. [See also: OpenCorporates](https://opencorporates.com/companies/us_ca/C3422070)\n\
      InMobi's founder, in a recent [Forbes article,](http://www.forbesindia.com/article/leaderboard/inmobi-wants-to-glue-your-attention-to-your-lock-screen/53095/1)\
      \ stated that \"Consumers will move from seeking content to consuming what is shown to them.\" \
      \ \n## Ownership\nInMobi was founded in Mumbai, India, as mKhoj, in 2007 by Naveen Tewari, Abhay\
      \ Singhal, Amit Gupta and Mohit Saxena.  Its investors include Softbank and its debt financier is\
      \ Tennenbaum Capital Partners.  \n## What it does\n* Native/Targeted Advertising\n* E-Commerce\n\
      * In-app Mobile Advertising\n* Market Research Platform\n## Privacy Policy\n[Policy as of 17/2/2017,\
      \ reviewed 21/4/2019:](https://www.inmobi.com/privacy-policy/)\n* InMobi's opt-out is [located here.](https://www.inmobi.com/page/opt-out/)\
      \  Users will need their iOS or Android ID.  \n* InMobi's privacy policy states that it collects\
      \ information about the \"device type (e.g. smartphone, tablet, etc.),operating system (e.g. iOS,\
      \ Android, Windows, Blackberry), network provider, mobile browser used (e.g. Safari, Internet Explorer\
      \ etc.),platform, SDK version, timestamp, API key (identifier for application), application version,\
      \ iOS Identifier for Advertising, iOS Identifier for Vendors, model, manufacture of device, OS version\
      \ of device, session start/stop time, locale (specific location where a given language is spoken),\
      \ time zone, network status such as WiFi, the geo-location of your device (using GPS or other geo-location\
      \ data) and the Identifier for Advertising (IDFA) or the Google Advertising ID (AAID) etc\"  which\
      \ it may infer from WiFi identifiers in the area.   \n* It also collects information regarding \"\
      (i) the content type of the ad (what the ad is about, e.g. games, finance, entertainment, news);\
      \ (ii) the ad type (e.g. whether the ad is a text, image, or video based ad); (iii) where the ad\
      \ is being served (e.g. the address of the site on which the ad appears); and (iv) certain information\
      \ about post-click activity in relation to the ad including user interaction with such ad.\"  It\
      \ may also collect email addresses in a hashed format. \n* This information is shared with \"Publishers,\
      \ Developers, Advertisers, Data Partners, Measurement Companies, InMobi Affiliates, and third parties\
      \ such as advisors and law enforcement authorities.\"  \n* Data is kept for a 13-month period, after\
      \ which InMobi \"may retain and use such data in an aggregated format, as necessary for internal\
      \ analytical purposes, to comply with its legal obligations, resolve disputes and enforce agreements.\"\
      \n## Lawsuits and Settlements\n* In 2016, InMobi settled with the FTC (US Federal Trade Commission)\
      \ for $950,000 over the Children's Online Privacy Protection Act violations (\"COPPA\").  [See more\
      \ information](https://www.ftc.gov/news-events/press-releases/2016/06/mobile-advertising-network-inmobi-settles-ftc-charges-it-tracked)"
    company: inmobi
