recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:55:18Z'
i18n:
  en:
    description: Frodoking's App-Architecture library uses this LeakCanary Service after a heap dump has
      been analyzed. If a memory leak is found, it sends the dump and leak details to the app's configured
      diagnostic uploader.
    disableEffect: Memory-leak reports will no longer be uploaded for diagnosis; normal app features are
      unaffected.
  zh-CN:
    description: 堆转储分析完成后，Frodoking 的 App-Architecture 库会使用此 LeakCanary Service。如果发现内存泄漏，它会将堆转储和泄漏详情发送到应用配置的诊断上传器。
    disableEffect: 内存泄漏报告将无法再上传供诊断使用；应用的正常功能不受影响。
