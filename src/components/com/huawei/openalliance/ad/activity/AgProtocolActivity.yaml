recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:39:39Z'
i18n:
  en:
    description: During a Huawei Ads app-install flow, this Activity forwards an AppGallery confirmation
      request and returns the user’s decision to the ad service.
    disableEffect: Huawei Ads download flows that need this AppGallery handoff cannot finish; normal app
      use is unaffected.
  zh-CN:
    description: 华为 Ads 的应用安装流程需要确认时，此 Activity 会转交 AppGallery 的确认请求，并把用户的选择返回广告服务。
    disableEffect: 停用后，需要此 AppGallery 交接步骤的华为广告下载流程无法完成；应用的正常功能不受影响。
