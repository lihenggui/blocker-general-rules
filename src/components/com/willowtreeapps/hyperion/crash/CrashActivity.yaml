i18n:
  en:
    description: When Hyperion catches an uncaught app error, it opens this screen in a separate crash
      process with a report that users can copy or share.
    disableEffect: The app still fails on the same error, but Hyperion's crash report screen and sharing
      controls are unavailable.
  zh-CN:
    description: Hyperion 捕获到未处理的应用错误后，会在独立的崩溃进程中打开此界面，显示可复制或分享的错误报告。
    disableEffect: 相同错误仍会导致应用崩溃，但 Hyperion 的崩溃报告界面和分享功能将不可用。
