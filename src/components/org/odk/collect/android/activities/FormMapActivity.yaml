i18n:
  en:
    description: From the map control beside a form, ODK Collect shows that form's mapped records; selecting
      a record opens it for editing, while the map can also start a new record. It is part of the Samagra
      ODK Collect client.
    disableEffect: Users will lose the map-based way to locate, edit, or start records for a form.
  zh-CN:
    description: 在表单旁选择地图入口后，ODK Collect 会显示该表单的地图记录；选择已有记录可进行编辑，也可从地图开始新记录。 它是 Samagra 构建的 ODK Collect
      客户端的一部分。
    disableEffect: 停用后，用户将无法通过地图查找、编辑或新建该表单的记录。
