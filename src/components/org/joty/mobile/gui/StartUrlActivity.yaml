recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T03:02:40Z'
i18n:
  en:
    description: Joty 2.0 Mobile opens this Activity when the starting server address must be entered
      or changed. The user can enter a URL, which the SDK saves before continuing its startup connection
      flow.
    disableEffect: If disabled, the user cannot set the start address needed for the app's Joty connection
      flow.
  zh-CN:
    description: 需要输入或更改起始服务器地址时，Joty 2.0 Mobile 会打开此 Activity。用户可以输入网址，SDK 保存后会继续启动连接流程。
    disableEffect: 停用后，用户无法设置 Joty 连接流程所需的起始地址。
