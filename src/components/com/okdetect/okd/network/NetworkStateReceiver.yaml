i18n:
  en:
    description: When Android reports a connectivity change, the OkDetect SDK updates its detection and
      verification logic with whether the device has Wi-Fi, mobile data, or no connection.
    disableEffect: OkDetect may keep an outdated connection state and fail to refresh network-dependent
      verification.
  zh-CN:
    description: Android 通知网络连接变化时，OkDetect SDK 会将设备当前使用 Wi-Fi、移动数据还是无网络的信息更新到检测和验证流程。
    disableEffect: OkDetect 可能保留过期的网络状态，无法刷新依赖网络的验证。
