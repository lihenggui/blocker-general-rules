i18n:
  en:
    description: This is part of Mrocigno's BigBrother diagnostic toolkit. When BigBrother monitoring
      is enabled, it places a floating shortcut on app screens so users can open the diagnostic panel.
    disableEffect: The BigBrother floating shortcut and its diagnostic panel will disappear; normal app
      screens will continue to work.
  zh-CN:
    description: 这是 Mrocigno 的 BigBrother 诊断工具的一部分。启用 BigBrother 监控后，它会在应用页面上显示悬浮入口，供用户打开诊断面板。
    disableEffect: 停用后，BigBrother 悬浮入口和诊断面板将不再出现；应用的普通页面仍可使用。
