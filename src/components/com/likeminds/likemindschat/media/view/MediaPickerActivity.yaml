  en:
    description: LikeMinds Chat-v1 opens this Activity when a user attaches files to a conversation or
      chatroom. It lets them choose photos or videos, audio, and documents after checking the required
      media access.
    disableEffect: Users cannot select media or documents for chat messages through this picker.
  zh-CN:
    description: 用户为会话或聊天室添加附件时，LikeMinds Chat-v1 会打开此 Activity。它会先检查所需的媒体访问权限，再让用户选择照片、视频、音频或文档。
    disableEffect: 停用后，用户无法通过此选择页面为聊天消息添加媒体或文档。
