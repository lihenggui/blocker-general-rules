i18n:
  en:
    description: AppliKey SocialManager opens Instagram authorization in an in-app browser when Instagram
      sign-in is selected, then exchanges the returned code for an access token.
    disableEffect: Instagram sign-in through this library can no longer complete, so an account flow that
      depends on it will fail.
  zh-CN:
    description: AppliKey SocialManager 在用户选择 Instagram 登录时，通过应用内浏览器打开授权页面，再用返回的代码换取访问令牌。
    disableEffect: 该库将无法完成 Instagram 登录，依赖此方式的账号流程也会失败。
