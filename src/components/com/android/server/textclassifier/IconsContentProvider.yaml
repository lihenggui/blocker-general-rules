i18n:
  en:
    description: 'A content provider that is used to access icons returned from the TextClassifier service.
      Use IconsUriHelper#getContentUri(String, int) to access a uri for a specific resource. The uri may
      be passed to other processes to access the specified resource. NOTE: Care must be taken to avoid
      leaking resources to non-permitted apps via this provider.'
