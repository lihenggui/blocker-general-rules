i18n:
  en:
    description: When the app starts WeChat Pay or WeChat returns from a payment, this Activity forwards
      the request or payment response to EasyPay. Disabling it can prevent WeChat payments from completing.
    disableEffect: Users may be unable to finish a WeChat Pay transaction or return its result to the
      app.
  zh-CN:
    description: 应用发起微信支付或微信支付后返回时，此 Activity 会把请求或付款结果交给 EasyPay。停用后，微信支付可能无法完成。
    disableEffect: 用户可能无法完成微信支付交易，或无法把支付结果返回给应用。
