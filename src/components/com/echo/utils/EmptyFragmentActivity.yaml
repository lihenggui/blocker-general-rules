i18n:
  en:
    description: Echo Utils starts this transparent Activity when the app uses its fragment-based image
      picker or sharing functions; it hosts the operation and forwards activity and permission results.
    disableEffect: The app's image-picking or fragment-based sharing flow will not run correctly or return
      its result.
  zh-CN:
    description: 应用使用 Echo Utils 的图片选择或分享功能时，工具会启动这个透明界面来承载操作，并转交页面返回值和权限请求结果。
    disableEffect: 停用后，应用的图片选择或基于 Fragment 的分享流程将无法正常运行或返回结果。
