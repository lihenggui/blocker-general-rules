  en:
    description: When a scheduled KLocalNotification alarm fires, this receiver builds a local notification
      with the supplied text and sets which app screen should open when it is tapped.
    disableEffect: Scheduled local notifications and their intended tap-through actions will no longer
      be delivered.
  zh-CN:
    description: KLocalNotification 的预定提醒触发时，此 Receiver 会根据提供的文字创建本地通知，并指定点击后打开的应用页面。
    disableEffect: 关闭后，预定的本地通知及其点击后跳转操作将无法送达。
