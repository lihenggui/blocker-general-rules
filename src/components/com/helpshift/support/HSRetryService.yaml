i18n:
  en:
    description: The Helpshift Android customer-support SDK starts this Service to resend support messages
      and related requests that failed earlier, then stops it after the retry attempt.
    disableEffect: Failed Helpshift messages and requests are no longer retried automatically, so a user’s
      support request may not reach the support team.
  zh-CN:
    description: Helpshift Android 客户支持 SDK 会启动此 Service，重新发送先前发送失败的支持消息和相关请求；重试后 Service 会停止。
    disableEffect: 停用后，发送失败的 Helpshift 消息和请求不会自动重试，用户的支持请求可能无法送达支持团队。
