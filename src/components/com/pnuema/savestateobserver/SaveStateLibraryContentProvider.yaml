recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:22:20Z'
i18n:
  en:
    description: At app startup, Pnuema SaveStateObserver registers callbacks that log the size of state
      saved by activities and fragments and warn when a saved bundle is too large.
    disableEffect: Logs showing saved state size and warnings for large saved state will stop appearing;
      the app will still be able to save screen state.
  zh-CN:
    description: 应用启动时，Pnuema SaveStateObserver 会注册回调，记录 Activity 和 Fragment 保存的状态大小，并在状态包过大时发出警告。
    disableEffect: 停用后，状态大小诊断日志和超大状态警告将停止出现，应用仍可正常保存界面状态。
