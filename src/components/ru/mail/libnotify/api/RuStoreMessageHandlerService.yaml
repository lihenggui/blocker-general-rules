i18n:
  en:
    description: When RuStore Push delivers a message or refreshes its token, this Mail.ru libnotify service
      passes the message data or token to the notification SDK.
    disableEffect: libnotify notifications and token updates will stop arriving through RuStore; other
      app features remain available.
  zh-CN:
    description: RuStore Push 收到推送消息或更新推送令牌时，Mail.ru 的 libnotify 服务会将消息数据或令牌交给通知 SDK。
    disableEffect: libnotify 将无法通过 RuStore 接收通知或令牌更新；应用的其他功能仍可使用。
