i18n:
  en:
    description: The older Ant Digital OCR flow opens this screen before capturing the front of an identity
      document; continuing opens the camera, and the accepted photo advances the document flow. Disabling
      it blocks that capture step.
    disableEffect: Users cannot begin the front-side document capture in this OCR flow.
  zh-CN:
    description: 较早版本的 Ant Digital OCR 流程会在拍摄证件正面前打开此界面；用户继续后进入相机，确认照片后流程继续。禁用后，正面拍摄步骤无法开始。
    disableEffect: 用户无法在此 OCR 流程中开始拍摄证件正面。
