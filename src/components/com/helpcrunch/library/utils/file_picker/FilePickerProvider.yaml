i18n:
  en:
    description: HelpCrunch's file-sharing provider creates shareable links to local files selected for
      chat attachments. Android uses it when the SDK opens or shares those files.
    disableEffect: HelpCrunch cannot share selected attachment files through this provider, so file-sharing
      and attachment flows may fail.
  zh-CN:
    description: HelpCrunch 文件共享提供程序会为聊天附件中选取的本地文件创建可共享链接。SDK 打开或分享这些文件时，Android 会使用此提供程序。
    disableEffect: HelpCrunch 将无法通过此提供程序共享选中的附件文件，文件共享和附件流程可能失败。
