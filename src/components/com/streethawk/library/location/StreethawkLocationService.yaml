i18n:
  en:
    description: This component is part of the StreetHawk mobile engagement SDK. StreetHawk starts this
      older Service when location collection is enabled. It selects a device location provider and sends
      coordinate updates to StreetHawk, using different intervals while the app is foreground or background.
    disableEffect: StreetHawk location history and location-based campaign reports will stop updating.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。启用位置收集时，StreetHawk 会启动此旧版服务。它会选择设备位置来源并向 StreetHawk 发送坐标更新，同时根据应用在前台或后台调整间隔。
    disableEffect: StreetHawk 的位置记录和基于位置的活动报告将停止更新。
