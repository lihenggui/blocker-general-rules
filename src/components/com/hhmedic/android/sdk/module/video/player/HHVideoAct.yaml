    description: HH Medics’ HHVideo SDK opens an in-app player for a supplied video, such as a video selected
      from an upload list. The player can loop the video and hide its hang-up control.
    disableEffect: Users will not be able to play videos through the HH Medics SDK player.
  zh-CN:
    description: HH Medics 的 HHVideo SDK 使用此页面播放指定视频，例如从上传列表中选择的视频。播放器可以循环播放，也可以隐藏挂断按钮。
    disableEffect: 停用后，用户无法通过 HH Medics SDK 播放视频。
