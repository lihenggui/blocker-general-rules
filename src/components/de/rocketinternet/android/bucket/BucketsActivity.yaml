i18n:
  en:
    description: RocketBucket (Rocket Internet) opens this screen when the app asks to inspect its experiments.
      It fetches the available experiments and shows the current group assignment for each.
    disableEffect: Users lose the RocketBucket screen for reviewing experiment assignments and opening
      their settings.
  zh-CN:
    description: 应用请求查看实验时，RocketBucket（Rocket Internet）会打开此界面。它会获取可用实验，并显示每项实验当前分配的组别。
    disableEffect: 用户将无法再通过 RocketBucket 界面查看实验分组或打开相应设置。
