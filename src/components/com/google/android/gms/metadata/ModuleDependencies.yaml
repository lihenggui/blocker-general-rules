recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:20:31Z'
i18n:
  en:
    description: Google Play services reads this disabled manifest entry to determine that the app requires
      its Photo Picker module. It is module-delivery information, not a service that runs while the app
      is in use.
    disableEffect: Photo selection that depends on the Google Play services Photo Picker may stop working
      on devices that need this module.
  zh-CN:
    description: Google Play 服务会读取这条已禁用的清单声明，以判断应用需要其照片选择器模块。这是模块交付信息，不会作为普通服务在应用使用期间运行。
    disableEffect: 在需要此模块的设备上，依赖 Google Play 服务照片选择器的选图功能可能无法使用。
