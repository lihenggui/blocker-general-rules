i18n:
  en:
    description: This Ometria customer-engagement SDK receiver accepts Google push-delivery broadcasts.
      If the SDK is not initialized, it starts it in the background and records the received-notification
      event for React Native apps.
    disableEffect: Ometria background notification-receipt tracking for React Native apps will stop.
  zh-CN:
    description: 此 Ometria 客户互动 SDK 接收 Google 推送服务送达的广播。若 SDK 尚未初始化，它会在后台启动 SDK，并为 React Native 应用记录通知接收事件。
    disableEffect: React Native 应用中的 Ometria 后台通知接收跟踪将停止。
