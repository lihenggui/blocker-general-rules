    name: mParticle
    description: "## Primary location\nUnited States (New York) [Crunchbase, 01](https://www.crunchbase.com/organization/mparticle)\n\
      ## Website\n[https://www.mparticle.com](https://www.mparticle.com)\n## About\nmParticle offers \"\
      a customer data platform built for mobile and native apps across all devices\" [mParticle, 04](https://www.mparticle.com/news/mparticle-raises-15-million-series-a-led-by-social-capital)\n\
      ## Ownership\nmParticle\n## Documentation\n[https://docs.mparticle.com/developers/sdk/android/getting-started](https://docs.mparticle.com/developers/sdk/android/getting-started)\n\
      ## Products and Services\nmParticle's core features include:\n* _Simplicity and organization:_ Clients\
      \ \"collect and control all\" their \"customer data through a single API\"\n* _Cross-device identification:_\
      \ \"Recognize customers at every step of the buying process\"\n* _Market orchestration:_ \"Personalize\
      \ experiences across channels, partners, and screens\"\nProducts and services include:\n* _Customer\
      \ Data Platform (CDP):_\n* * _Understand the entire buying process:_ Merge online and offline data\
      \ through collection of digital and offline customer journey data; stream it to platforms and systems\n\
      * * _Understand and predict customers:_ \"Link customer identities and profile information across\
      \ internal and external systems for...customer insights\"\n* * _Integration:_ \"Integrate with 175+\
      \ of the leading marketing, analytics and data warehousing solutions\"\n* * _Control your data:_\
      \ \"Set rules to transform and filter data without having to make changes to client-side code, and\
      \ monitor all integrations in real-time\"\n* * * _IDSync:_ \"Create fine-grained identity mappings\
      \ and logic to meet nuanced business requirements and share them across providers\"\n* * * _AudienceSync:_\
      \ \"Transform raw data into actionable audience segments and sync them across paid media, CRM, and\
      \ other platforms\"\n* * * _Enrichment:_ \"Manage integrations with third-party profile enrichment\
      \ providers and supplement existing data with additional customer insights\"\n* * * _Warehouses:_\
      \ \"Instantly load data into Amazon Redshift, BigQuery and other data warehouses, BI tools, and\
      \ machine learning extensions\" [mParticle, 05](https://www.mparticle.com/product)\n* _Enhance analytics:_\
      \ \"Unify data around a single customer profile to fuel better insights and attribution reporting\"\
      \ \n* _Segmentation:_ Build and sync audience segments across platforms [mParticle, 06](https://www.mparticle.com/marketer)\n\
      * _Data integration:_ \"Unite disparate data sources to better understand the customer and key business\
      \ metrics\" [mParticle, 07](https://www.mparticle.com/productmanager)\n* _Cross-device identification:_\
      \ \"Improve media measurement, customer journey analytics, lifetime value modeling, and more by\
      \ resolving customer identity data across disparate sources\" [mParticle, 08](https://www.mparticle.com/analytics)\n\
      * _Location tracking with SafeGraph integration:_ By integrating with SafeGraph, clients have the\
      \ tools to track user physical locations, and harness machine learning to analyze the data: \"mParticle\
      \ customers can now create, monitor, and control server-to-server integrations with SafeGraph via\
      \ the mParticle platform. With the integration enabled, brands can stream real-time mobile location\
      \ data directly from their apps to SafeGraph, which will then translate long/lat coordinates into\
      \ known locations and use machine learning to help brands understand their customers offline movement\
      \ patterns\" [mParticle, 10](https://www.mparticle.com/integrations/integration-safegraph)\n## Privacy\
      \ Policy\n_Data Collection:_ Clients \"collect information based on User interaction with their\
      \ mobile application(s), mobile website(s) or other digital properties where Clients have integrated\
      \ with the\" mParticle Platform. mParticle calls this \"Client Digital Properties\". Data collected\
      \ through \"via Client Digital Properties for the Platform includes: the date/time for a visit to\
      \ a Client Digital Property, referrer information such as what search engine and search keywords\
      \ Users may have used to get to a Client Digital Property, information about the browser or device\
      \ your User is on such as their Operating System, as well as the city/country location of Users,\
      \ and any pseudonymous tokens and mobile advertising IDs (e.g., IDFA in iOS). In addition, our Clients\
      \ can choose what other User data they want to collect and store on the platform such as an IP address,\
      \ location information, a User’s age, user names, real names, email addresses and other custom data\
      \ points as determined by each Client.\"  \nmParticle places restrictions on data practices. They\
      \ state, \"We contractually prohibit Clients from placing sensitive information (e.g., passwords,\
      \ authentication credentials, credit cards, social security or driver’s license numbers) or information\
      \ that is deemed sensitive by applicable law or self-regulatory codes such as the Digital Advertising\
      \ Alliance. mParticle functions strictly as the data processing agent of our Clients. Accordingly,\
      \ other than those aforementioned restrictions, the data stored on the Platform is subject to the\
      \ privacy policies of each Client\".\n_Information sharing:_ Third party sharing may proceed as\
      \ follows:\n* Third-party agents working as subprocessors (who must adhere to mParticle's privacy\
      \ policy)\n* \"To protect the rights and property of mParticle, our agents, Clients and others \"\
      \n* \"In an emergency, including protection of the personal safety of any person\"\n* \"For the\
      \ purposes of a business deal (or negotiation of a business deal) involving sale or transfer of\
      \ all or a part of our business or assets\"\n* In response to a lawful request by public authorities\n\
      * mParticle \"may also share aggregate or anonymous information without restriction\"\n_Security:_\
      \ mParticle asserts that they take reasonable steps to protect information. They state, \"We encrypt\
      \ transmission of data on pages where you provide payment information or otherwise provide sensitive\
      \ information. However, no security or encryption method can be guaranteed to protect information\
      \ from hackers or human error. Information we collect may be stored or processed on computers located\
      \ in any country where we do business\".\n_Data retention:_ mParticle \"retains Client data for\
      \ so long as you remain are a Client and will delete Client’s information within 12 months of either\
      \ party’s termination of applicable Client agreement upon written request. We retain User level\
      \ data on the Platform as directed by our Clients and for a reasonable time thereafter for audit\
      \ purposes and as otherwise required by law\".\n_Opt-out:_ mParticle has an email-based opt-out\
      \ procedure for Clients, but does not list opt-out procedures for End Users on its Privacy Policy\
      \ web page. The opt-out procedure for Clients is as follows: \"You may opt out of receiving promotional\
      \ emails from mParticle by following the instructions in those emails. If you opt out, we may still\
      \ send you non-promotional emails, such as emails about your mParticle projects or our ongoing business\
      \ relationship. An individual wishing to limit the use or sharing of their data should contact email\
      \ support@mparticle.com. mParticle will respond within ninety (90) days to any request to delete\
      \ your information. Individuals who have provided information directly to one of mParticle’s Clients\
      \ must send follow-up requests to change or delete such information to that particular mParticle\
      \ Client\"\n_International law:_ mParticle complies with the EU-US Privacy Shield Framework and\
      \ the Swiss-US Privacy Shield Framework [mParticle, 12](https://www.mparticle.com/privacypolicy).\n\
      ## Relationships\n_Customers:_ Airbnb / King / Spotify / Jet / EA / SeatGeek / Ticketmaster / Gilt\
      \ / Bleacher Report / Chick-fil-A / Postmates / Lilly Pulitzer [mParticle, 01](https://www.mparticle.com)\
      \ / Venmo / Via / Stash / Starwood Preferred Guest / Draft / StockTwits / OKCupid / NBCUniversal\
      \ / Turner / theSkimm / Lakes Fifth Avenue / Lululemon Athletica / Goat / Live Nation [mParticle,\
      \ 02](https://www.mparticle.com/customers) / Walmart [mParticle, 03](https://www.mparticle.com/news/mparticle-gartner-magic-quadrant-digital-marketing-hubs)\
      \ / iHeartRadio / Starwood / SoulCycle [mParticle, 04](https://www.mparticle.com/news/mparticle-raises-15-million-series-a-led-by-social-capital)\
      \  \n_Integrations:_ mParticle offers \"Full-featured integrations with the top marketing, advertising,\
      \ analytics, and data warehousing platforms\". Integrations include: Amazon Redshift / Amplitude\
      \ / Appboy / Kahuna / Kochava / SendGrid [mParticle, 04](https://www.mparticle.com/news/mparticle-raises-15-million-series-a-led-by-social-capital)\
      \ / Facebook / Snap / Twitter / TUNE / Adobe Marketing Cloud / Oracle Marketing Cloud / Salesforce\
      \ Marketing Cloud / Zendesk / MailChimp / Google Analytics / Looker / Mixpanel / comScore [mParticle,\
      \ 01](https://www.mparticle.com). For a detailed database of integrations, see [mParticle, 09](https://www.mparticle.com/integrations).\n\
      _Key partnerships:_ Some key partnerships include integration with SafeGraph [mParticle, 10](https://www.mparticle.com/integrations/integration-safegraph)\
      \ and Salesforce Marketing Cloud [mParticle, 11](https://www.mparticle.com/blog/salesforce-partnership).\n\
      ## Details\n_Financial details:_ mParticle was founded in 2013 and has raised over $76 million from\
      \ funders [Crunchbase, 01](https://www.crunchbase.com/organization/mparticle).  \n_Location-based\
      \ tracking:_ Via, an \"on-demand ride-sharing app based in NYC\", integrates with mParticle for\
      \ geofencing services [mParticle, 13](https://www.mparticle.com/blog/via-predictive-analytics-radar).\n\
