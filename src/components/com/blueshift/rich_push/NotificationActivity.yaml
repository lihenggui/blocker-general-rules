    description: When an older Blueshift rich push uses an alert dialog, this Activity shows the message
      and lets the user open the app or dismiss the alert.
    disableEffect: Blueshift alert-style push messages will no longer show their open and dismiss dialog.
  zh-CN:
    description: 旧版 Blueshift 富媒体推送使用提醒对话框时，此 Activity 会显示消息，并允许用户打开应用或关闭提醒。
    disableEffect: Blueshift 提醒式推送将不再显示打开或关闭消息的对话框。
