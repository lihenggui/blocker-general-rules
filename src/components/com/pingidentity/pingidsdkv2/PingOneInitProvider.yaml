i18n:
  en:
    description: When the app process starts, the PingOne MFA (Ping Identity) SDK watches for the app
      to enter the foreground; it refreshes MFA information and checks whether an authenticator app is
      configured.
    disableEffect: PingOne MFA initialization and authenticator checks will not run, so sign-in verification
      that relies on this SDK may fail.
  zh-CN:
    description: 应用进程启动时，PingOne MFA（Ping Identity）SDK 会监听应用进入前台的状态；它会刷新 MFA 信息并检查是否已配置身份验证器应用。
    disableEffect: PingOne MFA 的初始化和验证器检查将无法运行，依赖该 SDK 的登录验证可能失败。
