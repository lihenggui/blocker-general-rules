i18n:
  en:
    description: The AppCoins Ads SDK uses this Service in its AppCoins Wallet campaign verification flow.
      The SDK registers campaigns and sends time-stamped confirmations while the app is in the foreground
      through this connection.
    disableEffect: AppCoins ad campaigns that rely on the Wallet connection will no longer exchange their
      attention confirmations through this service.
  zh-CN:
    description: AppCoins Ads SDK 会在与 AppCoins Wallet 的广告活动核验流程中使用此服务。SDK 会注册广告活动，并在应用处于前台时通过该连接发送带时间戳的使用确认。
    disableEffect: 依赖 AppCoins Wallet 连接的广告活动将无法通过此服务交换使用确认。
