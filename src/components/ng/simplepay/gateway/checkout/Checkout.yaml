  en:
    description: SimplePay Gateway opens this Activity when the app starts a card checkout. It collects
      payment details and continues through PIN or one-time-code checks when the payment requires them.
    disableEffect: Disabling it prevents the app from completing this SimplePay card payment.
  zh-CN:
    description: 应用发起信用卡结账时，SimplePay Gateway 会打开此 Activity。它收集付款信息，并在付款需要时继续进行 PIN 或一次性验证码验证。
    disableEffect: 停用后，应用将无法完成这笔 SimplePay 信用卡付款。
