i18n:
  en:
    description: The Ant Digital OCR SDK opens this landscape screen when an identity-document scan requires
      the wide layout; it captures and reads the document image. Disabling it prevents that scan from
      completing.
    disableEffect: Users cannot complete document OCR in the landscape verification flow.
  zh-CN:
    description: Ant Digital OCR SDK 会在证件扫描需要横屏布局时打开此界面，用于拍摄并识读证件图像。禁用后，该横屏核验流程无法完成。
    disableEffect: 用户将无法完成横屏核验流程中的证件识读。
