i18n:
  en:
    description: When a user chooses the gallery option in Hippo (Jungle Works) support chat, this Activity
      lists photo folders and lets them select an image to attach to the conversation.
    disableEffect: Users can no longer attach a saved image from the gallery to a Hippo conversation;
      opening that option may fail.
  zh-CN:
    description: 在 Hippo（Jungle Works）客服聊天中选择图库附件时，此 Activity 会列出照片文件夹，供用户选择图片并添加到对话中。
    disableEffect: 停用后，用户无法从图库向 Hippo 对话添加已保存的图片，打开图库附件选项也可能失败。
