  en:
    description: Jamun Language-Picker opens a language list when the app requests a language choice.
      It supports single or multiple selection and returns the selected languages.
    disableEffect: Users cannot select and return a language through Jamun Language-Picker in the app.
  zh-CN:
    description: 应用请求选择语言时，Jamun Language-Picker 会打开语言列表。它支持单选或多选，并会将所选语言返回应用。
    disableEffect: 停用后，用户将无法通过 Jamun Language-Picker 选择语言并将结果返回应用。
