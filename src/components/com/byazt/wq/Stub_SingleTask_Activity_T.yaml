    description: Pangle（字节跳动）广告 SDK 将此 Activity 用作运行时加载广告页面的容器。SDK 需要按对应的屏幕布局显示全屏广告时会使用它。
    disableEffect: 这个 Pangle 广告页面将无法打开。
