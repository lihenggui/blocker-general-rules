  en:
    description: PictureSelector (LuckSiege) opens this screen when its picker is configured to use the
      built-in camera. It lets the user take a photo or record a video and returns the capture to the
      picker.
    disableEffect: The app can no longer capture photos or videos with PictureSelector's built-in camera.
  zh-CN:
    description: PictureSelector（LuckSiege）的媒体选择器启用内置相机时，会打开此页面。用户可拍照或录制视频，完成后媒体会返回到选择器。
    disableEffect: 应用将无法再使用 PictureSelector 的内置相机拍照或录像。
