  en:
    description: The NetEase Yunxin QChat UI SDK opens this screen when a user edits an individual's access
      to a channel. It controls whether that member can send messages, manage the channel or roles, and
      manage the channel's member lists.
    disableEffect: Users cannot change an individual's QChat channel permissions through the built-in
      screen.
  zh-CN:
    description: 网易云信 QChat 界面库会在用户编辑某位成员的频道权限时打开此页。页面可以设置该成员能否发消息、管理频道或角色，以及管理频道成员名单。
    disableEffect: 用户无法通过 QChat 内置界面修改单个成员的频道权限。
