recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:12:24Z'
i18n:
  en:
    description: TaurusX Ads registers this file-sharing provider for files in its ad-download folder.
      Android can use it to give another app access to a downloaded file when the SDK hands that file
      off.
    disableEffect: TaurusX file handoffs can fail, including ad-download actions that need another app
      to open a downloaded file.
  zh-CN:
    description: TaurusX Ads 为广告下载目录注册了此文件共享入口。当 SDK 需要把下载文件交给其他应用时，Android 可通过它提供文件访问。
    disableEffect: TaurusX 的文件交接可能失败，包括需要由其他应用打开下载文件的广告下载操作。
