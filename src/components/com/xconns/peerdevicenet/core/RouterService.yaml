i18n:
  en:
    description: The XCONNS PeerDeviceNet SDK runs this foreground Service to find network peers, manage
      connections and groups, and carry messages between devices. The app starts it when it uses PeerDeviceNet
      connection or messaging features.
    disableEffect: Peer discovery, device connections, group communication, and messages through PeerDeviceNet
      will stop working.
  zh-CN:
    description: XCONNS PeerDeviceNet SDK 通过这个前台服务发现网络中的其他设备、管理连接和群组，并在设备间传递消息。应用使用 PeerDeviceNet 的连接或消息功能时会启动它。
    disableEffect: 停用后，应用通过 PeerDeviceNet 进行设备发现、连接、群组通信和设备间消息传递的功能将停止。
