i18n:
  en:
    description: RongCloud IMKit opens this screen when you enter a one-to-one or group conversation.
      It displays the messages and chat controls for that person or group.
    disableEffect: The app will not be able to open the IMKit conversation screen, so messaging through
      it will fail.
  zh-CN:
    description: 进入一对一或群组会话时，融云 IMKit 会打开此页面。页面显示该联系人或群组的消息和聊天控制项。
    disableEffect: 停用后，应用将无法打开 IMKit 会话界面，通过该界面聊天也会失效。
