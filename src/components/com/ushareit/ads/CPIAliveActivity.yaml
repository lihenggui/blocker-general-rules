i18n:
  en:
    description: SHAREit Ads briefly opens this nearly invisible screen when a promoted app's full-screen
      install flow starts. It records the install start and then closes.
    disableEffect: SHAREit Ads will stop recording these promoted-app install starts.
  zh-CN:
    description: 推广应用的全屏安装流程开始时，SHAREit Ads 会短暂打开此几乎不可见的页面，记录安装启动事件后将其关闭。
    disableEffect: SHAREit Ads 将不再记录这些推广应用安装流程的启动事件。
