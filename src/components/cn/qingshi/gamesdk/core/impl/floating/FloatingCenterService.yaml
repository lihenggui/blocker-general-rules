    description: The Qingshi (YYXXGame) game SDK starts this Service when it shows its floating shortcut;
      tapping the draggable icon opens the configured gift-center page.
    disableEffect: Disabling it removes the floating gift-center shortcut, so players cannot open that
      page from the game.
  zh-CN:
    description: 青石（YYXXGame）游戏 SDK 显示悬浮入口时会启动此 Service；点按可拖动的图标会打开已配置的礼包中心页面。
    disableEffect: 停用后，游戏中的悬浮礼包入口会消失，玩家无法从这里打开礼包页面。
