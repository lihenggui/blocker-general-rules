recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Google Mobile Ads checks the app's AdMob app ID or integration details during startup.
      This provider performs an early setup check and does not display an app screen.
    disableEffect: Google's early app ID check will not run, so a missing or invalid ad setup may go unnoticed
      until ads are used.
  zh-CN:
    description: Google Mobile Ads 会在应用启动时检查 AdMob 应用 ID 或集成信息；此提供程序只进行早期配置检查，不显示应用页面。
    disableEffect: Google 的早期应用 ID 检查将不再运行，因此缺失或无效的广告配置可能要到使用广告时才会发现。
