i18n:
  en:
    description: This is part of Mrocigno's BigBrother diagnostic toolkit. When BigBrother session diagnostics
      start, this task records which app screens open and adds interaction markers to the session timeline.
    disableEffect: BigBrother will stop collecting the screen and interaction history used in session
      reports; app screens continue to work normally.
  zh-CN:
    description: 这是 Mrocigno 的 BigBrother 诊断工具的一部分。BigBrother 会话诊断启动后，此任务会记录打开过的应用页面，并将交互标记加入会话时间线。
    disableEffect: 停用后，BigBrother 不再收集会话报告使用的页面和交互记录；应用页面仍可正常运行。
