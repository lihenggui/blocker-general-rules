i18n:
  en:
    description: The LivePerson Messaging SDK opens a co-browsing session from a support conversation
      and can keep it visible in a small floating window. Disabling it prevents users and support agents
      from opening that shared browsing session.
    disableEffect: The app's LivePerson co-browsing session will not open.
  zh-CN:
    description: LivePerson 消息 SDK 会从客服会话中打开协同浏览，并可将会话缩小到浮动窗口继续显示。禁用后，用户和客服人员将无法打开这项共享浏览。
    disableEffect: 应用中的 LivePerson 协同浏览会话将无法打开。
