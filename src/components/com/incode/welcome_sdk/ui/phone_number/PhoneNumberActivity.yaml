i18n:
  en:
    description: When phone verification is part of the flow, this screen collects the user's phone number
      and can verify it with an SMS code. The MetaMap identity verification SDK opens this screen when
      the configured flow reaches this step.
    disableEffect: Disabling it prevents users from completing required phone collection or SMS-code verification.
  zh-CN:
    description: 核验流程要求验证电话时，此页面会收集用户手机号，并可通过短信验证码进行验证。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法完成所需的手机号收集或短信验证码验证。
