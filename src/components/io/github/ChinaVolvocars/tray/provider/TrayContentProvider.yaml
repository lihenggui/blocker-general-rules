i18n:
  en:
    description: The ChinaVolvocars Tray preference library starts this provider as the app process is
      created. It stores saved preference values in separate device and user databases and lets the app
      read or save them.
    disableEffect: Apps that use Tray for settings or saved preferences may fail to load or save those
      values.
  zh-CN:
    description: 应用进程启动时，ChinaVolvocars Tray 偏好设置库会创建此 Provider。它将偏好数据分别存入设备和用户数据库，让应用能够读取或保存这些内容。
    disableEffect: 依赖 Tray 保存设置或偏好数据的应用可能无法读取或保存这些内容。
