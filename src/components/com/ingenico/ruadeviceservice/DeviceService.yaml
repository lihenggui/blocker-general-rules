i18n:
  en:
    description: The Global Payments and Heartland RUA device service is bound by apps when they need
      to discover or connect to an Ingenico card reader. It manages reader search, pairing, and connections
      over USB, Bluetooth, or an audio jack.
    disableEffect: The app cannot discover or connect to supported Ingenico readers, so card-present payments
      through them stop working.
  zh-CN:
    description: 应用需要查找或连接 Ingenico 读卡器时，会绑定 Global Payments 或 Heartland 的 RUA 设备服务。此服务负责通过 USB、蓝牙或耳机接口搜索读卡器、配对并建立连接。
    disableEffect: 应用将无法发现或连接受支持的 Ingenico 读卡器，因此无法再通过这些设备进行实体卡支付。
