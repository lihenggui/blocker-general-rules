  en:
    description: The Xinliangxiang voice-read SDK opens this screen when an ad response selects the multi-stage
      reward landing page. It shows the reward steps and lets the user continue an unfinished ad-view
      task.
    disableEffect: The multi-stage reward flow will stop, and rewards for watching its ads will no longer
      be granted.
  zh-CN:
    description: Xinliangxiang 的 voice-read SDK 会在广告返回多阶段奖励推广页时打开此页面，显示奖励步骤，并允许用户继续未完成的广告观看任务。
    disableEffect: 多阶段奖励流程会停止，观看相关广告的奖励也不会再发放。
