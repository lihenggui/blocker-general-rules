i18n:
  en:
    description: When a user starts screen sharing through Tencent LiteAV/TRTC or the Tencent TCIC classroom
      SDK, this screen opens Android’s system consent prompt and returns the user’s choice to the media
      SDK.
    disableEffect: The selected SDK cannot obtain screen-capture consent through this flow, so screen
      sharing or recording may not start.
  zh-CN:
    description: 用户通过腾讯 LiteAV/TRTC 或腾讯 TCIC 课堂 SDK 发起屏幕共享时，此页面会打开 Android 系统授权提示，并将用户的选择返回媒体 SDK。
    disableEffect: 相应 SDK 无法通过此流程取得屏幕采集授权，因此屏幕共享或录制可能无法启动。
