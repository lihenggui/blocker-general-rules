i18n:
  en:
    description: When FireBots receives its notification-click broadcast, this Receiver forwards the selected
      destination to the app’s click callback.
    disableEffect: FireBots registers a receiver instance for this broadcast, so disabling only the manifest
      entry does not stop the callback.
  zh-CN:
    description: FireBots 收到通知点击广播时，此 Receiver 会将所选目标转交给应用的点击回调。
    disableEffect: FireBots 会为此广播注册接收器实例，因此单独停用清单中的组件不会停止该回调。
