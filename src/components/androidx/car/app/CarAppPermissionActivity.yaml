i18n:
  en:
    description: AndroidX Android for Cars App opens this Activity when the car host requests app permissions,
      shows Android's permission prompt, and returns which permissions were granted or rejected.
    disableEffect: Car permission requests will not open or return their result, so car features that
      need those permissions may stop working.
  zh-CN:
    description: 车载主机通过 AndroidX Android for Cars App 请求应用权限时会打开这个 Activity；它显示 Android 权限提示，并把用户允许或拒绝的结果返回给车载主机。
    disableEffect: 车载权限请求将无法打开或返回结果，因此依赖这些权限的车载功能可能无法使用。
