i18n:
  en:
    description: The Junerver Utils Android utility library briefly opens this Activity for runtime permission
      requests and other operations that need to return a result to the app.
    disableEffect: Apps that rely on these helpers may lose permission prompts or returned results, which
      can block permission-dependent features.
  zh-CN:
    description: Junerver Utils 工具库会在申请运行时权限或需要向应用返回操作结果时短暂打开此 Activity。
    disableEffect: 依赖这些辅助功能的应用可能无法显示权限请求或接收操作结果，导致需要相关权限的功能无法使用。
