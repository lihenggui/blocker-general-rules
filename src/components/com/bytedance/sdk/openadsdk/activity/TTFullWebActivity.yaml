i18n:
  en:
    description: When Pangle shows full-screen web ad content, this Activity displays the ad page inside
      the app, including reward-style web ads that use this screen.
    disableEffect: Pangle web ads using this screen will not open, and rewards for watching rewarded ads
      will no longer be granted.
  zh-CN:
    description: Pangle 展示全屏网页广告时，此 Activity 会在应用内显示广告页面，包括使用此页面的网页激励广告。
    disableEffect: 依赖此页面的 Pangle 网页广告将无法打开，观看激励广告的奖励也将不再发放。
