  en:
    description: When the 233 MPG SDK needs user consent, this Activity shows its user agreement and reports
      whether the user accepts. Declining records the refusal and closes the current SDK flow.
    disableEffect: The consent decision cannot be collected, which can prevent SDK features that require
      agreement from starting.
  zh-CN:
    description: 233 MPG SDK 需要用户同意时，此 Activity 会显示用户协议并返回用户是否接受；用户拒绝后会记录拒绝结果并结束当前 SDK 流程。
    disableEffect: 停用后将无法收集用户的同意结果，需要协议确认的 SDK 功能可能无法启动。
