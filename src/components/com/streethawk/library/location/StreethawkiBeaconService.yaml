i18n:
  en:
    description: This component is part of the StreetHawk mobile engagement SDK. StreetHawk starts this
      older Service when iBeacon support is enabled. It connects to the iBeacon monitor, watches configured
      beacon regions, and reports matching proximity changes.
    disableEffect: StreetHawk iBeacon detection and proximity campaigns will stop.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。启用 iBeacon 支持时，StreetHawk 会启动此旧版服务。它会连接 iBeacon 监控器、监测已配置的信标区域，并报告匹配的邻近状态变化。
    disableEffect: StreetHawk 的 iBeacon 检测和邻近活动将停止。
