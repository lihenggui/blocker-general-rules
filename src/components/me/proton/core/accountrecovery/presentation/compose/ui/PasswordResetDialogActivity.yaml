i18n:
  en:
    description: Proton AG's Proton Core Android SDK opens this dialog during account recovery when a
      password reset is needed. It offers the password-reset step and can open Proton's account reset
      page.
    disableEffect: If disabled, the user may be unable to continue the password-reset part of account
      recovery in the app.
  zh-CN:
    description: Proton AG 的 Proton Core Android SDK 会在账户恢复需要重置密码时打开此对话框，提供密码重置步骤，并可打开 Proton 账户重置页面。
    disableEffect: 停用后，用户可能无法在应用中继续账户恢复的密码重置步骤。
