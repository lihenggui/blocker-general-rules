i18n:
  en:
    description: HTTP Monitor (Jiang Junmin) initializes the local store for captured request and response
      details when the app starts. The monitor's recording layer saves traffic there for later review.
    disableEffect: The monitor may stop saving requests, and apps using its traffic recorder may fail
      when captured data cannot be stored.
  zh-CN:
    description: HTTP Monitor（Jiang Junmin）会在应用启动时初始化已捕获请求与响应信息的本地存储区。流量记录功能会将数据存入其中，供之后查看。
    disableEffect: 监测工具可能无法再保存请求；使用其流量记录功能的应用也可能因数据无法保存而出错。
