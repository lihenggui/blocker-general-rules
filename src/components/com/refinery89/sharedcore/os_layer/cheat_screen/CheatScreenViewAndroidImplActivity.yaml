i18n:
  en:
    description: When the Refinery89 Monetize App SDK opens its built-in diagnostic screen, this Activity
      lists tools for checking app details, ad setup, saved preferences, and SDK logs. It also provides
      links to ad inspection and creative preview tools.
    disableEffect: Refinery89's built-in diagnostic and ad-preview screens cannot be opened, while ordinary
      app screens remain available.
  zh-CN:
    description: 当 Refinery89 Monetize App SDK 打开内置诊断页面时，此 Activity 会列出用于查看应用信息、广告设置、已保存偏好和 SDK 日志的工具。页面还提供广告检查和创意预览入口。
    disableEffect: 停用后，Refinery89 内置的诊断和广告预览页面无法打开，应用的普通页面仍可使用。
