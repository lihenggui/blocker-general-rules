i18n:
  en:
    description: LicheeDev’s SomeLibrary context utility starts with the app and makes its application
      context available to the library. Other utility functions can use this context without an Activity
      being open.
    disableEffect: SomeLibrary functions that need the app context may stop working.
  zh-CN:
    description: LicheeDev 的 SomeLibrary 上下文工具会随应用启动，并将应用上下文提供给该库使用。即使没有页面打开，其他工具功能也能取得此上下文。
    disableEffect: 依赖应用上下文的 SomeLibrary 工具功能可能无法工作。
