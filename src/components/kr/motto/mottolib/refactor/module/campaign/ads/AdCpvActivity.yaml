  en:
    description: Motto opens this view-based ad campaign when the user selects the offer. It loads the
      ad, tracks the required viewing time, and reports the reward after completion.
    disableEffect: Users will not be able to complete these ad views; rewards for watching these ads will
      no longer be granted.
  zh-CN:
