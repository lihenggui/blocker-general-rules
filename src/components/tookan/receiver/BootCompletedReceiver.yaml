  en:
    description: After the device restarts, JungleWorks' Tookan Agent checks for a saved signed-in session
      and restarts background location tracking when one exists.
    disableEffect: Location tracking will not resume automatically after a reboot until the app starts
      it again.
  zh-CN:
    description: 设备重启后，JungleWorks 的 Tookan Agent 会检查是否保留登录状态，并在已登录时重新启动后台定位跟踪。
    disableEffect: 设备重启后，定位跟踪将不会自动恢复，直到应用再次启动该功能。
