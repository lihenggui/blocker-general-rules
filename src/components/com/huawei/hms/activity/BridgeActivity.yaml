  en:
    description: Huawei Mobile Services (HMS) opens this Activity when a service flow needs a temporary
      screen and a result returned to the app.
    disableEffect: HMS flows that use this screen cannot complete or return their result when it is disabled.
  zh-CN:
    description: 华为移动服务（HMS）的某项服务需要打开临时页面并将操作结果返回应用时，会启动此 Activity。
    disableEffect: 停用后，依赖此页面的 HMS 服务流程无法完成或返回结果。
