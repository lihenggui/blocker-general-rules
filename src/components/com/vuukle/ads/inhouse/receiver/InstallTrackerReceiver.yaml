i18n:
  en:
    description: When Google Play sends an install-referral broadcast, this Vuukle receiver reads its
      click ID and records it for in-house ad attribution.
    disableEffect: Vuukle will not receive these install click IDs, so install attribution is lost.
  zh-CN:
    description: Google Play 发送安装来源广播时，此 Vuukle Receiver 会读取其中的点击 ID，并记录下来用于自有广告归因。
    disableEffect: 停用后，Vuukle 将无法收到这些安装点击 ID，因此会失去相应的安装归因数据。
