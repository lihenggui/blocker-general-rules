  en:
    description: LoKi's passcode-lock library opens this screen when a protected app requires the saved
      passcode. It checks attempts and temporarily locks further tries after repeated incorrect entries.
    disableEffect: Users will not be able to unlock the protected app through LoKi's passcode screen.
  zh-CN:
    description: LoKi 密码锁库在受保护的应用要求输入密码时打开此界面。它会验证密码，并在多次输入错误后暂时禁止继续尝试。
    disableEffect: 停用后，用户将无法通过 LoKi 密码界面解锁受保护的应用。
