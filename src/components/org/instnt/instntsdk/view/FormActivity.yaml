    description: The Instnt Android SDK opens this Activity when the app requests a configured identity
      form. It shows text, choice, checkbox, and date fields, then submits the entered values or reports
      cancellation or an error.
    disableEffect: If disabled, the app cannot collect or submit the Instnt form details.
  zh-CN:
    description: 应用请求显示身份验证表单时，Instnt Android SDK 会打开此 Activity。它显示文本、选项、复选框和日期字段，并提交填写内容或返回取消及错误结果。
    disableEffect: 停用后，应用无法收集或提交 Instnt 表单中的信息。
