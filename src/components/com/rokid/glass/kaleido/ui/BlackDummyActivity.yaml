i18n:
  en:
    description: If a Rokid Kaleido integration opens this activity, it shows a black screen on the extra
      glasses display while the related app is paused and closes when that app resumes.
    disableEffect: The generic black pause screen is unavailable, while Kaleido’s landscape and portrait
      pause screens remain available.
  zh-CN:
    description: 如果 Rokid Kaleido 集成直接打开此活动，它会在关联应用暂停时于眼镜的额外显示画面上显示黑屏，并在应用恢复后关闭。
    disableEffect: 停用后，通用黑屏暂停画面不可用；Kaleido 的横屏和竖屏暂停画面仍可使用。
