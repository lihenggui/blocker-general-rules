i18n:
  en:
    description: When the device finishes booting, this Ogury (Presage) Receiver sends a startup signal
      to the SDK's background ad and analytics work.
    disableEffect: Ogury will miss this background signal for its ads and analytics; the app's own features
      remain available.
  zh-CN:
    description: 设备启动完成时，Ogury（Presage）接收器会向 SDK 的广告和统计后台任务发送启动信号。
    disableEffect: 禁用后，Ogury 将无法收到这类广告和统计后台信号；应用本身的功能仍可使用。
