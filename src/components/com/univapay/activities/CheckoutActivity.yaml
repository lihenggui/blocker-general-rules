i18n:
  en:
    description: Univapay’s Android checkout widget opens this screen when the app starts a payment. It
      loads the enabled payment methods, presents the checkout forms, and sends success or failure results
      back to the app.
    disableEffect: Users cannot complete payments through Univapay from the app.
  zh-CN:
    description: 应用发起付款时，Univapay Android 收银台组件会打开此界面。它会加载已启用的付款方式、展示收银台表单，并将成功或失败结果返回应用。
    disableEffect: 停用后，用户无法在应用中通过 Univapay 完成付款。
