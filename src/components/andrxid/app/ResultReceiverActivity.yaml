i18n:
  en:
    description: When an app uses Suckgamony's Andrxid library to open another screen and wait for a result,
      this transparent Activity receives that result and returns it to the app.
    disableEffect: App actions that depend on results from screens opened through Andrxid may not complete.
  zh-CN:
    description: 应用通过 Suckgamony 的 Andrxid 打开另一个界面并等待返回结果时，此透明 Activity 会接收结果并交还给应用。
    disableEffect: 依赖 Andrxid 获取其他界面返回结果的操作可能无法完成。
