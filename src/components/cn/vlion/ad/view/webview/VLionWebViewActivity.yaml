i18n:
  en:
    description: After a VLion ad is clicked or its video ends, this screen displays the ad's HTML end
      page or landing page and handles links the viewer taps.
    disableEffect: VLion ad end cards and landing pages will not open, though the host app's regular screens
      can continue to work.
  zh-CN:
    description: 用户点击 VLion 广告或视频播放结束后，此界面会显示广告的 HTML 结束页或落地页，并处理用户点击的链接。
    disableEffect: VLion 广告结束页和落地页将无法打开，但宿主应用的常规界面仍可继续使用。
