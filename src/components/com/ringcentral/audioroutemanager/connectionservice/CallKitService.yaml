i18n:
  en:
    description: RingCentral RCV asks Android Telecom to create incoming and outgoing call connections
      for calls managed by the SDK. It supplies caller details and connects Android’s call interface to
      the RingCentral call session.
    disableEffect: Calls that rely on RingCentral’s Android Telecom integration may fail to appear or
      connect.
  zh-CN:
    description: RingCentral RCV 会通过 Android Telecom 为 SDK 管理的来电和去电创建通话连接，并提供来电信息，将 Android 通话界面接入 RingCentral
      通话会话。
    disableEffect: 依赖 RingCentral Android Telecom 集成的通话可能无法显示或接通。
