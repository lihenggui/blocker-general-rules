    description: Scanto Vision Search 会打开相机界面扫描条码，或根据拍摄的图像进行搜索。它会发送图像进行视觉搜索，并可将匹配结果返回应用。
    disableEffect: 停用后，应用将无法使用 Scanto Vision Search 扫描条码或搜索图像。
