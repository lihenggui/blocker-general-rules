i18n:
  en:
    description: Xiaomi Mi Push sends registration results, notification arrivals or clicks, and call
      messages to this EngageLab receiver. It forwards those events to EngageLab’s push or call handling.
    disableEffect: Xiaomi-delivered EngageLab notifications stop, and apps that rely on its call messages
      may miss incoming calls.
  zh-CN:
    description: Xiaomi Mi Push 会将注册结果、通知到达或点击以及通话消息发送给此 EngageLab 接收器；接收器会转交给 EngageLab 的推送或通话处理流程。
    disableEffect: Xiaomi 渠道的 EngageLab 通知将停止；依赖此通话消息的应用可能无法收到来电。
