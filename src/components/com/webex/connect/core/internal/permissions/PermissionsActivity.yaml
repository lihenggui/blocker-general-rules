i18n:
  en:
    description: When Webex Connect needs runtime permissions, this Activity explains the request, asks
      the user, and sends the grant or denial result back to the SDK. It can direct users to Settings
      when a permission remains blocked.
    disableEffect: Permission-dependent Webex Connect features may stop working because the SDK cannot
      complete their permission requests.
  zh-CN:
    description: Webex Connect 需要运行时权限时，此 Activity 会说明请求原因、向用户申请权限，并将授权或拒绝结果返回 SDK；权限仍被阻止时也可引导用户前往设置。
    disableEffect: 由于 SDK 无法完成权限请求，需要这些权限的 Webex Connect 功能可能无法使用。
