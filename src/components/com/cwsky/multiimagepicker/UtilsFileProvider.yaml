  en:
    description: This startup provider supports CWSky's Multiple Image Picker, which lets users choose
      photos and makes configured app, cache and media files available through private content links.
    disableEffect: Without it, the photo-picker view cannot calculate its layout from the app's screen
      settings and can fail to open.
  zh-CN:
    description: 这个启动 Provider 为 CWSky Multiple Image Picker 提供支持，供用户选择照片，并通过私有内容链接提供已配置的应用、缓存和媒体文件。
    disableEffect: 停用后，照片选择页面无法从应用的屏幕设置计算布局，可能无法打开。
