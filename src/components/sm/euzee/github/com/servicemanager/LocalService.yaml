recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:55:18Z'
i18n:
  en:
    description: Euzee's serviceManager library starts this Service for short background tasks submitted
      by the app. It lets those requested actions run while the app is not on screen.
    disableEffect: Background actions that rely on this Service may not run, so the related feature or
      update can stop working.
  zh-CN:
    description: Euzee 的 serviceManager 工具会为应用提交的短时后台任务启动此 Service。即使应用当前没有显示在屏幕上，这些任务也能继续执行。
    disableEffect: 依赖此 Service 的后台操作可能无法运行，相关功能或更新也可能停止。
