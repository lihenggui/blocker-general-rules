i18n:
  en:
    description: DirectOne Smarkio Push receives Firebase messages through this Service and turns notification
      messages into system notifications. It can include category-specific buttons and links configured
      for the message.
    disableEffect: New DirectOne push messages will no longer appear as notifications or offer their configured
      buttons.
  zh-CN:
    description: DirectOne Smarkio Push 通过此 Service 接收 Firebase 消息，并将通知消息显示为系统通知。通知还可包含为该消息配置的分类按钮和链接。
    disableEffect: 停用后，新的 DirectOne 推送消息将不再显示为通知，也不会提供配置的按钮。
