  en:
    description: When an app requests image or video selection, ImageSelect shows a media picker where
      users can choose from storage or capture media, then returns the results to the app.
    disableEffect: The app cannot use ImageSelect to choose or capture photos and videos.
  zh-CN:
    description: 应用发起图片或视频选择时，ImageSelect 会显示媒体选择器；用户可从存储中选择或拍摄媒体，完成后结果会返回应用。
    disableEffect: 应用将无法通过 ImageSelect 选择或拍摄照片和视频。
