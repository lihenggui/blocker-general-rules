recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:32:08Z'
i18n:
  en:
    description: Vanadium Android starts this screen when an app asks it to create a Vanadium identity
      blessing; it lets the user choose or approve a Google account, then retrieves and returns the identity
      credentials.
    disableEffect: Vanadium identity approval and credential setup will fail, so features that depend
      on that login cannot complete.
  zh-CN:
    description: 应用请求创建 Vanadium 身份凭据时，Vanadium Android SDK 会打开此页面，让用户选择或确认 Google 账号，再获取并返回身份凭据。
    disableEffect: 禁用后，Vanadium 身份授权和凭据创建无法完成，依赖这些登录信息的功能也会失败。
