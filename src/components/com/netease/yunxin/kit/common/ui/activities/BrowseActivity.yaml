i18n:
  en:
    description: The NetEase Yunxin (CommsEase) common UI SDK opens this screen when the app shows a web
      page in its in-app browser. It provides a title bar and back navigation, and sends other kinds of
      links to an app that can open them.
    disableEffect: Web pages that rely on the Yunxin in-app browser will not open.
  zh-CN:
    description: NetEase Yunxin（CommsEase）通用 UI SDK 会在应用需要以内置浏览器打开网页时显示此界面。界面提供标题栏和返回浏览功能；其他类型的链接会交给能够处理它们的应用打开。
    disableEffect: 停用后，依赖 Yunxin 内置浏览器打开的网页将无法打开。
