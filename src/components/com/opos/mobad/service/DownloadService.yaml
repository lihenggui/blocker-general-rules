recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: OPPO HeyTap Mobad runs this background service when an ad needs a file or app download.
      It manages the download notification and can pass a downloaded app to Android’s installer.
    disableEffect: OPPO Mobad ad downloads and their install actions will stop; the app’s non-ad features
      remain available.
  zh-CN:
    description: OPPO HeyTap Mobad 会在广告需要下载文件或应用时运行此后台服务；它管理下载通知，也可将下载的应用交给 Android 安装。
    disableEffect: OPPO Mobad 的广告下载和安装操作将停止，应用的非广告功能仍可使用。
