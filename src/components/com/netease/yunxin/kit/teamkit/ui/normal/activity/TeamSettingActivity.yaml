i18n:
  en:
    description: The NetEase Yunxin TeamKit Activity opens a team chat’s settings page, with controls
      for chat notices, muting and pinning, team details, members, and manager settings. Owners can also
      leave or dismiss the team from the available controls.
    disableEffect: Users lose this page’s team-chat settings and its shortcuts to member, manager, and
      team details.
  zh-CN:
    description: 网易云信 TeamKit 的此 Activity 会打开群聊设置，提供消息提醒、免打扰和置顶选项，以及群信息、成员和管理员页面入口；群主还可使用相应的退群或解散群组功能。
    disableEffect: 停用后，用户将无法使用此页面的群聊设置，也无法从这里进入成员、管理员和群信息页面。
