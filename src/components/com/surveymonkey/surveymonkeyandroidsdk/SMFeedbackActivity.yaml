i18n:
  en:
    description: The SurveyMonkey Mobile Feedback SDK opens this Activity when the app starts an in-app
      feedback survey. It displays the supplied survey and returns the respondent's answers or a cancellation
      or error result to the app.
    disableEffect: The app cannot show its SurveyMonkey feedback form or receive the user's answers through
      this SDK.
  zh-CN:
    description: 应用启动内置反馈问卷时，SurveyMonkey Mobile Feedback SDK 会打开此 Activity 显示问卷，并将用户的回答、取消或错误结果返回给应用。
    disableEffect: 停用后，应用无法通过此 SDK 显示 SurveyMonkey 反馈问卷或接收用户回答。
