i18n:
  en:
    description: Android starts this Ogury (Presage) Service for scheduled SDK work. It processes the
      task and tells Android when the job is finished.
    disableEffect: Disabling it stops or limits Ogury's background ad and analytics work; the host app's
      own screens and features remain available.
  zh-CN:
    description: Android 会为定时 SDK 任务启动此 Ogury（Presage）服务。它处理任务，并在完成后通知 Android。
    disableEffect: 禁用后，Ogury 的广告和统计后台任务会停止或受限；应用本身的界面和功能仍可使用。
