  en:
    description: The Sina Weibo Android SDK declares this private file provider, and YYXX Game's common-share
      SDK bundles the same class. Its configured paths let sharing flows pass local image or attachment
      files to another app.
    disableEffect: Weibo or YYXX sharing that attaches local files may fail because those files can no
      longer be handed to the receiving app.
  zh-CN:
    description: Sina Weibo Android SDK 声明了此私有文件提供器，YYXX Game 的通用分享 SDK 也打包了同一个类。它按配置的路径让分享流程将本地图片或附件交给其他应用。
    disableEffect: Weibo 或 YYXX 分享本地文件时可能失败，因为这些文件无法再提供给接收应用。
