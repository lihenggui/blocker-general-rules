i18n:
  en:
    description: When a user opens a vendor from Fidzup Android CMP's vendor list, this screen shows the
      vendor's purposes and features. It also opens the vendor's policy when a policy link is available.
    disableEffect: Disabling it prevents users from inspecting a vendor's stated purposes and features
      or reaching its linked policy from Fidzup's interface.
  zh-CN:
    description: 用户从 Fidzup Android CMP 的供应商列表打开某个供应商时，此页面会显示该供应商涉及的用途和功能；若有政策链接，也可从此处打开。
    disableEffect: 停用后，用户无法在 Fidzup 界面中查看供应商所列的用途和功能，也无法打开其政策链接。
