i18n:
  en:
    description: HelpCrunch's provider runs automatically at app startup and initializes the chat SDK
      with the host app context. This prepares the support chat and related HelpCrunch features for use.
    disableEffect: The app will lose HelpCrunch's automatic startup initialization, so its support chat
      and related features may not start.
  zh-CN:
    description: HelpCrunch 提供程序会在应用启动时自动运行，并使用宿主应用上下文初始化聊天 SDK，为使用客服聊天和相关功能做准备。
    disableEffect: 应用将失去 HelpCrunch 的自动启动初始化，客服聊天及相关功能可能无法启动。
