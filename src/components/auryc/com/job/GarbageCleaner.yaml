i18n:
  en:
    description: The Auryc Android SDK schedules this job to remove local records and files for sessions
      whose event data and replay videos have already been uploaded. It runs in the background as part
      of Auryc’s data cleanup.
    disableEffect: Auryc will retain uploaded session records and files longer, which may use more device
      storage.
  zh-CN:
    description: Auryc Android SDK 会安排此任务清理事件数据和回放视频均已上传的会话记录及本地文件，这是 Auryc 的后台数据清理工作。
    disableEffect: Auryc 会更久地保留已上传的会话记录和文件，可能占用更多设备存储空间。
