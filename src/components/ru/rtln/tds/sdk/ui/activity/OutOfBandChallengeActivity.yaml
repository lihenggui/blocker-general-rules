i18n:
  en:
    description: The Tinkoff Acquiring 3-D Secure SDK opens this Activity when a card issuer asks the
      shopper to confirm a payment through a separate channel. It displays the issuer's instructions and
      returns the confirmation to the payment flow.
    disableEffect: Payments that require this separate confirmation cannot be authenticated and may fail.
  zh-CN:
    description: 发卡行要求用户通过其他渠道确认付款时，Tinkoff 收单 3-D Secure SDK 会打开此 Activity。它显示发卡行提供的确认说明，并把确认结果交回支付流程。
    disableEffect: 需要此额外确认的付款将无法完成身份验证，可能会失败。
