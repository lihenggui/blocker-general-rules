i18n:
  en:
    description: The Sobot album library opens this screen when photo, video, or mixed-media selection
      starts. It lists matching items on the device, can offer camera capture, and returns the chosen
      files.
    disableEffect: Users will not be able to choose photos or videos through this Sobot media picker,
      including its camera fallback.
  zh-CN:
    description: 开始选择照片、视频或混合媒体时，Sobot 相册库会打开此界面。它会列出设备中的匹配内容，可提供相机拍摄，并返回所选文件。
    disableEffect: 停用后，用户将无法通过 Sobot 媒体选择器选择照片或视频，也无法使用其中的相机备用入口。
