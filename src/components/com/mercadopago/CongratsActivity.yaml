i18n:
  en:
    description: Mercado Pago Android SDK opens this Activity after a payment is approved. It shows the
      success summary, payment details, receipt number when available, and any configured review items.
    disableEffect: The buyer will lose the SDK’s payment-success and receipt screen, including any review
      action shown there.
  zh-CN:
    description: 付款获批后，Mercado Pago Android SDK 会打开此 Activity。它会显示付款成功摘要、付款详情、可用的收据编号以及配置的检查项目。
    disableEffect: 用户将看不到 SDK 的付款成功和收据页面，也无法使用该页面中的检查操作。
