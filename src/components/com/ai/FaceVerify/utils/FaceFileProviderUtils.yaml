i18n:
  en:
    description: AnyLife's face verification SDK uses this Android file provider to make files in the
      app's configured folders available through temporary file links. The SDK can request these links
      when a verification step needs a file.
    disableEffect: Face-verification steps that need to read or share one of these files may fail.
  zh-CN:
    description: AnyLife 人脸验证 SDK 使用此 Android 文件提供程序，通过临时文件链接提供应用已配置目录中的文件；验证步骤需要文件时会使用这些链接。
    disableEffect: 停用后，需要读取或共享这些文件的人脸验证步骤可能失败。
