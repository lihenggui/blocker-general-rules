i18n:
  en:
    description: When the Yongzheng7 SAOP library needs a runtime permission, this Activity shows the
      Android permission prompt and returns whether access was granted. Disabling it can stop features
      that need those permissions.
    disableEffect: The app may be unable to request required permissions, preventing the related camera,
      location, or other feature from working.
  zh-CN:
    description: Yongzheng7 SAOP 库需要运行时权限时，此 Activity 会显示 Android 权限请求并返回授权结果。停用后，依赖这些权限的功能可能无法使用。
    disableEffect: 应用可能无法申请所需权限，导致相机、定位或其他相关功能无法运行。
