  en:
    description: When a user dismisses a Pulsate notification, this receiver records the dismissal and
      updates the SDK's notification feed.
    disableEffect: Pulsate will stop recording notification dismissals and keeping its feed in sync after
      a dismissal.
  zh-CN:
    description: 用户关闭 Pulsate 通知时，此接收器会记录关闭事件并更新 SDK 的通知动态。
    disableEffect: 停用后，Pulsate 将无法记录通知关闭事件或在关闭后同步动态内容。
