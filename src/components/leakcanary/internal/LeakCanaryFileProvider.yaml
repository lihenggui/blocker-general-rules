    description: This Square LeakCanary provider creates controlled file links for memory-leak reports
      and opens those files when LeakCanary shares or displays them.
    disableEffect: LeakCanary reports can no longer open or share their saved files; the host app’s normal
      features remain available.
  zh-CN:
    description: 这个 Square LeakCanary 提供程序会为内存泄漏报告创建受控文件链接，供 LeakCanary 打开或分享相关文件。
    disableEffect: 禁用后，LeakCanary 将无法打开或分享已保存的报告文件，但宿主应用的日常功能仍可使用。
