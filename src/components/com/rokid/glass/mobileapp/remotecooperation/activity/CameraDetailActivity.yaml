i18n:
  en:
    description: Rokid Remote Cooperation opens this page when a participant's camera is selected in a
      meeting. It shows that participant's video and provides camera controls, shared annotations, and
      document upload for the call.
    disableEffect: Users cannot open a participant's camera detail page or use its camera, annotation,
      and document-sharing controls.
  zh-CN:
    description: 在会议中选择某位参与者的摄像头画面时，Rokid Remote Cooperation 会打开此页面。页面显示对方的视频，并提供摄像头控制、共享标注和文档上传功能。
    disableEffect: 用户无法打开参与者的摄像头详情页，也无法使用其中的摄像头、标注和文档共享功能。
