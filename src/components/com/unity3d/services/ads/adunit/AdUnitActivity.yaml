i18n:
  en:
    description: Unity Ads opens this full-screen Activity to render an ad, such as an interstitial or
      rewarded video. It hosts the ad content and relays screen events to Unity’s ad player.
    disableEffect: Unity Ads will not display; users will not receive rewards for watching Unity rewarded
      ads.
  zh-CN:
    description: Unity Ads 展示插屏或奖励视频时会打开此全屏界面。它承载广告内容，并把界面状态交给 Unity 广告播放器处理。
    disableEffect: 屏蔽后，Unity Ads 将无法显示；观看 Unity 奖励广告也不会获得奖励。
