i18n:
  en:
    description: When Google Play changes the status of extra content being downloaded for an app, this
      receiver passes the update to background processing so the app can show progress and finish the
      download.
    disableEffect: Asset-pack progress and background completion handling may stop working.
  zh-CN:
    description: Google Play 更新应用额外内容的下载状态时，此接收器会把更新交给后台处理，让应用显示进度并完成下载。
    disableEffect: 资源包进度和后台完成处理可能停止工作。
