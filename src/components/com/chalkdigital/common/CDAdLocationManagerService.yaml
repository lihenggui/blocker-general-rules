i18n:
  en:
    description: Chalk Digital's CD Ads SDK starts this foreground service for one-time or ongoing location
      updates and address lookups. Android shows a location notification while it runs.
    disableEffect: CD Ads will stop receiving location updates for its location-based ad features.
  zh-CN:
    description: Chalk Digital 的 CD Ads 广告 SDK 会启动此定位前台服务，获取一次性或持续的位置更新及地址信息；服务运行时 Android 会显示位置通知。
    disableEffect: 停用后，CD Ads 的位置相关广告将无法收到位置更新。
