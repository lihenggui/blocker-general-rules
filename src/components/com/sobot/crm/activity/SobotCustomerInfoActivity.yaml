  en:
    description: The Sobot CRM SDK opens this screen from a customer list or merge review to show a customer's
      profile and contact records. When available, it also offers profile editing and calling.
    disableEffect: Agents will lose access to customer details and contact records in Sobot CRM, including
      its in-screen edit and call actions.
  zh-CN:
    description: 客服人员从客户列表或合并核对页面打开此界面后，可以查看客户资料和联系记录；符合条件时还可编辑资料或拨打电话。
    disableEffect: 停用后，客服人员将无法在 Sobot CRM 中查看客户详情和联系记录，也不能使用其中的编辑和拨号操作。
