recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:48:26Z'
i18n:
  en:
    description: Appfigurate starts this Provider during app startup to prepare the app runtime configuration
      and feature settings. It loads the app-specific configuration before those settings are used.
    disableEffect: Features that read Appfigurate configuration may fail or be unavailable because the
      settings are not initialized.
  zh-CN:
    description: Appfigurate 会在应用启动时运行此 Provider，以准备应用的运行时配置和功能设置，并在这些设置被使用前加载应用专属配置。
    disableEffect: 停用后，依赖 Appfigurate 配置的功能可能无法使用，或因设置未初始化而出错。
