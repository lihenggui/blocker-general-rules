  en:
    description: The OPPO HeyTap Mobad SDK starts or binds this background service during ad work. It
      has no screen and handles the SDK’s service lifecycle.
    disableEffect: Mobad’s ad work that relies on this service will stop, while non-ad app functions remain
      available.
  zh-CN:
    description: OPPO HeyTap Mobad SDK 会在广告流程中启动或绑定此后台服务；它不显示界面，负责承接 SDK 的服务生命周期。
    disableEffect: 依赖此服务的 Mobad 广告流程将停止，应用的非广告功能仍可使用。
