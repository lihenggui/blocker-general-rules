i18n:
  en:
    description: When an app records data from a Wear OS device, GeoTecINIT WearOS Sensors starts this
      service and routes the background recording through its wearable-sensor collector.
    disableEffect: The app will no longer record sensor readings from its Wear OS device through this
      service.
  zh-CN:
    description: 应用记录 Wear OS 设备的数据时，GeoTecINIT WearOS Sensors 会启动此服务，并通过可穿戴设备的传感器采集器执行后台记录。
    disableEffect: 停用后，应用将无法通过此服务记录 Wear OS 设备的传感器数据。
