i18n:
  en:
    description: The Aniways Android SDK opens this screen from its conversation controls so users can
      change automatic and contextual suggestions and the inline icon size. Disabling it removes these
      user-facing settings.
    disableEffect: Users cannot open Aniways settings to change suggestion behavior or icon size, and
      an attempt to open the screen can fail.
  zh-CN:
    description: 用户从 Aniways 对话控件打开此设置页后，可以调整自动建议、上下文建议和消息内图标大小。禁用后，这些面向用户的设置将无法使用。
    disableEffect: 用户无法打开 Aniways 设置来调整建议行为或图标大小，尝试进入此页也可能失败。
