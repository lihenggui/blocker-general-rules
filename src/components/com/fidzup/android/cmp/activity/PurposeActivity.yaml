  en:
    description: When opened with a purpose and its current consent choice, Fidzup Android CMP shows the
      purpose name and description with a switch. It returns the user's updated choice when they leave.
    disableEffect: Disabling it prevents users from viewing or changing an individual purpose from its
      detail screen.
  zh-CN:
