i18n:
  en:
    description: When the app opens the RedMadRobot Debug Panel, this Activity displays the diagnostic
      tools registered by the app. It is launched from the panel's debug controls or notification.
    disableEffect: The RedMadRobot diagnostic panel cannot be opened, while the app's ordinary screens
      remain available.
  zh-CN:
    description: 当应用打开 RedMadRobot Debug Panel 时，此 Activity 会显示应用注册的诊断工具。它可从面板的调试入口或通知中打开。
    disableEffect: 停用后，RedMadRobot 诊断面板无法打开，应用的普通页面仍可使用。
