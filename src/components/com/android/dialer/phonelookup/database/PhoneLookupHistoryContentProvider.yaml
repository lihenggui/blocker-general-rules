  en:
    description: 'ContentProvider for the PhoneLookupHistory. Operations may run against the entire table
      using the URI: <pre> content://com.android.dialer.phonelookuphistory/PhoneLookupHistory </pre> Or
      against an individual row keyed by normalized number where the number is the last component in the
      URI path, for example: <pre> content://com.android.dialer.phonelookuphistory/PhoneLookupHistory/+11234567890
      </pre>'
