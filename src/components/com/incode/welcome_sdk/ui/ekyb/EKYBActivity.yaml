i18n:
  en:
    description: When a flow verifies a business, this screen collects business details such as its name,
      country, address, and tax number, then submits them for checking. The MetaMap identity verification
      SDK opens this screen when the configured flow reaches this step.
    disableEffect: Disabling it prevents business-verification flows from collecting and submitting the
      required details.
  zh-CN:
    description: 核验流程验证企业时，此页面会收集企业名称、国家、地址和税号等信息并提交检查。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，企业核验流程无法收集并提交所需信息。
