  en:
    description: WGT Ads (WGT) opens this full-screen page when it displays a site ad. It loads the ad,
      records viewing and click events, and reports completion after the countdown for rewarded formats.
    disableEffect: Full-screen ads will not open, and rewards for watching ads will no longer be granted.
  zh-CN:
    description: 显示站点广告时，WGT Ads（WGT）会打开此全屏页面。它加载广告并记录观看和点击情况；对于激励广告，倒计时结束后会报告观看完成。
    disableEffect: 全屏广告将无法打开，观看广告的奖励也将不再发放。
