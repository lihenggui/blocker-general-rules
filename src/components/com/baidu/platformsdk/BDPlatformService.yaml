recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:32:20Z'
i18n:
  en:
    description: Baidu Game SDK starts this short background Service during a platform-session keep-alive
      check while the app is active. It stops itself after the check returns.
    disableEffect: The SDK may stop refreshing its background session; the game's own features remain
      available.
  zh-CN:
    description: 百度游戏 SDK 会在应用运行期间通过此短暂后台 Service 检查并维持平台会话。检查返回后 Service 会自行停止。
    disableEffect: SDK 可能不再刷新后台平台会话，游戏自身功能仍可使用。
