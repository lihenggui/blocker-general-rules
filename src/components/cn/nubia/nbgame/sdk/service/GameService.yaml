i18n:
  en:
    description: Nubia Game SDK starts this Service to receive results for initialization, login, account
      switching, profile changes, password recovery, logout, identity checks, and exit requests. It returns
      those results to the game.
    disableEffect: The game's Nubia login, account, identity-check, profile, and session callbacks will
      stop working.
  zh-CN:
    description: 努比亚游戏 SDK 会通过此 Service 接收初始化、登录、切换账号、修改资料、找回密码、注销、实名验证和退出请求的结果，并将结果回传给游戏。
    disableEffect: 游戏中的努比亚登录、账号、实名验证、资料和会话回调将无法正常工作。
