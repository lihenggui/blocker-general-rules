i18n:
  en:
    description: The NetEase Yunxin IM SDK starts this auxiliary Service in its background process to
      help keep messaging available; Android may restart it after it stops.
    disableEffect: The SDK loses this background keep-alive path, which may interrupt message delivery
      while the app is closed.
  zh-CN:
    description: 网易云信 IM SDK 会在后台进程中启动这个辅助 Service，以维持消息服务可用；服务停止后，Android 可能会重新启动它。
    disableEffect: SDK 的这条后台保活路径会失效，应用关闭时的消息传递可能中断。
