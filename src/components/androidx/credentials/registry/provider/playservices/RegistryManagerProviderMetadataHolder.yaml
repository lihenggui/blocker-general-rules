i18n:
  en:
    description: The AndroidX Credentials Registry Play Services integration uses this Service to advertise
      the Play Services-backed credential registry to Credential Manager. That registry handles an app
      registering or clearing digital credentials and their sign-in options.
    disableEffect: Apps that rely on this integration may lose digital credential registration and cleanup.
  zh-CN:
    description: AndroidX 凭据注册表的 Play 服务集成通过此 Service 向凭据管理器提供 Play 服务凭据注册表。该注册表负责应用注册或清除数字凭据及其登录选项。
    disableEffect: 依赖此集成的应用可能无法注册或清除数字凭据。
