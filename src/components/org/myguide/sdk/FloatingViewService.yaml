  en:
    description: The MyGuide (EdCast) guide SDK starts this service to show a movable shortcut while guides
      are available. Tapping the shortcut opens the guide home screen for signed-in users.
    disableEffect: Disabling it removes the floating shortcut used to open MyGuide guides.
  zh-CN:
    description: MyGuide（EdCast）指南 SDK 会启动此服务，在有可用指南时显示可移动的快捷入口。已登录用户点按入口后可打开指南主页。
    disableEffect: 停用后，用于打开 MyGuide 指南的悬浮入口将不可用。
