    description: Bouncer between work activities and the activity used to confirm credentials before unlocking
      a managed profile. Shows a solid color when started, based on the organization color of the user
      it is supposed to be blocking. Once focused, it switches to a screen to confirm credentials and
      auto-dismisses if credentials are accepted.
