  en:
    description: The visibledebugtool library by snaps-eddy uses this Service for its floating log viewer.
      It displays app log messages and applies a keyword sent from the viewer's search screen.
    disableEffect: The visibledebugtool floating log panel and its keyword filtering will be unavailable.
