i18n:
  en:
    description: The Aranea Apps async runners library starts this service to run queued background tasks.
      Libraries that use it, including REST clients, may depend on those tasks to complete network work.
    disableEffect: Queued background work handled by the Aranea Apps runner, including dependent network
      requests, may not complete.
  zh-CN:
    description: Aranea Apps 异步任务库会启动此服务来运行排队的后台任务。使用该库的 REST 客户端等组件可能依赖这些任务完成网络操作。
    disableEffect: Aranea Apps 任务运行器负责的后台工作（包括依赖它的网络请求）可能无法完成。
