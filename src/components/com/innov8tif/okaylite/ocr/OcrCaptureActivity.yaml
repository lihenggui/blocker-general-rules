    description: OkayID Lite (Innov8tif OCR SDK) opens the camera to read a Malaysian MyKad. It returns
      the recognized name, identity number, address and other card details, along with the card image.
    disableEffect: The app cannot read or return Malaysian identity-card details through OkayID Lite if
      this screen is disabled.
  zh-CN:
    description: OkayID Lite（Innov8tif OCR SDK）会打开相机读取马来西亚 MyKad 身份证，并向应用返回识别到的姓名、身份证号码、地址等信息以及证件图像。
    disableEffect: 停用后，应用无法通过 OkayID Lite 读取或返回马来西亚身份证信息。
