recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T03:22:18Z'
i18n:
  en:
    description: The MetaKeep Android SDK opens this Activity when the app begins browser-based authentication;
      it launches the sign-in page and returns the success or cancellation result to the app.
    disableEffect: MetaKeep authentication cannot complete, so app features that require that sign-in
      may be unavailable.
  zh-CN:
    description: 应用通过 MetaKeep Android SDK 发起浏览器认证时会打开此 Activity；它会启动登录页面，并将成功或取消结果交回应用。
    disableEffect: MetaKeep 认证无法完成，因此依赖该登录流程的应用功能可能无法使用。
