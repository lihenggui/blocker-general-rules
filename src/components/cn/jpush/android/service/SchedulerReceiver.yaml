    description: When a JPush notification is scheduled for later, Android sends an alarm here at the
      chosen time. The receiver asks JPush to display the delayed notification.
    disableEffect: JPush notifications scheduled for later will no longer appear at their scheduled time.
  zh-CN:
    description: JPush 通知被安排稍后显示时，Android 会在指定时间发送闹钟广播。此接收器会让 JPush 显示该通知。
    disableEffect: 延迟显示的 JPush 通知将无法在预定时间出现。
