i18n:
  en:
    description: 100ms.live Room Kit starts this foreground service during a call to keep the call active
      with an ongoing notification while the app is in the background. The notification can return the
      user to the meeting.
    disableEffect: Calls may be interrupted when the app moves to the background, and the ongoing call
      notification will be unavailable.
  zh-CN:
    description: 通话期间，100ms.live Room Kit 会启动此前台服务，在应用进入后台时维持通话并显示持续通知；用户可从通知返回会议。
    disableEffect: 停用后，应用进入后台时通话可能中断，持续通话通知也将不可用。
