i18n:
  en:
    description: The NHN ACE Adlib Activity plays a video ad, supports its tap and skip actions, and can
      grant the configured reward after the required viewing threshold.
    disableEffect: Video ads from Adlib will not play, and users will not receive rewards offered for
      watching them.
  zh-CN:
    description: NHN ACE Adlib 的此 Activity 会播放视频广告、处理点击和跳过操作，并可在达到要求的观看进度后发放配置的奖励。
    disableEffect: 停用后，Adlib 视频广告将无法播放，用户也无法获得观看这些广告的奖励。
