recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:23:19Z'
i18n:
  en:
    description: When Tencent TPNS needs its MQTT push channel, it starts this service to initialize the
      channel that carries push traffic.
    disableEffect: Disabling it prevents the TPNS MQTT channel from starting, so messages delivered through
      that channel may not arrive.
  zh-CN:
    description: 腾讯 TPNS 需要使用 MQTT 推送通道时，会启动这个服务来初始化承载推送消息的连接。
    disableEffect: 停用后，TPNS 的 MQTT 通道将无法启动，通过该通道发送的消息可能无法送达。
