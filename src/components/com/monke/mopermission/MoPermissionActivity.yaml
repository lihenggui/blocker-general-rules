recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:00:48Z'
i18n:
  en:
    description: ZhangQinhao's MoPermission library opens this Activity when an app requests normal or
      special permissions; it explains the request, launches Android's permission prompt or Settings,
      and returns the granted-permission list.
    disableEffect: The MoPermission request flow cannot return permission results, so features that need
      those permissions cannot use them through this library.
  zh-CN:
    description: 应用请求普通或特殊权限时，ZhangQinhao 的 MoPermission 权限库会打开此 Activity；它说明权限用途、启动 Android 权限提示或系统设置，并返回已授予权限列表。
    disableEffect: MoPermission 无法返回权限申请结果，因此依赖这些权限的应用功能无法通过此库使用。
