i18n:
  en:
    description: The PoloBustillo Document Scanner library opens this camera screen when the app starts
      a scan. It captures one or more pages, detects document edges, lets the user adjust the crop, and
      returns the cropped images.
    disableEffect: The app cannot open this document scanning flow, so users cannot scan and return documents
      through this library.
  zh-CN:
    description: 应用开始扫描时，PoloBustillo 的 Document Scanner 库会打开此相机页面。它可以拍摄一页或多页文档、识别文档边缘、让用户调整裁剪范围，并返回裁剪后的图像。
    disableEffect: 应用将无法打开此文档扫描流程，用户也无法通过该库扫描并返回文档。
