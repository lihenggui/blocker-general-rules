i18n:
  en:
    description: DEUNA’s payment SDK opens this Activity to load a hosted Elements page during checkout.
      It displays the page inside the app and returns its events to the app.
    disableEffect: The app’s DEUNA Elements page will not open, so checkout steps that use it may fail.
  zh-CN:
    description: DEUNA 支付 SDK 会在结账过程中打开此 Activity 来加载托管的 Elements 页面。页面显示在应用内，其操作事件会返回给应用。
    disableEffect: 停用后，应用的 DEUNA Elements 页面无法打开，依赖它的结账步骤可能无法完成。
