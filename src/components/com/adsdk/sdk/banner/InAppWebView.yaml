i18n:
  en:
    description: MobFox's ad SDK opens the web page linked from a tapped ad in an in-app browser. Links
      to an app store or another external destination are handed to the phone.
    disableEffect: MobFox ad landing pages will not open; the app's other screens remain available.
  zh-CN:
    description: MobFox 广告 SDK 会在用户点按广告时于应用内打开广告网页；跳转到应用商店或其他外部目标的链接会交由手机打开。
    disableEffect: MobFox 广告落地页将无法打开，应用的其他界面仍可使用。
