recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: The Appbooster Android SDK opens this debug screen when its test launcher is used; testers
      can set or reset experiment variants saved by the SDK. Disabling it removes that testing control.
    disableEffect: Testers can no longer set or reset Appbooster experiment overrides from this debug
      screen.
  zh-CN:
    description: 使用 Appbooster Android SDK 的测试入口时会打开此调试界面，测试人员可设置或重置 SDK 保存的实验分组。禁用后，这项测试控制功能会消失。
    disableEffect: 测试人员将无法通过此调试界面设置或重置 Appbooster 实验覆盖项。
