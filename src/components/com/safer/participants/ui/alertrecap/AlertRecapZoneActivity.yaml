i18n:
  en:
    description: When a user asks for help at a festival, this Safer screen lists designated safe spaces
      so they can choose where they are and continue the request. It also opens the phone dialer for emergency
      numbers 15 and 18.
    disableEffect: Users cannot choose a safe-space location for a help request or open the emergency
      dialer from this screen.
  zh-CN:
    description: 用户在节庆活动中请求帮助时，Safer 会显示指定的安全区域，供用户选择所在位置并继续求助流程。此界面还可打开拨号器拨打 15 或 18 等紧急号码。
    disableEffect: 用户将无法为求助请求选择安全区域，也无法从此界面打开紧急拨号器。
