recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Baidu Navigation uses this file provider when it shares SDK files through Android file
      links that another app can open.
    disableEffect: Baidu Navigation file handoffs that depend on these links can fail, so sharing or opening
      SDK files may stop working.
  zh-CN:
    description: 百度导航 SDK 需要分享供其他应用打开的文件时，会通过此文件提供器生成 Android 文件链接。
    disableEffect: 停用后，依赖这些链接的百度导航文件传递可能失败，相关分享或打开操作可能无法使用。
