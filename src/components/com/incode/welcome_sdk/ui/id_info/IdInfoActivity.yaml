i18n:
  en:
    description: After text is read from an identity document, this screen lets the user review and, when
      allowed, correct details such as name, birth date, document number, and address. The MetaMap identity
      verification SDK opens this screen when the configured flow reaches this step.
    disableEffect: Disabling it prevents users from reviewing or correcting document details required
      for verification.
  zh-CN:
    description: 身份证件文字识别完成后，此页面让用户检查并在允许时修改姓名、出生日期、证件号码和地址等信息。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法检查或更正身份核验所需的证件信息。
