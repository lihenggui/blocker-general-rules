i18n:
  en:
    description: Xiaomi MiMo uses this Activity to run reward ads in mini-games. Depending on the ad,
      it shows playable content or a video.
    disableEffect: Reward videos will not play, and rewards for watching ads will no longer be granted.
  zh-CN:
    description: 小米 MiMo 会通过此界面在小游戏中播放激励广告。根据广告内容，界面会显示可互动广告或视频。
    disableEffect: 激励视频将无法播放，观看广告后也不会再发放奖励。
