i18n:
  en:
    description: When an app uses Dolby UXKit's system-call notifications, this startup Provider registers
      the service that maintains the active-call notification and its controls.
    disableEffect: The Dolby active-call service may not be registered, so its ongoing notification and
      controls may not appear.
  zh-CN:
    description: 应用使用 Dolby UXKit 的系统通话通知时，此启动 Provider 会注册维护当前通话通知及控制按钮的服务。
    disableEffect: Dolby 当前通话服务可能无法注册，因此持续通话通知和控制按钮可能不会显示。
