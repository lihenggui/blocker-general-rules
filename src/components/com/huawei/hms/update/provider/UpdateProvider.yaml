i18n:
  en:
    description: When Huawei HMS Core Installer retrieves an update, this provider lets the installer
      open downloaded update files for installation.
    disableEffect: Disabling it prevents the installer from reading update files through this provider,
      so update flows that use it fail.
  zh-CN:
    description: 华为 HMS Core Installer 获取更新后，会通过此 Provider 打开已下载的更新文件以便安装。
    disableEffect: 停用后，安装程序无法通过此 Provider 读取更新文件，依赖它的更新流程会失败。
