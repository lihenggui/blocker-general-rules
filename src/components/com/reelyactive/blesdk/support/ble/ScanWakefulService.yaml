i18n:
  en:
    description: When the ReelyActive BLE SDK requests another background scan cycle, this Service scans
      for nearby Bluetooth devices and then lets the phone return to sleep.
    disableEffect: Nearby-device scanning stops between scheduled scan cycles, so apps using ReelyActive
      proximity detection may miss updates.
  zh-CN:
    description: 当 ReelyActive BLE SDK 请求进行下一轮后台扫描时，此服务组件 会扫描附近的蓝牙设备，随后让手机恢复休眠。
    disableEffect: 停用后，定时扫描期间的附近设备检测会停止，使用 ReelyActive 近距离设备检测功能的应用可能无法收到更新。
