  en:
    description: When Huawei Push Kit delivers a push message or refreshes its token, this Mail.ru libnotify
      service passes the message or token to the notification SDK.
    disableEffect: libnotify notifications and token updates will stop arriving through Huawei Push Kit;
      other app features remain available.
  zh-CN:
    description: Huawei Push Kit 收到推送消息或更新推送令牌时，Mail.ru 的 libnotify 服务会将消息或令牌交给通知 SDK。
    disableEffect: libnotify 将无法通过 Huawei Push Kit 接收通知或令牌更新；应用的其他功能仍可使用。
