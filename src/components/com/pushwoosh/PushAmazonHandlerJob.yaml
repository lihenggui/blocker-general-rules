recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:20:24Z'
i18n:
  en:
    description: Pushwoosh's Amazon messaging service runs when Amazon Device Messaging delivers a push
      message or a registration result. It forwards the message and device registration changes to Pushwoosh.
    disableEffect: Pushwoosh will stop receiving messages and registration updates through Amazon Device
      Messaging.
  zh-CN:
    description: Amazon Device Messaging 送达推送消息或注册结果时，Pushwoosh 的亚马逊消息服务会运行，并把消息和设备注册变更交给 Pushwoosh 处理。
    disableEffect: Pushwoosh 将无法再通过 Amazon Device Messaging 接收消息和注册状态更新。
