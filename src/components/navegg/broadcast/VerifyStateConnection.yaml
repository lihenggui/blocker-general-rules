  en:
    description: When Android reports a connectivity change, the Navegg tracking SDK checks the connection
      and sends stored user, page-view, custom-event, and onboarding data when online.
    disableEffect: Queued Navegg tracking data may not be sent when connectivity returns.
  zh-CN:
    description: Android 报告网络连接状态变化时，Navegg 跟踪 SDK 会检查网络，并在联网后发送已保存的用户、页面浏览、自定义事件和引导数据。
    disableEffect: 停用后，网络恢复时排队等待的 Navegg 跟踪数据可能不会发送。
