i18n:
  en:
    description: When SmartMe Monitor's audio collection is enabled, this foreground service periodically
      sends microphone audio to ACRCloud for recognition and saves recognized matches with the last stored
      location.
    disableEffect: If disabled, SmartMe will no longer identify or record nearby sounds; the host app's
      other features remain available.
  zh-CN:
    description: 启用 SmartMe Monitor 的音频采集后，此前台服务会定期将麦克风音频发送给 ACRCloud 识别，并把识别结果与最近保存的位置一起记录。
    disableEffect: 禁用后，SmartMe 将不再识别或记录周围的声音；宿主应用的其他功能仍可使用。
