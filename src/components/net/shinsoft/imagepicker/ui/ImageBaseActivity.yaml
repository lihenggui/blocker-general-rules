recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:50:35Z'
i18n:
  en:
    description: Shinsoft ImagePicker uses this shared base Activity to style the status bar when its
      picker, crop, and preview screens are created; the library does not open it as a separate screen.
    disableEffect: Disabling its standalone manifest entry leaves the picker, crop, and preview screens
      available because each has its own Activity entry.
  zh-CN:
    description: Shinsoft ImagePicker 会在选择、裁剪和预览界面创建时通过此基础 Activity 设置状态栏样式；该库不会单独打开这个界面。
    disableEffect: 停用它单独的清单注册项后，选择、裁剪和预览界面仍可使用，因为这些界面各自有独立的 Activity 注册项。
