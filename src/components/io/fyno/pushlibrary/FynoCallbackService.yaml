recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:04:01Z'
i18n:
  en:
    description: When app-internal code starts this Fyno Push Library Service with an action string, it
      sends a broadcast with that same action and result data, then stops.
    disableEffect: If app code uses this relay, blocking it prevents the matching broadcast from reaching
      the app.
  zh-CN:
    description: 应用内部代码用操作字符串启动 Fyno Push Library 的此 Service 时，它会发出同名广播并附上该字符串作为结果数据，然后停止服务。
    disableEffect: 如果应用代码使用此转发服务，停用后相应广播将无法传递给应用。
