  zh-CN:
    description: Atome 商户 SDK 的应用内网页请求用户拍照时，会通过此 Provider 将临时照片安全地提供给网页。
    disableEffect: 停用后，Atome 中需要把新拍摄照片交给网页处理的流程将无法完成。
