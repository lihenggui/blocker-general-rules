i18n:
  en:
    description: The Android Image Cropper library from ArthurHub opens this screen when an app asks someone
      to select or crop a photo. It provides crop, rotate, and flip controls and returns the edited image
      to the app.
    disableEffect: Disabling it prevents photo workflows that rely on this library from completing a crop.
  zh-CN:
    description: ArthurHub 的 Android Image Cropper 图像裁剪库会在应用要求用户选择或裁剪照片时打开此页面。用户可裁剪、旋转或翻转照片，完成后图片会返回给应用。
    disableEffect: 停用后，依赖此库的照片编辑流程将无法完成裁剪。
