i18n:
  en:
    description: The linpopopo tool library starts this screen when an app requests runtime permissions
      through its permission helper; it shows Android's permission prompt and returns the results.
    disableEffect: Permission requests made through this library may not complete, so features that need
      them may be unavailable.
  zh-CN:
    description: 应用通过 linpopopo 的 tool 库请求运行时权限时会启动此界面；它显示 Android 权限提示并返回请求结果。
    disableEffect: 停用后，通过此库发起的权限请求可能无法完成，依赖这些权限的功能也可能无法使用。
