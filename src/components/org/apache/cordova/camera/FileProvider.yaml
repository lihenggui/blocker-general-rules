  en:
    description: Apache Cordova Camera uses this provider to give the camera app temporary access to the
      photo file when the user takes a picture.
    disableEffect: Taking a photo through the app’s Cordova camera feature can fail because the camera
      cannot write the image file.
  zh-CN:
    description: 用户拍照时，Apache Cordova Camera 会通过此提供程序临时允许相机应用写入照片文件。
    disableEffect: 相机应用无法写入照片文件，通过应用的 Cordova 相机功能拍照可能失败。
