    description: In Shinsoft ImagePicker, this Activity opens when a selected photo is sent for cropping;
      it lets the user adjust the crop and returns the saved image.
    disableEffect: Photo-cropping workflows that use Shinsoft ImagePicker will not open or return a cropped
      image.
  zh-CN:
    description: 在 Shinsoft ImagePicker 中，用户选择照片并进入裁剪流程时会打开此 Activity；用户调整裁剪区域后，它会保存并返回图片。
    disableEffect: 依赖 Shinsoft ImagePicker 的照片裁剪流程将无法打开，也无法返回裁剪后的图片。
