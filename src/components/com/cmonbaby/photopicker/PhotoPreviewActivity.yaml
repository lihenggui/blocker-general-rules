i18n:
  en:
    description: Cnmen Photo Selector opens this screen when an app asks to review selected images. Users
      can swipe through, remove or restore images, and save remote images to the gallery before returning
      the remaining selection.
    disableEffect: The app's image-review step cannot open, so users may be unable to confirm or edit
      selected photos.
  zh-CN:
    description: 应用需要检查已选图片时，Cnmen Photo Selector 会打开此预览界面。用户可以滑动查看、移除或恢复图片，也可以把远程图片保存到图库，然后返回剩余选择。
    disableEffect: 应用的图片预览步骤无法打开，用户可能无法确认或编辑已选照片。
