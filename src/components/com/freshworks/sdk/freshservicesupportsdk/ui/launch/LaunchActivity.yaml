i18n:
  en:
    description: Freshservice Support opens the support screen selected by the app, such as the dashboard,
      ticket list, issue report, service request, or approval requests. It runs when the app invokes one
      of those support options.
    disableEffect: Disabling it prevents the app from opening Freshservice support screens through the
      SDK.
  zh-CN:
    description: Freshservice Support 会打开应用所选的支持页面，例如控制台、工单列表、问题反馈、服务请求或审批请求。应用调用这些支持功能时会运行此页面。
    disableEffect: 禁用后，应用将无法通过 Freshservice Support 打开这些支持页面。
