i18n:
  en:
    description: Rokid Meeting opens this screen for live augmented-reality collaboration during a meeting.
      It uses the camera view to place arrows, circles, drawings, and images in the shared scene and exchanges
      those marks with other participants.
    disableEffect: Participants lose the shared AR scene and annotation tools in Rokid meetings.
  zh-CN:
    description: Rokid Meeting 会在会议中打开此实时增强现实协作画面。它使用摄像头画面在共享场景中放置箭头、圆圈、涂鸦和图片，并与其他参会者交换这些标注。
    disableEffect: 停用后，参会者无法使用 Rokid 会议中的共享增强现实场景和标注工具。
