i18n:
  en:
    description: AuthMe OCR opens this screen when users choose the country or region on an identity document.
      It returns that choice so the scan flow can offer matching document types.
    disableEffect: Users cannot choose a document country in AuthMe OCR flows that require this screen.
  zh-CN:
    description: 用户在 AuthMe OCR 中选择证件所属国家或地区时，会打开此界面。它返回所选地区，以便扫描流程提供对应的证件类型。
    disableEffect: 需要此界面的 AuthMe OCR 流程将无法选择证件所属国家或地区。
