i18n:
  en:
    description: VSee’s application SDK runs this receiver on a scheduled background alarm after login
      is initialized. It sends a connection check and schedules the next check.
    disableEffect: VSee may stop maintaining its background connection, so incoming calls or chats may
      be delayed when push notifications are unavailable.
  zh-CN:
    description: VSee 应用 SDK 会在登录初始化后，通过预定的后台闹钟运行此接收器。它会检查连接并安排下一次检查。
    disableEffect: VSee 可能不再维持后台连接；当推送通知不可用时，来电或聊天消息可能延迟。
