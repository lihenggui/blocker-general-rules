i18n:
  en:
    description: Pangle’s download manager opens this screen when Android requires approval to install
      an app downloaded from outside the app store; the user can continue or cancel.
    disableEffect: The ad’s APK installation prompt will not work, while the host app’s own features remain
      available.
  zh-CN:
    description: Android 要求授权安装从应用商店之外下载的应用时，穿山甲下载器会打开此页面，供用户继续或取消安装。
    disableEffect: 停用后，广告 APK 的安装提示无法工作，但宿主应用自身功能仍可使用。
