    name: BlueConic
    description: "## About\nBlueConic, Inc. is a privately-held e-marketing company that sells targeted\
      \ advertising through marketing management systems, or CDPs (Customer Data Platforms).  The company\
      \ has 50-100 employees and is headquartered in Boston, MA with a European office in Nijmegen, The\
      \ Netherlands. [For more information, see OpenCorporates.](https://opencorporates.com/companies/us_ma/001126438)\n\
      BlueConic's customers include the Boston Globe, Hearst Newspapers, Moen, T-Mobile, ING, America's\
      \ Test Kitchen, and the American Kennel Club.  [Source: website](https://www.blueconic.com/about/)\n\
      ## Ownership\nBlueConic was founded by Bart Heilbron and Martjin van Berkum in 2010. [Source: website](https://www.blueconic.com/about/)\n\
      ## What it does\n* Behavioral Analytics\n* Customer Data Platform (CDP) Marketing Management Systems\n\
      * Targeted Advertising/Personalization\n## Privacy Policy\n[Policy as of 1/11/2018, last updated\
      \ 1/11/2017:](https://www.blueconic.com/privacy-policy/)\n* BlueConic's privacy policy applies to\
      \ both its website and its services platform. It is not clear to what extent end users have rights\
      \ under the policy separate from clients.\n* Personal data is not defined in the policy.  It may\
      \ be used by  third party affiliates in the ordinary course of business, however, \"the use of information\
      \ collected through BlueConic Services Platform shall be limited to the purpose of providing the\
      \ service for which the Client has engaged BlueConic.\"\n* Infomation gathered may include \"Internet\
      \ Protocol (IP) addresses, browser type and language, Internet service provider (ISP), referring\
      \ and exit pages, operating system, date/time stamp, and other data\", including \"social networking\
      \ pages.\"  \n* BlueConic may \"share or publish aggregate information that doesn’t specifically\
      \ identify you, such as statistical information about visitors to our Websites or statistical information\
      \ about how customers use our applications.\"\n* The policy states that BlueConic will \"follow\
      \ generally accepted standards to protect the personal information submitted to us, both during\
      \ transmission and once it is received, including requiring our suppliers to meet such standards\
      \ to protect your personal data from unauthorized access, use, and disclosure. If you have questions\
      \ about the security of your personal data, you can contact us at info@blueconic.com. \"\n* BlueConic\
      \ has certified its compliance with the EU-U.S. Privacy Shield Framework and the Swiss-U.S. Privacy\
      \ Shield Framework."
    company: blueconic
