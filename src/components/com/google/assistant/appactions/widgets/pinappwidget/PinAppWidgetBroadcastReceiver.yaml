i18n:
  en:
    description: After Google Assistant completes a request to add a widget from the app, this receiver
      applies the supplied setup options to that widget. It belongs to the Google Assistant App Actions
      widgets library.
    disableEffect: The widget may miss its initial settings when users add it through Google Assistant.
  zh-CN:
    description: Google 助理完成将应用中的小组件添加到桌面的请求后，此接收器会为该小组件应用请求中提供的设置选项。它属于 Google 助理 App Actions 小组件库。
    disableEffect: 用户通过 Google 助理添加小组件时，它可能无法收到初始设置。
