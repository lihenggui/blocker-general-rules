i18n:
  en:
    description: PayU's Wibmo 3-D Secure helper opens this Activity when a card issuer requests an in-app
      authentication challenge, such as a one-time code or another response. It submits the user's answer
      to the issuer.
    disableEffect: The issuer's in-app card authentication may not complete.
  zh-CN:
    description: 发卡行要求在应用内完成验证挑战时，PayU 集成的 Wibmo 3-D Secure 辅助 SDK 会打开此 Activity，例如输入一次性验证码或其他响应。它会将用户的回答提交给发卡行。
    disableEffect: 停用后，发卡行的应用内银行卡验证可能无法完成。
