  en:
    description: When IDWise Device Intel Shield blocks an operation, this dialog displays the supplied
      title and explanation and stays open until Shield or the app closes it.
    disableEffect: Users may not see why the operation was blocked, and the Shield flow may fail when
      it expects this dialog.
  zh-CN:
    description: IDWise Device Intel Shield 阻止某项操作时，此对话框会显示传入的标题和说明，并保持打开，直到 Shield 或应用将其关闭。
    disableEffect: 用户可能看不到操作被阻止的原因，而依赖此对话框的 Shield 流程也可能失败。
