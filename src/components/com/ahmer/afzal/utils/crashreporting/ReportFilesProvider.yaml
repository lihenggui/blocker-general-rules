    description: AhmerUtils (Ahmer Afzal) provides screenshot and log files to the crash-report email
      flow so another app can attach them. It runs when the report shares those files.
    disableEffect: Crash reports will be unable to attach the saved screenshot and logs.
  zh-CN:
    description: AhmerUtils（Ahmer Afzal）会向崩溃报告邮件流程提供截图和日志文件，供其他应用作为附件读取；报告分享这些文件时会调用它。
    disableEffect: 崩溃报告将无法附加保存的截图和日志。
