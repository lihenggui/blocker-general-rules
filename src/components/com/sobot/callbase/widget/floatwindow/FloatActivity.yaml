i18n:
  en:
    description: Sobot CallBase, used by the Sobot customer-service call SDK, opens Android’s overlay-access
      settings when the call flow requests permission for a floating call window. After the user returns,
      it reports whether permission was granted.
    disableEffect: Without this screen, users cannot grant overlay access through the SDK, so its floating
      incoming or ongoing call window may not appear.
  zh-CN:
    description: Sobot 客服呼叫 SDK 使用的 CallBase 模块会在呼叫流程请求悬浮窗权限时打开 Android 悬浮窗设置；用户返回后，页面会反馈授权结果。
    disableEffect: 没有此页面，用户无法通过 SDK 授予悬浮窗权限，因此来电或通话悬浮窗可能无法显示。
