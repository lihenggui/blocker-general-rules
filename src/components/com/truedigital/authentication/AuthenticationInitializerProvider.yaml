i18n:
  en:
    description: TrueID SSO runs this provider as Android starts the app's content providers; it initializes
      the SDK and registers activity lifecycle hooks used by authentication.
    disableEffect: TrueID startup initialization and lifecycle handling do not run, so SSO or token flows
      can fail.
  zh-CN:
    description: Android 启动应用的内容提供程序时，TrueID SSO 会运行此提供程序来初始化 SDK，并注册认证所需的活动生命周期处理。
    disableEffect: TrueID 的启动初始化和生命周期处理将不会运行，SSO 或令牌流程可能因此失败。
