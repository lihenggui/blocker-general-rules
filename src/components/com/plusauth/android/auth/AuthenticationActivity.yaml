i18n:
  en:
    description: PlusAuth’s OpenID Connect authentication SDK starts this screen when an app begins a
      web login; it opens the identity provider’s authorization page in a browser tab and returns the
      result.
    disableEffect: Login flows that use PlusAuth will not be able to complete.
  zh-CN:
    description: 应用通过网页进行账号登录时，PlusAuth 的 OpenID Connect 登录 SDK 会打开此界面，在浏览器标签页中显示身份服务商的授权页面并返回登录结果。
    disableEffect: 停用后，依赖 PlusAuth 的账号登录流程将无法完成。
