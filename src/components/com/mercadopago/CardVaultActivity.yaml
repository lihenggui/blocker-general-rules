  en:
    description: Mercado Pago Android SDK uses this Activity to continue a card payment. It routes buyers
      to enter card details or provide a saved or recovered card’s security code, issuer, or installment
      choice as needed.
    disableEffect: The card-payment flow cannot collect the required details or return its payment data,
      so card payments through this SDK flow may fail.
  zh-CN:
    description: Mercado Pago Android SDK 会使用此 Activity 继续银行卡付款。它会根据需要引导用户填写卡片信息，或为已保存、恢复的卡片输入安全码并选择发卡机构或分期方案。
    disableEffect: 银行卡付款流程将无法收集所需信息或返回付款数据，因此通过此 SDK 流程进行的银行卡付款可能无法完成。
