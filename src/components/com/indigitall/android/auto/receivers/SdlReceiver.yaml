i18n:
  en:
    description: When a compatible car connection is detected over Bluetooth or USB, indigitall's SmartDeviceLink
      integration starts its car service so app notifications can be handled in the vehicle.
    disableEffect: indigitall notifications will no longer connect to a compatible car system automatically;
      the app remains usable on the phone.
  zh-CN:
    description: 通过蓝牙或 USB 检测到兼容的车载连接时，indigitall 的 SmartDeviceLink 集成会启动车载服务，以便在车内处理应用通知。
    disableEffect: indigitall 通知将无法自动连接到兼容的车载系统；应用在手机上仍可使用。
