i18n:
  en:
    description: Microsoft's shared MSAL/ADAL device-registration code opens this Activity when a broker
      returns an intent to install a work-device certificate; it launches the broker screen and sends
      the result back to the app.
    disableEffect: The certificate used for a work account cannot be installed, so dependent work-account
      or device enrollment may fail.
  zh-CN:
    description: 微软 MSAL/ADAL 共用的设备注册代码会在 broker 返回工作设备证书安装请求时打开此 Activity；它启动 broker 的安装界面，并把结果交还应用。
    disableEffect: 工作账户所需的设备证书将无法安装，依赖该证书的工作账户或设备注册可能失败。
