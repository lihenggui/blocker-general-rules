i18n:
  en:
    description: PictureSelector by LuckSiege starts this notification-backed service when foreground
      camera mode is enabled. It keeps the camera session active while the app handles the camera flow.
    disableEffect: Apps that use foreground camera mode may lose camera activity while the picker is in
      use or the app moves to the background.
  zh-CN:
    description: 启用前台相机模式时，PictureSelector by LuckSiege 会启动此带通知的服务。它在应用处理相机流程时保持相机任务运行。
    disableEffect: 使用前台相机模式的应用在选择器运行或切到后台时，相机任务可能会中断。
