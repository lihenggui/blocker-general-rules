i18n:
  en:
    description: Jenly AppPay's WeChat Pay integration receives this activity when the user returns from
      WeChat after a payment attempt. It passes the payment result back to the app.
    disableEffect: The app will not receive the WeChat payment result, which can leave its payment flow
      incomplete.
  zh-CN:
    description: 用户完成或取消支付并从微信返回后，Jenly AppPay 的微信支付集成会通过此页面接收结果，并将支付状态交还应用。
    disableEffect: 应用将无法收到微信支付结果，支付流程可能无法完成。
