      sharing through it.
  zh-CN:
    description: 应用启动 Multipaz 凭据出示流程时，此界面会在向读取设备出示数字身份凭据期间显示连接、共享、等待和失败提示。
    disableEffect: 应用将无法显示此出示流程，用户也无法通过它完成凭据共享。
