  en:
    description: Park SangGwon's TedImagePicker opens this Activity when an app asks the user to choose
      images or videos. It shows albums and media, supports camera capture, and returns one or several
      selected items.
    disableEffect: The app loses this image and video selection screen, including the picker's camera
      shortcut.
  zh-CN:
    description: 应用请求用户选择图片或视频时，Park SangGwon 的 TedImagePicker 会打开此 Activity。它展示相册和媒体、支持相机拍摄，并返回一个或多个选中项目。
    disableEffect: 停用后，应用将无法使用此图片和视频选择页面，包括选择器中的相机入口。
