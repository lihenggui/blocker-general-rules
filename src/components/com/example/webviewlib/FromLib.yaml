i18n:
  en:
    description: When the host app opens a page with Alif Garindra WebView, this screen loads the address
      supplied by the app and keeps navigation inside the app. It supports back navigation and closes
      when the designated close link is reached.
    disableEffect: Pages that use this embedded browser cannot be opened.
  zh-CN:
    description: 宿主应用使用 Alif Garindra WebView 打开网页时，此页面会加载应用提供的地址，并在应用内显示网页。页面支持返回，并会在访问指定关闭链接时关闭。
    disableEffect: 依赖此内置浏览器的网页将无法打开。
