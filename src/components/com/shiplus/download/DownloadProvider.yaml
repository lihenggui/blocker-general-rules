i18n:
  en:
    description: The 2ndLines Download Library creates its download database and configures background
      work when Android starts this provider. Adding a download stores it in the queue and schedules a
      worker to fetch it.
    disableEffect: Disabling it can prevent downloads that use this library from being queued or tracked.
  zh-CN:
    description: Android 启动此内容提供程序时，2ndLines 下载库会创建下载数据库并配置后台任务。添加下载后，任务会进入队列并安排后台工作程序获取文件。
    disableEffect: 停用后，使用此库的下载可能无法加入队列或跟踪进度。
