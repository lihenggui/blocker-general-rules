recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: The Capacitor Browser plugin coordinates opening a web link in an Android Custom Tab
      and returns control when the tab closes. If disabled, sign-in, checkout, or help pages that the
      app opens through this browser may fail.
    disableEffect: The app may be unable to open or complete web flows that use the Capacitor Browser
      plugin.
  zh-CN:
    description: Capacitor Browser 插件通过 Android 自定义标签页打开网页，并在页面关闭时把控制权交还给应用。禁用后，应用通过此浏览器打开的登录、结账或帮助页面可能无法正常使用。
    disableEffect: 应用可能无法打开或完成通过 Capacitor Browser 插件进行的网页流程。
