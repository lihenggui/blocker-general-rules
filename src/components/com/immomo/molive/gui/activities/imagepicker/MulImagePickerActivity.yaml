    description: When a Momo Live SDK flow needs pictures, this screen lists recent albums and lets the
      user select multiple images. Depending on the flow, it can also open the camera or the image-cropping
      screen.
    disableEffect: Flows that use this picker cannot choose or attach pictures.
  zh-CN:
