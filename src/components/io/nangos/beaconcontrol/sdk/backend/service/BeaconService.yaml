i18n:
  en:
    description: Nangos BeaconControl SDK monitors its configured iBeacon devices while scanning is active.
      It detects when they enter or leave range and reports distance changes so configured actions can
      run.
    disableEffect: Configured beacon detection will stop, along with the actions and proximity updates
      that depend on it.
  zh-CN:
    description: Nangos BeaconControl SDK 会在扫描期间监测已配置的 iBeacon 设备。它检测设备进入或离开范围，并上报距离变化，以便运行已配置的操作。
    disableEffect: 停用后，将无法检测已配置的信标，依赖信标的操作和接近状态更新也会停止。
