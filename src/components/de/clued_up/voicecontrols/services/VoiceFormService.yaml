recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:36:50Z'
i18n:
  en:
    description: VoiceControls by Frank Zickert starts this Service when the app runs a voice form. It
      asks form questions through notifications, sends the answers for interpretation, and returns a completed
      result or cancellation to the app.
    disableEffect: The app will no longer be able to collect or return answers through VoiceControls forms.
  zh-CN:
    description: 应用运行语音表单时，Frank Zickert 的 VoiceControls 会启动此 Service。它通过通知提出表单问题，发送回答进行解析，并将完成结果或取消状态返回应用。
    disableEffect: 停用后，应用将无法通过 VoiceControls 表单收集并返回回答。
