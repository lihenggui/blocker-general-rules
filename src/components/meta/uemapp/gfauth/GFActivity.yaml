recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:12:52Z'
i18n:
  en:
    description: When a user follows a GFAuth authorization link, this Activity checks the link with GFAuth
      and opens the app screen configured to receive the resulting account details.
    disableEffect: The authorization link cannot return the user's account details to the app, so this
      GFAuth sign-in flow fails.
  zh-CN:
    description: 用户打开 GFAuth 授权链接时，此 Activity 会向 GFAuth 核验链接，并打开应用预先设置的页面以接收账户信息。
    disableEffect: 禁用后，授权链接无法把账户信息返回应用，GFAuth 登录流程会失败。
