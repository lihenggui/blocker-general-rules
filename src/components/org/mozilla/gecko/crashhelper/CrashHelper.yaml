recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:44:57Z'
i18n:
  en:
    description: The Mozilla GeckoView engine (also forked by Equalitie for CENO) starts this service
      when one of its browser processes crashes so it can create a crash report from the saved crash data.
    disableEffect: Browsing can continue, but GeckoView may no longer save a report when one of its processes
      crashes.
  zh-CN:
    description: Mozilla GeckoView 浏览器引擎（包括 Equalitie 为 CENO 制作的分支）的浏览器进程发生崩溃时会启动此服务，用崩溃数据生成报告。
    disableEffect: 应用仍可继续浏览，但 GeckoView 进程崩溃时可能无法保存崩溃报告。
