i18n:
  en:
    description: Jamun Calendar displays a calendar for choosing one date or month, depending on the app's
      request. The app can limit the available choices and receives the selection.
    disableEffect: The app cannot collect a single date or month through Jamun Calendar's picker.
  zh-CN:
    description: Jamun Calendar 会显示日历，供用户根据应用的请求选择一个日期或月份。应用可以限制可选范围，并接收用户的选择。
    disableEffect: 停用后，应用将无法通过 Jamun Calendar 的选择界面收集单个日期或月份。
