i18n:
  en:
    description: The In-Telligent OpenAPI SDK starts this Service during initialization; after the user
      removes the app from Recents, it clears the SDK's previous priority-alert state and stops itself.
    disableEffect: Priority-alert state will not be cleared when the app is swiped away, so later alert
      handling may use stale state.
  zh-CN:
    description: In-Telligent OpenAPI SDK 会在初始化时启动此 Service；用户从最近任务中移除应用后，它会清除 SDK 先前的优先提醒状态并停止运行。
    disableEffect: 禁用后，用户划掉应用时优先提醒状态不会清除，之后处理提醒时可能会使用过期状态。
