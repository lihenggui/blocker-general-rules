i18n:
  en:
    description: This is part of Mrocigno's Sandman diagnostic toolkit. When Sandman monitoring is enabled,
      this task places a floating shortcut on app screens so users can open Sandman's diagnostic panel.
    disableEffect: The Sandman floating shortcut and its diagnostic panel will disappear; normal app screens
      will continue to work.
  zh-CN:
    description: 这是 Mrocigno 的 Sandman 诊断工具的一部分。启用 Sandman 监控后，此任务会在应用页面上显示悬浮入口，供用户打开 Sandman 诊断面板。
    disableEffect: 停用后，Sandman 悬浮入口和诊断面板将不再出现；应用的普通页面仍可使用。
