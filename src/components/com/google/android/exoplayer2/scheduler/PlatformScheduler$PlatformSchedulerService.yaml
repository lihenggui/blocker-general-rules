i18n:
  en:
    description: The Google ExoPlayer library runs this service when Android is ready to resume a scheduled
      background media task. It checks the device and network requirements, then starts the requested
      media service when they are met.
    disableEffect: Scheduled ExoPlayer media tasks may fail to restart when their network, charging, idle,
      or storage requirements are met.
  zh-CN:
    description: Google ExoPlayer 库会在 Android 准备恢复计划中的后台媒体任务时运行此服务。它检查设备和网络条件，并在条件满足后启动指定媒体服务。
    disableEffect: 当网络、充电、空闲或存储条件满足时，已计划的 ExoPlayer 媒体任务可能无法重新启动。
