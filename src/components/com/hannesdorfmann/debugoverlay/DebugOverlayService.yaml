i18n:
  en:
    description: When the app's debug tools bind to Hannes Dorfmann's DebugOverlay library, this service
      displays their log messages in an on-screen panel. The panel appears when a message arrives and
      can be closed by the user.
    disableEffect: The debug message panel will not appear; the app's other screens continue to work.
  zh-CN:
    description: 应用的调试工具连接到 Hannes Dorfmann 的 DebugOverlay 调试库时，此服务会在屏幕面板中显示日志消息。收到消息后面板会出现，用户可以将其关闭。
    disableEffect: 调试日志面板将不会显示；应用的其他页面仍可使用。
