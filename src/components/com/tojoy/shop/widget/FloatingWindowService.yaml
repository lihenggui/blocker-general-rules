i18n:
  en:
    description: When started with a video-stream address, the Tianjiu e-commerce product SDK adds a movable
      floating player with a close button and plays the stream in that window.
    disableEffect: The SDK’s floating video playback will stop working, so a video cannot continue in
      this movable window.
  zh-CN:
    description: 天九电商商品 SDK 携带视频流地址启动此服务时，会创建带关闭按钮的可移动悬浮播放器，并在窗口中播放视频流。
    disableEffect: 停用后，SDK 的悬浮视频播放将无法使用，视频不能在此可移动窗口中继续播放。
