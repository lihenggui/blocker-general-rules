  en:
    description: When a user taps a Pushwoosh notification or a standard notification action, Pushwoosh
      opens this Activity to process the message and pass its destination or action back to the app.
    disableEffect: Tapping Pushwoosh notifications or their standard actions will no longer open the associated
      screen or action in the app.
  zh-CN:
