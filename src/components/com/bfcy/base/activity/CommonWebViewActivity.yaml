i18n:
  en:
    description: The Banfengcanyue base Android library opens this Activity when the app asks to display
      a web address or a bundled local page; it shows loading progress and lets users go back through
      pages.
    disableEffect: If disabled, in-app web pages routed through this library cannot be opened.
  zh-CN:
    description: 应用要求显示网页地址或随应用提供的本地页面时，Banfengcanyue 基础 Android 库会打开此 Activity；页面会显示加载进度，并支持返回上一页。
    disableEffect: 停用后，通过此库打开的应用内网页将无法显示。
