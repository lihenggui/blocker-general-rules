i18n:
  en:
    description: The ForgeRock Authentication SDK opens this Activity when an app starts its built-in
      sign-in flow. It displays the SDK login form and returns the success or error result to the app.
    disableEffect: If disabled, the app cannot complete login through ForgeRock's built-in sign-in screen.
  zh-CN:
    description: 应用启动 ForgeRock 内置登录流程时，会打开此 Activity。它显示 SDK 的登录表单，并把成功或错误结果返回给应用。
    disableEffect: 停用后，应用无法通过 ForgeRock 内置登录界面完成登录。
