  en:
    description: Fyber's Inneractive ad SDK opens an advertiser's store or landing page after an ad is
      clicked. It runs from the ad-click flow.
    disableEffect: Ad clicks will no longer open the associated advertiser store or promotion page; other
      app features continue.
  zh-CN:
    description: Fyber 的 Inneractive 广告 SDK 会在用户点击广告后打开广告主的商店或推广页面。它由广告点击流程启动。
    disableEffect: 禁用后，广告点击将无法打开相应的商店或推广页面；应用的其他功能不受影响。
