i18n:
  en:
    description: When an app needs to find or communicate with several Bluetooth LE devices at once, it
      binds this Junkchen BleLib Service. The Service manages multiple connections and reports each device’s
      connection and data changes.
    disableEffect: Bluetooth LE discovery and multi-device communication through BleLib will stop working.
  zh-CN:
    description: 应用需要同时发现多个蓝牙低功耗设备或与它们通信时，会绑定 Junkchen BleLib 的此服务。它管理多个设备连接，并向应用报告各设备的连接和数据变化。
    disableEffect: BleLib 的蓝牙低功耗设备发现和多设备通信将无法使用。
