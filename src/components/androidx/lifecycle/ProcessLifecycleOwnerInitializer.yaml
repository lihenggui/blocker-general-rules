recommendToBlock: false
i18n:
  en:
    description: Class that provides lifecycle for the whole application process. It is useful for use
      cases where you would like to react on your app coming to the foreground or going to the background
      and you don't need a milliseconds accuracy in receiving lifecycle events.
  zh-CN:
    description: 此类为整个应用程序进程提供生命周期事件支持。它适用于希望在应用程序切换到前台或后台时做出响应，但不需要毫秒级准确性来接收生命周期事件的用例。
