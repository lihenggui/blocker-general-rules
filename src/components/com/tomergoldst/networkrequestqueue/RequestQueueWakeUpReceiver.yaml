recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:33:25Z'
i18n:
  en:
    description: The NetworkRequestQueue SDK by Tomer Goldstein calls this Receiver when a timed retry
      for a failed queued request is due. It starts the Service that tries the saved requests again.
    disableEffect: Requests waiting for a timed retry may remain unsent, which can stop an app feature
      that relies on them from completing.
  zh-CN:
    description: Tomer Goldstein 的 NetworkRequestQueue SDK 会在排队请求的定时重试到期时调用此 Receiver。它会启动 Service，再次尝试发送保存的请求。
    disableEffect: 等待定时重试的请求可能一直无法发送，依赖这些请求的应用功能也可能无法完成。
