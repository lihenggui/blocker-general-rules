i18n:
  en:
    description: The Xiaoe WebCore SDK uses this provider to create app-owned file links for files selected
      or captured from a web page, so Android's file and camera apps can pass those files safely.
    disableEffect: The WebCore file picker or camera handoff can fail when a page attaches a file or photo.
  zh-CN:
    description: 小鹅 WebCore SDK 通过这个内容提供器为网页选择或拍摄的文件生成应用内文件链接，便于 Android 的文件选择器和相机应用安全地传递这些文件。
    disableEffect: 停用后，WebCore 网页中的文件选择或相机文件回传可能失败。
