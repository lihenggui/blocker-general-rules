recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:01:15Z'
i18n:
  en:
    description: This older Xinliangxiang Voice Read SDK screen appears for question-based voice ads.
      It shows an advertiser-related question and answer choices, then guides the user through a spoken
      answer check.
    disableEffect: Blocking it prevents the spoken question step from running, so users cannot complete
      that rewarded ad or receive its reward.
  zh-CN:
    description: 这是旧版 Xinliangxiang Voice Read SDK 用于问答式语音广告任务的页面，会展示广告相关问题和选项，并引导用户通过语音作答来完成检查。
    disableEffect: 停用后，问答语音步骤无法运行，用户不能完成该奖励广告任务或领取奖励。
