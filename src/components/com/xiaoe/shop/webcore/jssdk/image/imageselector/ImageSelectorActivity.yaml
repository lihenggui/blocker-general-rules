    description: The Xiaoe WebCore SDK opens this Activity when a page's photo picker is used. It displays
      a photo grid, can crop a camera image, and returns the chosen pictures to the page.
    disableEffect: The page's built-in photo selection, cropping, and upload flow will stop working.
  zh-CN:
