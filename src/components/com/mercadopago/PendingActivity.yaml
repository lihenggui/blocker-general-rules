i18n:
  en:
    description: Mercado Pago Android SDK opens this Activity when a payment is still pending or being
      processed. It shows the current status, configured follow-up items, and an option to choose another
      payment method when available.
    disableEffect: The buyer loses the pending-payment status and any follow-up or alternate-method actions
      provided by this screen.
  zh-CN:
    description: 付款仍在等待处理或处理中时，Mercado Pago Android SDK 会打开此 Activity。它会显示当前状态、配置的后续检查项目，并在可用时提供更换付款方式的选项。
    disableEffect: 用户将无法看到待处理状态，也无法使用此页面提供的后续操作或更换付款方式。
