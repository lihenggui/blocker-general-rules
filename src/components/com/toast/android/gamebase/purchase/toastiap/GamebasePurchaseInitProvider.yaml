i18n:
  en:
    description: Gamebase's TOAST IAP adapter registers for Google Play purchase updates when the app
      starts so completed purchases can reach the purchase flow.
    disableEffect: Google Play purchase updates may not reach Gamebase, so purchases could fail or remain
      unconfirmed.
  zh-CN:
    description: 应用启动时，Gamebase 的 TOAST IAP 适配器会注册 Google Play 购买更新，以便已完成的购买进入购买处理流程。
    disableEffect: 停用后 Google Play 购买更新可能无法送达 Gamebase，购买可能失败或无法确认。
