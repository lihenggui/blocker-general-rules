i18n:
  en:
    description: When Dataroid AppConnect triggers a full-screen custom in-app campaign, this screen displays
      its localized content in a web page and records that the message was viewed.
    disableEffect: If AppConnect tries to show a full-screen custom campaign after this screen is disabled,
      its direct launch may crash the app and the message cannot appear.
  zh-CN:
    description: Dataroid AppConnect 触发全屏自定义应用内活动消息时，会通过此界面在网页中显示本地化内容，并记录消息已查看。
    disableEffect: 停用此界面后，如果 AppConnect 尝试显示全屏自定义活动消息，直接启动该界面的过程可能导致应用崩溃，消息也无法显示。
