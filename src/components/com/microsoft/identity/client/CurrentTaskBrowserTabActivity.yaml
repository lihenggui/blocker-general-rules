recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: MSAL uses this browser-return screen for sign-in flows that stay in the current task.
      It forwards the redirect response and closes the temporary return task when the flow finishes.
    disableEffect: Current-task browser sign-in cannot pass its redirect response through MSAL or complete
      the return-task cleanup.
  zh-CN:
    description: MSAL 会在需要留在当前任务中的登录流程里使用此浏览器返回界面。它转交重定向响应，并在流程结束时关闭临时返回任务。
    disableEffect: 保持在当前任务中的浏览器登录将无法通过 MSAL 传递重定向响应，也无法完成返回任务的清理。
