  en:
    description: The what3words OCR Components extension opens this camera scanner when an app uses its
      hybrid recognition option. It reads a three-word address and displays validated what3words matches.
    disableEffect: Users will no longer be able to scan what3words addresses with this recognition option.
  zh-CN:
    description: 应用使用混合识别方式时，what3words OCR Components 扩展会打开此相机扫描界面，读取三词地址并显示验证后的 what3words 匹配结果。
    disableEffect: 用户将无法再通过此识别方式扫描 what3words 地址。
