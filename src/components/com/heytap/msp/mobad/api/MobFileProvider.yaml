i18n:
  en:
    description: OPPO HeyTap Mobad uses this provider to share downloaded ad files with Android, including
      files passed to the app installer.
    disableEffect: Blocking it makes Mobad initialization fail and prevents ad-file or app-install links
      from opening.
  zh-CN:
    description: OPPO HeyTap Mobad 会通过此提供程序将已下载的广告文件交给 Android 使用，包括传给应用安装程序的文件。
    disableEffect: 停用后 Mobad 初始化会失败，广告文件或应用安装链接也无法打开。
