  en:
    description: When Android reports that the app has been replaced or the MapmyIndia Tracking SDK receives
      a broadcast, this Receiver asks the SDK to resume enabled beacon tracking.
    disableEffect: Enabled beacon tracking may no longer resume automatically after these broadcasts.
  zh-CN:
    description: Android 报告应用被替换或 MapmyIndia Tracking SDK 收到广播时，此 Receiver 会要求 SDK 恢复已启用的信标跟踪。
    disableEffect: 这些广播到达后，已启用的信标跟踪可能无法再自动恢复。
