i18n:
  en:
    description: The HyXen AdLocus private ad SDK opens this page for in-app ads and ad-notification taps;
      it shows the ad page or opens the advertised link, and also handles the SDK's ad-setting prompt.
    disableEffect: Disabling it prevents AdLocus ads, their landing pages, and related notification controls
      from opening; the host app's other screens remain available.
  zh-CN:
    description: HyXen AdLocus 私有广告 SDK 在展示应用内广告或用户点击广告通知时打开此页面，显示广告内容或跳转至广告链接，也处理 SDK 的广告设置页面。
    disableEffect: 停用后，AdLocus 广告、落地页和相关通知设置无法打开，但宿主应用的其他页面仍可使用。
