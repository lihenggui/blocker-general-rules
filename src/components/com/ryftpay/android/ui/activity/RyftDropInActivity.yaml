    disableEffect: Disabling it prevents RyftPay checkout from opening, so the app cannot complete payments
      through this flow.
  zh-CN:
    description: 应用打开 RyftPay 结账界面时，这个页面会显示付款表单、处理 Google Pay 返回的信息，并把付款结果交还给应用。
    disableEffect: 停用后，RyftPay 结账页面无法打开，应用无法通过这条流程完成付款。
