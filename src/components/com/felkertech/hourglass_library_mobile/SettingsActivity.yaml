  en:
    description: Hourglass's watch-face settings library opens this Activity when the user changes its
      options. It displays date, time, ambient-display, and developer settings, then sends supported changes
      to the paired watch.
    disableEffect: The Hourglass settings screen will be unavailable, and its options cannot be changed
      from the phone.
  zh-CN:
    description: 用户更改表盘选项时，Hourglass 的表盘设置库会打开此 Activity。它显示日期、时间、环境显示和开发者设置，并将支持的更改发送到配对手表。
    disableEffect: Hourglass 设置界面将无法使用，用户也无法从手机修改相关选项。
