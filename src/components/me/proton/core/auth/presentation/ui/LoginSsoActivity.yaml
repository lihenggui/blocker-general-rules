i18n:
  en:
    description: Proton AG's Proton Core Android SDK opens this Activity when an organization account
      signs in through single sign-on. It opens the identity-provider page in an in-app web view or browser
      tab and processes the return to the app.
    disableEffect: If disabled, organization single sign-on and its return flow may not work.
  zh-CN:
    description: Proton AG 的 Proton Core Android SDK 会在组织账户使用单点登录时打开此 Activity，在应用内网页或浏览器标签页中打开身份提供方页面，并处理返回应用的结果。
    disableEffect: 停用后，组织单点登录及其返回流程可能无法使用。
