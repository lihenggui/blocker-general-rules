recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: When Firebase delivers a push message or refreshes the device's registration token, the
      Capacitor Push Notifications plugin forwards it to the app's push handler. Disabling it stops this
      plugin from receiving pushes and token updates.
    disableEffect: Push messages and refreshed registration tokens will no longer reach the app through
      Capacitor Push Notifications.
  zh-CN:
    description: Firebase 投递推送消息或更新设备注册令牌时，Capacitor Push Notifications 插件会将消息或新令牌交给应用处理。禁用后，该插件将不再接收推送或令牌更新。
    disableEffect: 应用将无法再通过 Capacitor Push Notifications 接收推送消息或新的注册令牌。
