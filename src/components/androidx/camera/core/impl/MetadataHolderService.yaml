recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T15:29:31Z'
i18n:
  en:
    description: AndroidX CameraX reads this disabled-by-default Service's package information while initializing
      the camera to find the default Camera2 setup and compatibility settings; the Service itself is never
      started.
    disableEffect: Disabling it does not hide its package metadata from CameraX, so camera setup and camera
      features continue to work.
  zh-CN:
    description: AndroidX CameraX 在初始化相机时会读取这个默认关闭的 Service 的包信息，以查找 Camera2 默认配置和兼容性设置；该 Service 本身不会启动。
    disableEffect: 禁用它不会阻止 CameraX 读取包元数据，因此相机初始化和相机功能仍可使用。
