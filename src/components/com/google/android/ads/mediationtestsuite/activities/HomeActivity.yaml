recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:15:26Z'
i18n:
  en:
    description: Google Mobile Ads Mediation Test Suite opens this as its main screen when a developer
      launches the suite for an app. It loads the app's configured mediation items and links to their
      details and test tools.
    disableEffect: The app's mediation test suite cannot be opened, but its regular ad placements continue
      to work.
  zh-CN:
    description: 开发者为应用启动 Google Mobile Ads 中介测试套件时，会进入此主页面。页面加载应用已配置的中介项目，并提供查看详情和测试工具的入口。
    disableEffect: 应用的中介测试套件将无法打开，但常规广告位仍可正常投放广告。
