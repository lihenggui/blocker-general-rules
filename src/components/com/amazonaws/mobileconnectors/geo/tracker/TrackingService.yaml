i18n:
  en:
    description: AWS Location starts this foreground service when the app enables location tracking; it
      requests periodic fused-location updates and delivers each location to the tracking listener.
    disableEffect: The app's AWS Location tracking feature will stop receiving periodic location updates.
  zh-CN:
    description: 应用启用位置跟踪时，AWS Location 会启动此前台服务，定期请求融合定位结果并将位置交给跟踪监听器。
    disableEffect: 应用的 AWS Location 跟踪功能将无法继续接收定期位置更新。
