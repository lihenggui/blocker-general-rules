i18n:
  en:
    description: When a user opens a person's profile, the NetEase Yunxin ContactKit UI SDK loads contact
      or AI-account details and offers actions such as chatting, adding a friend, blocking, or removing
      a friend.
    disableEffect: Users lose the ContactKit page for viewing a person's details and using its contact
      actions.
  zh-CN:
    description: 用户打开某人的资料时，网易云信 ContactKit UI SDK 会加载联系人或 AI 账号信息，并根据关系提供聊天、添加好友、屏蔽或删除好友等操作。
    disableEffect: 用户将无法通过 ContactKit 查看联系人资料或使用资料页中的联系人操作。
