i18n:
  en:
    description: When a user taps an interactive Infobip notification action, this receiver dismisses
      the notification, captures any typed reply, and sends the action to the app.
    disableEffect: Notification buttons and inline replies may no longer reach the app, which can break
      actions offered there.
  zh-CN:
    description: 用户点击 Infobip 通知中的交互操作时，此接收器会关闭通知、读取输入的回复并将操作交给应用。
    disableEffect: 停用后，通知按钮和直接回复可能无法传给应用，相关操作可能失效。
