i18n:
  en:
    description: When a browser returns to the app through a Logto sign-in link, the Logto Android SDK
      opens this exported callback screen. It checks the returned link and forwards it to the in-progress
      sign-in.
    disableEffect: Users may not complete browser-based Logto sign-in because the callback will not be
      received.
  zh-CN:
    description: 浏览器通过 Logto 登录链接返回应用时，Logto Android SDK 会打开此回调页面。页面检查返回链接，并将其交给正在进行的登录流程。
    disableEffect: 停用后，应用将无法接收浏览器登录回调，用户可能无法完成 Logto 登录。
