i18n:
  en:
    description: This is part of MrSweeter's HypCo app logger. This is HypCo's app-logging screen; when
      opened, it loads the saved records and lets users export a selected item as a JSON file.
    disableEffect: HypCo's saved-record browser and JSON export screen will be unavailable; the host app's
      features are unaffected.
  zh-CN:
    description: 这是 MrSweeter 的 HypCo 应用日志工具的一部分。这是 HypCo 的应用日志页面；打开后会加载已保存的记录，并可将选中的条目导出为 JSON 文件。
    disableEffect: 停用后，HypCo 已保存记录的浏览和 JSON 导出页面不可用；宿主应用功能不受影响。
