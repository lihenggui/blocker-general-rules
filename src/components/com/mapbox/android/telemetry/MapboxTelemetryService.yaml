recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T20:13:52Z'
i18n:
  en:
    description: Mapbox Android Telemetry binds this service during startup to follow whether the app
      is in the foreground or background. It saves those app state changes for Mapbox telemetry.
    disableEffect: Mapbox telemetry will stop receiving app foreground and background state changes.
  zh-CN:
    description: Mapbox Android Telemetry 会在启动初始化时绑定此服务，以跟踪应用处于前台还是后台，并保存这些状态供遥测使用。
    disableEffect: 禁用后，Mapbox 遥测将无法继续接收应用前后台状态变化。
