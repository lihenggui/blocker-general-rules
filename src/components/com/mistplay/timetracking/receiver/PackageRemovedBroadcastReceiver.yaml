i18n:
  en:
    description: When Android reports that an app has been fully uninstalled, this Mistplay Hex receiver
      removes that package from the game-install tracking records.
    disableEffect: Records for uninstalled games may remain in Mistplay's local tracking data.
  zh-CN:
    description: Android 报告应用已完全卸载时，此 Mistplay Hex 接收器会从游戏安装跟踪记录中移除该应用。
    disableEffect: 已卸载游戏的记录可能继续留在 Mistplay 的本地跟踪数据中。
