i18n:
  en:
    description: Walmart Labs LiveBundle opens for a LiveBundle link or package-scan request and switches
      a React Native app to a remotely hosted code package, then reloads the app with it.
    disableEffect: Users cannot switch to a LiveBundle package from this app; its ordinary features remain
      available.
  zh-CN:
    description: Walmart Labs LiveBundle 在打开 LiveBundle 链接或请求扫描程序包时启动，将 React Native 应用切换到远程代码包并重新加载应用。
    disableEffect: 停用后，用户无法从此应用切换到 LiveBundle 程序包；应用的常规功能仍可使用。
