    description: The Zhongruan Gaoke UniApp reading plugin opens this screen when an NFC card or passport
      tag is presented. It passes the tag to the configured reader and returns the card data to the app.
    disableEffect: The plugin cannot read NFC cards or passports or return their data.
  zh-CN:
    description: 出现 NFC 身份证或护照标签时，中软高科 UniApp 读卡插件会打开此页面。它将标签交给已配置的读卡器，并把证件数据返回应用。
    disableEffect: 插件将无法读取 NFC 身份证或护照，也无法向应用返回证件数据。
