      hang up, or use a missed-call action.
  zh-CN:
    description: 用户点击 CleverTap DirectCall 通知中的接听、拒绝、挂断或未接来电操作时，此接收器会把选择交给通话界面或通话处理流程。
    disableEffect: 用户可能无法从通知接听或拒绝 DirectCall 来电、挂断通话，或使用未接来电操作。
