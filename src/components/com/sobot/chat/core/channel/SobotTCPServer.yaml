i18n:
  en:
    description: When a user starts or continues a live Sobot chat session, Sobot's customer-service chat
      SDK runs this service. It maintains the live message connection and responds to network changes
      so messages can reach the conversation.
    disableEffect: Live messages may stop arriving or updating in real time in Sobot chat.
  zh-CN:
    description: 当用户开始或继续 Sobot 实时客服会话时，Sobot 客服聊天 SDK 会运行此 Service。它维持实时消息连接并响应网络变化，让消息送达会话。
    disableEffect: Sobot 聊天中的实时消息可能无法继续送达或更新。
