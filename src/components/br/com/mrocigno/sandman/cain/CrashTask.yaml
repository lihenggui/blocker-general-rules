i18n:
  en:
    description: This is part of Mrocigno's Sandman diagnostic toolkit. As app screens resume, this Sandman
      task registers an uncaught-crash handler that opens Sandman's crash report when an error occurs.
    disableEffect: Sandman will stop opening its crash report; the app's existing crash handler remains
      in place.
  zh-CN:
    description: 这是 Mrocigno 的 Sandman 诊断工具的一部分。应用页面恢复显示时，此 Sandman 任务会注册未捕获崩溃的处理程序，发生错误时打开 Sandman 崩溃报告。
    disableEffect: 停用后，Sandman 不再打开崩溃报告；应用原有的崩溃处理程序仍会工作。
