i18n:
  en:
    description: ModuleNotificationRating (Huliganul) prepares optional app rating reminders when the
      app configures them. It stores the chosen reminder text and icon, and the screen to open when a
      reminder is tapped.
    disableEffect: The effect of disabling this manifest entry on rating reminders is uncertain because
      the code uses it as a helper, not as an Android screen.
  zh-CN:
    description: ModuleNotificationRating（Huliganul）会在应用启用时准备可选的评分提醒。它保存提醒文字、图标以及用户点击提醒后要打开的页面。
    disableEffect: 由于代码将它用作评分提醒辅助类，而不是 Android 页面，禁用此清单项对评分提醒的影响尚无法确认。
