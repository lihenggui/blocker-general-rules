i18n:
  en:
    description: Vdopia’s ad SDK opens an in-app browser when an ad link is tapped or an interactive ad
      opens a web page. It loads the destination and provides back, forward, refresh, share, and close
      controls.
    disableEffect: The Vdopia in-app ad browser and its navigation and sharing controls will not be available.
  zh-CN:
    description: Vdopia 广告 SDK 会在用户点击广告链接或互动广告打开网页时启动应用内浏览器，加载目标网页并提供前进、后退、刷新、分享和关闭按钮。
    disableEffect: Vdopia 广告的应用内浏览器及其导航和分享功能将无法使用。
