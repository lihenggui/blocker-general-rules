i18n:
  en:
    description: When an internal Pangle broadcast contains collected values, this Receiver passes them
      to the SDK's data collection handler.
    disableEffect: Pangle's embedded data collection stops, while the host app's other features remain
      available.
  zh-CN:
    description: Pangle 内部广播携带收集到的数据时，此 Receiver 会把数据交给 SDK 的收集处理程序。
    disableEffect: Pangle 的嵌入式数据收集会停止，但宿主应用的其他功能仍可使用。
