i18n:
  en:
    description: DriveBuddy starts this short-lived service while setting up trip detection; it registers
      an exit boundary around the last known location and then stops.
    disableEffect: DriveBuddy cannot set this location boundary, so geofence-based trip startup may not
      work.
  zh-CN:
    description: DriveBuddy 设置行程检测时会短暂启动此 Service；它会围绕最近已知位置注册离开边界，然后停止运行。
    disableEffect: 停用后，DriveBuddy 无法设置此位置边界，基于地理围栏启动行程的功能可能失效。
