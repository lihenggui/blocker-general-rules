recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:40:10Z'
i18n:
  en:
    description: During PayEase Webox identity or card verification, this Activity captures and crops
      an ID-card or bank-card image, sends it for text recognition, and returns the recognized details
      to the form.
    disableEffect: Disabling it prevents the SDK’s camera-scanning flow and can interrupt identity or
      card verification that depends on a scan.
  zh-CN:
    description: 进行 PayEase Webox 身份或银行卡验证时，此 Activity 会拍摄并裁剪证件或银行卡照片，发送识别，并把识别出的信息交回表单。
    disableEffect: 停用后，SDK 的摄像头扫描流程无法使用，依赖扫描的身份或银行卡验证也会中断。
