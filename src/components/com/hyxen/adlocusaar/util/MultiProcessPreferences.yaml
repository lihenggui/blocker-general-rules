recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:39:17Z'
i18n:
  en:
    description: HyXen AdLocus uses this ContentProvider when its background push service saves or reads
      the shared push key between the app and the separate push service.
    disableEffect: Without it, AdLocus cannot retrieve the shared push key and its push checks may stop;
      the app's regular screens remain available.
  zh-CN:
    description: HyXen AdLocus 的后台推送服务通过此 ContentProvider 与应用主进程共享推送密钥，并读取或保存该密钥。
    disableEffect: 停用后，AdLocus 无法读取共享推送密钥，推送检查可能停止；应用的普通页面仍可使用。
