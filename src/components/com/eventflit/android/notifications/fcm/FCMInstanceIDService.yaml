i18n:
  en:
    description: When Firebase refreshes the device’s messaging token, the Eventflit Android WebSocket
      library passes the new token to its registered push-token handler.
    disableEffect: Eventflit push registration will stop receiving refreshed tokens, so its notifications
      may stop reaching the app.
  zh-CN:
    description: Firebase 刷新设备的消息令牌时，Eventflit Android WebSocket 库会把新令牌交给已注册的推送令牌处理器。
    disableEffect: 屏蔽后，Eventflit 推送注册收不到更新的令牌，通知可能无法送达应用。
