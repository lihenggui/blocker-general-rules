    description: 'At Jumio, we use informed AI to get to the ground truth of customer identity, quickly
      and easily. With Jumio, you can onboard, convert and authenticate good customers faster and keep
      fraud from poisoning your online channel.

      Employ Jumio’s informed AI to automate the online identity verification process and deliver the
      industry’s highest accuracy rates. Get definitive answers in mere seconds while removing the obstacles
      that stand between good customers and your business.

      Verify the digital identities of your customers — anytime, anywhere — with the device that’s always
      with them — their smartphones. After your user snaps a picture of their ID, they just need to take
      a corroborating selfie and in seconds, their online identities are reliably verified.

      Verify more than 3,500 government-issued ID types from over 200 countries and territories. And enable
      verifications across channels with mobile SDK, webcam, API or mobile web implementation options.

      Cut the number of steps and time it takes to onboard new customers, delivering a more intuitive
      user journey. When environmental factors, such as glare, blur or bad lighting, prevent a successful
      online verification, let users course correct in real-time by providing specific reason codes for
      initial failure.

      Liveness Detection, Optical Character Recognition, Face-based Biometrics'
