  en:
    description: AndroidX Test Core starts this blank floating Activity during instrumentation tests to
      pause another screen and check its paused state.
    disableEffect: Tests that rely on this screen lifecycle transition may fail or time out; normal app
      navigation is unaffected.
  zh-CN:
    description: AndroidX Test Core 会在测试期间启动这个空白浮动 Activity，使另一个界面暂停，以便检查其暂停状态。
    disableEffect: 依赖此界面生命周期变化的测试可能失败或超时；应用的正常导航不受影响。
