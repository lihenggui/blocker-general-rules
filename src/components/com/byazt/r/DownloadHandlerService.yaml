recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Pangle's downloader starts this Service when a user acts on an app-download notification,
      such as opening the downloaded app, continuing, or cancelling its download. It also restarts eligible
      downloads when storage is reconnected.
    disableEffect: Pangle ad app downloads and their notification actions will stop working.
  zh-CN:
    description: 用户操作应用下载通知时，Pangle 下载器会启动此 Service，例如打开已下载的应用、继续下载或取消下载。存储空间重新连接后，它也会恢复符合条件的下载。
    disableEffect: Pangle 广告应用下载及其通知操作将无法使用。
