i18n:
  en:
    description: When VHall on-demand video is moved out of its page, this service places the player in
      a movable floating window and keeps its playback position. Tapping the window returns to the video.
    disableEffect: On-demand video will not continue in a floating window after leaving its page; watching
      in the video page still works.
  zh-CN:
    description: 当用户把 VHall 点播视频移出播放页面时，此 Service 会将播放器放入可移动的悬浮窗并保留播放位置。点击悬浮窗可返回视频。
    disableEffect: 停用后，离开播放页面时点播视频不会继续显示在悬浮窗中；在视频页面内观看仍可使用。
