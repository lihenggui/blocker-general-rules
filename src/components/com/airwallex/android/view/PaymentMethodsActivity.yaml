i18n:
  en:
    description: When Airwallex checkout asks for a payment method, this screen lists saved methods and
      lets the customer choose one or add a card. Flows configured to include checkout can continue payment
      from this screen.
    disableEffect: Customers cannot choose or manage saved payment methods through this screen, and checkout
      flows that use it cannot continue.
  zh-CN:
    description: Airwallex 结账需要选择支付方式时，此页面会列出已保存的方式，并允许用户选择一种或添加银行卡。包含结账步骤的流程也可从此页面继续付款。
    disableEffect: 用户将无法通过此页面选择或管理已保存的支付方式，依赖此页面的结账流程也无法继续。
