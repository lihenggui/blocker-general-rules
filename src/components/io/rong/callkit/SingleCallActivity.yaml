  en:
    description: RongCloud CallKit opens this screen for a one-to-one voice or video call, whether the
      call is incoming or outgoing. It shows the call state and controls for answering, switching audio
      or video, and hanging up.
    disableEffect: One-to-one internet calls will not be able to open their call screen or handle call
      controls.
  zh-CN:
    description: 融云 CallKit 会在一对一语音或视频通话的来电和去电过程中打开此页面。页面显示通话状态，并提供接听、切换音视频和挂断等控制项。
    disableEffect: 停用后，一对一网络通话将无法打开通话界面或使用通话控制项。
