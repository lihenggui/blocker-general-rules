    description: After a user taps an EZPush notification, the SDK briefly opens this screen and passes
      the notification link and extra information to the host app.
    disableEffect: Tapping an EZPush notification will no longer open the host app with its link or extra
      information; users can still open the app normally.
  zh-CN:
    description: 用户点按 EZPush 通知后，SDK 会短暂显示此页面，并将通知链接及附带信息传给宿主应用。
    disableEffect: 禁用后，点按 EZPush 通知将无法携带链接或附加信息打开宿主应用，但用户仍可正常启动应用。
