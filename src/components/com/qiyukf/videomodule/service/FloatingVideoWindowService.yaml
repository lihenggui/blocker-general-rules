  en:
    description: When a Qiyu video call is minimized to a floating view, this Service displays the remote
      participant’s video and lets the user return to the full call screen.
    disableEffect: Users lose the floating video window and its shortcut back to the active call.
  zh-CN:
    description: 七鱼视频通话缩小为悬浮视图时，此服务会显示远端参与者的视频，并让用户返回完整通话界面。
    disableEffect: 用户将无法使用悬浮视频窗口及其返回当前通话的入口。
