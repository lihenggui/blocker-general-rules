recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: AndroidX Android for Cars App reads this disabled-by-default Service's package information
      when setting up car hardware access and result handling; its metadata selects the Automotive or
      projected Android Auto implementation.
    disableEffect: Blocking it leaves its package metadata readable, so the car hardware and result implementations
      remain available.
  zh-CN:
    description: AndroidX Android for Cars App 在设置车载硬件访问和结果处理时会读取这个默认关闭的 Service 的包信息；其中的元数据用于选择 Android
      Automotive 或投射式 Android Auto 实现。
    disableEffect: 禁用它后包元数据仍可读取，因此车载硬件和结果处理实现仍可使用。
