i18n:
  en:
    description: Android starts this Provider for the Kuaishou ad SDK at app startup; it shares downloaded
      APK files with Android's package installer and initializes SDK activity tracking.
    disableEffect: Ad app installation may fail, and the SDK may not initialize its activity tracking.
  zh-CN:
    description: 应用启动时，Android 会为快手广告 SDK 创建此 Provider；它向 Android 安装程序提供已下载 APK 的文件访问权限，并初始化 SDK 的 Activity
      跟踪。
    disableEffect: 广告应用可能无法安装，SDK 的 Activity 跟踪也可能无法初始化。
