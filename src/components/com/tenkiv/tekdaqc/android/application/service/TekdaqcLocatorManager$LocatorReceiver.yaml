i18n:
  en:
    description: When TenKiv broadcasts a board-discovery update, this receiver updates the discovered-board
      list and notifies the app that a board was found, updated, or lost.
    disableEffect: Disabling it prevents the app from receiving TekDAQC board discovery and availability
      updates.
  zh-CN:
    description: TenKiv 广播采集板发现状态时，这个接收器会更新设备列表，并通知应用设备已发现、状态已更新或已离线。
    disableEffect: 停用后，应用将无法收到 TekDAQC 设备发现和可用状态更新。
