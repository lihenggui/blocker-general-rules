recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:19:59Z'
i18n:
  en:
    description: When an app starts NETPIE Microgear, this service connects to NETPIE and carries messages
      between the app and its connected IoT devices.
    disableEffect: The app can no longer send or receive messages through NETPIE, so connected-device
      features may stop working.
  zh-CN:
    description: 应用启动 NETPIE Microgear 时，此服务会连接 NETPIE，并在应用与联网设备之间传递消息。
    disableEffect: 停用后，应用无法再通过 NETPIE 收发消息，依赖联网设备的功能可能停止工作。
