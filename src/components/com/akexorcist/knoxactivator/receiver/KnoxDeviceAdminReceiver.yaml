i18n:
  en:
    description: The AkeXorcist KnoxActivator wrapper registers this Android device-administrator receiver
      for Knox activation. Its subclass adds no extra callback behavior of its own.
    disableEffect: Android cannot deliver the Knox device-admin activation event to the app, so Knox administrator
      setup may fail.
  zh-CN:
    description: AkeXorcist KnoxActivator 封装会将此接收器注册为 Android 设备管理员，以支持 Knox 激活。该子类本身没有额外的回调处理。
    disableEffect: Android 将无法向本应用传递 Knox 设备管理员激活事件，Knox 管理员设置可能失败。
