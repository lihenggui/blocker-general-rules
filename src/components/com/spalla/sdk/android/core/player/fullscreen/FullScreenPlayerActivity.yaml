i18n:
  en:
    description: When the host app requests full-screen playback, the Spalla SDK player opens this screen
      for a video and accepts live-content and autoplay settings. It keeps playback in sync as the screen
      resumes, pauses, or closes, and can open cast controls.
    disableEffect: The Spalla SDK's full-screen video player cannot open.
  zh-CN:
    description: 应用请求全屏播放时，Spalla SDK 播放器会打开此页面播放指定视频，并可按请求自动开始或播放直播内容；页面恢复、暂停或关闭时也会同步控制播放器，并可打开投屏控制页面。
    disableEffect: 停用后，Spalla 的全屏视频播放页面无法打开。
