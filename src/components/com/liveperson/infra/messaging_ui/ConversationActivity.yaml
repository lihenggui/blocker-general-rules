  en:
    description: The LivePerson Messaging SDK opens the app's in-app support conversation for a selected
      brand and loads the conversation screen. Disabling it prevents users from opening that support chat.
    disableEffect: Users will not be able to open the LivePerson support conversation in the app.
  zh-CN:
    description: LivePerson 消息 SDK 会为所选品牌打开应用内的客服会话，并显示聊天界面。禁用后，用户将无法打开这项客服聊天。
    disableEffect: 用户将无法在应用中打开 LivePerson 客服会话。
