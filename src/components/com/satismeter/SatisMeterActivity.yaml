i18n:
  en:
    description: SatisMeter opens this screen when its survey response says a feedback prompt should be
      shown. It collects a rating or written feedback and can offer an app-store review or promotion.
    disableEffect: Disabling it removes SatisMeter's in-app survey and review prompts; the app's other
      features continue.
  zh-CN:
    description: SatisMeter 会在调查配置要求显示反馈提示时打开此页面。它收集评分或文字反馈，也可以提供应用商店评价或促销内容。
    disableEffect: 禁用后，SatisMeter 的应用内调查和评价提示将无法显示；应用的其他功能仍可使用。
