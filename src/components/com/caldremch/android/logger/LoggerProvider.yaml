i18n:
  en:
    description: At app startup, this Provider enables Caldremch's diagnostic logger and network-log monitoring,
      and registers for app lifecycle changes.
    disableEffect: Automatic diagnostic and network logging stops; normal app screens and requests can
      continue without this logging setup.
  zh-CN:
    description: 应用启动时，此 Provider 会开启 Caldremch 诊断日志和网络日志监测，并注册应用生命周期监听。
    disableEffect: 停用后，自动诊断和网络日志会停止；应用页面和请求仍可在没有这套日志配置的情况下运行。
