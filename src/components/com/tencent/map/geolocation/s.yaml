i18n:
  en:
    description: When an app binds while requesting a location notification, the Tencent Location SDK
      uses this Service to keep the location session running in the foreground.
    disableEffect: Location work that relies on Tencent’s background service may stop, interrupting ongoing
      location updates in the app.
  zh-CN:
    description: 应用请求定位通知并绑定此服务时，腾讯定位 SDK 会让定位任务以前台服务的方式继续运行。
    disableEffect: 依赖腾讯后台服务的定位任务可能会停止，导致应用无法持续更新位置。
