i18n:
  en:
    description: When an ad download needs install permission, the Kuaishou SDK opens this Activity to
      take the user to Android's install-from-this-source setting. After the user returns, it resumes
      the pending app installation.
    disableEffect: The ad download may not be able to request install permission or resume installation.
  zh-CN:
    description: 广告下载需要安装权限时，快手 SDK 会打开此 Activity，引导用户进入 Android 的“允许安装此来源的应用”设置。用户返回后，它会继续等待中的应用安装。
    disableEffect: 广告下载可能无法申请安装权限或继续安装。
