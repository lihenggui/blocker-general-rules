  en:
    description: The NetEase Yunxin QChat UI SDK opens this screen when a server owner selects an announcement
      manager. It lets the owner change that person's permissions to post, edit the announcement channel,
      delete messages, manage members, and use emoji, or remove the person.
    disableEffect: The server owner cannot change or remove individual announcement managers through the
      built-in QChat screen.
  zh-CN:
    description: 网易云信 QChat 界面库会在服务器创建者选中公告管理员时打开此页。创建者可以调整此人发消息、编辑公告频道、删除消息、管理成员和使用表情的权限，也可以将其移除。
    disableEffect: 服务器创建者无法通过 QChat 内置界面调整或移除单个公告管理员。
