i18n:
  en:
    description: LikeMinds Chat-v1 runs this receiver when a user taps follow, reply, or mark-as-read
      actions in a chat notification. It also handles other notification buttons, such as voting or event
      actions, by submitting the requested action or opening its related screen.
    disableEffect: Chat and event notification buttons stop updating or opening their related content.
  zh-CN:
    description: 用户点击聊天通知中的关注、回复或标为已读操作时，LikeMinds Chat-v1 会运行此 Receiver。它也处理投票或活动等通知按钮，提交相应操作或打开相关页面。
    disableEffect: 停用后，聊天和活动通知按钮无法更新状态或打开相关内容。
