recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: When a user taps an Antsomi push notification or one of its buttons, this Receiver opens
      the configured destination and sends the click through the SDK's notification handler. Disabling
      it breaks those push interactions.
    disableEffect: Tapping Antsomi notifications or their buttons will no longer open the configured content.
  zh-CN:
    description: 用户点击 Antsomi 推送通知或其中的按钮时，此 Receiver 会打开配置的目标页面，并将点击交给 SDK 的通知处理流程。禁用后，这些推送交互将失效。
    disableEffect: 点击 Antsomi 通知或其中的按钮将无法打开配置的内容。
