i18n:
  en:
    description: Hive Promotion opens this screen when a promotion requests a video. It plays the requested
      clip and returns whether playback finished, was cancelled, or could not start.
    disableEffect: Hive promotional videos will not play; this removes that promotional content but does
      not disable the game's other Hive features.
  zh-CN:
    description: Hive Promotion 请求播放视频时会打开此界面。它播放相应的视频，并向应用返回播放已结束、已取消或无法启动的结果。
    disableEffect: Hive 推广视频将无法播放；这只会移除该推广内容，不会关闭游戏的其他 Hive 功能。
