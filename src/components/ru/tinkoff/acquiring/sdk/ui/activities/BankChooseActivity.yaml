i18n:
  en:
    description: The Tinkoff Acquiring SDK opens this Activity when a fast bank-transfer flow asks the
      shopper to choose a banking app. It can open the selected bank or a payment link in the browser.
    disableEffect: Shoppers cannot choose a banking app in this fast-transfer flow, so the transfer may
      not continue.
  zh-CN:
    description: 快速银行转账流程需要用户选择银行应用时，Tinkoff 收单 SDK 会打开此 Activity。它可以打开用户选择的银行应用，或在浏览器中打开付款链接。
    disableEffect: 用户将无法在此快速转账流程中选择银行应用，转账可能无法继续。
