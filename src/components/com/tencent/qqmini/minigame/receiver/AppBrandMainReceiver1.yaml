i18n:
  en:
    description: QQ Mini Game sends this Receiver an internal message for one of its mini-game tasks.
      It prepares the SDK for that task and passes the message on.
    disableEffect: The SDK cannot handle messages for this task, so games assigned to it may fail to start
      or respond.
  zh-CN:
    description: QQ 小游戏 SDK 向此 Receiver 发送小游戏任务的内部消息时，它会为该任务准备运行环境并把消息交给 SDK 继续处理。
    disableEffect: 停用后 SDK 无法处理该任务的内部消息，分配到这里的小游戏可能无法启动或响应。
