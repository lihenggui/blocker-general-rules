i18n:
  en:
    description: The MoPub (Twitter) Android ads SDK opens this Activity when it is ready to show a full-screen
      ad. It displays the ad and handles its playback and dismissal.
    disableEffect: MoPub full-screen ads will not open, while the app's other screens can still work.
  zh-CN:
    description: MoPub（Twitter）Android 广告 SDK 准备展示全屏广告时会打开此 Activity。它负责显示广告并处理播放和关闭。
    disableEffect: 禁用后，MoPub 全屏广告无法打开，应用的其他页面仍可使用。
