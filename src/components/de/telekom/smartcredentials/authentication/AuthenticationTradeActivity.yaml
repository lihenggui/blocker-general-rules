i18n:
  en:
    description: Telekom Smart Credentials opens this Activity as part of sign-in after an authorization
      response returns. It exchanges the returned code for tokens and sends success or cancellation back
      to the app.
    disableEffect: The Smart Credentials sign-in flow may fail to finish or return its result to the app.
  zh-CN:
    description: Telekom Smart Credentials 会在授权响应返回后，通过此 Activity 处理登录流程。它会用返回的代码换取令牌，并将成功或取消结果传回应用。
    disableEffect: Smart Credentials 登录流程可能无法完成，也可能无法将结果传回应用。
