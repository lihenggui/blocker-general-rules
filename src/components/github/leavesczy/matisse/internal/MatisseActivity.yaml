i18n:
  en:
    description: When an app starts media selection, Matisse by LeavesCZY opens this screen to browse
      and select photos or videos. It returns the chosen media to the app; capture and video playback
      use the other Matisse screens.
    disableEffect: Apps using Matisse will not be able to open the media picker or receive selected items.
  zh-CN:
    description: 应用启动媒体选择时，LeavesCZY 的 Matisse 会打开此界面供用户浏览和选择照片或视频，并把选中内容返回应用。拍摄和视频播放由 Matisse 的其他界面处理。
    disableEffect: 使用 Matisse 的应用将无法打开媒体选择器或收到用户选中的内容。
