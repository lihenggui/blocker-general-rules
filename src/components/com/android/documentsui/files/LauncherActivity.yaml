  en:
    description: Provides FilesActivity task grouping support. This allows multiple FilesActivities to
      be launched (a behavior imparted by way of @code documentLaunchMode="intoExisting" and our use of
      pseudo document Uris. This also lets us move an existing task to the foreground when a suitable
      task exists. Requires that @code documentLaunchMode="intoExisting" be set on target activity.
