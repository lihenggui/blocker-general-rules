i18n:
  en:
    description: When the game asks to share an image or link, the EGLS (EasyGames) support library opens
      Facebook's sharing dialog. It returns whether sharing succeeded, was cancelled, or failed.
    disableEffect: Players cannot share game images or links through Facebook using the SDK.
  zh-CN:
    description: 游戏请求分享图片或链接时，EGLS（EasyGames）支持库会打开 Facebook 分享对话框，并返回分享成功、取消或失败的结果。
    disableEffect: 停用后，玩家无法通过 SDK 在 Facebook 分享游戏图片或链接。
