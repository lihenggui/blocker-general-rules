i18n:
  en:
    description: Mercado Pago Android SDK opens this Activity to run a checkout from a payment preference
      supplied by the app. It retrieves or validates the preference, gathers payment information, and
      creates the payment.
    disableEffect: The integrated checkout cannot run or return its payment result to the app.
  zh-CN:
    description: 应用提供付款偏好后，Mercado Pago Android SDK 会打开此 Activity 执行结账。它会获取或校验付款偏好、收集付款信息并创建付款。
    disableEffect: 集成的结账流程将无法运行，也无法向应用返回付款结果。
