i18n:
  en:
    description: When an app starts an Okra financial-account connection or payment flow, this screen
      displays the Okra widget and returns its success, error, or close result to the app.
    disableEffect: Blocking it prevents users from completing account-connection or payment flows provided
      through the Okra SDK.
  zh-CN:
    description: 应用发起 Okra 金融账户连接或支付流程时，此页面会显示 Okra 组件，并将成功、错误或关闭结果返回给应用。
    disableEffect: 禁用后，用户将无法完成通过 Okra SDK 提供的账户连接或支付流程。
