i18n:
  en:
    description: Chuck, an Android in-app HTTP inspector, opens when a user selects a captured network
      request and shows its summary, request, response, search, and sharing options.
    disableEffect: The request details will not open in Chuck, but the app normal network calls will continue
      to work.
  zh-CN:
    description: Chuck 是 Android 应用内的 HTTP 检查工具；用户选中一条已记录的网络请求时，此页面会显示概要、请求内容、响应内容以及搜索和分享选项。
    disableEffect: Chuck 将无法打开请求详情，但应用的普通网络请求仍可正常进行。
