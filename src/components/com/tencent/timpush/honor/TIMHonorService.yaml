i18n:
  en:
    description: Tencent Cloud IM (TIM)'s Honor push provider starts with the app and registers its device-push
      connector. When requested, it enables Honor push and returns the registration result.
    disableEffect: Honor push registration stops, and a later token callback from the still-enabled Honor
      message service can fail because this provider is missing.
  zh-CN:
    description: 腾讯云 IM（TIM）的荣耀推送提供方会在应用启动时注册设备推送连接器。收到注册请求后，它会启用荣耀推送并返回注册结果。
    disableEffect: 荣耀推送注册会停止；如果仍启用的荣耀消息服务之后回传令牌，回调可能因该提供方缺失而失败。
