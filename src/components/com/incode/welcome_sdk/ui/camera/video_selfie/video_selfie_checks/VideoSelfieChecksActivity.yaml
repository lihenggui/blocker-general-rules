i18n:
  en:
    description: Before video recording, this screen lists the checks the user must complete, such as
      showing an ID, looking at the camera, and speaking a prompt. The MetaMap identity verification SDK
      opens this screen when the configured flow reaches this step.
    disableEffect: Disabling it prevents users from seeing and completing the required video-selfie instructions.
  zh-CN:
    description: 开始录制视频前，此页面会列出用户必须完成的检查，例如展示证件、看向相机和朗读提示内容。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，用户无法查看并完成视频自拍所需的说明。
