recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Android creates this iShow AndroidCommon Provider during app startup. It registers app-state
      tracking and initializes the library's image-loading support and logs.
    disableEffect: Disabling it leaves AndroidCommon image-loading and app-state support uninitialized,
      which can break features that use them.
  zh-CN:
    description: 应用启动时，Android 会创建 iShow AndroidCommon 的此 Provider。它注册应用状态跟踪，并初始化库的图片加载支持和日志记录。
    disableEffect: 停用后，AndroidCommon 的图片加载和应用状态支持无法初始化，使用这些功能的页面可能会受影响。
