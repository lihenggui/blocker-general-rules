i18n:
  en:
    description: JNDCrash, Ivan Arh’s native crash reporter, starts this service in a separate process
      when the app enables out-of-process crash handling. It collects native crash details and writes
      a report in the background.
    disableEffect: Native crash reports will no longer be collected by this service; normal app features
      should continue to work.
  zh-CN:
    description: Ivan Arh 的 JNDCrash 原生崩溃报告库在应用启用独立进程崩溃处理时启动此服务。它在后台收集原生崩溃信息并生成报告。
    disableEffect: 此服务将不再收集原生崩溃报告，但应用的普通功能应可继续使用。
