i18n:
  en:
    description: The AISpeech DUI/DDS notification monitor receives notification events after the user
      enables its accessibility service. It forwards each notification and the source app name to the
      SDK's notification listener.
    disableEffect: The SDK cannot monitor notifications or deliver notification updates to the app's listener.
  zh-CN:
    description: 用户在 Android 无障碍设置中启用 AISpeech DUI/DDS 通知监控后，此服务会接收通知事件，并将通知及来源应用名称交给 SDK 的通知监听器。
    disableEffect: SDK 将无法监控通知，也无法向本应用的监听器传递通知更新。
