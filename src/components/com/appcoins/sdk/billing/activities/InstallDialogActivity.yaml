      that need it cannot continue.
  zh-CN:
    description: 需要安装钱包时，AppCoins Billing SDK 会显示此界面，并提供打开应用商店或浏览器安装 AppCoins Wallet 的入口。
    disableEffect: 用户无法从支付流程安装所需的 AppCoins Wallet，依赖该钱包的购买将无法继续。
