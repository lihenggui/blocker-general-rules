    description: At app startup, Codlab's Sentry wrapper stores the app context that its error-reporting
      setup uses.
    disableEffect: Disabling it can make the wrapper's initialization fail and stop crash reports from
      being recorded.
  zh-CN:
    description: 应用启动时，Codlab 的 Sentry 封装会保存错误报告初始化所需的应用上下文。
    disableEffect: 停用后，该封装的初始化可能失败，崩溃报告也将无法记录。
