    description: Gimbal uses this Receiver at device startup or shutdown to restart or stop its background
      location service.
    disableEffect: Gimbal background location monitoring may not restart after the device boots, so location-triggered
      app features can stop updating.
  zh-CN:
    description: 设备启动或关闭时，Gimbal 会通过此接收器重启或停止后台定位服务。
