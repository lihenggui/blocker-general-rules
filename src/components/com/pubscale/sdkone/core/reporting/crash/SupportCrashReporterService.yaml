i18n:
  en:
    description: Pubscale SDKOne queues this background service for crash reports on its compatibility
      path. It uploads the report and saves it locally if the request fails.
    disableEffect: Crash reports handled by Pubscale's compatibility service will no longer be uploaded.
  zh-CN:
    description: Pubscale SDKOne 在兼容处理路径中会将崩溃报告任务交给此后台服务。服务会上传报告，并在请求失败时将报告保存在本地。
    disableEffect: 停用后，Pubscale 兼容服务处理的崩溃报告将无法上传。
