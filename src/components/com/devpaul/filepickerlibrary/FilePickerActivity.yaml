i18n:
  en:
    description: When an app opens the DeveloperPaul123 FilePicker library, this Activity lists storage
      folders and files so the user can browse, create a folder, and choose a file or folder; it returns
      the selected path to the app.
    disableEffect: The app cannot open this library file or folder picker or receive a selection through
      it.
  zh-CN:
    description: 应用打开 DeveloperPaul123 FilePicker 文件选择库时，此 Activity 会列出存储中的文件和文件夹，供用户浏览、创建文件夹并选择文件或文件夹，然后将所选路径返回给应用。
    disableEffect: 应用无法再通过此文件选择库打开文件或文件夹选择界面并获取所选路径。
