i18n:
  en:
    description: The Swirepay Android SDK's abstract base Activity supplies the shared in-app browser
      and file-selection behavior used by several specific payment and account screens. The SDK opens
      those specific screens; this base has no separate user-facing page.
    disableEffect: This abstract base Activity has no separate screen or task, so blocking its entry has
      no independent user-visible effect.
  zh-CN:
    description: Swirepay Android SDK 的此抽象基础 Activity 为多个支付和账户页面提供共用的应用内浏览及文件选择功能。SDK 会打开各个具体页面，此基础类本身没有独立的用户界面。
    disableEffect: 此抽象基础 Activity 没有独立页面或任务，停用它本身不会产生单独的用户可见影响。
