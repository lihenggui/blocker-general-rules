i18n:
  en:
    description: The FeedAd SDK binds to this background service for standalone ad requests and ad playback.
      It prepares a standalone placement and can request another ad when the placement is configured to
      reload.
    disableEffect: Standalone FeedAd requests and placements that depend on this service will stop working.
  zh-CN:
    description: FeedAd SDK 会绑定此后台服务来处理独立广告请求和播放；它准备独立广告位，并可按设置在广告结束后请求下一条广告。
    disableEffect: 独立 FeedAd 请求以及依赖此服务的广告位将无法使用。
