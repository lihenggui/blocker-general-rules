    description: The Auryc Android SDK starts this service during initialization. It periodically removes
      local session records and files after their event data and replay videos have been uploaded.
    disableEffect: Auryc will retain uploaded session records and files longer, which may use more device
      storage.
  zh-CN:
    description: Auryc Android SDK 初始化时会启动此服务；事件数据和回放视频上传后，它会定期清理对应的本地会话记录及文件。
    disableEffect: Auryc 会更久地保留已上传的会话记录和文件，可能占用更多设备存储空间。
