recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:51:03Z'
i18n:
  en:
    description: When a T-ID login link hands sign-in between an app and a webpage, this screen shows
      the login channel and asks the user to continue or cancel. The SDK returns that choice to the app.
    disableEffect: Blocking it prevents the T-ID login handoff from being confirmed, so sign-in through
      that provider cannot complete.
  zh-CN:
    description: T-ID 登录需要在应用与网页之间交接时，此界面会显示登录渠道并询问用户是否继续；SDK 会把选择返回应用。
    disableEffect: 停用后，T-ID 登录交接无法确认，通过该服务进行的登录将无法完成。
