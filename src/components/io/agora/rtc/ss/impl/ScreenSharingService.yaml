i18n:
  en:
    description: The Agora screen-sharing SDK keeps a sharing session connected and sends captured screen
      content to the other participants, with a visible notification while sharing is active. Disabling
      it prevents the app from starting or maintaining screen sharing.
    disableEffect: The app cannot start or maintain an Agora screen-sharing session.
  zh-CN:
    description: Agora 屏幕共享 SDK 会保持共享会话连接，并将采集到的屏幕画面发送给其他参与者；共享期间还会显示通知。禁用后，应用无法开始或维持屏幕共享。
    disableEffect: 应用无法开始或维持 Agora 屏幕共享会话。
