recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:04:01Z'
i18n:
  en:
    description: When Gamedock opens its optional rating prompt, this Activity collects a star rating
      and can open a feedback page or the app store. Users can also reject or postpone the prompt.
    disableEffect: Blocking it disables Gamedock's optional rating and feedback prompt; the app's other
      features remain available.
  zh-CN:
    description: Gamedock 打开可选评分提示时，此 Activity 会收集星级评分，并可打开反馈页面或应用商店。用户也可以拒绝或稍后处理。
    disableEffect: 停用后，Gamedock 的可选评分和反馈提示将无法使用；应用的其他功能仍可使用。
