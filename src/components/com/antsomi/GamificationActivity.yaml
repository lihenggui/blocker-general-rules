i18n:
  en:
    description: When an Antsomi gamification experience is opened, this Activity loads its web-based
      game or campaign and handles in-page media access, file sharing, and screen recording. Disabling
      it stops those user-facing experiences.
    disableEffect: Antsomi gamification pages and their sharing or recording features will no longer open.
  zh-CN:
    description: 打开 Antsomi 游戏化体验时，此 Activity 会加载网页游戏或活动，并处理页面内的媒体访问、文件分享和屏幕录像。禁用后，这些面向用户的体验将无法使用。
    disableEffect: Antsomi 游戏化页面及其分享或录像功能将无法打开。
