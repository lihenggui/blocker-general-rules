i18n:
  en:
    description: The Agora AVC conference app uses Xiaomi Mi Push to handle delivery, arrival, error,
      and registration events. When a user taps a Xiaomi push message containing a meeting invitation,
      this Receiver opens the invitation in the conference app.
    disableEffect: Xiaomi push messages and meeting invitations delivered through Xiaomi will no longer
      be received or opened.
  zh-CN:
    description: Agora AVC 会议应用通过小米 Mi Push 处理消息送达、到达、错误和注册事件。用户点击包含会议邀请的小米推送通知时，此 Receiver 会在会议应用中打开邀请。
    disableEffect: 小米推送消息和通过小米送达的会议邀请将无法接收或打开。
