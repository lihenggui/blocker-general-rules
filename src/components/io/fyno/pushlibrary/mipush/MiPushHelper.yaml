recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T00:04:01Z'
i18n:
  en:
    description: When Xiaomi Mi Push delivers or registers a message for Fyno, this Fyno Push Library
      receiver handles the message, displays Fyno notifications, and saves the Xiaomi push token.
    disableEffect: Blocking it stops Fyno push delivery through Xiaomi services and token updates; the
      host app's regular features remain available.
  zh-CN:
    description: 小米 Mi Push 为 Fyno 送达消息或完成注册时，Fyno Push Library 的此 Receiver 会处理消息、显示 Fyno 通知并保存小米推送令牌。
    disableEffect: 停用后，Fyno 将无法通过小米服务接收推送或更新令牌；宿主应用的常规功能仍可使用。
