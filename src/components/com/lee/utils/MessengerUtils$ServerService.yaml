recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:17:46Z'
i18n:
  en:
    description: Utils (shichuanenhui) starts this service when the app sends an internal message. It
      carries the message to the other parts of the app that are waiting for it.
    disableEffect: Messages sent through this utility will not reach the parts of the app waiting for
      them, so features that rely on those messages may stop working.
  zh-CN:
    description: Utils（shichuanenhui）会在应用发送内部消息时启动此服务，并将消息传递给应用中等待接收的部分。
    disableEffect: 通过此工具发送的消息将无法送达应用中等待接收的部分，因此依赖这些消息的功能可能无法使用。
