i18n:
  en:
    description: SEON's ID Verification Android SDK opens this screen when an app starts an identity check.
      It guides the user through document capture and verification, then returns the result to the app.
    disableEffect: Users cannot complete SEON identity verification in the app, so any signup or account
      action that requires it may be blocked.
  zh-CN:
    description: SEON 身份核验 Android SDK 会在应用启动身份核验时打开此页面，引导用户拍摄身份证件并完成核验，然后将结果返回应用。
    disableEffect: 停用后，用户无法在应用中完成 SEON 身份核验，依赖核验的注册或账户操作也可能无法继续。
