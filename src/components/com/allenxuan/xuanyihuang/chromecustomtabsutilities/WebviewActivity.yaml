i18n:
  en:
    description: Chrome Custom Tabs Utilities by Xuanyi Huang opens a URL supplied by the app in an in-app
      browser with JavaScript and a back button.
    disableEffect: Pages the app routes through this browser will not open, which can interrupt any in-app
      flow that uses them.
  zh-CN:
    description: Xuanyi Huang 的 Chrome Custom Tabs Utilities 会在应用请求时，通过内置浏览器打开网页，并启用 JavaScript 和返回按钮。
    disableEffect: 停用后，应用通过此浏览器打开的页面将无法显示，使用这些页面的应用流程也会中断。
