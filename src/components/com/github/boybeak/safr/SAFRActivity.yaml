i18n:
  en:
    description: Boybeak SAFR opens this helper when the app asks it to launch another app or system screen
      for a result. It forwards the requested action and returns the result to the app.
    disableEffect: Any app flow using SAFR to open another screen and receive its result can no longer
      complete.
  zh-CN:
    description: 应用通过 Boybeak SAFR 启动其他应用或系统页面并等待结果时，会打开此辅助页面转发操作，再将结果返回应用。
    disableEffect: 任何依赖 SAFR 打开其他页面并接收返回结果的流程都将无法完成。
