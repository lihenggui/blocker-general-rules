    description: The NetEase Yunxin TeamKit Activity opens team-management controls for who may invite
      members or edit team details, group-join approval, and member mention or pin permissions; it also
      opens the manager list.
    disableEffect: Owners and managers lose this page’s controls for team permissions, joining rules,
      and managers.
  zh-CN:
    description: 网易云信 TeamKit 的此 Activity 提供群管理设置，可调整邀请成员和修改群信息的权限、入群方式，以及全体提醒和置顶消息的权限，并可打开管理员列表。
    disableEffect: 停用后，群主和管理员无法使用此页面调整群权限、入群规则或管理员名单。
