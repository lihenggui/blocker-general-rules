i18n:
  en:
    description: Particle Network Wallet opens this Activity when a user scans a wallet address or connection
      code; it can scan with the camera or read a QR code from an image. It returns scanned addresses
      to the caller and can start a WalletConnect connection.
    disableEffect: Scanning wallet addresses and connecting to wallets through QR codes will stop working.
  zh-CN:
    description: 用户扫描钱包地址或连接码时，Particle Network 钱包会打开此 Activity；它可以使用相机扫描，也可以读取图片中的二维码。它会将扫描到的地址返回给调用方，也可以发起
      WalletConnect 连接。
    disableEffect: 二维码扫描钱包地址和连接钱包的功能将无法使用。
