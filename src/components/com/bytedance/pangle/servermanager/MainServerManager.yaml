recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: Pangle (ByteDance) uses this provider to connect its ad process to the main ad service
      and obtain service connections when the app process starts. It has no screen.
    disableEffect: Pangle ads and their plug-in services will stop working, while the app’s non-ad features
      remain available.
  zh-CN:
    description: Pangle（字节跳动）会通过此提供程序连接广告进程与主广告服务，并取得广告服务连接；它在应用进程启动时由系统创建，不显示界面。
    disableEffect: Pangle 广告及其插件服务将无法使用，应用的非广告功能仍可运行。
