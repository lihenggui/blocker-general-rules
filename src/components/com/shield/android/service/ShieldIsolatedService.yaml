i18n:
  en:
    description: When IDWise Device Intel Shield checks device integrity, it binds this isolated service
      to look for Magisk or Zygisk root tools; the check runs in a separate background process without
      a screen.
    disableEffect: Shield loses this root-detection check and may not complete its device-risk assessment.
  zh-CN:
    description: IDWise Device Intel Shield 检查设备完整性时，会绑定此隔离服务来检测 Magisk 或 Zygisk 等 root 工具；该检查在独立后台进程中运行，不显示页面。
    disableEffect: Shield 将失去这项 root 检测，设备风险评估可能无法完成。
