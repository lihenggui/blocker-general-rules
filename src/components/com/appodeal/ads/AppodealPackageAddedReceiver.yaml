i18n:
  en:
    description: When Android reports that an app was installed, the Appodeal Ads SDK checks whether it
      matches an advertised app and records an install attribution event.
    disableEffect: Appodeal install attribution stops; the app’s other features continue to work.
  zh-CN:
    description: Android 通知有应用安装时，Appodeal Ads SDK 会检查它是否与推广应用匹配，并记录安装归因事件。
    disableEffect: Appodeal 的安装归因将停止，应用的其他功能仍可使用。
