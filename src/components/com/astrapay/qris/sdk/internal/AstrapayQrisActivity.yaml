i18n:
  en:
    description: When an integrated app launches AstraPay's QRIS scanner, this screen requests camera
      access, scans payment QR codes, and returns scan events to the app.
    disableEffect: The app cannot open this scanner, so QR scanning flows that use it will stop working.
  zh-CN:
    description: 集成应用启动 AstraPay QRIS 扫码功能时，此页面会申请相机权限、扫描付款二维码并将扫码结果返回应用。
    disableEffect: 应用无法打开此扫码页面，因此依赖它的二维码扫描流程将无法使用。
