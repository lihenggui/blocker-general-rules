i18n:
  en:
    description: When AppLovin starts a fullscreen ad, this Activity displays it and handles playback,
      clicks, and closing. It is used for fullscreen video and rewarded ads.
    disableEffect: AppLovin fullscreen ads will no longer open, and rewards for watching rewarded ads
      will no longer be granted.
  zh-CN:
    description: AppLovin 启动全屏广告时，此 Activity 会显示广告并处理播放、点击和关闭操作。它用于全屏视频广告和激励广告。
    disableEffect: AppLovin 全屏广告将无法打开，观看激励广告也将不再获得奖励。
