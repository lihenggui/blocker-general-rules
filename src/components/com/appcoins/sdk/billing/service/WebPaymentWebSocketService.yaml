i18n:
  en:
    description: Older AppCoins Billing SDK versions start this Service for web payments. It runs the
      WebSocket server that exchanges payment status between the payment page and the app.
    disableEffect: The older AppCoins web payment flow will not be able to exchange payment status through
      its WebSocket server.
  zh-CN:
    description: 较早版本的 AppCoins Billing SDK 会在网页支付时启动此服务，为支付网页和应用之间的状态通信运行 WebSocket 服务。
    disableEffect: 旧版 AppCoins 网页支付将无法通过 WebSocket 交换支付状态。
