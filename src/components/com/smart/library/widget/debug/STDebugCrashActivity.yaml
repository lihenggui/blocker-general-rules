  en:
    description: Smart Library uses this separate debug screen when its troubleshooting tools need to
      show diagnostic or crash details. It provides a place to review that information.
    disableEffect: Developers may lose the optional in-app diagnostics view when investigating crashes;
      ordinary app pages can still use the shared screen host.
