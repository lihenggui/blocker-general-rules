i18n:
  en:
    description: When Android asks ODK Collect to create a shortcut, this screen lets the user choose
      a form and returns a shortcut that opens it. It is part of the Samagra ODK Collect client.
    disableEffect: Users will no longer be able to create home-screen shortcuts for individual forms.
  zh-CN:
    description: Android 请求 ODK Collect 创建快捷方式时，此页面会让用户选择表单，并返回可直接打开该表单的快捷方式。 它是 Samagra 构建的 ODK Collect
      客户端的一部分。
    disableEffect: 停用后，用户将无法为单个表单创建主屏幕快捷方式。
