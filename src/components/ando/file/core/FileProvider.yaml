  en:
    description: Ando File Operator (Javakam) uses this provider when the app opens or shares local files
      through the library. It gives another app temporary access to a selected file.
    disableEffect: File opening or sharing through Ando File Operator can fail if this provider is disabled.
  zh-CN:
    description: 应用通过 Ando File Operator（Javakam）打开或分享本地文件时，会用此内容提供器让其他应用临时读取所选文件。
    disableEffect: 停用后，通过 Ando File Operator 打开或分享文件的功能可能失效。
