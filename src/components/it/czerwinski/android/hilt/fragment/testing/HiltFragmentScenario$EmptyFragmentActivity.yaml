i18n:
  en:
    description: When Hilt-based fragment tests run, this Dagger Hilt testing library launches a blank
      host Activity with the requested theme and hosts the fragment under test.
    disableEffect: Tests that use this library can no longer launch their fragment; regular app screens
      are unaffected.
  zh-CN:
    description: 运行 Hilt Fragment 测试时，Dagger Hilt 测试库会启动一个空白宿主 Activity，应用指定主题并承载待测 Fragment。
    disableEffect: 使用此测试库的测试将无法启动待测 Fragment，应用的日常界面不受影响。
