i18n:
  en:
    description: Magic-Box (HiJesse developer toolkit) opens a diagnostics dashboard when the app requests
      it. The dashboard controls CPU, memory, and frame-rate monitoring, request logging, and tests that
      simulate blocked, slow, or timed-out network access.
    disableEffect: The developer dashboard and its monitoring and network simulation controls will be
      unavailable; regular app screens remain available.
  zh-CN:
    description: Magic-Box（HiJesse 开发工具包）会在应用请求时打开诊断面板。面板可控制 CPU、内存和帧率监测、请求日志，以及模拟断网、低速或超时网络。
    disableEffect: 开发诊断面板及其监测和网络模拟功能将无法使用，应用的常规界面仍可使用。
