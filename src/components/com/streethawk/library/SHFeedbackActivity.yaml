recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:03:24Z'
i18n:
  en:
    description: This component is part of the StreetHawk mobile engagement SDK. StreetHawk opens this
      Activity from a campaign feedback prompt. It lets the user enter a subject and comment, sends the
      feedback to StreetHawk, and reports whether the prompt was accepted or dismissed.
    disableEffect: Users will not be able to open StreetHawk's built-in feedback form from campaign prompts.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。StreetHawk 会在活动反馈提示中打开此界面。用户可以填写主题和意见，提交给 StreetHawk；界面还会报告用户是否接受或关闭了提示。
    disableEffect: 用户将无法从活动提示打开 StreetHawk 内置的反馈表单。
