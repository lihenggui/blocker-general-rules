recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T01:47:22Z'
i18n:
  en:
    description: When a developer opens a Rangers AppLog debug link from its QR workflow, ByteDance's
      Rangers AppLog SDK checks the app's logging session and starts an event-simulation session in the
      app.
    disableEffect: Blocking it only prevents this AppLog QR-based debug session; normal app startup and
      features remain available.
  zh-CN:
    description: 开发者通过 Rangers AppLog 的二维码流程打开调试链接时，字节跳动的 Rangers AppLog SDK 会校验应用的日志会话，并在应用中启动事件模拟会话。
    disableEffect: 停用后将无法通过 AppLog 二维码启动此调试会话，应用的正常启动和功能不受影响。
