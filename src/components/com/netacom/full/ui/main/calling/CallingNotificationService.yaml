  en:
    description: During an active NetAlo call, this service keeps an ongoing notification with the caller,
      call type, and elapsed time when the call screen moves to the background. Tapping the notification
      returns to NetAlo.
    disableEffect: The ongoing call notice and its return-to-call shortcut may be unavailable while the
      call screen is in the background.
  zh-CN:
    description: NetAlo 通话界面转入后台后，此服务会显示持续通知，列出通话对象、通话类型和已通话时间。点击通知可返回 NetAlo。
    disableEffect: 通话界面在后台时，持续通话通知及返回通话的入口可能无法使用。
