i18n:
  en:
    description: CloudFive Push receives Firebase messages for the app and forwards their data to its
      push handler. It also forwards refreshed Firebase messaging tokens so the app can remain registered
      for push delivery.
    disableEffect: The app will stop receiving CloudFive push messages and Firebase token updates through
      this service.
  zh-CN:
    description: CloudFive Push 会接收发送给应用的 Firebase 消息，并将消息数据转交给推送处理程序。它也会转交更新后的 Firebase 消息令牌，以维持推送注册。
    disableEffect: 应用将无法再通过此服务接收 CloudFive 推送消息或 Firebase 令牌更新。
