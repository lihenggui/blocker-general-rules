recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T15:21:12Z'
i18n:
  en:
    description: AndroidX Health Connect Client exposes this Service to the Health Connect system app
      for permission-state requests. It lets that app update or retrieve the current permission token
      and check whether the calling app is in the foreground.
    disableEffect: Health Connect permission checks and health data access for the app may fail.
  zh-CN:
    description: AndroidX Health Connect Client 通过此 Service 响应 Health Connect 系统应用的权限状态请求。系统应用可借此更新或读取当前权限令牌，并检查发起请求的应用是否位于前台。
    disableEffect: 此应用的 Health Connect 权限检查和健康数据访问可能失败。
