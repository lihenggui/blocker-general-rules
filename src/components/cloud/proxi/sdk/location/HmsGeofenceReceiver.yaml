i18n:
  en:
    description: When Huawei location services reports a Proxi.cloud area entry, exit, location update,
      or provider change, this receiver forwards it for proximity processing.
    disableEffect: Huawei-based Proxi.cloud location messages and event reports stop; other app features
      remain available.
  zh-CN:
    description: 华为定位服务报告进入或离开 Proxi.cloud 区域、位置更新或定位服务变化时，这个接收器会转交事件进行邻近处理。
    disableEffect: 禁用后，基于华为定位服务的 Proxi.cloud 位置消息和事件报告将停止，但应用的其他功能仍可使用。
