      may fail.
  zh-CN:
    description: ProcessOut Android SDK 会在浏览器标签页中打开支付服务商的授权页面，并等待回跳链接，再将结果交回结账流程。
    disableEffect: 重定向式支付授权无法返回应用，相关支付可能失败。
