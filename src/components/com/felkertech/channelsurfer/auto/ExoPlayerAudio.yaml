recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:55:18Z'
i18n:
  en:
    description: ChannelSurfer exposes this Service to Android media clients that request a media browser.
      It creates an empty media session and returns no media items; its play, pause, and seek controls
      have no behavior.
    disableEffect: Android media clients will no longer discover this empty media service; the component
      currently exposes no playable items or working playback controls.
  zh-CN:
    description: Android 媒体客户端请求媒体浏览服务时，ChannelSurfer 会提供此 Service。它会创建一个空媒体会话且不返回媒体项目，播放、暂停和拖动控制也没有实际操作。
    disableEffect: Android 媒体客户端将无法再发现此空媒体服务；该组件目前没有可播放项目或可用的播放控制。
