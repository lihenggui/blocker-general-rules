    description: UpdateX, shiweibsw's Android update library, declares this private Receiver for Android's
      package-replaced broadcast. In version 1.0.1 its handler is empty, so it performs no work when that
      event arrives.
    disableEffect: There is no behavior to lose in this version; the app's update features are unaffected.
