i18n:
  en:
    description: Ando Gallery uses this screen when its picker routes photo, video, or audio capture through
      the device camera or recorder. It requests the needed permission, processes the returned file, and
      adds it to the selection result.
    disableEffect: The picker's standard camera or audio-capture flow can no longer return media to the
      app.
  zh-CN:
    description: Ando Gallery 通过设备相机或录音工具拍摄照片、视频或音频时，会使用此页面。它会请求所需权限、处理返回的文件，并将媒体加入选择结果。
    disableEffect: 选择器将无法再把通过普通相机或录音流程获得的媒体返回给应用。
