    description: Android Automotive Car UI starts this provider at app launch to load its UI plugin and
      register lifecycle handling for screens configured to use Car UI layouts.
    disableEffect: Car UI screens may lose their plugin, layout, and inset setup and display or behave
      incorrectly.
