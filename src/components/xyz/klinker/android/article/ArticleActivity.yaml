recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T20:04:30Z'
i18n:
  en:
    description: When an app opens an article URL with Klinker's Android Article Viewer, this Activity
      fetches and displays the article. If the page cannot be parsed as an article, it opens the URL in
      a browser custom tab.
    disableEffect: The app's Klinker article reader will not open, so article reading through that screen
      is unavailable.
  zh-CN:
    description: 应用使用 Klinker Android Article Viewer 打开文章链接时，此 Activity 会获取并显示文章；如果页面无法解析为文章，则会在浏览器自定义标签页中打开链接。
    disableEffect: 应用的 Klinker 文章阅读页面将无法打开，用户不能通过该页面阅读文章。
