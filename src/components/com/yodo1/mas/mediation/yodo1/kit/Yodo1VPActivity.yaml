i18n:
  en:
    description: Yodo1 MAS starts this screen when it shows a rewarded video or rewarded interstitial,
      plays a cached video, and reports completion for the reward.
    disableEffect: Those video ads will not play, and rewards for watching ads will no longer be granted.
  zh-CN:
    description: Yodo1 MAS 展示激励视频或激励插屏广告时会打开此页面播放已缓存的视频，并在播放结束后通知广告系统发放奖励。
    disableEffect: 停用后，这些视频广告无法播放，观看广告的奖励也不会发放。
