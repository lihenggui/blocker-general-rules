i18n:
  en:
    description: This component is part of the StreetHawk mobile engagement SDK. Google Cloud Messaging
      starts this older StreetHawk service when a message is delivered. It is the SDK's GCM entry point
      and delegates delivery to StreetHawk's message handler.
    disableEffect: StreetHawk push messages delivered through this older integration will stop.
  zh-CN:
    description: 此组件属于 StreetHawk 移动互动 SDK。收到消息时，Google Cloud Messaging 会启动此旧版 StreetHawk 服务。它是 SDK 的
      GCM 接收入口，并将消息交给 StreetHawk 处理。
    disableEffect: 通过此旧版集成送达的 StreetHawk 推送消息将停止。
