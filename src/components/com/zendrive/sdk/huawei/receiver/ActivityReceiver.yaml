i18n:
  en:
    description: In older Zendrive Huawei integrations, this Receiver converts Huawei activity-recognition
      updates into movement events for Zendrive's driving tracker.
    disableEffect: Zendrive may miss movement changes used to identify drives on Huawei devices.
  zh-CN:
    description: 在较早的 Zendrive 华为集成中，此 Receiver 会把华为活动识别更新转换为移动事件，交给 Zendrive 行车跟踪功能。
    disableEffect: Zendrive 可能会漏掉华为设备上用于识别行程的移动状态变化。
