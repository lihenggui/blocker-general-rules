recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:48:24Z'
i18n:
  en:
    description: The React Native WebView library uses this provider when an embedded page requests a
      camera photo or video for upload. It makes the captured file available to the page through Android's
      private file-sharing system.
    disableEffect: Camera-based photo or video uploads from embedded web pages may fail.
  zh-CN:
    description: 内置网页请求拍摄照片或视频并上传时，React Native WebView 会使用此文件提供程序。它通过 Android 的私有文件共享机制将拍摄的文件交给网页。
    disableEffect: 内置网页可能无法通过相机拍摄并上传照片或视频。
