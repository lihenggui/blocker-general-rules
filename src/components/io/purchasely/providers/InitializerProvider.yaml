i18n:
  en:
    description: Purchasely's subscription SDK uses this provider during app startup to give its manager
      the application context needed by later SDK features.
    disableEffect: Disabling it prevents Purchasely from receiving its startup context, so paywall and
      subscription features may fail to initialize.
  zh-CN:
    description: Purchasely 订阅 SDK 会在应用启动时通过此 Provider 为管理器设置应用环境，供后续 SDK 功能使用。
    disableEffect: 停用后，Purchasely 无法在启动时取得应用环境，付费墙和订阅功能可能无法初始化。
