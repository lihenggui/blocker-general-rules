recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:07:28Z'
i18n:
  en:
    description: When a browser returns through a Stytch sign-in link, Android opens this Activity to
      pass the returned address into the ongoing single sign-on flow.
    disableEffect: If disabled, Stytch cannot receive the browser sign-in response, so single sign-on
      may fail.
  zh-CN:
    description: 浏览器通过 Stytch 登录链接返回时，Android 会打开此 Activity，把返回信息交给正在进行的单点登录流程。
    disableEffect: 停用后，Stytch 无法接收浏览器返回的登录结果，单点登录可能失败。
