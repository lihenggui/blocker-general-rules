i18n:
  en:
    description: The LivePerson Messaging SDK uses this service to upload, download, or retry transfers
      of images, voice clips, and other files shared in chats, showing a progress notification while they
      run. Disabling it interrupts those attachment transfers.
    disableEffect: Chat attachments and voice clips may not upload, download, or finish retrying.
  zh-CN:
    description: LivePerson 消息 SDK 会用这项服务上传、下载或重新传输聊天中的图片、语音和其他文件，并在传输时显示进度通知。禁用后，这些附件传输会中断。
    disableEffect: 聊天附件和语音可能无法上传、下载或完成重试。
