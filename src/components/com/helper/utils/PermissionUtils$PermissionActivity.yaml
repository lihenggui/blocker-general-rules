  en:
    description: When UtilsX requests a runtime permission or special access such as overlay or file access,
      this transparent Activity opens the Android prompt or settings page and returns the result.
    disableEffect: Permission requests through UtilsX cannot complete, which can stop features that need
      those permissions.
  zh-CN:
    description: UtilsX 请求运行时权限或悬浮窗、文件访问等特殊权限时，此透明 Activity 会打开 Android 权限提示或设置页面，并将结果返回。
    disableEffect: 通过 UtilsX 发起的权限请求将无法完成，依赖这些权限的功能也可能停止。
