recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:34:13Z'
i18n:
  en:
    description: Identos CardReader Provider (gematik) opens this Activity when a supported Identos USB
      card reader is attached. It makes the reader available to the app and then closes.
    disableEffect: The app will not detect newly attached Identos readers, so reading cards through them
      will fail.
  zh-CN:
    description: Identos CardReader Provider（gematik）会在连接受支持的 Identos USB 读卡器时打开此 Activity。它将读卡器交给应用使用，随后关闭。
    disableEffect: 应用将无法发现新连接的 Identos 读卡器，也就无法通过它读取卡片。
