    name: Prebid Mobile
    description: 'Native iOS and Android solutions to enable header bidding within a mobile app.

      Header bidding is a response to the “waterfall” method, a fragmented and highly inefficient process
      for implementing programmatic advertising. Instead of offering impressions to one partner at a time,
      header bidding lets all partners bid simultaneously. With header bidding, publishers can also receive
      bids that may be unavailable through their primary ad server.'
