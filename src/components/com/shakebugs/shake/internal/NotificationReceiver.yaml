recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T21:48:03Z'
i18n:
  en:
    description: Shake's bug-reporting SDK runs this receiver when someone uses Quick Reply on a Shake
      chat notification. It sends the typed reply to that ticket and refreshes the notification.
    disableEffect: Users cannot reply to Shake chat messages from the notification, while the host app's
      normal screens continue to work.
  zh-CN:
    description: 用户点击 Shake 聊天通知中的快捷回复时，Shake 缺陷反馈 SDK 会运行此接收器，把回复发送到对应对话并更新通知。
    disableEffect: 用户无法直接从通知回复 Shake 消息，但应用本身仍可正常使用。
