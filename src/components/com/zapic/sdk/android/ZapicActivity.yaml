  en:
    description: Zapic's Android game platform opens this Activity when a game launches one of its pages;
      it shows the page inside the game and lets the page select a photo or take one with the camera.
    disableEffect: Zapic pages and game features delivered through those pages will not open.
  zh-CN:
    description: 游戏打开 Zapic 平台页面时会启动此 Activity；它在游戏内显示页面，并允许页面选择照片或调用相机拍摄。
    disableEffect: Zapic 页面及通过这些页面提供的游戏功能将无法打开。
