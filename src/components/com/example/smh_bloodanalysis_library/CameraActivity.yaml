i18n:
  en:
    description: SmH Blood Analysis opens this camera Activity when an app starts scanning a blood-test
      report. It reads text from the live camera view and returns the extracted analysis to the calling
      screen.
    disableEffect: The app cannot scan blood-test reports with this screen or receive its extracted readings.
  zh-CN:
    description: 应用开始扫描血液检测报告时，SmH Blood Analysis 会打开此相机 Activity。它读取实时画面中的文字，并将提取出的分析结果返回调用页面。
    disableEffect: 应用将无法通过此页面扫描血液检测报告或接收提取出的检测结果。
