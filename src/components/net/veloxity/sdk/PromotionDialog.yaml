i18n:
  en:
    description: When a user opens a Veloxity promotion, this Activity can show an offer dialog or web
      view, open a web link, or launch the promoted app.
    disableEffect: Veloxity promotion screens and their links will not open; the host app’s ordinary features
      remain available.
  zh-CN:
    description: 用户打开 Veloxity 推广内容时，此 Activity 可以显示优惠对话框或网页、打开网页链接，或启动推广的应用。
    disableEffect: Veloxity 推广界面及其链接将无法打开；宿主应用的普通功能仍可使用。
