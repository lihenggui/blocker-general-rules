i18n:
  en:
    description: The HERE SDK bundled by The Ahoy App binds to this background service when an app uses
      positioning. It prepares the location engine and supplies the connection used for location updates.
    disableEffect: The app may lose HERE location updates used to position maps or guide navigation.
  zh-CN:
    description: 应用使用定位功能时，The Ahoy App 所包含的 HERE SDK 会绑定此后台服务。它准备定位引擎，并提供接收位置更新所需的连接。
    disableEffect: 应用可能无法收到 HERE 位置更新，影响地图定位或导航指引。
