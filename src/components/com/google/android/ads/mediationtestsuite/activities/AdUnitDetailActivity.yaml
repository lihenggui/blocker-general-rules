recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:15:26Z'
i18n:
  en:
    description: Google Mobile Ads Mediation Test Suite opens this screen after a developer selects an
      ad unit. It lists that unit's mediation network configurations and can load test ads from selected
      networks.
    disableEffect: Developers can no longer inspect or batch-test an ad unit's mediation sources here;
      regular ad delivery is unaffected.
  zh-CN:
    description: 开发者在 Google Mobile Ads 中介测试套件里选择广告单元后，会打开此页面。页面列出该单元的中介网络配置，并可从选定网络加载测试广告。
    disableEffect: 开发者将无法在此查看广告单元的中介来源或批量测试广告；常规广告投放不受影响。
