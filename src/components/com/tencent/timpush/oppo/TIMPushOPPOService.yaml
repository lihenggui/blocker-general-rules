i18n:
  en:
    description: Tencent Cloud IM's provider registers the Oppo push channel; when TIMPush requests registration,
      it starts Oppo push with the app's credentials and schedules a retry if needed.
    disableEffect: The app will no longer register or receive push through the Oppo channel in TIMPush.
  zh-CN:
    description: 腾讯云 IM 的此提供程序会注册 Oppo 推送通道；TIMPush 请求注册时，它使用应用凭据启动 Oppo 推送，并在需要时安排重试。
    disableEffect: 停用后，应用将无法通过 TIMPush 注册或接收 Oppo 通道的推送。
