i18n:
  en:
    description: The NetEase Yunxin SMS Login SDK opens this in-app browser for links configured on its
      login and registration screens, such as terms or privacy pages. It displays web pages inside the
      app and hands non-web links to another app when available.
    disableEffect: Users cannot open configured terms, privacy, or other login-screen links through this
      in-app browser.
  zh-CN:
    description: 网易云信短信登录库会在用户点按登录或注册页面配置的链接时打开此内置浏览器，例如服务条款或隐私页面。它在应用内显示网页，并在有可用应用时将非网页链接交给其他应用打开。
    disableEffect: 用户无法通过此内置浏览器打开登录页面配置的条款、隐私或其他链接。
