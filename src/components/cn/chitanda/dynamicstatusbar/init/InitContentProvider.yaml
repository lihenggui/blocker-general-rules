i18n:
  en:
    description: The DynamicStatusBar library follows app screen lifecycle changes and applies its dynamic
      status bar appearance while screens are active.
    disableEffect: Disabling it stops DynamicStatusBar from automatically applying its status bar style
      to app screens.
  zh-CN:
    description: DynamicStatusBar 会跟随应用界面的打开和关闭，在界面显示期间应用其动态状态栏样式。
    disableEffect: 停用后，DynamicStatusBar 无法自动调整应用界面的状态栏样式。
