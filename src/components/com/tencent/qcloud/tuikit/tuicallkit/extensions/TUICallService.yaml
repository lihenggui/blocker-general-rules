i18n:
  en:
    description: Tencent Cloud TRTC TUICallKit starts this foreground Service when a call is accepted
      so the call can stay active while the app is in the background. It also posts the ongoing-call notification.
    disableEffect: An active call loses this keep-alive foreground service when the app moves to the background.
  zh-CN:
    description: 腾讯云 TRTC TUICallKit 会在通话接通后启动此 Service，帮助应用切到后台时继续维持通话，并显示正在通话的通知。
    disableEffect: 停用后，应用进入后台时将失去这项通话保活服务。
