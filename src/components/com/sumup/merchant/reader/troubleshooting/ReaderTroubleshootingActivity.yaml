i18n:
  en:
    description: SumUp Reader opens this screen when reader setup or a connection needs troubleshooting.
      It shows recovery steps for the reported reader issue and returns the result to setup.
    disableEffect: If disabled, reader troubleshooting and some connection-recovery flows cannot run,
      which can leave setup blocked.
  zh-CN:
    description: 读卡器设置或连接需要排查时，SumUp Reader 会打开此页面，根据读卡器问题显示恢复步骤，并把结果返回设置流程。
    disableEffect: 停用后，读卡器故障排查和部分连接恢复流程无法使用，设置过程可能受阻。
