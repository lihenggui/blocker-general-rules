  en:
    description: When a NetEase Yunxin CallKit video session needs to continue in the background, this
      Service posts a notification and keeps camera and microphone use in the foreground.
    disableEffect: Video sessions that rely on this service may lose camera or microphone use when the
      app is no longer visible.
  zh-CN:
    description: NetEase 云信 CallKit 的视频会话需要在后台继续时，此 Service 会显示通知，并让相机和麦克风持续处于前台使用状态。
    disableEffect: 依赖此服务的视频会话可能在应用不可见时失去相机或麦克风。
