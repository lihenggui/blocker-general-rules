i18n:
  en:
    description: When the older HelpCrunch SDK queues a file download, this service fetches the supplied
      address, saves the file in app storage, and reports when the download finishes.
    disableEffect: HelpCrunch will not be able to download files through this service, so attachment downloads
      may fail.
  zh-CN:
    description: 旧版 HelpCrunch SDK 将文件加入下载队列时，此服务会获取指定网址、将文件保存到应用存储中，并报告下载完成状态。
    disableEffect: HelpCrunch 将无法通过此服务下载文件，附件下载可能失败。
