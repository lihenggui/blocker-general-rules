  en:
    description: Neokred Card Details opens its card-management screen when an app starts this card flow.
      It uses the supplied customer and client information to load card details and provide virtual-card
      controls such as blocking a card or changing online transaction access.
    disableEffect: Users cannot open Neokred's card details and virtual-card management flow in the app.
  zh-CN:
    description: Neokred Card Details 会在应用启动卡片管理流程时显示卡片界面。它使用应用传入的客户及应用信息加载卡片详情，并提供锁定虚拟卡、开关线上交易等操作。
    disableEffect: 停用后，用户将无法在应用中打开 Neokred 的卡片详情和虚拟卡管理流程。
