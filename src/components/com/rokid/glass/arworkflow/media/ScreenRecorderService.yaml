i18n:
  en:
    description: The Rokid Glass media SDK starts this foreground service after Android grants screen-capture
      access. It keeps the capture session available to the meeting media system for sharing or recording
      the phone display.
    disableEffect: Rokid meeting screen sharing and screen recording cannot use the display capture session.
  zh-CN:
    description: Android 授予屏幕捕获权限后，Rokid Glass 媒体 SDK 会启动此前台服务，为会议媒体系统保留屏幕捕获会话，以便共享或录制手机画面。
    disableEffect: 停用后，Rokid 会议无法使用此屏幕捕获会话来共享或录制手机画面。
