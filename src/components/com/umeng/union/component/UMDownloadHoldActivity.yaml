recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:48:37Z'
i18n:
  en:
    description: When an Umeng Union download is ready to install but Android requires installation permission,
      this Activity shows the permission prompt and continues the installer flow after the user responds.
    disableEffect: Users may be unable to grant installation permission and continue installing apps downloaded
      from Umeng Union ads; the app's other features continue to work.
  zh-CN:
    description: 友盟 Union 下载的应用准备安装但 Android 要求先授权时，此 Activity 会显示授权提示，并在用户响应后继续安装流程。
    disableEffect: 停用后，用户可能无法授予安装权限并继续安装友盟 Union 广告下载的应用；应用的其他功能仍可使用。
