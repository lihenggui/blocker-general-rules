  en:
    description: When a user chooses card scanning in Hyperswitch checkout, this Activity opens the camera-based
      card scanner and sends the scanned card number or a cancelled or failed result back to checkout.
    disableEffect: If disabled, users cannot complete checkout by scanning a card through this flow.
  zh-CN:
    description: 用户在 Hyperswitch 结账时选择扫描银行卡，SDK 会通过此 Activity 打开相机扫描界面，并将卡号或取消、失败结果返回结账流程。
    disableEffect: 停用后，用户将无法通过此流程扫描银行卡完成结账。
