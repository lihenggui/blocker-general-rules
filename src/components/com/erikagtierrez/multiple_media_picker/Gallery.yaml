i18n:
  en:
    description: Multiple Media Picker (Erika Gutiérrez) opens this screen when an app asks the user to
      choose media. It shows photos and videos in separate tabs and returns the selected items when the
      user confirms.
    disableEffect: The app cannot open this gallery picker or receive the selected photos and videos.
  zh-CN:
    description: 应用请求用户选择媒体文件时，Multiple Media Picker（Erika Gutiérrez）会打开此界面。它将照片和视频分栏显示，并在用户确认后把所选文件返回给应用。
    disableEffect: 应用将无法打开此图库选择界面，也无法收到用户选择的照片和视频。
