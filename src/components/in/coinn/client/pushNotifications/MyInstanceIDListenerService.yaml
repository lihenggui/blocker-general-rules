lastUpdateTime: '2026-10-28T23:53:32Z'
i18n:
  en:
    description: When Google's messaging service reports a changed device token, this Coinn Proximity
      Service starts the token-registration task so the push subscription can be refreshed.
    disableEffect: A refreshed device token will no longer be registered for Coinn push messages, so those
      messages may stop arriving.
  zh-CN:
    description: Google 消息服务报告设备令牌已变化时，此 Coinn Proximity Service 会启动令牌注册任务以刷新推送订阅。
    disableEffect: 停用后，更新后的设备令牌将无法注册用于接收 Coinn 推送，因此推送可能停止送达。
