  en:
    description: The Leap Creator Android SDK debug dashboard opens from the SDK's developer controls
      and shows connection details and diagnostic-log status. It also opens setup and user-data pages
      and can upload SDK logs.
    disableEffect: Leap Creator's troubleshooting dashboard and log-sharing controls become unavailable;
      regular app screens remain available.
  zh-CN:
    description: Leap Creator Android SDK 的调试面板从开发者工具打开，显示连接信息和诊断日志状态。它还可打开设置和用户数据页面，并上传 SDK 日志。
    disableEffect: Leap Creator 的故障排查面板和日志分享工具将无法使用，应用的日常界面仍可使用。
