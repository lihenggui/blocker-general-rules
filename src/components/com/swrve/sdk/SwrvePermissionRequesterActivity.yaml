i18n:
  en:
    description: Swrve opens this Activity when a notification prompt or in-app message needs an Android
      permission; it shows the system permission request or the related settings screen.
    disableEffect: Swrve permission prompts may fail to open, so the notification or message action that
      requested permission may not work.
  zh-CN:
    description: 通知提示或应用内消息需要申请 Android 权限时，Swrve 会打开此活动页面，显示系统权限请求或相关设置页面。
    disableEffect: Swrve 权限提示可能无法打开，因此发起申请的通知或消息操作可能无法使用。
