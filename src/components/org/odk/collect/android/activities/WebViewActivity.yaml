  en:
    description: If ODK Collect needs to display a project page inside the app, this screen loads the
      supplied web address and shows page-loading progress. It is part of the Samagra ODK Collect client.
    disableEffect: Project pages that fall back to the in-app browser will no longer open there.
  zh-CN:
    description: ODK Collect 需要在应用内显示项目网页时，此页面会加载指定网址并显示加载进度。 它是 Samagra 构建的 ODK Collect 客户端的一部分。
    disableEffect: 停用后，无法通过应用内浏览器打开需要回退到该方式的项目网页。
