    name: AppsFlyer
    description: "## Primary Location\nIsrael (Herzliya)\n## Website\n[https://www.appsflyer.com](https://www.appsflyer.com)\n\
      ## About\nA mobile & attribution analytics platform that aims to help marketers make better decisions\
      \ [AppsFlyer, 01](https://www.appsflyer.com)\n## Ownership\nAppsFlyer\n## Documentation\n[https://support.appsflyer.com/hc/en-us/articles/207032126-AppsFlyer-SDK-Integration-Android](https://support.appsflyer.com/hc/en-us/articles/207032126-AppsFlyer-SDK-Integration-Android)\n\
      ## Products and Services\nAppsFlyer provides the following services: \n* Fraud prevention, malware\
      \ protection [AppsFlyer, 04](https://www.appsflyer.com/product/protect360)\n* Identity attribution\
      \ services. AppsFlyer fingerprints devices by their IDs and tracks across datasets (to solve the\
      \ problem of fragmentation across devices). This works with all Windows 10 devices (including mobile),\
      \ Android, and iOS [AppsFlyer, 03](https://www.appsflyer.com/product/mobile-attribution-for-user-acquisition).\n\
      * Mobile services for targeted advertising [AppsFlyer, 05](https://www.appsflyer.com/product/mobile-ecosystem)\n\
      * Marketing across devices and channels [AppsFlyer, 06](https://www.appsflyer.com/product/marketing-analytics)\n\
      * Generates reports based on user behavior [AppsFlyer, 06](https://www.appsflyer.com/product/marketing-analytics)\n\
      * Tracks which users install apps; tracks successful re-targeting marketing campaigns [AppsFlyer,\
      \ 07](https://www.appsflyer.com/product/overview)\nAppsFlyer uses artificial intelligence and machine\
      \ learning for big data analytics [AppsFlyer, 04](https://www.appsflyer.com/product/protect360);\
      \ [VentureBeat, 01](https://venturebeat.com/2017/05/25/appsflyer-helps-mobile-advertisers-beat-back-ad-fraud-via-machine-learning).\n\
      ## Privacy Policy\n_Third Parties:_ AppsFlyer states it does not sell data to third parties [AppsFlyer,\
      \ 02](https://www.appsflyer.com/we-are-appsflyer)\n## Relationships\nOver 2,000 network and analytics\
      \ partners have integrated with AppsFlyer.\n_Investors include:_ Goldman Sachs / Deutsche Telekom\
      \ / Qumra Capital / Magma Venture Partners / Pitango [AppsFlyer, 02](https://www.appsflyer.com/we-are-appsflyer)\
      \  \n_Partners:_ Google [Google, 01](https://adwords.googleblog.com/2015/05/new-media-partnerships-and-ad-solutions.html);\
      \ [TechCrunch, 02](https://techcrunch.com/2015/05/28/google-expands-its-app-promotion-business-with-universal-app-campaigns-and-new-media-partnerships)\
      \ / Snap / Tencent / HBO / Playtika / Waze / Alibaba / Kayak / Activision [VentureBeat, 01](https://venturebeat.com/2017/05/25/appsflyer-helps-mobile-advertisers-beat-back-ad-fraud-via-machine-learning)\
      \ / Facebook / Twitter / Accuweather / AdlQuity/Flipkart / Bing Search / Pandora / Opera Software\
      \ / Ad4Screen / Cooladata / Fiksu / EveryAds / Nanigans / Fyber / HeyZap / Tapjoy / Adroll / Flurry\
      \ / GameAnalytics / Jampp / Inmobi / Appnexus / Vserv / AppLovin / Vungle / URX / Mobvista / Inneractive\
      \ / Aarki / Bidalgo / Avazu / Taptica / NativeX / AirPush / Amobee / PlayHaven / Mobilecore / Accesstrade\
      \ / ADS / ADSNative / Ad County Media / AccordantMedia / Ad2games / Ad2iction / Abakus / APUS /\
      \ ADyes / Accruo / AID / Aarki / Ad4Game / APPROUND MOBILE / AML / APPSILON / ART DMP / ActionAds\
      \ / APPAniac / ADvantage / AdBuddiz / ADRW / ADXMI Exchange / ADSAXIS / APPAVE / AVH digital / Actionpay\
      \ / Ad2Click / ART Ad Platform / ASB / Ad2c / ADPRESSO / Ad@m (kakao) / ADZ JUNCTION MEDIA / ADVERTISE.RU\
      \ / Ad County / AWIN / Adbird / AdCorsa / Adamas / Adbert / AdReady / Adbrain / Adacts / AdChakra\
      \ / AdCare / Adattract / AdTiming / AdWyze / AdTen / Adboosters / Adara / AdDeals / Adblender /\
      \ AdView / AdTiger / AdFit / AdTriba / AdPacker / and many more. For a longer list, see [AppsFlyer,\
      \ 03](https://www.appsflyer.com/partners)\n## Details\n### Financial details & history \nAppsFlyer\
      \ received early seed funding from Microsoft Accelerator and Magma Venture Partners [CrunchBase,\
      \ 01](https://www.crunchbase.com/funding_round/appsflyer-seed--4b06b119). As of November 2017, AppsFlyer's\
      \ website lists $84M raised from Top VC's, $6B+ annual mobile ad spend measured, 3k+ mobile tech\
      \ partners, and 13 global offices (and growing) [AppsFlyer, 02](https://www.appsflyer.com/we-are-appsflyer).\n\
      ### Scope\nAccording to VentureBeat, AppsFlyer leverages metadata from 98% of the world's mobile\
      \ devices [VentureBeat, 01](https://venturebeat.com/2017/05/25/appsflyer-helps-mobile-advertisers-beat-back-ad-fraud-via-machine-learning).\n\
      ### Devices\nThe AppsFlyer SDK is available for Android, iPhone, and Windows Phone\n## References\n\
