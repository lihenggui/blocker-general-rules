recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:48:37Z'
i18n:
  en:
    description: When an Umeng Union ad offers an app, this Activity shows its details, permissions, and
      privacy links; its download button starts the app download.
    disableEffect: Users will not be able to view or start app downloads offered by Umeng Union ads; the
      app's other features continue to work.
  zh-CN:
    description: 友盟 Union 广告展示可下载应用时，此 Activity 会显示应用详情、权限和隐私政策链接；用户点按下载后会开始下载。
    disableEffect: 停用后，用户将无法查看或下载友盟 Union 广告推荐的应用；应用的其他功能仍可使用。
