  en:
    description: ChannelSurfer's Live Channels library shows this setup Activity when Android TV configures
      its input. It displays the setup page and starts an initial channel sync.
    disableEffect: ChannelSurfer's TV input cannot complete setup, so its channels may not appear in Android
      TV.
  zh-CN:
    description: Android TV 配置 ChannelSurfer 输入源时，ChannelSurfer 的 Live Channels 库会显示此设置 Activity。它会显示设置页面并启动首次频道同步。
    disableEffect: ChannelSurfer 的 TV 输入源将无法完成设置，其频道可能不会显示在 Android TV 中。
