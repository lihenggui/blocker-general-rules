i18n:
  en:
    description: FloatingX starts this provider with the app so its floating-window feature can track
      which app screen is currently open.
    disableEffect: FloatingX loses the active-screen tracking used by its app-scoped floating windows.
  zh-CN:
    description: FloatingX 会在应用启动时运行此 Provider，使其悬浮窗功能能够跟踪当前打开的应用页面。
    disableEffect: FloatingX 将无法跟踪应用内悬浮窗所需的当前页面。
