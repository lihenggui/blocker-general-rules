i18n:
  en:
    description: Android starts this RevOS Vehicle Controller SDK receiver for PHONE_STATE and NEW_OUTGOING_CALL
      broadcasts. It tracks ringing and call changes, sends call events, and clears the connected vehicle
      display's current image when appropriate.
    disableEffect: Call-related events and call-aware information on the connected vehicle display may
      stop updating.
  zh-CN:
    description: Android 收到 PHONE_STATE 或 NEW_OUTGOING_CALL 广播时会启动 RevOS Vehicle Controller SDK 的此接收器。它跟踪来电和通话状态变化、发送通话事件，并在需要时清除已连接车辆显示屏上的当前图像。
    disableEffect: 通话事件和已连接车辆显示屏上的通话相关信息可能不再更新。
