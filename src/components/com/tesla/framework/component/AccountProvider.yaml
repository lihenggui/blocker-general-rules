i18n:
  en:
    description: FastFramework (Jerry Liu's FastAndroid library) declares this account-related Provider
      when the app starts. In this release its queries return no data and its insert, update and delete
      requests make no changes.
    disableEffect: Blocking it removes an empty Provider; this release exposes no account data or updates
      through it.
  zh-CN:
    description: FastFramework（Jerry Liu 的 FastAndroid 库）会在应用启动时声明此账户相关 Provider。此版本的查询不返回数据，新增、修改和删除请求也不会产生变化。
    disableEffect: 屏蔽后将移除此空 Provider；此版本不会通过它提供账户数据或更新。
