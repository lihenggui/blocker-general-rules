i18n:
  en:
    description: When the user taps a Pangle download notice, this Service resumes, pauses, or installs
      the app promoted by the ad.
    disableEffect: Disabling it stops the download controls and installation flow opened from Pangle notices;
      the host app remains usable.
  zh-CN:
    description: 用户点击 Pangle 下载通知时，这个 Service 会恢复、暂停或安装广告推广的应用。
    disableEffect: 禁用后，通过 Pangle 通知打开的下载控制和安装流程会停止；宿主应用仍可使用。
