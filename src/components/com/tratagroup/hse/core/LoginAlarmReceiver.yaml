i18n:
  en:
    description: When the Trata Group HSE library's daily alarm fires, this Receiver resets saved auto-login
      details and clears the local appointment table.
    disableEffect: Blocking it stops this scheduled login and appointment cleanup, leaving expired login
      data and old appointments in local storage.
  zh-CN:
    description: Trata Group 的 HSE 患者管理库设定的每日提醒触发时，此接收器会重置自动登录信息并清空本地预约表。
    disableEffect: 停用后，定时登录和预约清理会停止，过期的登录信息和旧预约可能留在本地。
