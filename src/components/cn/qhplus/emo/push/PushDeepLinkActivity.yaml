i18n:
  en:
    description: QHPlus Emo Push opens this entry when a notification contains an app link; it passes
      the link content into the app and then closes.
    disableEffect: Tapping an app link in a push notification will no longer open its destination; normal
      app use remains available.
  zh-CN:
    description: 推送通知包含应用链接时，QHPlus Emo Push 会打开此入口，将链接内容交给应用处理后关闭。
    disableEffect: 点击推送通知中的应用链接将无法打开目标页面，但应用的正常功能仍可使用。
