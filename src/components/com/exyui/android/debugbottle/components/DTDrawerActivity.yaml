i18n:
  en:
    description: Debug Bottle opens this developer toolbox for app status, screen and intent inspection,
      saved preferences, network records, crashes, and performance reports. Its launcher and debug shortcut
      both open the toolbox.
    disableEffect: Debug Bottle's main diagnostic menu and views will be unavailable; the app's normal
      screens still open.
  zh-CN:
    description: Debug Bottle 使用此开发者工具箱查看应用状态、界面和 Intent、已保存的偏好设置、网络记录、崩溃及性能报告。它可通过启动入口或调试快捷方式打开。
    disableEffect: Debug Bottle 的主诊断菜单和相关界面将无法使用；应用的普通界面仍可打开。
