i18n:
  en:
    description: Android creates this provider during app startup, and it starts Huawei AppGallery Connect
      Performance Management (APMS) monitoring.
    disableEffect: APMS performance monitoring and measurement collection will stop, while the host app's
      regular features remain available.
  zh-CN:
    description: 应用启动时 Android 会创建此 Provider，并由它启动华为 AppGallery Connect 性能管理服务（APMS）的监控。
    disableEffect: APMS 性能监控和数据采集将停止，但应用的常规功能仍可使用。
