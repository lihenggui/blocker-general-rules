recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T03:02:40Z'
i18n:
  en:
    description: Joty 2.0 Mobile opens this Activity when a session needs user authentication. It collects
      the username and password and, when shared access is enabled, the sharing key before continuing
      login.
    disableEffect: If disabled, users cannot sign in through the Joty login flow.
  zh-CN:
    description: 会话需要用户验证时，Joty 2.0 Mobile 会打开此 Activity。它收集用户名和密码；启用共享访问时，还会收集共享密钥，然后继续登录。
    disableEffect: 停用后，用户无法通过 Joty 登录流程登录应用。
