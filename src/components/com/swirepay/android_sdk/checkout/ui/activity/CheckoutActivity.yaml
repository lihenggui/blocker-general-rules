recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:06:39Z'
i18n:
  en:
    description: The Swirepay Android SDK opens this Activity when the app starts an order checkout. It
      shows payment methods such as cards, UPI, and bank transfer, submits the selected payment, then
      continues to a payment page or result screen.
    disableEffect: Users cannot submit orders through this Swirepay checkout, so the app's payment flow
      can fail.
  zh-CN:
    description: 应用开始订单结账时，Swirepay Android SDK 会打开此 Activity。它显示银行卡、UPI 或银行转账等支付方式，提交用户选择的付款，并继续打开支付页面或结果页面。
    disableEffect: 停用后，用户无法通过此 Swirepay 结账页面提交订单，应用的支付流程可能无法完成。
