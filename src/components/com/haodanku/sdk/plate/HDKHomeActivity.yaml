lastUpdateTime: '2026-10-28T19:25:28Z'
i18n:
  en:
    description: When the app opens a Haodanku BianXian shopping page, this screen builds its tabs from
      page data supplied by the SDK and loads each tab inside an embedded browser. BianXian uses it as
      its in-app shopping and service hub.
    disableEffect: BianXian's shopping and service pages will not open, while the host app's other screens
      remain available.
  zh-CN:
    description: 应用打开好单库 BianXian 购物页面时，此界面会根据 SDK 提供的页面数据生成标签，并在内置浏览器中加载各个页面。BianXian 用它展示应用内的购物和服务入口。
    disableEffect: BianXian 的购物和服务页面将无法打开，宿主应用的其他页面仍可使用。
