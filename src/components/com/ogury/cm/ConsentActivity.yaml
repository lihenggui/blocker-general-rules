i18n:
  en:
    description: Ogury's consent manager displays its consent form here when an app asks users to review
      or update their data choices. The Activity places the form on screen for that consent flow.
    disableEffect: If the app asks Ogury to show its consent form, the screen cannot open and the consent
      request may fail.
  zh-CN:
    description: 应用请求用户查看或更新数据选择时，Ogury 的同意管理器会在此显示同意表单。此 Activity 为该同意流程呈现表单。
    disableEffect: 如果应用请求显示 Ogury 同意表单，该页面无法打开，同意请求可能失败。
