    description: Cisco DNA Spaces OpenRoaming SDK uses this Activity when it passes a Wi-Fi profile and
      callback; the Activity submits the profile to Android's Add networks screen and reports the user's
      response.
    disableEffect: The app cannot complete installation or confirmation of its OpenRoaming Wi-Fi profile.
  zh-CN:
