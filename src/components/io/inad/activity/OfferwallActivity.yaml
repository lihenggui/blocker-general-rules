recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-29T02:09:11Z'
i18n:
  en:
    description: InAd Network's offerwall opens when the app shows its install offers. It displays campaigns;
      choosing one opens its store page or target link and lets the SDK check whether the promoted app
      was installed.
    disableEffect: Blocking it removes the offerwall and its install-and-verify flow.
  zh-CN:
    description: InAd Network 广告 SDK 的任务墙会在应用打开安装推广列表时显示推广任务；点按任务会打开应用商店或指定链接，并让 SDK 检查推广应用是否已安装。
    disableEffect: 禁用后将无法使用任务墙及其安装核验流程。
