i18n:
  en:
    description: When selected as the keyboard for a form field, Lodz Pandora’s custom keyboard provides
      layouts for ID numbers, vehicle plate numbers, or company certificate numbers and enters the chosen
      characters into the field.
    disableEffect: Forms that use this service lose the custom keyboard for these values and may need
      another input method.
  zh-CN:
    description: 当表单字段选择 Lodz Pandora 的自定义键盘时，该键盘会提供身份证号码、车牌号码或企业证书号码布局，并将所选字符输入字段。
    disableEffect: 使用此服务的表单将失去这些内容的专用键盘，可能需要改用其他输入方式。
