recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: AndroidX Core provides a private file-sharing component that turns files from configured
      folders into temporary links other apps can access. Android starts it with the app; it is used when
      the app shares a file or hands a photo or video to another app, and it has no screen of its own.
    disableEffect: Disabling it can make file sharing, exports, photo or video handoffs, and camera capture
      fail when an app relies on it to give another app access to a file.
  zh-CN:
    description: AndroidX Core 提供私有文件共享组件，可将指定文件夹中的文件转换为临时链接，供其他应用访问。Android 会随应用启动此组件；分享文件或把照片、视频交给其他应用处理时会用到它，而且它没有独立界面。
    disableEffect: 停用后，依赖此组件的文件分享、导出、照片或视频交接以及相机拍摄流程可能失败，因为其他应用无法取得所需文件。
