    disableEffect: App features that rely on Kotpref settings may fail when they try to read or save preferences.
  zh-CN:
    description: 应用启动时，Kotpref 初始化模块会通过此提供程序准备偏好设置存储，以便应用使用相关设置。
    disableEffect: 依赖 Kotpref 设置的应用功能在读取或保存偏好数据时可能失败。
