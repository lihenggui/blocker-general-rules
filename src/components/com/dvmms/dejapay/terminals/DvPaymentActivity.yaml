  en:
    description: The DejaPay (iPOS Systems/Dejavoo) payment SDK opens this Activity for terminal transactions,
      sends payment details to the selected Dejavoo terminal app, and returns the result; Dejavoo can
      also open it for terminal registration.
    disableEffect: The app cannot start or complete Dejavoo terminal payments or handle registration through
      this integration.
  zh-CN:
    description: DejaPay（iPOS Systems/Dejavoo）支付 SDK 通过此 Activity 处理终端交易，将付款信息交给所选的 Dejavoo 终端应用并回传结果；终端注册也会打开它。
    disableEffect: 禁用后，应用无法通过此集成发起或完成 Dejavoo 终端付款，也无法处理终端注册。
