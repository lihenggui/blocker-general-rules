i18n:
  en:
    description: When an Ogury (ExploreStack) ad flow opens its terms screen, this translucent screen
      displays the terms content supplied by Ogury (ExploreStack).
    disableEffect: Ogury’s terms screen and any ad flow that requires it will not open; the host app’s
      other features remain available.
  zh-CN:
    description: Ogury（ExploreStack）广告流程需要展示条款时，会打开此半透明页面显示 Ogury（ExploreStack）提供的条款内容。
    disableEffect: Ogury 条款页面及依赖它的广告流程将无法打开，但应用的其他功能仍可使用。
