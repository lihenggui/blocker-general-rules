contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:50:27Z'
i18n:
  en:
    description: When CZXing (Devilsen QR and barcode scanner) completes a scan without an app-provided
      result handler, this Activity shows the scanned text and lets the user copy it.
    disableEffect: The scanner cannot open its built-in result screen, so scans that rely on that screen
      will not show or copy the result.
  zh-CN:
    description: CZXing（Devilsen 二维码和条码扫描库）完成扫描且应用未提供结果处理界面时，此 Activity 会显示扫描文本，并允许用户复制内容。
    disableEffect: 扫描器无法打开内置结果界面，因此依赖该界面的扫描流程将无法显示或复制结果。
