i18n:
  en:
    description: Android starts this Bugsee service for scheduled background tasks, including preparing
      and uploading issue reports. It runs the task requested by Bugsee and reports whether it should
      be retried.
    disableEffect: Bugsee's scheduled report preparation and uploads may not finish in the background.
  zh-CN:
    description: Android 会为 Bugsee 的计划后台任务启动此服务，包括准备和上传问题报告。服务会执行 Bugsee 请求的任务，并返回是否需要重试。
    disableEffect: 停用后，Bugsee 计划执行的问题报告准备和上传任务可能无法在后台完成。
