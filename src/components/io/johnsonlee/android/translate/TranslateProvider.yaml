i18n:
  en:
    description: The Johnson Lee Translator SDK downloads its Korean-to-Chinese translation model over
      Wi-Fi when it starts and adds a movable translation control to supported app screens. Tapping it
      translates the visible text into Chinese.
    disableEffect: The floating translation control and on-screen translation will be unavailable.
  zh-CN:
    description: Johnson Lee Translator SDK 启动时会在 Wi-Fi 下下载韩语到中文的翻译模型，并在支持的应用页面添加可移动的翻译按钮。点击按钮可将页面上显示的文字翻译成中文。
    disableEffect: 浮动翻译按钮和屏幕文字翻译将无法使用。
