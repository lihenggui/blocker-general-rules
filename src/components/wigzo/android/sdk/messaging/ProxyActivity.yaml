i18n:
  en:
    description: Wigzo’s messaging SDK opens this Activity when a push message is tapped or displayed
      while the app is open; it shows the message and follows its configured app link or review action.
    disableEffect: Wigzo push message dialogs and their app links or review prompts will no longer open.
  zh-CN:
    description: 用户点开 Wigzo 推送，或应用打开时收到推送，Wigzo 消息 SDK 会显示此 Activity；它展示消息，并按推送设置打开应用页面或评价入口。
    disableEffect: Wigzo 推送的消息窗口、应用链接和评价入口将无法打开。
