i18n:
  en:
    description: This is part of Mrocigno's BigBrother diagnostic toolkit. As app screens resume, this
      older BigBrother task registers a handler for uncaught crashes; a crash opens the report screen.
    disableEffect: The older BigBrother crash handler and report screen will no longer run; the app's
      existing crash handler remains in place.
  zh-CN:
    description: 这是 Mrocigno 的 BigBrother 诊断工具的一部分。应用页面恢复显示时，此旧版 BigBrother 任务会注册未捕获崩溃的处理程序；发生崩溃时会打开报告页面。
    disableEffect: 停用后，旧版 BigBrother 崩溃处理程序和报告页面不再运行；应用原有的崩溃处理程序仍会工作。
