i18n:
  en:
    description: After document capture, this newer processing screen handles the selected identity-document
      type and advances verification to the next document step. The MetaMap identity verification SDK
      opens this screen when the configured flow reaches this step.
    disableEffect: Disabling it prevents document-verification flows that use this processing path from
      continuing.
  zh-CN:
    description: 证件拍摄完成后，此新版处理页面会处理所选证件类型，并将核验流程推进到下一证件步骤。配置的核验流程到达此步骤时，MetaMap 身份核验 SDK 会打开此页面。
    disableEffect: 停用后，使用此处理流程的证件核验无法继续。
