    description: MrZWC SuperAdapterWrapper starts this service when its floating diagnostic log panel
      is requested. The panel displays diagnostic messages from the running app over the screen.
    disableEffect: The floating diagnostic log panel is unavailable; ordinary app screens continue to
      work.
