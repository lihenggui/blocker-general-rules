  en:
    description: LinX OpenNetwork's SendingNetwork Android SDK uses this Activity for its Jitsi voice
      and video meeting screen. It refreshes the meeting when Android reports a change to work-profile
      restrictions.
    disableEffect: Disabling it can prevent the app from opening SendingNetwork meetings through this
      screen.
  zh-CN:
    description: LinX OpenNetwork 的 SendingNetwork Android SDK 用此 Activity 显示 Jitsi 语音和视频会议界面。Android
      的工作资料限制发生变化时，它会刷新会议。
    disableEffect: 停用后，应用可能无法通过此界面打开 SendingNetwork 会议。
