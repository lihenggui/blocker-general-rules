i18n:
  en:
    description: The KARTE notifications SDK handles a tap or dismissal of a KARTE message. It records
      the response and opens the message's target screen when the user taps it.
    disableEffect: KARTE notification actions may stop opening their intended screen, and click or dismissal
      tracking will be lost.
  zh-CN:
    description: KARTE 通知 SDK 在用户点击或关闭 KARTE 消息时处理相应操作并记录结果；用户点击消息时，它会打开消息指定的页面。
    disableEffect: KARTE 通知可能无法打开指定页面，点击和关闭记录也会停止。
