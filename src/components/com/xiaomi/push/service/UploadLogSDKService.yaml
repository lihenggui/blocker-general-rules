  en:
    description: When Xiaomi Market requests diagnostic logs, this Xiaomi Mi Push service gathers and
      compresses the push SDK logs and shares them back.
    disableEffect: Disabling it prevents Xiaomi Market from retrieving diagnostic logs from the app's
      Xiaomi push SDK.
  zh-CN:
    description: 小米应用商店请求诊断日志时，这个小米推送服务会收集并压缩推送 SDK 日志，再提供给商店。
    disableEffect: 停用后，小米应用商店将无法从应用中的小米推送 SDK 获取诊断日志。
