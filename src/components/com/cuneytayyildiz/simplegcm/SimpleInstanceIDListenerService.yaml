    description: When Google Cloud Messaging reports a refreshed instance token, SimpleGCM clears the
      saved token and starts registration again.
    disableEffect: Disabling it can leave the app using an outdated push token and stop new messages from
      arriving.
  zh-CN:
    description: Google Cloud Messaging 通知令牌已更新时，SimpleGCM 会清除已保存的令牌并重新开始注册。
    disableEffect: 停用后，应用可能继续使用过期的推送令牌，导致无法收到新消息。
