      pass-through messages and Xiaomi registration results to Stream.
    disableEffect: Disabling it stops Stream notifications and registration updates delivered through
      Xiaomi Push.
  zh-CN:
    description: 这是 Stream Chat 和 Stream Video 推送集成使用的小米推送接收器。它会将透传消息和小米注册结果交给 Stream 处理。
    disableEffect: 停用后，通过小米推送服务发送的 Stream 通知和注册更新将停止。
