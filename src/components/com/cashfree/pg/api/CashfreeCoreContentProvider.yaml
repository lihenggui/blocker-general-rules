i18n:
  en:
    description: When the host app starts, Cashfree Payments' PG SDK initializes its payment core unless
      the app has disabled automatic initialization. This also starts payment-event reporting used by
      the SDK.
    disableEffect: Cashfree payment setup may not initialize, so the app's Cashfree checkout flows can
      fail.
  zh-CN:
    description: 宿主应用启动时，Cashfree Payments PG SDK 会初始化支付核心，除非应用关闭了自动初始化；同时也会启动 SDK 的支付事件上报。
    disableEffect: Cashfree 支付初始化可能无法完成，应用中的 Cashfree 结账流程可能失败。
