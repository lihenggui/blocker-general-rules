recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T19:04:42Z'
i18n:
  en:
    description: After the user enables notification access in Android settings, the PrivacyStreams Service
      receives notifications as they appear or disappear and forwards them to PrivacyStreams handlers.
    disableEffect: PrivacyStreams will stop receiving notification events; the app’s other features remain
      available.
  zh-CN:
    description: 用户在 Android 设置中启用通知访问后，PrivacyStreams 的 Service 会接收通知出现或消失的事件，并交给 PrivacyStreams 处理。
    disableEffect: PrivacyStreams 将无法再接收通知事件，但应用的其他功能仍可使用。
