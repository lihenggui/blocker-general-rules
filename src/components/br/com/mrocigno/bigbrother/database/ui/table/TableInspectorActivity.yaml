  en:
    description: This is part of Mrocigno's BigBrother diagnostic toolkit. After a table is selected in
      BigBrother's database browser, this screen shows its columns and rows and lets users inspect expanded
      values.
    disableEffect: BigBrother's table-inspection screen will be unavailable; the app's databases remain
      unchanged and usable.
  zh-CN:
    description: 这是 Mrocigno 的 BigBrother 诊断工具的一部分。在 BigBrother 数据库浏览器中选择数据表后，此页面会显示表的列和记录，并可展开查看字段内容。
    disableEffect: 停用后，BigBrother 无法打开数据表检查页面；应用数据库不受影响，仍可正常使用。
