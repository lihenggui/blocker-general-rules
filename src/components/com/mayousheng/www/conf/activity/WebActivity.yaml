    description: The conf-interface Android library opens this screen when the app requests a web page;
      it loads the page inside the app, handles links and downloads, supports full-screen video, and reports
      page events back to the app.
    disableEffect: App screens or flows that depend on this in-app web browser can no longer open.
  zh-CN:
