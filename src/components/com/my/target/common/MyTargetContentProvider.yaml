recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T18:26:36Z'
i18n:
  en:
    description: The myTarget ads SDK uses this provider to initialize itself automatically when the app
      starts, unless the app disables that startup option. It prepares the SDK to load ads.
    disableEffect: myTarget will not initialize automatically, so its ads will not be ready unless the
      app starts the SDK another way.
  zh-CN:
    description: myTarget 广告 SDK 会在应用启动时通过此提供程序自动初始化，除非应用关闭了自动启动选项；初始化后即可加载广告。
    disableEffect: myTarget 将不会自动初始化；除非应用通过其他方式启动 SDK，否则其广告无法加载。
