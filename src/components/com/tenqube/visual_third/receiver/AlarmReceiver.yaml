i18n:
  en:
    description: TENQUBE Visual runs this receiver when a scheduled IBK notification fires. It verifies
      that the saved reminder is active, displays it when due, and refreshes the schedule.
    disableEffect: TENQUBE Visual’s scheduled IBK reminder notifications will stop appearing.
  zh-CN:
    description: TENQUBE Visual 的 IBK 定时通知触发时会运行此接收器。它确认已保存的提醒仍然有效，在到期时显示提醒，并更新后续安排。
    disableEffect: TENQUBE Visual 的 IBK 定时提醒将不再显示。
