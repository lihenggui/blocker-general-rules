recommendToBlock: true
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:26:19Z'
i18n:
  en:
    description: Pangle uses this Activity as a screen for pages supplied by ad plugins at runtime, including
      ad landing and video pages.
    disableEffect: Ads assigned to this screen cannot open, and rewards for watching an ad that uses this
      screen will not be granted.
  zh-CN:
    description: Pangle 会使用这个 Activity 显示广告插件在运行时提供的页面，包括广告落地页和视频页面。
    disableEffect: 分配到此页面的广告无法打开；通过此页面观看广告可获得的奖励也不会发放。
