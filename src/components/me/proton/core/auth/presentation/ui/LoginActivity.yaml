i18n:
  en:
    description: Proton AG's Proton Core Android SDK opens this Activity when the app asks a user to sign
      in. It collects the account credentials, handles the sign-in result, and returns the signed-in account
      to the app.
    disableEffect: If disabled, users may be unable to sign in to the app or access their accounts.
  zh-CN:
    description: Proton AG 的 Proton Core Android SDK 会在应用要求用户登录时打开此 Activity，收集账户凭据、处理登录结果，并将已登录账户返回应用。
    disableEffect: 停用后，用户可能无法登录应用或访问账户。
