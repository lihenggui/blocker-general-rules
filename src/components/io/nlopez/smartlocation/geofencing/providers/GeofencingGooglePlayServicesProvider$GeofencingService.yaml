    description: When Google Play services reports a registered location-boundary event, this service
      forwards the affected boundary, transition, and triggering location to the app.
    disableEffect: The app will stop receiving the location-boundary events it uses for alerts or automation.
  zh-CN:
    description: Google Play 服务报告已注册的地理围栏事件时，此服务会将对应围栏、状态变化和触发位置转发给应用。
