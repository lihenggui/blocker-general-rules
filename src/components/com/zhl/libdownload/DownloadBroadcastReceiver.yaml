i18n:
  en:
    description: Henry Zhu Dev's lib_download receiver responds when Android reports a download completion
      or notification click; it checks the download, reports its status, and opens the installer for APK
      downloads marked for installation.
    disableEffect: Download completion notices and this library's automatic APK installation prompt stop
      working.
  zh-CN:
    description: Android 通知下载完成或用户点击下载通知时，Henry Zhu Dev 的 lib_download 接收器会检查下载状态、显示结果，并为设为需安装的 APK 打开安装程序。
    disableEffect: 停用后，下载完成提示以及此库自动打开 APK 安装程序的功能将无法使用。
