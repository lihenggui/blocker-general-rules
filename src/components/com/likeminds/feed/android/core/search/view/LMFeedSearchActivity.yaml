  en:
    description: LikeMinds Master Feed SDK (LikeMinds) opens this Activity when the app starts a search
      in the community feed. It displays the feed search screen for the supplied search options.
    disableEffect: Users cannot search the LikeMinds community feed through this screen.
  zh-CN:
    description: 应用在社区动态中启动搜索时，LikeMinds Master Feed SDK（LikeMinds）会打开此 Activity。它根据传入的搜索选项显示动态搜索界面。
    disableEffect: 停用后，用户无法通过此界面搜索 LikeMinds 社区动态。
