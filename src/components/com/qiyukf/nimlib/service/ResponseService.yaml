i18n:
  en:
    description: When Qiyu needs to wake the app’s messaging process, it starts this short-lived Service
      to refresh SDK state and briefly enter the foreground when Android requires it.
    disableEffect: Disabling it breaks the SDK’s message wake-up flow, so incoming messages and chat updates
      may not appear promptly.
  zh-CN:
    description: 七鱼客服 SDK 需要唤醒应用的消息进程时，会启动此短时服务刷新 SDK 状态，并在 Android 要求时短暂以前台服务运行。
    disableEffect: 禁用后，SDK 的消息唤醒流程会失效，收到的消息和聊天更新可能无法及时显示。
