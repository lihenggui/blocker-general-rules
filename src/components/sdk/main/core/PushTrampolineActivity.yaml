i18n:
  en:
    description: InTrack Android SDK and UserMost Android SDK use this screen when a user opens a push
      notification; it forwards the selected link or app action and then closes.
    disableEffect: Push-notification taps and their linked navigation will no longer be handled through
      these SDKs.
  zh-CN:
    description: 用户打开推送通知时，InTrack Android SDK 和 UserMost Android SDK 会使用此页面转发所选链接或应用操作，随后关闭页面。
    disableEffect: 通过这些 SDK 发出的推送通知点击及其链接跳转将无法处理。
