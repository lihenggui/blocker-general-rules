recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T23:42:16Z'
i18n:
  en:
    description: BlueNote by Nodes opens this Activity when an app requests BLE setup. It checks Bluetooth
      support, asks the user to enable Bluetooth when needed, and requests location access used for nearby
      device scanning.
    disableEffect: Apps using BlueNote may be unable to finish Bluetooth and location permission setup,
      so nearby device discovery or connection can fail.
  zh-CN:
    description: Nodes 的 BlueNote 会在应用请求设置 BLE 时打开此 Activity。它会检查蓝牙支持情况，必要时提示用户开启蓝牙，并请求附近设备扫描所需的位置权限。
    disableEffect: 使用 BlueNote 的应用可能无法完成蓝牙和位置权限设置，附近设备发现或连接可能失败。
