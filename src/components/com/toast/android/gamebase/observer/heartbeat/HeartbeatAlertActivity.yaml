recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-10-28T22:38:17Z'
i18n:
  en:
    description: Gamebase opens this blocking alert when its heartbeat handler reports a banned account;
      it shows the server message and waits for the user to acknowledge it.
    disableEffect: The ban notice and its acknowledgement callback may not run, leaving Gamebase session
      handling incomplete.
  zh-CN:
    description: Gamebase 的心跳处理程序报告账户被封禁时会打开此阻断式提示，显示服务器消息并等待用户确认。
    disableEffect: 停用后封禁提示及其确认回调可能不会执行，Gamebase 会话处理可能不完整。
