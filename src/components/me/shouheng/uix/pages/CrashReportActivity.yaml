  en:
    description: Android UIX (Shouheng88) displays its crash screen here after the app sends it an error
      message. The screen can show the error and log details, copy the log, or restart the app.
    disableEffect: The app will lose this crash screen, its copyable log details, and its restart action.
  zh-CN:
    description: Android UIX（Shouheng88）会在应用传入错误信息后显示此崩溃页面，可展示错误和日志详情、复制日志或重启应用。
    disableEffect: 应用将无法显示此崩溃页面、复制日志详情或使用重启操作。
