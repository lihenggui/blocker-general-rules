i18n:
  en:
    description: The CanHub Android Image Cropper opens this screen when an app starts an image-cropping
      flow. Users can choose or take a photo, crop or rotate it, and return the result to the app.
    disableEffect: Apps using this library will not be able to complete photo-cropping flows such as choosing
      a profile or upload image.
  zh-CN:
    description: 应用启动图片裁剪流程时，CanHub Android Image Cropper 会打开此页面。用户可以选择或拍摄照片、裁剪或旋转照片，然后将结果返回应用。
    disableEffect: 使用此库的应用将无法完成图片裁剪，例如选择头像或上传图片。
