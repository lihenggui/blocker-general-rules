    disableEffect: Age-sharing or age-verification requests that need consent will not complete.
  zh-CN:
    description: 应用请求的年龄信息需要用户确认时，Google Play 年龄信号 SDK 会打开确认页面，并将用户选择返回应用。
    disableEffect: 需要用户同意的年龄信息共享或验证请求将无法完成。
