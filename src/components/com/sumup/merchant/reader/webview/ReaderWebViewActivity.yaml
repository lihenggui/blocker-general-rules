  en:
    description: When a merchant opens a support link during card-reader setup or Bluetooth troubleshooting,
      SumUp Reader displays the requested help page in its in-app browser.
    disableEffect: If disabled, support pages opened from reader setup and Bluetooth troubleshooting may
      fail, making recovery guidance unavailable.
  zh-CN:
    description: 商户在读卡器设置或蓝牙故障排查中打开帮助链接时，SumUp Reader 会在应用内显示相应的支持页面。
    disableEffect: 停用后，读卡器设置和蓝牙排查中的帮助页面可能无法打开，用户会失去相关恢复指引。
