i18n:
  en:
    description: Mutual Mobile’s Barricade2 local mock-server library opens this screen when the app launches
      its mock settings. It shows configured API endpoints and saved response options, with a control
      for the mock-response delay.
    disableEffect: Developers lose this mock-settings screen, and an app that still tries to open it may
      fail at that point.
  zh-CN:
    description: Mutual Mobile 的 Barricade2 本地模拟服务器库会在应用打开模拟设置时显示此页面。页面列出已配置的 API 接口和模拟响应选项，并可调整模拟响应的延迟。
    disableEffect: 开发者将无法打开此模拟设置页面；如果应用仍尝试启动它，该操作可能失败。
